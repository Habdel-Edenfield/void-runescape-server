# Furniture of the houses in world_houses.tables.toml (fork only). After a change run
# `./gradlew :tools:worldHouseObjects --args=patch` (server stopped) to give the pieces their options.
# house: row of world_houses
# piece: name of the house's copy of the piece; pieces alike share one
# tile: where the map has it
# map_object: id of the object the map has there (a number, as some have no name)
# hotspot: Construction hotspot (house_hotspots) whose furniture the owner can build in its place
# unlit_object: for a fire, the object whose look it has while put out (its brightness is dropped to match)
[world_house_furniture]
house = "string"
piece = "string"
tile = "tile"
map_object = "int"
hotspot = "string"
unlit_object = "int"

