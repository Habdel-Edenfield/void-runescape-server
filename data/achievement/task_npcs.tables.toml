# Tasks whose hints point at an NPC: the map icon on hint line `hint` of the Task System tab walks the player there.
# Rows are task struct ids (data/client/structs.toml). `tile` is where the NPC spawns, used when it isn't around.
# `name` and `pt` are how the NPC reads in a sentence ("Click to walk to the Cook." / "Clique para andar até o Cook.").
# The cache reads this too (icon and tooltip, CacheTranslationPatch): after changing it, apply the patch to the cache.

[task_npcs]
npc = "npc"
hint = "int"
tile = "tile"
name = "string"
pt = "string"

# Tutorial set

[.introducing_explorer_jack_task]
npc = "explorer_jack"
hint = 1
tile = { x = 3204, y = 3241 }
name = "Explorer Jack"
pt = "o Explorer Jack"

