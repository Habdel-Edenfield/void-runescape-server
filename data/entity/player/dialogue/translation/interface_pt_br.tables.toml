[.script_3223_0]
en = "You must have access to the fairy ring network to complete this Task."
pt = "Você precisa ter acesso à rede de fairy rings para concluir esta tarefa."

[.script_3223_1]
en = "You must unlock 500 music tracks in order to perform the Air Guitar emote."
pt = "Você precisa desbloquear 500 músicas para fazer o emote Air Guitar."

[.script_3223_2]
en = "You must also have completed the Abyss miniquest."
pt = "Você também precisa ter concluído a minimissão Abyss."

[.script_3223_3]
en = "You must have progressed to a certain point in the Dragon Slayer quest."
pt = "Você precisa ter avançado até certo ponto na missão Dragon Slayer."

[.script_3223_4]
en = "You must begin the relevant section of Otto Godblessed's barbarian training."
pt = "Você precisa começar a parte certa do treinamento bárbaro do Otto Godblessed."

[.script_3223_5]
en = "You must complete the Bar Crawl miniquest."
pt = "Você precisa concluir a minimissão Bar Crawl."

[.script_3223_6]
en = "You must have a total combat level of at least 100 to accept an assignment in Shilo Village."
pt = "Você precisa de nível de combate 100 ou mais para aceitar um serviço em Shilo Village."

[.script_3223_7]
en = "You must have completed the Knight Waves in Camelot."
pt = "Você precisa ter concluído as Knight Waves em Camelot."

[.script_3223_8]
en = "You require 33 Quest Points to enter the Champions' Guild."
pt = "Você precisa de 33 pontos de missão (Quest Points) para entrar na Champions' Guild."

[.script_3223_9]
en = "You must unlock all four emotes by completing levels of the Stronghold of Security."
pt = "Você precisa desbloquear os quatro emotes completando os níveis da Stronghold of Security."

[.script_3223_10]
en = "You must learn the secret of the Senntisten necklace."
pt = "Você precisa descobrir o segredo do colar de Senntisten."

[.script_3223_11]
en = "You must have a total combat level of at least 40 to accept an assignment from Vannaka."
pt = "Você precisa de nível de combate 40 ou mais para aceitar um serviço do Vannaka."

[.script_3223_12]
en = "Completing quests will increase your access to Kudos with the Varrock Museum."
pt = "Concluir missões aumenta o seu acesso a Kudos no Varrock Museum."

[.script_3223_13]
en = "You may gather the Tears of Guthix once every week."
pt = "Você pode coletar as Tears of Guthix uma vez por semana."

[.script_3223_14]
en = "You must have gained a Quest Point or 100,000 total experience to enter Juna's cavern."
pt = "Você precisa ter ganhado um ponto de missão ou 100.000 de experiência total para entrar na caverna da Juna."

[.script_3223_15]
en = "You must have a total combat level of at least 40 to fight for the Void Knights."
pt = "Você precisa de nível de combate 40 ou mais para lutar pelos Void Knights."

[.script_3223_16]
en = "You must have Larry or Chuck explain the purpose of penguin spying."
pt = "O Larry ou o Chuck precisa explicar para que serve espionar pinguins."

[.script_3223_17]
en = "You must have spied on fewer than ten penguins already this week."
pt = "Você precisa ter espionado menos de dez pinguins nesta semana."

[.script_3223_18]
en = "You may spy on penguins if your total Penguin Points are less than the maximum of fifty."
pt = "Você pode espionar pinguins se tiver menos que o máximo de cinquenta Penguin Points."

[.script_3223_19]
en = "You must have Larry or Chuck explain the purpose of Penguin Hide and Seek."
pt = "O Larry ou o Chuck precisa explicar para que serve o Penguin Hide and Seek."

[.script_3223_20]
en = "You may not chop down more than two evil trees per day."
pt = "Você não pode derrubar mais de duas evil trees por dia."

[.script_3223_21]
en = "You may attempt the Agility, Magic and Ranged performances after a week has passed since your last show."
pt = "Você pode tentar as apresentações de Agility, Magic e Ranged uma semana depois do seu último show."

[.script_3223_22]
en = "You must wait at least a day since you last faced Bork."
pt = "Você precisa esperar pelo menos um dia desde a última vez que enfrentou o Bork."

[.script_3223_23]
en = "At least a week must pass since you last faced the Skeletal Horror."
pt = "Precisa passar pelo menos uma semana desde a última vez que você enfrentou o Skeletal Horror."

[.script_3223_24]
en = "You require 50 Runecrafting to enter the Runecrafters' Guild."
