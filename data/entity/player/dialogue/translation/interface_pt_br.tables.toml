en = "You must begin the relevant section of Otto Godblessed's barbarian training."
pt = "Você precisa começar a parte certa do treinamento bárbaro do Otto Godblessed."

[.script_3223_5]
en = "You must complete the Bar Crawl miniquest."
pt = "Você precisa concluir a minimissão Bar Crawl."

[.script_3223_6]
en = "You must have a total combat level of at least 100 to accept an assignment in Shilo Village."
pt = "Você precisa de nível de combate 100 ou mais para aceitar um serviço em Shilo Village."

