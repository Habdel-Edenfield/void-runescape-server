en = "Given by the town crier in East Ardougne's market for completing all Medium Tasks in Ardougne."
pt = "Entregue pelo Town Crier, no mercado de East Ardougne, por completar todas as tarefas de dificuldade Média em Ardougne."

[.hint1_1616]
en = "The cloak gains the following extra benefits:"
pt = "A capa ganha estes benefícios extras:"

