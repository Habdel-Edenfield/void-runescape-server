pt = "- Mais chance de sucesso ao bater carteiras ou furtar barracas em qualquer lugar de RuneScape."

[.hint3_1617]
en = "- Teleport traps on chests will always teleport you to Ardougne's north bank."
pt = "- As armadilhas de teletransporte dos baús sempre vão mandar você para o banco norte de Ardougne."

