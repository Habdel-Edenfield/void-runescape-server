pt = "- Lançar Superheat Item sem runas, 27 vezes por dia."

[.hint4_1221]
en = "- 50% chance to cast Bones to Bananas without using up runes, 10 successes per day."
pt = "- 50% de chance de lançar Bones to Bananas sem gastar runas, até 10 vezes por dia."

[.hint5_1221]
en = "- Claim a hamper of food from Lumbridge Castle's cook, once per day."
pt = "- Pegar uma cesta de comida (hamper) com o cozinheiro (Cook) do Lumbridge Castle, uma vez por dia."

[.set_1221]
en = "Explorer's ring 4 and a magic lamp worth 9,000xp in a skill of your choice."
pt = "Explorer's ring 4 (anel de explorador) e uma lâmpada mágica de 9.000xp numa habilidade à sua escolha."

[.name_1615]
en = "Ardougne Set Tasks - Easy"
pt = "Tarefas do conjunto de Ardougne - Fácil"

[.desc_1615]
en = "Given by Doctor Orbon in Ardougne Church for completing all Easy Tasks in Ardougne."
pt = "Entregue pelo Doctor Orbon, na igreja de Ardougne, por completar todas as tarefas de dificuldade Fácil em Ardougne."

