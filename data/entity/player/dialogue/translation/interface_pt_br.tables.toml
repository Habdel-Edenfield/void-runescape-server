pt = "- Mais runas ao criar runas no Ourania Altar."

[.set_1616]
en = "Ardougne cloak 2 and a magic lamp worth 7,500xp in a skill of your choice. Wizard Cromperty will offer you 100 noted essence per day."
pt = "Ardougne cloak 2 (capa de Ardougne) e uma lâmpada mágica de 7.500xp numa habilidade à sua escolha. Wizard Cromperty vai oferecer a você 100 essências em nota (noted) por dia."

[.name_1617]
en = "Ardougne Set Tasks - Hard"
pt = "Tarefas do conjunto de Ardougne - Difícil"

[.desc_1617]
en = "Given by Aleck in Yanille for completing all Hard Tasks in Ardougne."
pt = "Entregue pelo Aleck, em Yanille, por completar todas as tarefas de dificuldade Difícil em Ardougne."

