[.script_3223_1]
en = "You must unlock 500 music tracks in order to perform the Air Guitar emote."
pt = "Você precisa desbloquear 500 músicas para fazer o emote Air Guitar."

[.script_3223_2]
en = "You must also have completed the Abyss miniquest."
pt = "Você também precisa ter concluído a minimissão Abyss."

[.script_3223_3]
