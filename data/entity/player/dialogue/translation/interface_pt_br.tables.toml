en = "- Teleport to the Farming patch north of Ardougne once per day."
pt = "- Teletransportar para o canteiro de Farming ao norte de Ardougne uma vez por dia."

[.hint3_1616]
en = "- Improved rate of success when picking pockets in Ardougne."
pt = "- Mais chance de sucesso ao bater carteiras em Ardougne."

[.hint4_1616]
en = "- Double length PvP immunity after pulling the Wilderness teleport lever."
pt = "- Imunidade PvP com o dobro da duração depois de puxar a alavanca de teletransporte da Wilderness."

[.hint5_1616]
