[.set_1542]
en = "Completing this Task will give an amount of money based on total Tasks completed, and an air talisman."
pt = "Completar esta tarefa dá uma quantia em dinheiro conforme o total de tarefas concluídas, e um talismã de ar (air talisman)."

[.name_1543]
en = "Air Craft"
pt = "Ar-tesanato"

[.desc_1543]
en = "Craft an air rune at the Air Altar."
pt = "Crie uma runa de ar (air rune) no Air Altar."

[.hint1_1543]
en = "You must have completed Rune Mysteries, and you will need an air talisman to access the altar."
pt = "Você precisa ter completado a missão Rune Mysteries e de um talismã de ar (air talisman) para entrar no altar."

[.hint2_1543]
en = "Acquire some rune or pure essence."
pt = "Consiga um pouco de essência (rune ou pure essence)."

[.hint3_1543]
en = "Locate the Air Altar ruins."
pt = "Encontre as ruínas do Air Altar."

[.hint4_1543]
en = "Use the talisman on the ruins to enter, and click on the altar to bind your essence into runes."
pt = "Use o talismã nas ruínas para entrar e clique no altar para transformar sua essência em runas."

[.name_1544]
en = "Greasing the Wheels of Commerce"
pt = "Aquecendo o comércio"

[.desc_1544]
en = "Sell an item to a shop."
pt = "Venda um item para uma loja."

[.hint1_1544]
en = "Travel to a store that buys the item you wish to sell."
pt = "Vá até uma loja que compre o item que você quer vender."

[.hint2_1544]
en = "A general store will buy anything that can be sold, but at a reduced price."
pt = "Um armazém (general store) compra tudo o que pode ser vendido, mas por um preço menor."

[.hint3_1544]
en = "Open the shop interface, right-click the item and choose to sell however many you wish."
pt = "Abra a interface da loja, clique com o botão direito no item e escolha quantos quer vender."

[.name_1545]
en = "Must Be Funny in a Rich Man's World"
pt = "Deve ser bom no mundo dos ricos"

[.desc_1545]
en = "Claim a reward of at least 100 coins from a taskmaster."
pt = "Receba de um taskmaster uma recompensa de pelo menos 100 moedas (coins)."

[.hint1_1545]
en = "Tasks are worth more coins the more you complete."
pt = "Quanto mais tarefas você completa, mais moedas elas valem."

[.hint2_1545]
en = "Explorer Jack in Lumbridge is the first taskmaster you are likely to meet, but there are others; look for the green compass icon on the minimap."
pt = "O Explorer Jack, em Lumbridge, deve ser o primeiro taskmaster que você vai conhecer, mas há outros; procure o ícone da bússola verde no minimapa."

[.name_1546]
en = "I Wonder If It'll Sprout"
pt = "Será que vai brotar?"

[.desc_1546]
en = "Bury a bone to gain Prayer experience."
pt = "Enterre um osso para ganhar experiência em Prayer (oração)."

[.hint1_1546]
en = "Pick up a bone. Bones are a guaranteed drop from many creatures."
pt = "Pegue um osso (bones). Muitas criaturas sempre deixam ossos ao morrer."

[.hint2_1546]
en = "Click on the bone in your inventory to bury it."
pt = "Clique no osso no inventário para enterrá-lo."

[.name_1547]
en = "Put Your Hands Together For..."
pt = "Uma salva de palmas para..."

[.desc_1547]
en = "Activate any prayer."
pt = "Ative qualquer oração (prayer)."

[.hint1_1547]
en = "To activate a prayer, click on the Prayer icon in your sidebar menu."
pt = "Para ativar uma oração, clique no ícone de Prayer (oração) no menu lateral."

[.hint2_1547]
en = "Click on the prayer you wish to activate to begin enjoying its benefits."
pt = "Clique na oração que quer ativar para começar a aproveitar os benefícios dela."

[.hint3_1547]
en = "Prayers will drain Prayer points while active at a rate depending on the prayer."
pt = "Orações ativas gastam pontos de oração (Prayer points) num ritmo que depende de cada oração."

[.hint4_1547]
en = "Once you run out of Prayer points you will not be able to have any prayer active."
pt = "Quando seus pontos de oração acabarem, você não poderá manter nenhuma oração ativa."

[.hint5_1547]
en = "To use prayers again, find an altar and restore your Prayer points."
pt = "Para usar orações de novo, ache um altar e recupere seus pontos de oração."

[.name_1548]
en = "Prayer Point Power"
pt = "Prece poderosa"

[.desc_1548]
en = "Restore your Prayer points."
pt = "Recupere seus pontos de oração (Prayer points)."

[.hint1_1548]
en = "You can restore your Prayer points at many altars around the world."
pt = "Você pode recuperar seus pontos de oração (Prayer points) em muitos altares pelo mundo."

[.hint2_1548]
en = "Simply pray at the altar to restore your points to full."
pt = "Basta rezar no altar para recuperar todos os seus pontos."

[.hint3_1548]
en = "(To complete this task, you must pray at an altar while not at full Prayer.)"
pt = "(Para completar esta tarefa, reze num altar sem estar com os pontos de oração cheios.)"

[.name_1549]
en = "Not What We Mean By Irony"
pt = "Não é esse tipo de ironia"

[.desc_1549]
en = "Wield a melee weapon made of iron."
pt = "Empunhe uma arma corpo a corpo de ferro (iron)."

[.name_1550]
en = "All's Ferrous in Love and War"
pt = "No amor e na guerra, vale ferro"

[.desc_1550]
en = "Wear a piece of armour made of iron."
pt = "Vista uma peça de armadura de ferro (iron)."

[.name_1551]
en = "Am I a Blademaster Yet?"
pt = "Já sou mestre da espada?"

[.desc_1551]
en = "Kill a Giant Rat in each of the melee combat stances (Aggressive, Defensive, Controlled and Accurate)."
pt = "Mate um rato gigante (Giant Rat) em cada estilo de combate corpo a corpo (Aggressive, Defensive, Controlled e Accurate)."

[.hint1_1551]
en = "Not all weapons offer every type of fighting stance; you may need to acquire extra."
pt = "Nem toda arma oferece todos os estilos de luta; talvez você precise arranjar outras armas."

[.hint2_1551]
en = "Rats are a common sight around Lumbridge and in Lumbridge Swamp."
pt = "Ratos são comuns em volta de Lumbridge e no Lumbridge Swamp."

[.name_1552]
en = "First Blood"
pt = "Primeiro sangue"

[.desc_1552]
en = "Level your Attack and Defence skills to 5."
pt = "Leve Attack (ataque) e Defence (defesa) ao nível 5."

[.hint1_1552]
en = "To gain Attack experience, fight in Accurate combat style."
pt = "Para ganhar experiência de Attack, lute no estilo de combate Accurate (preciso)."

[.hint2_1552]
en = "To gain Defence experience, fight in Defensive combat style."
pt = "Para ganhar experiência de Defence, lute no estilo de combate Defensive (defensivo)."

[.hint3_1552]
en = "Certain quests also give Attack and Defence experience as rewards."
pt = "Algumas missões também dão experiência de Attack e Defence como recompensa."

[.name_1553]
en = "Temper, Temper"
pt = "Temperamento de aço"

[.desc_1553]
en = "Wield a weapon made of steel."
pt = "Empunhe uma arma de aço (steel)."

[.hint1_1553]
en = "You must have at least 5 Attack to wield steel weapons."
pt = "Você precisa de pelo menos 5 de Attack (ataque) para empunhar armas de aço."

[.name_1554]
en = "Steel Yourself For Combat"
pt = "Nervos de aço"

[.desc_1554]
en = "Wear a piece of armour made of steel."
pt = "Vista uma peça de armadura de aço (steel)."

[.hint1_1554]
en = "You must have at least 5 Defence to wear steel armour."
pt = "Você precisa de pelo menos 5 de Defence (defesa) para vestir armadura de aço."

[.name_1555]
en = "Ammo, Ammo, Ammo"
pt = "Munição pra dar e vender"

[.desc_1555]
en = "Equip iron arrows in your ammunition slot."
pt = "Equipe flechas de ferro (iron arrows) no espaço de munição."

[.hint1_1555]
en = "You may buy iron arrows at Lowe's Archery Emporium in Varrock."
pt = "Você pode comprar flechas de ferro na Lowe's Archery Emporium, em Varrock."

[.name_1556]
en = "Take a Bow"
pt = "Arco em punho"

[.desc_1556]
en = "Equip a shortbow, longbow and crossbow."
pt = "Equipe um arco curto, um arco longo e uma besta (crossbow)."

[.hint1_1556]
en = "Lowe's Archery Emporium in Varrock can provide each of these weapons."
pt = "A Lowe's Archery Emporium, em Varrock, vende todas essas armas."

[.name_1557]
en = "Don't Bury This One"
pt = "Não enterre este machado"

[.desc_1557]
en = "Obtain an iron hatchet."
pt = "Consiga um machado de ferro (iron hatchet)."

[.hint1_1557]
en = "Bob's Brilliant Axes in Lumbridge can sell you one for a small fee."
pt = "A Bob's Brilliant Axes, em Lumbridge, vende um por uma pequena quantia."

[.name_1558]
en = "Mace Invaders"
pt = "Maça Invaders"

[.desc_1558]
en = "Make a bronze mace of your own."
pt = "Faça você mesmo uma maça de bronze (bronze mace)."

[.hint1_1558]
en = "You will need 2 Smithing and a bronze bar to make this weapon."
pt = "Você precisa de 2 de Smithing (forja) e uma barra de bronze (bronze bar) para esta arma."

[.hint2_1558]
en = "You will also need a hammer, obtainable from a general store..."
pt = "Também vai precisar de um martelo (hammer), que se consegue num armazém (general store)..."

[.hint3_1558]
en = "...and an anvil."
pt = "...e de uma bigorna (anvil)."

[.name_1559]
en = "Capital Protection, What?"
pt = "Proteção de primeira, hein?"

[.desc_1559]
en = "Make a bronze helm of your own."
pt = "Faça você mesmo um elmo de bronze (bronze helm)."

[.hint1_1559]
en = "You will need 3 Smithing and a bronze bar to make a medium helm,"
pt = "Você precisa de 3 de Smithing (forja) e uma barra de bronze para um elmo médio (medium helm),"

[.hint2_1559]
en = "or 7 Smithing and two bronze bars for a full helm."
pt = "ou 7 de Smithing e duas barras de bronze para um elmo completo (full helm)."

[.hint3_1559]
en = "You will also need a hammer and an anvil."
pt = "Também vai precisar de martelo (hammer) e bigorna (anvil)."

[.name_1560]
en = "Hack and Smash"
pt = "Quebra-quebra"

[.desc_1560]
en = "Raise your Mining skill to 5."
pt = "Leve Mining (mineração) ao nível 5."

[.name_1564]
en = "Made For Walking"
pt = "Feitas para andar"

[.desc_1564]
en = "Make a pair of leather boots."
pt = "Faça um par de botas de couro (leather boots)."

[.hint1_1564]
en = "You will need 7 Crafting and one piece of soft leather."
pt = "Você precisa de 7 de Crafting (artesanato) e um couro macio (soft leather)."

[.hint2_1564]
en = "You will also need a needle and some thread. Dommik's crafting shop in Al Kharid sells these."
pt = "Também vai precisar de agulha (needle) e linha (thread). A loja de artesanato do Dommik, em Al Kharid, vende os dois."

[.name_1565]
en = "Did Anyone Bring Any Toast?"
pt = "Alguém trouxe torrada?"

[.desc_1565]
en = "Catch some sardines."
pt = "Pesque algumas sardinhas (sardines)."

[.hint1_1565]
en = "You will need 5 Fishing to catch sardines."
pt = "Você precisa de 5 de Fishing (pesca) para pescar sardinhas."

[.hint2_1565]
en = "You will also need a regular fishing rod and some bait. The fishing shop in Lumbridge sells these."
pt = "Também vai precisar de uma vara de pesca comum (fishing rod) e iscas (bait). A loja de pesca de Lumbridge vende os dois."

[.hint3_1565]
en = "Go to a saltwater bait fishing spot."
pt = "Vá a um ponto de pesca com isca em água salgada."

[.set_1565]
en = "Completing this Task will give an amount of money based on total Tasks completed, and five raw herring."
pt = "Completar esta tarefa dá uma quantia em dinheiro conforme o total de tarefas concluídas, e cinco arenques crus (raw herring)."

[.name_1566]
en = "It's Not a Red One"
pt = "Não é um arenque vermelho"

[.desc_1566]
en = "Cook a herring."
pt = "Cozinhe um arenque (herring)."

[.hint1_1566]
en = "Acquire a herring by fishing or by buying it."
pt = "Consiga um arenque pescando ou comprando."

[.hint2_1566]
en = "To fish for herring, use a rod and bait at a saltwater bait fishing spot with at least 10 Fishing."
pt = "Para pescar arenque, use vara (fishing rod) e isca (bait) num ponto de pesca com isca em água salgada, com pelo menos 10 de Fishing (pesca)."

[.hint3_1566]
en = "Use your raw herring on a range or fire with at least 5 Cooking."
pt = "Use o arenque cru num fogão (range) ou fogueira, com pelo menos 5 de Cooking (culinária)."

[.hint4_1566]
en = "It is possible to burn your herring by mistake, so you may wish to bring several."
pt = "Dá para queimar o arenque sem querer, então talvez seja bom levar vários."

[.name_1567]
en = "Not So Confusing After All"
pt = "Nem tão confuso assim"

[.desc_1567]
en = "Cast Confuse on a dummy or a living target."
pt = "Lance Confuse num boneco de treino (dummy) ou num alvo vivo."

[.hint1_1567]
en = "You will need level 3 Magic to cast this spell."
pt = "Você precisa de nível 3 de Magic (magia) para lançar este feitiço."

[.hint2_1567]
en = "You will also need 3 water runes, 2 earth runes and 1 body rune. The magic shop in Varrock sells these."
pt = "Também vai precisar de 3 runas de água (water runes), 2 de terra (earth) e 1 do corpo (body). A loja de magia de Varrock vende essas runas."

[.hint3_1567]
en = "Open your Magic Spellbook and click on the Confuse spell."
pt = "Abra seu livro de feitiços (Magic Spellbook) e clique no feitiço Confuse."

[.hint4_1567]
en = "Click on an enemy or dummy to cast Confuse on it."
pt = "Clique num inimigo ou boneco para lançar Confuse nele."

[.set_1567]
en = "Completing this Task will give an amount of money based on total Tasks completed, a sapphire necklace and ten cosmic runes."
pt = "Completar esta tarefa dá uma quantia em dinheiro conforme o total de tarefas concluídas, um colar de safira (sapphire necklace) e dez runas cósmicas (cosmic runes)."

[.name_1568]
en = "Absolutely Enchanting"
pt = "Simplesmente encantador"

[.desc_1568]
en = "Successfully cast Level-1 Enchant on an item of jewellery."
pt = "Lance Level-1 Enchant com sucesso numa joia (jewellery)."

[.hint1_1568]
en = "You will need level 7 Magic to cast this spell."
pt = "Você precisa de nível 7 de Magic (magia) para lançar este feitiço."

[.hint2_1568]
en = "You will also need a 1 water rune and 1 cosmic rune, and an item of sapphire jewellery to cast it on."
pt = "Também vai precisar de 1 runa de água (water rune), 1 runa cósmica (cosmic rune) e uma joia de safira (sapphire) para encantar."

[.hint3_1568]
en = "The magic shop in Varrock sells water runes."
pt = "A loja de magia de Varrock vende runas de água."

[.hint4_1568]
en = "Completing the Task 'Not So Confusing After All' will allow you to claim a sapphire amulet and a cosmic rune from Explorer Jack or any other taskmaster."
pt = "Completar a tarefa 'Nem tão confuso assim' permite resgatar um amuleto de safira (sapphire amulet) e uma runa cósmica com o Explorer Jack ou outro taskmaster."

[.hint5_1568]
en = "Activate the spell by clicking on it in the list, then on the item you wish to enchant."
pt = "Ative o feitiço clicando nele na lista e depois no item que quer encantar."

[.hint6_1568]
en = "Free players cannot enchant jewellery other than amulets."
pt = "Jogadores gratuitos só podem encantar amuletos."

[.name_1569]
en = "Heart of Oak"
pt = "Coração de carvalho"

[.desc_1569]
en = "Equip an oak shortbow or longbow."
pt = "Equipe um arco curto ou longo de carvalho (oak)."

[.hint1_1569]
en = "You will need 5 Ranged to wield an oak bow."
pt = "Você precisa de 5 de Ranged (à distância) para empunhar esse arco."

[.hint2_1569]
en = "You can buy one from Lowe's Archery Emporium in Varrock."
pt = "Dá para comprar um na Lowe's Archery Emporium, em Varrock."

[.name_1570]
en = "Get the Point"
pt = "Na mosca!"

[.desc_1570]
en = "Fire a steel arrow."
pt = "Dispare uma flecha de aço (steel arrow)."

[.hint1_1570]
en = "You will need at least an oak bow to fire steel arrows, which requires level 5 Ranged."
pt = "Você precisa de pelo menos um arco de carvalho (oak) para disparar flechas de aço, o que exige nível 5 de Ranged (à distância)."

[.hint2_1570]
en = "You can buy the bow and the arrows from Lowe's Archery Emporium in Varrock."
pt = "Dá para comprar o arco e as flechas na Lowe's Archery Emporium, em Varrock."

[.name_1571]
en = "Berry Tasty"
pt = "Delícia de torta"

[.desc_1571]
en = "Bake a redberry pie."
pt = "Asse uma torta de frutas vermelhas (redberry pie)."

[.hint1_1571]
en = "You will need 10 Cooking."
pt = "Você precisa de 10 de Cooking (culinária)."

[.hint2_1571]
en = "To make a redberry pie, first combine water and flour into pastry dough."
pt = "Para fazer a torta, misture primeiro água e farinha até virar massa de torta (pastry dough)."

[.hint3_1571]
en = "Use the dough with a pie dish to make a pie shell - Beefy Bill can sell you a pie dish."
pt = "Use a massa numa forma de torta (pie dish) para fazer a base (pie shell) - o Beefy Bill vende formas de torta."

[.hint4_1571]
en = "Fill the pie shell with redberries (you can find some on bushes south of Varrock's south-east wall)."
pt = "Recheie a base com frutas vermelhas (redberries) - há arbustos delas ao sul da muralha sudeste de Varrock."

[.hint5_1571]
en = "Cook the pie on a range or stove."
pt = "Asse a torta num fogão (range ou stove)."

[.name_1572]
en = "Dishwater"
pt = "Lavagem"

[.desc_1572]
en = "Drink a cheap beer."
pt = "Beba uma cerveja (beer) barata."

[.hint1_1572]
en = "You can buy beer from the pub in Port Sarim for 2 coins."
pt = "Dá para comprar cerveja no bar de Port Sarim por 2 moedas."

[.hint2_1572]
en = "Drinking beer will temporarily increase your Strength and decrease your Attack."
pt = "Beber cerveja aumenta Strength (força) e diminui Attack (ataque) por um tempo."

[.name_1573]
en = "Can't Touch This"
pt = "Nem encostou"

[.desc_1573]
en = "End a fight against a skeleton in Lumbridge Catacombs with as many life points as you started it."
pt = "Termine uma luta contra um esqueleto (skeleton) nas Lumbridge Catacombs com os mesmos pontos de vida (life points) do início."

[.hint1_1573]
en = "You can do this in several ways:"
pt = "Dá para fazer isso de vários jeitos:"

[.hint2_1573]
en = "- Use a ranged weapon and trap your opponent behind a barrier it cannot pass."
pt = "- Use uma arma de longo alcance e deixe o oponente preso atrás de um obstáculo que ele não consiga passar."

[.hint3_1573]
en = "- Eat food to heal yourself enough to fulfil this criterion."
pt = "- Coma para recuperar vida o bastante e cumprir essa condição."

[.hint4_1573]
en = "- Rely on high Defence levels and good armour to avoid taking any damage."
pt = "- Conte com nível alto de Defence (defesa) e boa armadura para não levar dano nenhum."

[.hint5_1573]
en = "You must complete The Blood Pact quest to access Lumbridge Catacombs."
pt = "Você precisa completar a missão The Blood Pact para entrar nas Lumbridge Catacombs."

[.name_1574]
en = "Quarter Centurion"
pt = "Um quarto de centurião"

[.desc_1574]
en = "Gain a total of 25 levels."
pt = "Ganhe 25 níveis no total."

[.name_1575]
en = "Fledgeling Adventurer"
pt = "Aventureiro novato"

[.desc_1575]
en = "Gain four Quest Points."
pt = "Ganhe quatro pontos de missão (Quest Points)."

[.hint1_1575]
en = "Every quest completed awards at least 1 Quest Point. There are those that award more..."
pt = "Toda missão concluída dá pelo menos 1 ponto de missão. Algumas dão mais..."

[.name_1520]
en = "Adventurer's Log"
pt = "Diário do aventureiro"

[.desc_1520]
en = "Cut a log from a regular tree."
pt = "Corte uma tora (log) de uma árvore comum."

[.hint1_1520]
en = "Get a hatchet (you can get one free from Bob's Brilliant Axes in Lumbridge)."
pt = "Pegue um machado (hatchet) - dá para ganhar um de graça na Bob's Brilliant Axes, em Lumbridge."

[.hint2_1520]
en = "Find any regular or dead tree."
pt = "Encontre qualquer árvore comum ou morta."

[.hint3_1520]
en = "Click on the tree while you have your hatchet to start cutting it."
pt = "Clique na árvore tendo o machado com você para começar a cortar."

[.hint4_1520]
en = "You don't need to hold the hatchet, but this can save some inventory room."
pt = "Não precisa empunhar o machado, mas isso economiza espaço no inventário."

[.name_1522]
en = "Log-a-rhythm"
pt = "Log-aritmo"

[.desc_1522]
en = "Set fire to a regular log."
pt = "Ponha fogo numa tora (log) comum."

[.hint1_1522]
en = "Get a regular log (you can cut one from a normal tree if you have a hatchet)."
pt = "Consiga uma tora comum - dá para cortar uma de árvore normal se tiver um machado (hatchet)."

[.hint2_1522]
en = "Bob's Brilliant Axes in Lumbridge can give you a hatchet."
pt = "A Bob's Brilliant Axes, em Lumbridge, pode te dar um machado."

[.hint3_1522]
en = "You will need a tinderbox (you can get one free from a general store)."
pt = "Você precisa de uma pederneira (tinderbox) - dá para pegar uma de graça num armazém (general store)."

[.hint4_1522]
en = "Click on the tinderbox in your inventory and then on your logs to light them."
pt = "Clique na pederneira no inventário e depois nas toras para acendê-las."

[.hint5_1522]
en = "Make sure the ground you're standing on is clear enough to light your logs on."
pt = "Confira se o chão onde você está é livre o bastante para acender as toras."

[.name_1561]
en = "Bovine Intervention"
pt = "Intervenção bovina"

[.desc_1561]
en = "Kill a cow for its hide."
pt = "Mate uma vaca para tirar o couro (cowhide)."

[.hint1_1561]
en = "You can find cows in the field north-east of Lumbridge."
pt = "Há vacas no pasto a nordeste de Lumbridge."

[.name_1562]
en = "Tan Your Hide"
pt = "Curtindo o couro"

[.desc_1562]
en = "Have a cowhide tanned into soft leather."
pt = "Mande curtir um couro (cowhide) em couro macio (soft leather)."

[.hint1_1562]
en = "Ellis, at his shop in Al Kharid, can tan hides for a small fee."
pt = "O Ellis, na loja dele em Al Kharid, curte couros por uma pequena quantia."

[.name_1563]
en = "Handicrafts"
pt = "Trabalho manual"

[.desc_1563]
en = "Craft a pair of soft leather gloves."
pt = "Faça um par de luvas de couro macio (leather gloves)."

[.hint1_1563]
en = "To make a pair of gloves you will need one piece of soft leather, a needle and some thread."
pt = "Para fazer as luvas, você precisa de um couro macio (soft leather), uma agulha (needle) e linha (thread)."

[.hint2_1563]
en = "Ellis can tan cowhide into leather for you in Al Kharid."
pt = "O Ellis, em Al Kharid, pode curtir o couro de vaca (cowhide) para você."

[.hint3_1563]
en = "The needle and thread can be bought from a crafting shop such as Dommik's."
pt = "A agulha e a linha podem ser compradas numa loja de artesanato, como a do Dommik."

[.name_1703]
en = "Talk to Sir Vant"
pt = "Fale com Sir Vant"

[.desc_1703]
en = "The knight, Sir Vant, has information for you.<br><br>To talk to him and find out more, click on him (or click on him and select 'Talk To' if you have a one-button mouse)."
pt = "O cavaleiro Sir Vant tem informações para você.<br><br>Para falar com ele e saber mais, clique nele (ou clique nele e escolha 'Talk To' se o seu mouse tiver um botão só)."

[.set_1703]
en = "Completing this Task will help you escape from the cellar in which you find yourself."
pt = "Concluir esta tarefa vai ajudar você a escapar do porão em que você está."

[.name_1704]
en = "Assist Sir Vant"
pt = "Ajude Sir Vant"

[.desc_1704]
en = "Sir Vant needs your help - talk to him to find out more.<br><br>For more information on this Task, click on the Hints tab above."
pt = "Sir Vant precisa da sua ajuda - fale com ele para saber mais.<br><br>Para mais informações sobre esta tarefa, clique na aba Dicas acima."

[.hint1_1704]
en = "The Hints tab offers further information that will help you complete many Tasks."
pt = "A aba Dicas traz mais informações que vão ajudar você a concluir muitas tarefas."

[.hint2_1704]
en = "Some Hints have a button next to them which you can click to point you to a useful place, thing or person."
pt = "Algumas dicas têm um botão ao lado; clique nele para ser guiado até um lugar, objeto ou pessoa útil."

[.hint3_1704]
en = "For now, simply click on Sir Vant to find out what he needs from you."
pt = "Por enquanto, é só clicar em Sir Vant para descobrir o que ele precisa de você."

[.name_1705]
en = "Gather the Squire's Gear"
pt = "Pegue o equipamento do escudeiro"

[.desc_1705]
en = "Pick up the bronze armour and weapon from the spot where Sir Vant's squire was incinerated.<br><br>For more information on this Task, click on the Hints tab above."
pt = "Pegue a armadura e a arma de bronze no lugar onde o escudeiro de Sir Vant foi incinerado.<br><br>Para mais informações sobre esta tarefa, clique na aba Dicas acima."

[.hint1_1705]
en = "To pick up an object, you may right-click on it where it lies and choose 'Take', or simply left-click on it."
pt = "Para pegar um objeto, clique nele com o botão direito onde ele está e escolha 'Take', ou só clique nele com o botão esquerdo."

[.hint2_1705]
en = "Items you pick up go into your inventory."
pt = "Os itens que você pega vão para o seu inventário."

[.name_1706]
en = "Equip Yourself"
pt = "Equipe-se"

[.desc_1706]
en = "Wield the bronze armour and weapon you have acquired.<br><br>For more information on this Task, click on the Hints tab above."
pt = "Vista a armadura e empunhe a arma de bronze que você conseguiu.<br><br>Para mais informações sobre esta tarefa, clique na aba Dicas acima."

[.hint1_1706]
en = "To wear an object, right-click on it in your inventory and choose 'Wear' or 'Wield'."
pt = "Para vestir um objeto, clique nele com o botão direito no seu inventário e escolha 'Wear' ou 'Wield'."

[.hint2_1706]
en = "Most weapons and armour can be equipped by simply left-clicking on them in your inventory."
pt = "A maioria das armas e armaduras pode ser equipada com um simples clique esquerdo nelas no seu inventário."

[.hint3_1706]
en = "You can see what you are currently wearing, and what effect it has on your character, via the Worn Equipment tab on the side bar."
pt = "Você pode ver o que está vestindo agora, e o efeito disso no seu personagem, na aba Worn Equipment da barra lateral."

[.name_1707]
en = "Kill the Goblin"
pt = "Mate o goblin"

[.desc_1707]
en = "Engage and kill the goblin currently looting Sir Vant's supplies.<br><br>For more information on this Task, click on the Hints tab above."
pt = "Enfrente e mate o goblin que está saqueando os suprimentos de Sir Vant.<br><br>Para mais informações sobre esta tarefa, clique na aba Dicas acima."

[.hint1_1707]
en = "You must have gathered and equipped all three pieces of the squire's gear to engage this goblin."
pt = "Você precisa ter pegado e equipado as três peças do equipamento do escudeiro para enfrentar este goblin."

[.hint2_1707]
en = "Right-click on the goblin and choose 'Attack' to begin combat. You may also left-click the enemy to attack it."
pt = "Clique no goblin com o botão direito e escolha 'Attack' para começar o combate. Você também pode clicar no inimigo com o botão esquerdo para atacá-lo."

[.hint3_1707]
en = "Once combat begins, you will continue to attack your opponent until one of you dies or flees."
pt = "Depois que o combate começa, você continua atacando o oponente até que um de vocês morra ou fuja."

[.hint4_1707]
en = "This goblin poses little threat, but other enemies will be considerably tougher. You can get a rough estimate of an enemy's strength by looking at the level displayed next to their name when you right-click on them."
pt = "Este goblin é pouco perigoso, mas outros inimigos serão bem mais fortes. Para ter uma ideia da força de um inimigo, veja o nível que aparece ao lado do nome dele quando você clica nele com o botão direito."

[.name_1708]
en = "Find Out Sir Vant's Plan"
pt = "Descubra o plano de Sir Vant"

[.desc_1708]
en = "Talk to Sir Vant again to find out what he needs you to do next."
pt = "Fale com Sir Vant de novo para descobrir o que ele precisa que você faça agora."

[.name_1709]
en = "Check your Quest Journal"
pt = "Confira o Quest Journal"

[.desc_1709]
en = "Open the Quest Journal interface to see your current quest progress. Click on an entry in the list to see what you should be doing to progress in that quest."
pt = "Abra a interface Quest Journal para ver o seu progresso nas missões. Clique em um item da lista para ver o que você deve fazer para avançar naquela missão."

[.hint1_1709]
en = "You are now on a quest to deal with the dragon. For more information, click on the Quest List tab on the side bar..."
pt = "Agora você está numa missão para dar um jeito no dragão. Para mais informações, clique na aba Quest List da barra lateral..."

[.hint2_1709]
en = "...and then on the Unstable Foundations entry to view your Quest Journal."
pt = "...e depois em Unstable Foundations para ver o seu Quest Journal."

[.name_1712]
en = "Climb the Wall"
pt = "Escale o muro"

[.desc_1712]
en = "You must get past the dragon.<br><br>Take some drugged meat from Sir Vant's bag, then find a way to climb over the broken wall near Sir Vant into the main room of the cellar.<br><br>For more information on this Task, click on the Hints tab above."
pt = "Você precisa passar pelo dragão.<br><br>Pegue um pouco de carne com sonífero (drugged meat) da bolsa de Sir Vant e encontre um jeito de escalar a parede quebrada perto dele para chegar ao salão principal do porão.<br><br>Para mais informações sobre esta tarefa, clique na aba Dicas acima."

[.hint1_1712]
en = "Pick up some drugged meat from Sir Vant's bag by clicking on it."
pt = "Clique na bolsa de Sir Vant para pegar um pouco de carne com sonífero (drugged meat)."

[.hint2_1712]
en = "The wall is too high to climb without aid."
pt = "A parede é alta demais para escalar sem ajuda."

[.hint3_1712]
en = "There is a plank next to the wall; click on it to pick it up."
pt = "Há uma tábua (plank) ao lado da parede; clique nela para pegá-la."

[.name_1710]
en = "Check your World Map"
pt = "Confira o mapa-múndi"

[.desc_1710]
en = "Before you go off to drug the dragon, check your surroundings. The minimap in the top-right of the screen gives a general picture; for more detail, open the world map by clicking on the globe icon."
pt = "Antes de ir dopar o dragão, confira os arredores. O minimapa no canto superior direito da tela dá uma visão geral; para mais detalhes, abra o mapa-múndi (world map) clicando no ícone do globo."

[.hint1_1710]
en = "Check the minimap in the top-right corner of the screen to see a plan of the cellar."
pt = "Olhe o minimapa no canto superior direito da tela para ver a planta do porão."

[.hint2_1710]
en = "For a more complete picture of the area, click on the globe button next to the minimap."
pt = "Para uma visão mais completa da área, clique no botão do globo ao lado do minimapa."

[.hint3_1710]
en = "The world map will show you many other places once you are free of this cellar."
pt = "O mapa-múndi (world map) vai mostrar muitos outros lugares quando você sair deste porão."

[.name_1711]
en = "Realign your Minimap"
pt = "Realinhe o minimapa"

[.desc_1711]
en = "Set your camera view and minimap alignment back to face North, by clicking on the compass icon next to your minimap."
pt = "Volte a câmera e o minimapa para o norte clicando no ícone da bússola ao lado do seu minimapa."

[.hint1_1711]
en = "Clicking on the compass arrow on the other side of the minimap from the World Map button will cause your camera and minimap to face due North."
pt = "Clicar na seta da bússola, no lado do minimapa oposto ao botão World Map, faz a câmera e o minimapa apontarem bem para o norte."

[.name_1714]
en = "Put the Dragon to Sleep"
pt = "Ponha o dragão para dormir"

[.desc_1714]
en = "Search the cellar to locate the dragon's food bowl and put the drugged meat in it."
pt = "Procure no porão a tigela de comida do dragão e coloque nela a carne com sonífero (drugged meat)."

[.hint1_1714]
en = "Explore the cellar until you find the food bowl."
pt = "Explore o porão até achar a tigela de comida."

[.hint2_1714]
en = "Use the food on the bowl to aid Sir Vant with his plan."
pt = "Use a comida na tigela para ajudar Sir Vant com o plano dele."

[.name_1715]
en = "Talk to Sir Vant Again"
pt = "Fale com Sir Vant de novo"

[.desc_1715]
en = "Sir Vant has joined you by the pillars. Talk to him to discover the next step of the plan."
pt = "Sir Vant foi até você, perto dos pilares. Fale com ele para descobrir o próximo passo do plano."

[.hint1_1715]
en = "Sir Vant has moved; you can now find him by the wooden pillar just south-east of the dragon's nest."
pt = "Sir Vant mudou de lugar; agora ele está perto do pilar de madeira logo a sudeste do ninho do dragão."

[.name_1716]
en = "Sabotage!"
pt = "Sabotagem!"

[.desc_1716]
en = "Set Sir Vant's trap by tying an oily rag around each pillar and adding a fuse.<br><br>Once you have done this, give Sir Vant a tinderbox and light the fuse on the right.<br><br>For more information on this Task, click on the Hints tab above."
pt = "Arme a armadilha de Sir Vant amarrando um trapo oleoso (oily rag) em cada pilar e pondo um pavio (fuse).<br><br>Feito isso, dê uma pederneira (tinderbox) a Sir Vant e acenda o pavio da direita.<br><br>Para mais informações sobre esta tarefa, clique na aba Dicas acima."

[.hint1_1716]
en = "To rip the cloth into strips, simply left-click on it in your inventory."
pt = "Para rasgar o pano (cloth) em tiras, é só clicar nele com o botão esquerdo no seu inventário."

[.hint2_1716]
en = "Use each cloth on the oil can to soak it in oil, then on a pillar to set in place."
pt = "Use cada pano na lata de óleo (oil can) para encharcá-lo de óleo e depois em um pilar para prendê-lo."

[.hint3_1716]
en = "Once the cloth is in place, use the fuse on it to ready the trap."
pt = "Com o pano no lugar, use o pavio (fuse) nele para armar a armadilha."

[.hint4_1716]
en = "You can then give a tinderbox to Sir Vant by clicking on it in your inventory and using it on him."
pt = "Depois, dê uma pederneira (tinderbox) a Sir Vant: clique nela no seu inventário e use-a nele."

[.hint5_1716]
en = "Once all is ready, use the tinderbox on the pillar to light the fuse, then run for cover!"
pt = "Com tudo pronto, use a pederneira no pilar para acender o pavio e corra para se proteger!"

[.name_1717]
en = "Return the Squire's Gear"
pt = "Devolva o equipamento do escudeiro"

[.desc_1717]
en = "Sir Vant will need to return the squire's weapons and armour to the family. Take them off and give them to him."
pt = "Sir Vant vai precisar devolver as armas e a armadura do escudeiro à família dele. Tire-as e entregue a ele."

[.hint1_1717]
en = "Take off your armour and weapons by opening the worn equipment tab and clicking on them."
pt = "Tire a armadura e as armas abrindo a aba Worn Equipment e clicando nelas."

[.hint2_1717]
en = "Right-click on the items in your inventory and choose Use, then click on Sir Vant to hand back the kit."
pt = "Clique nos itens do seu inventário com o botão direito e escolha Use, depois clique em Sir Vant para devolver o equipamento."

[.name_1718]
en = "Discover an Exit"
pt = "Encontre uma saída"

[.desc_1718]
en = "The dragon's breath burned away the ladder to the surface.<br><br>Locate another way out - the man you rescued may be able to advise you."
pt = "O sopro do dragão queimou a escada que levava à superfície.<br><br>Encontre outra saída - o homem que você resgatou talvez possa aconselhar você."

[.hint1_1718]
en = "The ladder in the starting room is gone, but you may be able to use the ladder in the cellar of the connected house, if you can reach it."
pt = "A escada da sala inicial sumiu, mas talvez você possa usar a do porão da casa vizinha, se conseguir chegar até ela."

[.hint2_1718]
en = "You'll need to exploit a weak spot in the wall between the two cellars in order to make further progress."
pt = "Você vai precisar aproveitar um ponto fraco na parede entre os dois porões para seguir em frente."

[.hint3_1718]
en = "Talk to Roddeck, the man who just came out of the cupboard, to seek his input."
pt = "Fale com Roddeck, o homem que acabou de sair do armário, para pedir a opinião dele."

[.name_1719]
en = "Cutting a Path"
pt = "Cortando caminho"

[.desc_1719]
en = "Use a woodcutting hatchet to clear the roots blocking the right-hand path out of the cellar.<br><br>You now have two Tasks: click on the Back button above or the Task System icon to view both, then on one of the icons displayed to find out more."
pt = "Use um machado (hatchet) para cortar as raízes que bloqueiam a saída da direita do porão.<br><br>Agora você tem duas tarefas: clique no botão Voltar acima ou no ícone do Task System para ver as duas, e depois em um dos ícones mostrados para saber mais."

[.hint1_1719]
en = "The exit route you have chosen is blocked by thick roots. In order to clear them, you will need a hatchet; simply click on them to attempt to cut through."
pt = "A saída que você escolheu está bloqueada por raízes grossas. Para tirá-las, você vai precisar de um machado (hatchet); é só clicar nelas para tentar cortá-las."

[.name_1720]
en = "Breaking Through"
pt = "Quebrando barreiras"

[.desc_1720]
en = "Use a mining pickaxe to clear the rubble blocking the left-hand path out of the cellar.<br><br>You now have two Tasks: click on the Back button above or the Task System icon to view both, then on one of the icons displayed to find out more."
pt = "Use uma picareta (pickaxe) para tirar os escombros que bloqueiam a saída da esquerda do porão.<br><br>Agora você tem duas tarefas: clique no botão Voltar acima ou no ícone do Task System para ver as duas, e depois em um dos ícones mostrados para saber mais."

[.hint1_1720]
en = "The exit route you have chosen is blocked by rubble. In order to clear it, you will need a pickaxe; simply click on the rubble to attempt to break through it."
pt = "A saída que você escolheu está bloqueada por escombros. Para tirá-los, você vai precisar de uma picareta (pickaxe); é só clicar nos escombros para tentar abrir caminho."

[.name_1721]
en = "Skill in Woodcutting"
pt = "Treine Woodcutting"

[.desc_1721]
en = "Clearing the roots requires level 2 Woodcutting. Find a way to attain this; Roddeck may have some useful advice."
pt = "Cortar as raízes exige nível 2 de Woodcutting (corte de lenha). Descubra como chegar lá; Roddeck pode ter um conselho útil."

[.hint1_1721]
en = "It seems that cutting through a tangle of roots is a harder job than it looked. You'll need to get in some practice in order to be up to the task."
pt = "Parece que cortar um emaranhado de raízes é mais difícil do que parecia. Você vai precisar praticar um pouco para dar conta do serviço."

[.hint2_1721]
en = "On another wall nearby is a spot where weaker roots have breached the cellar walls. Click on them, or use your hatchet on them, to cut them and practice the art of woodcutting."
pt = "Em outra parede ali perto há um ponto onde raízes mais finas atravessaram as paredes do porão. Clique nelas, ou use o machado (hatchet) nelas, para cortá-las e praticar Woodcutting (corte de lenha)."

[.hint3_1721]
en = "Each root knole you successfully chop will yield some chippings and 42 experience. The chippings are useless to you and can be safely dropped on the floor using their right-click option."
pt = "Cada nó de raiz que você conseguir cortar rende algumas lascas (chippings) e 42 pontos de experiência. As lascas não servem para nada e podem ser largadas no chão pela opção do botão direito."

[.hint4_1721]
en = "Gaining 83 experience from cutting the roots will allow you to reach level 2 and be ready to deal with the major root blockage."
pt = "Com 83 pontos de experiência cortando as raízes, você chega ao nível 2 e fica pronto para enfrentar o grande bloqueio de raízes."

[.name_1722]
en = "Skill in Mining"
pt = "Treine Mining"

[.desc_1722]
en = "Clearing the rubble requires level 2 Mining. Find a way to attain this; Roddeck may have some useful advice."
pt = "Tirar os escombros exige nível 2 de Mining (mineração). Descubra como chegar lá; Roddeck pode ter um conselho útil."

[.hint1_1722]
en = "It seems that smashing through solid rock is a harder job than it looked. You'll need to get in some practice in order to be up to the task."
pt = "Parece que quebrar rocha sólida é mais difícil do que parecia. Você vai precisar praticar um pouco para dar conta do serviço."

[.hint2_1722]
en = "On the ground nearby is a spot where stone has fallen from the ceiling. Click on it, or use your pick on it, to hack at it and practice the art of mining."
pt = "No chão ali perto há um ponto onde caíram pedras do teto. Clique nele, ou use a picareta (pickaxe) nele, para quebrar as pedras e praticar Mining (mineração)."

[.hint3_1722]
en = "Each lump of rock you successfully shatter will yield some chippings and 42 experience. The chippings are useless to you and can be safely dropped on the floor using their right-click option."
pt = "Cada pedaço de rocha que você conseguir quebrar rende algumas lascas (chippings) e 42 pontos de experiência. As lascas não servem para nada e podem ser largadas no chão pela opção do botão direito."

[.hint4_1722]
en = "Gaining 83 experience from breaking the stone will allow you to reach level 2 and be ready to deal with the major rubble blockage."
pt = "Com 83 pontos de experiência quebrando as pedras, você chega ao nível 2 e fica pronto para enfrentar o grande bloqueio de escombros."

[.name_1723]
en = "To Freedom!"
pt = "Rumo à liberdade!"

[.desc_1723]
en = "Leave the cellar via the ladder under Explorer Jack's house."
pt = "Saia do porão pela escada que fica embaixo da casa do Explorer Jack."

[.hint1_1723]
en = "By clearing a path into Explorer Jack's cellar you have opened a route to the outside world."
pt = "Ao abrir caminho até o porão do Explorer Jack, você encontrou uma rota para o mundo lá fora."

[.hint2_1723]
en = "Depart up the ladder to the surface."
pt = "Suba a escada até a superfície."

[.name_1724]
en = "Introducing...Explorer Jack"
pt = "Apresentando... Explorer Jack"

[.desc_1724]
en = "Talk to Explorer Jack about the world outside."
pt = "Fale com o Explorer Jack sobre o mundo lá fora."

[.hint1_1724]
en = "Explorer Jack can tell you more about the Tasks and other possible goals available to you outside. Talk to him before you go."
pt = "O Explorer Jack pode contar mais sobre as tarefas e outros objetivos que esperam por você lá fora. Fale com ele antes de ir."

[.name_1725]
en = "The Journey Begins"
pt = "A jornada começa"

[.desc_1725]
en = "You may now leave Explorer Jack's house and begin your own explorations."
pt = "Agora você pode sair da casa do Explorer Jack e começar a explorar por conta própria."

[.hint1_1725]
en = "Good luck and have fun!"
pt = "Boa sorte e divirta-se!"

[.name_1702]
en = "Rotate Your Camera"
pt = "Gire a câmera"

[.desc_1702]
en = "Welcome to RuneScape.<br><br>You control your camera view using the arrow keys.<br><br>Pan the camera round until you can see the knight at the door of the room you are in."
pt = "Bem-vindo ao RuneScape.<br><br>Você controla a câmera com as setas do teclado.<br><br>Gire a câmera até conseguir ver o cavaleiro na porta da sala onde você está."

[.name_1713]
en = "Make a Ramp"
pt = "Faça uma rampa"

[.desc_1713]
en = "The wall is too high to climb without aid. Click on the plank in your inventory to select it, then on the wall to construct a ramp.<br><br>For more information on this Task, click on the Hints tab above."
pt = "A parede é alta demais para escalar sem ajuda. Clique na tábua (plank) no seu inventário para selecioná-la e depois na parede para montar uma rampa.<br><br>Para mais informações sobre esta tarefa, clique na aba Dicas acima."

[.hint1_1713]
en = "In your inventory, click on the plank to select it."
pt = "No seu inventário, clique na tábua (plank) para selecioná-la."

[.hint2_1713]
en = "With the plank selected, click on the low wall to place it. Once you have placed the plank down, you will be able to climb the wall by clicking on it."
pt = "Com a tábua selecionada, clique na parede baixa para colocá-la. Depois de posicionar a tábua, você poderá escalar a parede clicando nela."

[.name_1218]
en = "Lumbridge Set Tasks - Beginner"
pt = "Tarefas do conjunto de Lumbridge - Iniciante"

[.desc_1218]
en = "Given by Explorer Jack in Lumbridge for completing all Beginner Tasks in Lumbridge."
pt = "Entregue pelo Explorer Jack, em Lumbridge, por completar todas as tarefas de dificuldade Iniciante em Lumbridge."

[.hint1_1218]
en = "The ring provides the following benefits:"
pt = "O anel dá os seguintes benefícios:"

[.hint2_1218]
en = "- Recharge 50% of your run energy once per day."
pt = "- Recarregar 50% da energia de corrida (run energy) uma vez por dia."

[.hint3_1218]
en = "- Slight boost to Prayer and Magic."
pt = "- Pequeno bônus em Prayer (oração) e Magic (magia)."

[.hint4_1218]
en = "- Access to the Explore emote."
pt = "- Acesso ao emote Explore."

[.set_1218]
en = "Explorer's ring 1 and a magic lamp worth 500xp in a skill of your choice."
pt = "Explorer's ring 1 (anel de explorador) e uma lâmpada mágica de 500xp numa habilidade à sua escolha."

[.name_1219]
en = "Lumbridge Set Tasks - Easy"
pt = "Tarefas do conjunto de Lumbridge - Fácil"

[.desc_1219]
en = "Given by Bob, the axe seller in Lumbridge, for completing all Easy Tasks in Lumbridge."
pt = "Entregue pelo Bob, o vendedor de machados de Lumbridge, por completar todas as tarefas de dificuldade Fácil em Lumbridge."

[.hint1_1219]
en = "The ring gains the following extra benefits:"
pt = "O anel ganha estes benefícios extras:"

[.hint2_1219]
en = "- Recharge 50% of your run energy twice per day."
pt = "- Recarregar 50% da energia de corrida (run energy) duas vezes por dia."

[.hint3_1219]
en = "- Cast Low-level Alchemy without runes, 30 times per day."
pt = "- Lançar Low-level Alchemy sem runas, 30 vezes por dia."

[.hint4_1219]
en = "- 10% chance per essence of receiving extra elemental runes from runecrafting."
pt = "- 10% de chance, por essência, de receber runas elementais extras no Runecrafting (criação de runas)."

[.set_1219]
en = "Explorer's ring 2 and a magic lamp worth 1,000xp in a skill of your choice."
