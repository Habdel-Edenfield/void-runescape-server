# Brazilian Portuguese for the interfaces the client draws from the cache (Task System, level up pop-up),
# generated by `./gradlew :tools:translateInterfaces --args=table` from tools/translation/sources/pt_tasks*.json
# and pt_level_up*.json: edit those, not this file. The cache copy is applied with `--args=patch`; the server uses
# the name, difficulty, area and chat rows in task chat messages and sends the label rows itself.

[interface_pt_br]
en = "string"
pt = "string"
interface = "int"
component = "int"

[.name_1214]
en = "A Grave Consideration"
pt = "Uma escolha de peso"

[.desc_1214]
en = "Look through Father Aereck's selection of gravestones."
pt = "Veja as lápides que o Father Aereck tem para escolher."

[.hint1_1214]
en = "You must have completed The Restless Ghost."
pt = "Você precisa ter concluído a missão The Restless Ghost."

[.hint2_1214]
en = "Make your way to Lumbridge's church."
pt = "Vá até a igreja de Lumbridge."

[.hint3_1214]
en = "Speak to Father Aereck to view his selection of gravestones."
pt = "Fale com o Father Aereck para ver as lápides que ele tem para escolher."

[.set_1214]
en = "This Beginner Task is part of the Lumbridge set."
pt = "Esta tarefa Iniciante faz parte do conjunto de Lumbridge."

[.name_1198]
en = "Doom!"
pt = "Perdição!"

[.desc_1198]
en = "Speak with the Doomsayer about the Warning System."
pt = "Fale com o Doomsayer sobre o sistema de avisos."

[.hint1_1198]
en = "The Doomsayer can be found near the Lumbridge Sage, north-east of Lumbridge Castle."
pt = "O Doomsayer fica perto do Lumbridge Sage, a nordeste do Lumbridge Castle."

[.hint2_1198]
en = "Speak to him and ask about the Warning System."
pt = "Fale com ele e pergunte sobre o sistema de avisos."

[.name_1212]
en = "Shrimpin' Ain't Easy"
pt = "Camarão que dorme a onda leva"

[.desc_1212]
en = "Catch some shrimp in the fishing spot to the east of Lumbridge Swamp."
pt = "Pesque alguns camarões (shrimp) no ponto de pesca a leste do Lumbridge Swamp."

[.hint1_1212]
en = "You can get a small fishing net from the fishing shop in Lumbridge."
pt = "Você consegue uma rede de pesca pequena (small fishing net) na loja de pesca de Lumbridge."

[.hint2_1212]
en = "Follow the road south out of Lumbridge, past Bob's Brilliant Axes and through the graveyard."
pt = "Siga a estrada para o sul saindo de Lumbridge, passando pela Bob's Brilliant Axes e pelo cemitério."

[.hint3_1212]
en = "Keep following the road until you see it fork east to the sea."
pt = "Continue pela estrada até ver que ela se divide para o leste, rumo ao mar."

[.hint4_1212]
en = "Click on one of the fishing spots to begin fishing."
pt = "Clique em um dos pontos de pesca para começar a pescar."

[.name_1153]
en = "Master of All I Survey"
pt = "Senhor de tudo que vejo"

[.desc_1153]
en = "Climb to the highest point in Lumbridge."
pt = "Suba até o ponto mais alto de Lumbridge."

[.hint1_1153]
en = "Enter Lumbridge Castle and make your way to one of the staircases, either to the north or south of the castle."
pt = "Entre no Lumbridge Castle e vá até uma das escadarias, ao norte ou ao sul do castelo."

[.hint2_1153]
en = "Climb the staircase to the first floor. Climb the staircase further until you reach the second floor."
pt = "Suba a escadaria até o primeiro andar. Continue subindo até chegar ao segundo andar."

[.hint3_1153]
en = "Head towards the bank and climb the ladder, right of the bank door, to reach the pinnacle of Lumbridge Castle's roof."
pt = "Vá em direção ao banco e suba a escada de mão à direita da porta do banco para chegar ao topo do telhado do Lumbridge Castle."

[.name_1196]
en = "Raise the Roof"
pt = "Levante a bandeira"

[.desc_1196]
en = "Raise the flag on the roof of the Lumbridge bank."
pt = "Hasteie a bandeira no telhado do banco de Lumbridge."

[.hint1_1196]
en = "Travel to Lumbridge Castle."
pt = "Vá até o Lumbridge Castle."

[.hint2_1196]
en = "Go to the stairs in the north-west or south-west corner of the castle."
pt = "Vá até a escadaria no canto noroeste ou sudoeste do castelo."

[.hint3_1196]
en = "Climb to the top of the castle to reach the bank. Use the ladder to climb onto the bank roof."
pt = "Suba até o topo do castelo para chegar ao banco. Use a escada de mão para subir no telhado do banco."

[.hint4_1196]
en = "The flag will be in front of you - use the handle to raise the flag."
pt = "A bandeira vai estar na sua frente - use a manivela para hasteá-la."

[.name_1197]
en = "Hail to the Duke, Baby"
pt = "Salve o Duke, baby"

[.desc_1197]
en = "Speak to Horacio, the Duke of Lumbridge."
pt = "Fale com Horacio, o Duke de Lumbridge."

[.hint1_1197]
en = "The Duke of Lumbridge can be found in his bedroom in Lumbridge Castle."
pt = "O Duke de Lumbridge fica no quarto dele, no Lumbridge Castle."

[.hint2_1197]
en = "Enter the castle and make your way to one of the staircases, either to the north or south."
pt = "Entre no castelo e vá até uma das escadarias, ao norte ou ao sul."

[.hint3_1197]
en = "Climb the staircase to the first floor. Head down the corridor and enter the Duke's bedroom."
pt = "Suba a escadaria até o primeiro andar. Siga pelo corredor e entre no quarto do Duke."

[.hint4_1197]
en = "Speak to the Duke to introduce yourself."
pt = "Fale com o Duke para se apresentar."

[.name_1200]
en = "Window Shopping"
pt = "Só dando uma olhada"

[.desc_1200]
en = "Browse Lumbridge's general store."
pt = "Veja as mercadorias do armazém (general store) de Lumbridge."

[.hint1_1200]
en = "Lumbridge's general store can be found north of Lumbridge Castle."
pt = "O armazém (general store) de Lumbridge fica ao norte do Lumbridge Castle."

[.hint2_1200]
en = "Head into the store and speak to the shopkeeper. Ask to see what he has for trade."
pt = "Entre na loja e fale com o lojista. Peça para ver o que ele tem à venda."

[.name_1207]
en = "Grinding My Gears"
pt = "Mó trabalho"

[.desc_1207]
en = "Grind some flour in Lumbridge's mill."
pt = "Moa um pouco de farinha no moinho de Lumbridge."

[.hint1_1207]
en = "Follow the road north out of Lumbridge."
pt = "Siga a estrada para o norte saindo de Lumbridge."

[.hint2_1207]
en = "Go past the general store and Fred's farm, until you reach a junction with a wheat field."
pt = "Passe pelo armazém e pela fazenda do Fred até chegar a um cruzamento com um campo de trigo."

[.hint3_1207]
en = "Enter the windmill to the north."
pt = "Entre no moinho de vento ao norte."

[.hint4_1207]
en = "Climb the ladders to the very top of the windmill and put some grain into the hopper."
pt = "Suba as escadas de mão até o topo do moinho e coloque um pouco de trigo (grain) na tremonha (hopper)."

[.hint5_1207]
en = "Operate the hopper controls to grind the grain and climb back down to remove your flour from the bin below."
pt = "Acione os controles da tremonha para moer o trigo e desça de novo para tirar a farinha do recipiente lá embaixo."

[.name_1199]
en = "Sage Advice"
pt = "Conselho de sábio"

[.desc_1199]
en = "Talk to the Lumbridge Sage."
pt = "Fale com o Lumbridge Sage."

[.hint1_1199]
en = "The Lumbridge Sage can be found east of Lumbridge Castle, by the river. Speak to him."
pt = "O Lumbridge Sage fica a leste do Lumbridge Castle, perto do rio. Fale com ele."

[.name_1215]
en = "Tinkle the Ivories"
pt = "Tocando de ouvido"

[.desc_1215]
en = "Play on the organ in Lumbridge's church."
pt = "Toque o órgão da igreja de Lumbridge."

[.hint2_1215]
en = "Play on the organ at the north end of the church."
pt = "Toque o órgão no extremo norte da igreja."

[.name_1217]
en = "Passing Out"
pt = "Passando mal"

[.desc_1217]
en = "Ask about the toll at the Al Kharid gate."
pt = "Pergunte sobre o pedágio no portão de Al Kharid."

[.hint1_1217]
en = "The guards at the gate charge a toll for use of the gate. Talk to them to find out about the toll."
pt = "Os guardas do portão cobram pedágio para quem quer passar. Fale com eles para saber do pedágio."

[.hint2_1217]
en = "Follow the road east away from Lumbridge Castle and cross the bridge."
pt = "Siga a estrada para o leste, saindo do Lumbridge Castle, e atravesse a ponte."

[.hint3_1217]
en = "Keep following the road east until you reach the Al Kharid toll gate."
pt = "Continue pela estrada para o leste até chegar ao portão do pedágio de Al Kharid."

[.name_1209]
en = "The Rules of Engagement"
pt = "Regras do jogo"

[.desc_1209]
en = "Find out about the Rules of Conduct from the town crier in Draynor."
pt = "Saiba das Rules of Conduct (regras de conduta) com o pregoeiro (town crier) de Draynor."

[.hint2_1209]
en = "Pass the general store, Fred's farm and the wheat fields until you reach a crossroads."
pt = "Passe pelo armazém (general store), pela fazenda do Fred e pelos campos de trigo até chegar a um cruzamento."

[.hint3_1209]
en = "At the crossroads, head south into Draynor and west when you reach the bank."
pt = "No cruzamento, vá para o sul até Draynor e, ao chegar ao banco, vire para o oeste."

[.hint4_1209]
en = "The town crier can be found in the marketplace."
pt = "O pregoeiro (town crier) fica na praça do mercado."

[.name_1211]
en = "Take Your Pick"
pt = "Mãos à picareta"

[.desc_1211]
en = "Mine some copper in the mining spot to the south-east of Lumbridge Swamp."
pt = "Minere cobre (copper) na mina a sudeste de Lumbridge Swamp."

[.hint1_1211]
en = "Acquire a pickaxe (you can get one free from Bob's Brilliant Axes)."
pt = "Consiga uma picareta (pickaxe); você ganha uma de graça na Bob's Brilliant Axes."

[.hint2_1211]
en = "Follow the road south out of Lumbridge."
pt = "Siga a estrada para o sul, saindo de Lumbridge."

[.hint3_1211]
en = "Keep following the road south, through the graveyard and along the coast until you reach the mining spot."
pt = "Continue pela estrada para o sul, passando pelo cemitério e pela costa, até chegar à mina."

[.hint4_1211]
en = "Prospect the rocks to discover which one holds copper and then mine it to gain some copper ore."
pt = "Use 'Prospect' nas rochas para ver qual tem cobre e depois minere-a para obter minério de cobre (copper ore)."

[.name_1216]
en = "Ring My Bell"
pt = "Bate o sino"

[.desc_1216]
en = "Ring the bell in Lumbridge's church."
pt = "Toque o sino da igreja de Lumbridge."

[.hint2_1216]
en = "Inside, climb the ladder to reach the balcony on the first floor."
pt = "Lá dentro, suba a escada para chegar à galeria do primeiro andar."

[.hint3_1216]
en = "Follow the balcony and climb the ladder at the end of it to reach the bell tower, then ring the bell."
pt = "Siga pela galeria e suba a escada no fim dela para chegar à torre do sino; depois, toque o sino."

[.name_1206]
en = "In the Countyard"
pt = "No pátio do Conde"

[.desc_1206]
en = "Enter the courtyard of Draynor Mansion."
pt = "Entre no pátio da Draynor Manor."

[.hint2_1206]
en = "Pass the chicken farm and wheat fields and continue until you reach the crossroads."
pt = "Passe pela granja e pelos campos de trigo e continue até chegar ao cruzamento."

[.hint3_1206]
en = "At the crossroads, head north through the dead woods until you reach Draynor Manor."
pt = "No cruzamento, vá para o norte pelo bosque morto até chegar à Draynor Manor."

[.hint4_1206]
en = "Walk through the gates to enter the courtyard."
pt = "Passe pelo portão para entrar no pátio."

[.name_1210]
en = "Tower Power"
pt = "Poder da torre"

[.desc_1210]
en = "Climb to the top of the Wizards' Tower."
pt = "Suba até o topo da Wizards' Tower."

[.hint1_1210]
en = "Follow the road north out of Lumbridge until you reach the general store."
pt = "Siga a estrada para o norte, saindo de Lumbridge, até chegar ao armazém (general store)."

[.hint2_1210]
en = "At the general store, take the road west until you reach a bridge to the south."
pt = "No armazém, pegue a estrada para o oeste até ver uma ponte ao sul."

[.hint3_1210]
en = "Cross the bridge and enter the tower."
pt = "Atravesse a ponte e entre na torre."

[.hint4_1210]
en = "Use the ladders to climb to the top of the Wizards' Tower."
pt = "Use as escadas para subir até o topo da Wizards' Tower."

[.name_1208]
en = "Beware of Pigzilla"
pt = "Cuidado com o Porcozilla"

[.desc_1208]
en = "Visit Draynor Village market."
pt = "Visite o mercado de Draynor Village."

[.name_1201]
en = "Wait, That's Not a Sheep"
pt = "Peraí, isso não é uma ovelha"

[.desc_1201]
en = "Visit Fred the Farmer's chicken and sheep farm."
pt = "Visite a fazenda de galinhas e ovelhas do Fred the Farmer."

[.hint1_1201]
en = "Follow the road north out of Lumbridge, past the general store."
pt = "Siga a estrada para o norte, saindo de Lumbridge, e passe pelo armazém (general store)."

[.hint2_1201]
en = "Fred the Farmer's farm will be on your way north."
pt = "A fazenda do Fred the Farmer fica no caminho, ao norte."

[.hint3_1201]
en = "When you reach the farm building, open the gate and enter through the door."
pt = "Ao chegar à casa da fazenda, abra o portão e entre pela porta."

[.name_1213]
en = "The Fruit of the Sea"
pt = "Fruto do mar"

[.desc_1213]
en = "Sell a raw shrimp to Lumbridge's fishing shop."
pt = "Venda um camarão cru (raw shrimp) na loja de pesca de Lumbridge."

[.hint1_1213]
en = "The fishing shop can be found north-west of Lumbridge Castle."
pt = "A loja de pesca fica a noroeste do Lumbridge Castle."

[.hint2_1213]
en = "Click to trade with Hank to sell him a raw shrimp."
pt = "Clique em 'Trade' no Hank para vender a ele um camarão cru (raw shrimp)."

[.name_1202]
en = "Clay of Champions"
pt = "Argila de campeão"

[.desc_1202]
en = "Mine some clay in the mining spot north of the Champions' Guild."
pt = "Minere argila (clay) na mina ao norte da Champions' Guild."

[.hint1_1202]
en = "Get a pickaxe (you can get one free from Bob's Brilliant Axes)."
pt = "Arranje uma picareta (pickaxe); você ganha uma de graça na Bob's Brilliant Axes."

[.hint2_1202]
en = "Head east out of Lumbridge and cross the bridge. Follow the road north until you reach a t-junction."
pt = "Saia de Lumbridge para o leste e atravesse a ponte. Siga a estrada para o norte até chegar a um cruzamento em T."

[.hint3_1202]
en = "Head west along the road until you reach the entrance to the city of Varrock."
pt = "Vá para o oeste pela estrada até chegar à entrada da cidade de Varrock."

[.hint4_1202]
en = "From here, head directly west to reach the mining spot."
pt = "Dali, vá direto para o oeste até chegar à mina."

[.hint5_1202]
en = "Prospect the rocks to find the clay and then use your pickaxe on it."
pt = "Use 'Prospect' nas rochas para achar a argila e depois use a picareta nela."

[.name_1203]
en = "Just Add Water"
pt = "É só pôr água"

[.desc_1203]
en = "Make some soft clay in the Draynor Village potter's house."
pt = "Faça argila macia (soft clay) na casa do oleiro em Draynor Village."

[.hint1_1203]
en = "Use a bucket, jug or bowl with any sink to fill it with water."
pt = "Use um balde (bucket), jarro (jug) ou tigela (bowl) numa pia qualquer para encher de água."

[.hint3_1203]
en = "Pass the general store, Fred's sheep and chicken farm and the wheat fields until you reach a crossroads."
pt = "Passe pelo armazém (general store), pela fazenda de ovelhas e galinhas do Fred e pelos campos de trigo até chegar a um cruzamento."

[.hint4_1203]
en = "The potter's house is just west of the crossroads."
pt = "A casa do oleiro fica logo a oeste do cruzamento."

[.hint5_1203]
en = "In the house, use the bucket of water with some clay you have mined to make soft clay."
pt = "Na casa, use o balde de água (bucket of water) na argila que você minerou para fazer argila macia (soft clay)."

[.name_1204]
en = "Very Potter"
pt = "Oleiro de mão cheia"

[.desc_1204]
en = "Make a pot on the potter's wheel in Draynor Village."
pt = "Faça um pote (pot) na roda de oleiro (potter's wheel) de Draynor Village."

[.hint5_1204]
en = "Use some soft clay with the potter's wheel to make a pot."
pt = "Use argila macia (soft clay) na roda de oleiro para fazer um pote."

[.name_1205]
en = "Hotpot"
pt = "Pote quente"

[.desc_1205]
en = "Fire a pot in the pottery oven of the potter's house in Draynor Village."
pt = "Queime um pote no forno de cerâmica (pottery oven) da casa do oleiro em Draynor Village."

[.hint1_1205]
en = "Enter the potter's house in Draynor Village."
pt = "Entre na casa do oleiro em Draynor Village."

[.hint2_1205]
en = "Use your unfired pot with the pottery oven to finish crafting a pot."
pt = "Use o pote cru (unfired pot) no forno de cerâmica para terminar o pote."

[.name_1233]
en = "And It Was THIS Big!"
pt = "E era DESTE tamanho!"

[.desc_1233]
en = "Catch a pike in the river to the east of Lumbridge Castle."
pt = "Pesque um lúcio (pike) no rio a leste do Lumbridge Castle."

[.set_1233]
en = "This Easy Task is part of the Lumbridge set."
pt = "Esta tarefa Fácil faz parte do conjunto de Lumbridge."

[.name_1247]
en = "Draaaaaiiiiiins..."
pt = "Esgoooooootos..."

[.desc_1247]
en = "Defeat a zombie in the sewers under the jailhouse."
pt = "Derrote um zumbi (zombie) nos esgotos embaixo da cadeia."

[.name_1234]
en = "Belter of a Smelter"
pt = "Fornalha que não falha"

[.desc_1234]
en = "Smelt a steel bar in the furnace in Lumbridge."
pt = "Funda uma barra de aço (steel bar) na fornalha de Lumbridge."

[.name_1242]
en = "Come In Here and Say That"
pt = "Diz isso na minha cara"

[.desc_1242]
en = "Taunt the lesser demon at the top of the Wizards' Tower."
pt = "Provoque o demônio menor (lesser demon) no topo da Wizards' Tower."

[.name_1240]
en = "Slippery When Wet"
pt = "Cuidado, piso molhado"

[.desc_1240]
en = "Craft a water rune at the Water Altar."
pt = "Crie uma runa de água (water rune) no Water Altar."

[.name_1245]
en = "Klept-Old-Man-ia"
pt = "Clepto-Old-Man-ia"

[.desc_1245]
en = "Ask the Wise Old Man to check your bank for unnecessary quest-related items."
pt = "Peça ao Wise Old Man para procurar no seu banco itens de missão que você não precisa mais."

[.name_1246]
en = "Eye on the Prize"
pt = "De olho no prêmio"

[.desc_1246]
en = "Discover what the Wise Old Man is watching through his telescope."
pt = "Descubra o que o Wise Old Man está observando pelo telescópio."

[.name_1241]
en = "I Can't Hear Dead People"
pt = "Eu não ouço gente morta"

[.desc_1241]
en = "Get a replacement amulet of ghostspeak from Father Urhney."
pt = "Peça ao Father Urhney outro amuleto da fala fantasma (amulet of ghostspeak)."

[.name_1235]
en = "Nowt Tool Look At"
pt = "Num tem nada pra vê"

[.desc_1235]
en = "Search the shed in Lumbridge Swamp."
pt = "Vasculhe o galpão em Lumbridge Swamp."

[.name_1236]
en = "You Doity Rat"
pt = "Seu rato imundo"

[.desc_1236]
en = "Kill a giant rat in Lumbridge Swamp."
pt = "Mate um rato gigante (giant rat) em Lumbridge Swamp."

[.name_1237]
en = "It Was Dead Already!"
pt = "Já estava morta!"

[.desc_1237]
en = "Cut down a dead tree in Lumbridge Swamp."
pt = "Corte uma árvore morta em Lumbridge Swamp."

[.name_1238]
en = "Camping Trip"
pt = "Hora de acampar"

[.desc_1238]
en = "Light a campfire using standard logs in Lumbridge Swamp."
pt = "Acenda uma fogueira com toras (logs) comuns em Lumbridge Swamp."

[.name_1239]
en = "Ratatouille"
pt = "Ratatouille"

[.desc_1239]
en = "Cook some rat meat on a campfire in Lumbridge Swamp."
pt = "Cozinhe carne de rato (rat meat) numa fogueira em Lumbridge Swamp."

[.name_1243]
en = "What Is This Place?"
pt = "Que lugar é este?"

[.desc_1243]
en = "Have Sedridor teleport you to the Rune Essence Mine."
pt = "Peça ao Sedridor para teletransportar você até a Rune Essence Mine."

[.name_1244]
en = "Money Down the Drayn"
pt = "Dinheiro pelo ralo"

[.desc_1244]
en = "Access the bank in Draynor Village."
pt = "Acesse o banco de Draynor Village."

[.name_1229]
en = "Artisan Crafting"
pt = "Arte de artesão"

[.desc_1229]
en = "Create a clay ring."
pt = "Faça um anel de argila (clay ring)."

[.hint1_1229]
en = "You will need one piece of soft clay. You can make soft clay by mining hard clay and adding water."
pt = "Você vai precisar de um pedaço de argila macia (soft clay). Para fazê-la, minere argila dura e acrescente água."

[.hint2_1229]
en = "You will also need a ring mould. The crafting shop in Al Kharid sells these."
pt = "Você também vai precisar de um molde de anel (ring mould). A loja de artesanato de Al Kharid vende."

[.name_1230]
en = "Bless Is More"
pt = "Que bênção!"

[.desc_1230]
en = "Have a clay ring blessed."
pt = "Mande abençoar um anel de argila (clay ring)."

[.hint1_1230]
en = "You will need a clay ring."
pt = "Você vai precisar de um anel de argila (clay ring)."

[.hint2_1230]
en = "The priest in Lumbridge can bless the ring for you once you have completed The Restless Ghost."
pt = "Depois que você completar The Restless Ghost, o padre de Lumbridge pode abençoar o anel para você."

[.name_1231]
en = "Morgan the Merrier"
pt = "Quanto mais Morgan, melhor"

[.desc_1231]
en = "Sell a clay ring to Morgan in Draynor Village."
pt = "Venda um anel de argila (clay ring) ao Morgan, em Draynor Village."

[.hint2_1231]
en = "Talk to Morgan in his house in Draynor Village and agree to sell him your ring."
pt = "Fale com o Morgan na casa dele em Draynor Village e aceite vender o anel a ele."

[.name_1232]
en = "Iron On"
pt = "Ferro à vista!"

[.desc_1232]
en = "Mine some iron ore from the Al Kharid mining spot."
pt = "Extraia minério de ferro (iron ore) na mina de Al Kharid."

[.name_1255]
en = "Everybody Loves Coal!"
pt = "Todo mundo ama carvão!"

[.desc_1255]
en = "Mine some coal in the mining spot south-west of Lumbridge Swamp."
pt = "Minere carvão (coal) na mina a sudoeste de Lumbridge Swamp."

[.set_1255]
en = "This Medium Task is part of the Lumbridge set."
pt = "Esta tarefa Média faz parte do conjunto de Lumbridge."

[.name_1258]
en = "A Meal Fit For a Duke"
pt = "Um prato digno do Duke"

[.desc_1258]
en = "Cook a lobster on the range in Lumbridge Castle's kitchen."
