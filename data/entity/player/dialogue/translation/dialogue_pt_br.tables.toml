[.skill_summoning_familiar_karamthulhuoverlord_10]
en = "Oh, how I long for that day..."
pt = "Ah, como anseio por esse dia..."

[.skill_summoning_familiar_karamthulhuoverlord_11]
en = "Kneel before my awesome might!"
pt = "Ajoelhe-se diante do meu poder magnífico!"

[.skill_summoning_familiar_karamthulhuoverlord_12]
en = "I would, but I have a bad knee you see..."
pt = "Eu até me ajoelharia, mas é que meu joelho anda ruim..."

[.skill_summoning_familiar_karamthulhuoverlord_13]
en = "Your feeble prattlings matter not, air-breather! Kneel or face my wrath!"
pt = "Seus balbucios débeis não importam, respirador de ar! Ajoelhe-se ou enfrente minha ira!"

[.skill_summoning_familiar_karamthulhuoverlord_14]
en = "I'm not afraid of you. You're only a squid in a bowl!"
pt = "Não tenho medo de você. Você é só uma lula num aquário!"

[.skill_summoning_familiar_karamthulhuoverlord_15]
en = "Only? I, radiant in my awesomeness, am 'only' a squid in a bowl? Clearly you need to be shown in your place, lung-user!"
pt = "Só? Eu, radiante em minha magnificência, sou 'só' uma lula num aquário? Pelo visto alguém precisa te pôr no seu lugar, usuário de pulmões!"

[.skill_summoning_familiar_karamthulhuoverlord_16]
en = "*The Karamthulhu overlord narrows its eye and you find yourself unable to breathe!"
pt = "*O Karamthulhu overlord estreita o olho e você não consegue mais respirar!"

[.skill_summoning_familiar_karamthulhuoverlord_17]
en = "Gaak! Wheeeze!"
pt = "Gaak! Cof, cof!"

[.skill_summoning_familiar_karamthulhuoverlord_18]
en = "Who rules?"
pt = "Quem manda aqui?"

[.skill_summoning_familiar_karamthulhuoverlord_19]
en = "You rule!"
pt = "Você manda!"

[.skill_summoning_familiar_karamthulhuoverlord_20]
en = "And don't forget it!"
pt = "E não se esqueça disso!"

[.skill_summoning_familiar_karamthulhuoverlord_21]
en = "The answer 'be silent'!"
pt = "A resposta: 'cale-se'!"

[.skill_summoning_familiar_karamthulhuoverlord_22]
en = "You have no idea what I was going to ask you."
pt = "Você nem sabe o que eu ia te perguntar."

[.skill_summoning_familiar_karamthulhuoverlord_23]
en = "Yes I do; I know all!"
pt = "Sei, sim; eu sei de tudo!"

[.skill_summoning_familiar_karamthulhuoverlord_24]
en = "Then you will not be surprised to know I was going to ask you what you wanted to do today."
pt = "Então não vai se surpreender ao saber que eu ia perguntar o que você queria fazer hoje."

[.skill_summoning_familiar_karamthulhuoverlord_25]
en = "You dare doubt me!"
pt = "Você ousa duvidar de mim!"

[.skill_summoning_familiar_karamthulhuoverlord_26]
en = "The answer 'be silent' because your puny compressed brain could not even begin to comprehend my needs!"
pt = "A resposta: 'cale-se', porque esse seu cerebrozinho comprimido nem começaria a compreender minhas necessidades!"

[.skill_summoning_familiar_karamthulhuoverlord_27]
en = "Well, how about I dismiss you so you can go and do what you like?"
pt = "Bem, e se eu te dispensar para você ir fazer o que quiser?"

[.skill_summoning_familiar_karamthulhuoverlord_28]
en = "Well, how about I topple your nations into the ocean and dance my tentacle-waving victory dance upon your watery graves?"
pt = "Bem, e se eu derrubar suas nações no oceano e dançar minha dança da vitória, sacudindo os tentáculos, sobre seus túmulos aquáticos?"

[.skill_summoning_familiar_karamthulhuoverlord_29]
en = "Yeah...well..."
pt = "É... bem..."

[.skill_summoning_familiar_karamthulhuoverlord_30]
en = "Silence! Your burbling vexes me greatly!"
pt = "Silêncio! Sua lengalenga me irrita imensamente!"

[.skill_summoning_familiar_karamthulhuoverlord_31]
en = "Errr...Have you calmed down yet?"
pt = "Hããã... Já se acalmou?"

[.skill_summoning_familiar_karamthulhuoverlord_32]
en = "Calmed down? Why would I need to calm down?"
pt = "Acalmar? Por que eu precisaria me acalmar?"

[.skill_summoning_familiar_karamthulhuoverlord_33]
en = "Well there is that whole 'god complex' thing..."
pt = "Bem, tem aquela história toda do 'complexo de deus'..."

[.skill_summoning_familiar_karamthulhuoverlord_34]
en = "Complex? What 'complex' are you drooling about this time, minion?"
pt = "Complexo? De que 'complexo' você está babando desta vez, lacaio?"

[.skill_summoning_familiar_karamthulhuoverlord_35]
en = "It is a sad thing indeed when a god as powerful as I cannot gain recognition from the foolish mewling sheep of this 'surface' place."
pt = "É deveras triste quando um deus tão poderoso quanto eu não obtém reconhecimento das ovelhas tolas que miam neste lugar chamado 'superfície'."

[.skill_summoning_familiar_karamthulhuoverlord_36]
en = "I don't really think sheep really make mewling noises..."
pt = "Eu acho que ovelha não mia, não..."

