# Skills - summoning/familiar/Hoardstalker.kt

[.skill_summoning_familiar_hoardstalker_1]
en = "Are you sure we can stop, naabe? Aren't there creatures about?"
pt = "Tem certeza de que podemos parar, naabe? Não tem criaturas por perto?"

[.skill_summoning_familiar_hoardstalker_2]
en = "You're a little timid for a gorajo, aren't you?"
pt = "Você é meio medroso para um gorajo, não?"

[.skill_summoning_familiar_hoardstalker_3]
en = "Naabe, a hoardstalker has little or no experience of combat. I am told that I fight like a cat on hind legs."
pt = "Naabe, um hoardstalker tem pouca ou nenhuma experiência em combate. Dizem que eu luto como um gato em pé nas patas de trás."

[.skill_summoning_familiar_hoardstalker_4]
en = "Choose an option:"
pt = "Escolha uma opção:"

[.skill_summoning_familiar_hoardstalker_5]
en = "Don't worry, I have your back."
pt = "Não se preocupe, eu protejo as suas costas."

[.skill_summoning_familiar_hoardstalker_6]
en = "Not just my back, I hope. I find a foe more terrifying when they run at me from the front. Although we do not die in our spirit form, we must rest for a week due to our spirit wounds, so others would have to perform my role for me."
pt = "Não só as costas, espero. Acho um inimigo mais aterrorizante quando corre para cima de mim pela frente. Embora não morramos em forma espiritual, precisamos descansar uma semana pelas feridas do espírito, e outros teriam de fazer o meu papel."

[.skill_summoning_familiar_hoardstalker_7]
en = "They would be like a woodpecket attempting to feed from a tortoise. I'd come back to find the crops irrigated with milk, weapons dipped in water, and babies drinking poison. Churra, it is too terrible to think on."
pt = "Seriam como um pica-pau tentando se alimentar de uma tartaruga. Eu voltaria e acharia as plantações regadas com leite, armas mergulhadas em água e bebês bebendo veneno. Churra, é terrível demais para pensar."

[.skill_summoning_familiar_hoardstalker_8]
en = "Then what use are you?"
pt = "Então para que você serve?"

[.skill_summoning_familiar_hoardstalker_9]
en = "Churra! You have a closed mind on those shoulders. I may not be a towering bloodrager or a graceful deathslinger, but I can be useful where they cannot"
pt = "Churra! Você tem uma mente fechada em cima desses ombros. Posso não ser um bloodrager imponente nem um deathslinger gracioso, mas posso ser útil onde eles não são."

[.skill_summoning_familiar_hoardstalker_10]
en = "Let me scavenge in these ruins, naabe. I will bring you such items that you would never question my place here."
pt = "Deixe-me vasculhar estas ruínas, naabe. Trarei itens tais que você nunca mais questionará o meu lugar aqui."

[.skill_summoning_familiar_hoardstalker_11]
en = "Do you like it in Daemonheim? I can't imagine how anyone could."
pt = "Você gosta de Daemonheim? Não imagino como alguém poderia gostar."

[.skill_summoning_familiar_hoardstalker_12]
en = "I see this place in a way that you do not, naabe. It amazes me how something can go down so deep, yet still be strong and broad. I cannot help but applaud the mind behind these dungeons."
pt = "Vejo este lugar de um jeito que você não vê, naabe. Me espanta como algo pode descer tão fundo e ainda ser forte e largo. Não posso deixar de aplaudir a mente por trás destas masmorras."

[.skill_summoning_familiar_hoardstalker_13]
en = "The workmanship, too...it makes me want to put down my tools and reincarnate as a bloodrager. I feel like a sparrowhawk who has been chased off his kill by a dragon."
pt = "E o acabamento, também... dá vontade de largar as ferramentas e reencarnar como bloodrager. Me sinto como um gavião expulso da própria presa por um dragão."

[.skill_summoning_familiar_hoardstalker_14]
en = "But this place is evil, and thousands died building it. I doubt you've murdered anyone to make a dagger, you know."
pt = "Mas este lugar é maligno, e milhares morreram construindo-o. Duvido que você já tenha matado alguém para fazer uma adaga, sabe."

[.skill_summoning_familiar_hoardstalker_15]
en = "And that is some comfort. I feel I must be careful about what I learn and study on this plane. There are poisoned thorns among the flowering wonders"
pt = "E isso é algum consolo. Sinto que devo tomar cuidado com o que aprendo e estudo neste plano. Há espinhos envenenados entre as maravilhas em flor."

[.skill_summoning_familiar_hoardstalker_16]
en = "Why are you called a hoardstalker? It seems a strange choice for a...blacksmith and scavenger, I guess."
pt = "Por que você se chama hoardstalker? Parece uma escolha estranha para um... ferreiro e catador, eu acho."

[.skill_summoning_familiar_hoardstalker_17]
en = "We are not just required to make the tools of our clansmen, naabe, We must protect the tools from those who would take them."
pt = "Não basta fazer as ferramentas do nosso clã, naabe. Também temos de protegê-las de quem quiser roubá-las."

[.skill_summoning_familiar_hoardstalker_18]
en = "Still, hoardstalker is a silly name."
pt = "Mesmo assim, hoardstalker é um nome bobo."

[.skill_summoning_familiar_hoardstalker_19]
en = "Naabe, I have held this back from you until now, but the term %1%, in our tongue, means 'One-Who-Juggles-Piglets'. A less-mature gorajo would find that amusing."
pt = "Naabe, escondi isto de você até agora, mas o termo %1%, na nossa língua, significa 'Aquele-Que-Faz-Malabarismo-Com-Leitões'. Um gorajo menos maduro acharia graça nisso."

[.skill_summoning_familiar_hoardstalker_20]
en = "No problem, naabe. Just make sure nothing sneaks past and hurts me."
pt = "Sem problema, naabe. Só cuide para que nada passe escondido e me machuque."

