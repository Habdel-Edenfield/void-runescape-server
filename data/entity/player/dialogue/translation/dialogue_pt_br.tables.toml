# Farmer advice - Farmer.kt picks one at random inside a when, which the extractor can't see

[.farmer_advice_belladonna]
en = "There is a special patch for growing Belladonna - I believe that it is somewhere near Draynor Manor, where the ground is a tad 'unblessed'"
pt = "Existe um canteiro especial para plantar Belladonna (beladona) - acho que fica em algum lugar perto da Draynor Manor, onde o solo é meio 'amaldiçoado'"

[.farmer_advice_hops]
en = "Hops are good for brewing ales. I believe there's a brewery up in Keldagrim somewhere, and I've heard rumours that a place called Phasmatys used to be good for that type of thing. 'Fore they all died, of course."
pt = "O lúpulo (hops) é bom para fazer cerveja. Acho que tem uma cervejaria lá em Keldagrim, e ouvi boatos de que um lugar chamado Phasmatys era bom para esse tipo de coisa. Antes de todo mundo morrer, claro."

[.farmer_advice_areas]
en = "There are many Farming areas out there. I know of Elstan's area near Falador, Dantaera's area near Catherby, Kragen's area near Ardougne and Lyra's area in Morytania. That said, I'm sure there's plenty more that I don't know about."
pt = "Existem muitas áreas de Farming (agricultura) por aí. Conheço a do Elstan perto de Falador, a da Dantaera perto de Catherby, a do Kragen perto de Ardougne e a da Lyra em Morytania. Mas tenho certeza de que há muitas outras que eu não conheço."

[.farmer_advice_compost]
en = "Don't just throw away your weeds after you've raked a patch - put them in a compost bin and make some compost."
pt = "Não jogue fora o mato depois de limpar um canteiro com o ancinho (rake) - coloque numa composteira (compost bin) e faça adubo (compost)."

[.farmer_advice_plantpots]
en = "You don't have to buy all your plantpots you know, you can make them yourself on a pottery wheel. If you're good enough at crafting, that is."
pt = "Sabe, você não precisa comprar todos os seus vasos (plantpots), dá para fazer na roda de oleiro (pottery wheel). Se você for bom em Crafting (artesanato), claro."

[.farmer_advice_sacks]
en = "You can put up to ten potatoes, cabbages or onions in vegetable sacks, although you can't have a mix in the same sack."
pt = "Você pode colocar até dez batatas, repolhos ou cebolas em sacos de legumes (vegetable sacks), mas não dá para misturar no mesmo saco."

[.farmer_advice_fruit_trees]
en = "If you want to grow fruit trees you could try a few places: Catherby, Brimhaven and The Gnome Stronghold all have fruit tree patches."
pt = "Se quiser plantar árvores frutíferas, tente alguns lugares: Catherby, Brimhaven e The Gnome Stronghold têm canteiros para elas."

[.farmer_advice_soil]
en = "You can fill plantpots with soil from any empty patch, if you have a gardening trowel."
pt = "Você pode encher vasos com terra de qualquer canteiro vazio, se tiver uma pazinha de jardinagem (gardening trowel)."

[.farmer_advice_disease]
en = "The only way to cure a bush or tree of disease is to prune away the diseased leaves with a pair of secateurs. For all other crops I would just apply some plant-cure."
pt = "O único jeito de curar a doença de um arbusto ou árvore é podar as folhas doentes com uma tesoura de poda (secateurs). Para as outras plantações, eu só aplicaria um pouco de plant-cure (remédio para plantas)."

[.farmer_advice_tools]
en = "You can buy all the farming tools from farming shops, which can be found close to the allotments in catherby."
pt = "Você pode comprar todas as ferramentas de agricultura nas lojas de farming, que ficam perto das hortas em Catherby."

[.farmer_advice_watering]
en = "Vegetables, hops and flowers need constant watering - if you ignore my advice, you will sooner or later find yourself in possession of a dead farming patch."
pt = "Legumes, lúpulo e flores precisam ser regados sempre - se ignorar meu conselho, mais cedo ou mais tarde vai acabar com um canteiro morto."

