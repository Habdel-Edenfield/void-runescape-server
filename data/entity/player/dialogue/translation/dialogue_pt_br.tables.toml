# Skills - summoning/familiar/SpiritKalphite.kt

[.skill_summoning_familiar_spiritkalphite_1]
en = "How dare you!"
pt = "Como ousa!"

[.skill_summoning_familiar_spiritkalphite_2]
en = "How dare I what?"
pt = "Como ouso o quê?"

[.skill_summoning_familiar_spiritkalphite_3]
en = "That weapon offends us!"
pt = "Essa arma nos ofende!"

[.skill_summoning_familiar_spiritkalphite_4]
en = "What weapon?"
pt = "Que arma?"

[.skill_summoning_familiar_spiritkalphite_5]
en = "This activity is not optimal for us."
pt = "Esta atividade não é ideal para nós."

[.skill_summoning_familiar_spiritkalphite_6]
en = "Well, you'll just have to put up with it for now."
pt = "Bem, vai ter que aguentar por enquanto."

[.skill_summoning_familiar_spiritkalphite_7]
en = "We would not have to 'put up' with this in the hive."
pt = "Na colmeia não teríamos que 'aguentar' isso."

[.skill_summoning_familiar_spiritkalphite_8]
en = "We are growing infuriated. What is our goal?"
pt = "Estamos ficando furiosos. Qual é o nosso objetivo?"

[.skill_summoning_familiar_spiritkalphite_9]
en = "Well, I haven't quite decided yet."
pt = "Bem, ainda não decidi direito."

[.skill_summoning_familiar_spiritkalphite_10]
en = "There is no indecision in the hive."
pt = "Não existe indecisão na colmeia."

[.skill_summoning_familiar_spiritkalphite_11]
en = "Or a sense of humour or patience, it seems."
pt = "Nem senso de humor ou paciência, pelo jeito."

[.skill_summoning_familiar_spiritkalphite_12]
en = "We find this to be wasteful of our time."
pt = "Consideramos isto um desperdício do nosso tempo."

[.skill_summoning_familiar_spiritkalphite_13]
en = "Maybe I find you wasteful..."
pt = "Talvez eu considere vocês um desperdício..."

[.skill_summoning_familiar_spiritkalphite_14]
en = "We would not face this form of abuse in the hive."
pt = "Na colmeia não sofreríamos este tipo de abuso."

[.skill_summoning_familiar_spiritkalphite_15]
en = "We grow tired of your antics, biped."
pt = "Cansamos das suas palhaçadas, bípede."

[.skill_summoning_familiar_spiritkalphite_16]
en = "What antics? I'm just getting on with my day."
pt = "Que palhaçadas? Só estou cuidando da minha vida."

[.skill_summoning_familiar_spiritkalphite_17]
en = "In an inefficient way. In the hive, you would be replaced."
pt = "De forma ineficiente. Na colmeia, você seria substituído."

[.skill_summoning_familiar_spiritkalphite_18]
en = "In the hive this, in the hive that..."
pt = "Na colmeia isso, na colmeia aquilo..."

