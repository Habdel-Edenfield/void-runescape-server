# Rockslug - Lumbridge - Tutorial Island

# FremennikShipmaster - Lumbridge - Tutorial Island

[.fremennikshipmaster_1]
en = "You want passage to Daemonheim?"
pt = "Quer passagem para Daemonheim?"

[.fremennikshipmaster_2]
en = "Daemonheim?"
pt = "Daemonheim?"

[.fremennikshipmaster_3]
en = "Yes, the icy peninsula far to the north of here."
pt = "Sim, a península gelada bem ao norte daqui."

[.fremennikshipmaster_4]
en = "Ice, snow, harsh winds..."
pt = "Gelo, neve, ventos cortantes..."

[.fremennikshipmaster_5]
en = "...and no sand or swamp sludge, clogging up every orifice."
pt = "...e nada de areia ou lama de pântano entupindo cada orifício."

[.fremennikshipmaster_6]
en = "Are you done with questions? Can we go now?"
pt = "Acabou com as perguntas? Podemos ir agora?"

[.fremennikshipmaster_7]
en = "Why are you so grumpy?"
pt = "Por que você é tão rabugento?"

[.fremennikshipmaster_8]
en = "Grumpy? I should kill you where you stand!"
pt = "Rabugento? Eu devia te matar aí mesmo!"

[.fremennikshipmaster_9]
en = "But that wouldn't help with this damned humidity."
pt = "Mas isso não ajudaria com esta maldita umidade."

[.fremennikshipmaster_10]
en = "I need the snow in my boots, the sea wind stinging my face..."
pt = "Preciso de neve nas botas, do vento do mar ardendo na cara..."

[.fremennikshipmaster_11]
en = "That's why I want to leave. Are you ready to go to Daemonheim?"
pt = "É por isso que quero ir embora. Está pronto para ir a Daemonheim?"

[.fremennikshipmaster_12]
en = "Not right now, thanks."
pt = "Agora não, obrigado."

[.fremennikshipmaster_13]
en = "Well, be on your way then. Leave me in peace!"
pt = "Então siga seu caminho. Me deixe em paz!"

[.fremennikshipmaster_14]
en = "Yes, please."
pt = "Sim, por favor."

[.fremennikshipmaster_15]
en = "Well, don't stand around. Get on board."
pt = "Então não fique aí parado. Suba a bordo."

# BarfyBill - Lumbridge - Tutorial Island

[.barfybill_1]
en = "Hello there."
pt = "Olá."

[.barfybill_2]
en = "Oh! Hello there."
pt = "Oh! Olá."

[.barfybill_3]
en = "Who are you?"
pt = "Quem é você?"

[.barfybill_4]
en = "My name is Ex Sea Captain Barfy Bill."
pt = "Meu nome é Ex-Capitão do Mar Barfy Bill."

[.barfybill_5]
en = "Ex sea captain?"
pt = "Ex-capitão do mar?"

[.barfybill_6]
en = "Yeah, I bought a lovely ship and was planning to make a fortune running her as a merchant vessel."
pt = "É, comprei um belo navio e planejava fazer fortuna com ele como navio mercante."

[.barfybill_7]
en = "Why are you not still sailing?"
pt = "E por que você não navega mais?"

[.barfybill_8]
en = "Chronic sea sickness. My first, and only, voyage was spent dry heaving over the rails."
pt = "Enjoo crônico. Passei minha primeira, e única, viagem com ânsia de vômito na amurada."

[.barfybill_9]
en = "If I had known about the sea sickness I could have saved myself a lot of money."
pt = "Se eu soubesse do enjoo, teria economizado um bom dinheiro."

[.barfybill_10]
en = "What are you up to now then?"
pt = "E o que você faz agora?"

[.barfybill_11]
en = "Well my ship had a little fire related problem. Fortunately it was well insured."
pt = "Bem, meu navio teve um probleminha envolvendo fogo. Por sorte, tinha um bom seguro."

[.barfybill_12]
en = "Anyway, I don't have to work anymore so I've taken to canoeing on the river."
pt = "Enfim, não preciso mais trabalhar, então passei a andar de canoa no rio."

[.barfybill_13]
en = "I don't get river sick!"
pt = "Em rio eu não enjoo!"

[.barfybill_14]
en = "Would you like to know how to make a canoe?"
pt = "Quer saber como fazer uma canoa?"

[.barfybill_15]
en = "Yes"
pt = "Sim"

[.barfybill_16]
en = "No"
pt = "Não"

[.barfybill_17]
en = "No thanks, not right now."
pt = "Não, obrigado, agora não."

[.barfybill_18]
en = "Can you teach me about Canoeing?"
pt = "Pode me ensinar sobre canoagem (Canoeing)?"

[.barfybill_19]
en = "It's really quite simple to make. Just walk down to that tree on the bank and chop it down."
pt = "É bem simples de fazer. Desça até aquela árvore na margem e derrube-a."

[.barfybill_20]
en = "When you have done that you can shape the log further with your axe to make a canoe."
pt = "Feito isso, você pode moldar o tronco com o machado até virar uma canoa."

[.barfybill_21]
en = "Hah! I can tell just by looking that you lack talent in woodcutting."
pt = "Rá! Só de olhar já vejo que você não tem talento em Woodcutting (corte de lenha)."

[.barfybill_22]
en = "What do you mean?"
pt = "Como assim?"

[.barfybill_23]
en = "No Callouses! No Splinters! No camp fires littering the trail behind you."
pt = "Nenhum calo! Nenhuma farpa! Nenhuma fogueira largada pela trilha atrás de você."

[.barfybill_24]
en = "Anyway, the only 'canoe' you can make is a log. You'll be able to travel 1 stop along the river with a log canoe."
pt = "Enfim, a única 'canoa' que você consegue fazer é um tronco. Com uma canoa de tronco (log) você viaja 1 parada pelo rio."

[.barfybill_25]
en = "With your skill in woodcutting you could make my favourite canoe, the Dugout. They might not be the best canoe on the river, but they get you where you're going."
pt = "Com sua habilidade em Woodcutting, você pode fazer minha canoa favorita, a Dugout. Pode não ser a melhor canoa do rio, mas te leva aonde você quer ir."

[.barfybill_26]
en = "How far will I be able to go in a Dugout canoe?"
pt = "Até onde eu consigo ir numa canoa Dugout?"

[.barfybill_27]
en = "You will be able to travel 2 stops on the river."
pt = "Você vai poder viajar 2 paradas pelo rio."

[.barfybill_28]
en = "The best canoe you can make is a Stable Dugout, one step beyond a normal Dugout."
pt = "A melhor canoa que você consegue fazer é a Stable Dugout, um passo acima da Dugout comum."

[.barfybill_29]
en = "With a Stable Dugout you can travel to any place on the river."
pt = "Com uma Stable Dugout você pode ir a qualquer lugar do rio."

[.barfybill_30]
en = "Even into the Wilderness?"
pt = "Até para a Wilderness?"

[.barfybill_31]
en = "Not likely! I've heard tell of a man up near Edgeville who claims he can use a Waka to get up into the Wilderness."
pt = "Nem pensar! Ouvi falar de um homem perto de Edgeville que diz conseguir ir até a Wilderness com uma Waka."

[.barfybill_32]
en = "I can't think why anyone would wish to venture into that hellish landscape though."
pt = "Mas não imagino por que alguém iria querer se aventurar naquela paisagem infernal."

[.barfybill_33]
en = "Hoo! You look like you know which end of an axe is which!"
pt = "Opa! Parece que você sabe de que lado se segura um machado!"

[.barfybill_34]
en = "You can easily build one of those Wakas. Be careful if you travel into the Wilderness though."
pt = "Você consegue construir uma daquelas Wakas fácil. Mas tome cuidado se for para a Wilderness."

[.barfybill_35]
en = "I've heard tell of great evil in that blasted wasteland."
pt = "Ouvi falar de um grande mal naquela maldita terra devastada."

[.barfybill_36]
en = "Thanks for the warning Bill."
pt = "Obrigado pelo aviso, Bill."

# BeefyBill - Lumbridge - Tutorial Island

[.beefybill_1]
en = "Beefy Bill at your service!"
pt = "Beefy Bill a seu dispor!"

[.beefybill_2]
en = "I can bank your beef, your cowhides and your flour, and I've got other stuff for trade. What's it to be?"
pt = "Posso levar ao banco sua carne (beef), seu couro (cowhide) e sua farinha (flour), e tenho outras coisas à venda. O que vai ser?"

[.beefybill_3]
en = "What would you like to say?"
pt = "O que você gostaria de dizer?"

[.beefybill_4]
en = "I'm Beefy Bill, specialist meat transporter and general merchant."
pt = "Sou o Beefy Bill, transportador especialista em carne e comerciante geral."

[.beefybill_5]
en = "People bring me their beef, cowhides and flour, and I transport it all to the bank, keeping a mere 10% for my services. I also have stuff for sale."
pt = "O povo me traz carne, couro e farinha, e eu levo tudo para o banco, ficando com meros 10% pelo serviço. Também tenho coisas à venda."

[.beefybill_6]
en = "How do you pull your wagon?"
pt = "Como você puxa a sua carroça?"

[.beefybill_7]
en = "Oh, I don't pull it myself!<br>I use cattle to pull it for me."
pt = "Ah, não sou eu que puxo!<br>Uso gado para puxar para mim."

[.beefybill_8]
en = "Isn't that disgusting?"
pt = "Isso não é nojento?"

[.beefybill_9]
en = "Oh, stop being naive! I'm not letting your petty personal ethics stand in the way of my right to run a successful business."
pt = "Ah, deixe de ser ingênuo! Não vou deixar a sua éticazinha pessoal atrapalhar o meu direito de ter um negócio de sucesso."

[.beefybill_10]
en = "Now, do you want my services or not?"
pt = "Agora, vai querer os meus serviços ou não?"

[.beefybill_11]
en = "Sorry, I don't transport that sort of thing."
pt = "Desculpe, eu não transporto esse tipo de coisa."

[.beefybill_12]
en = "Bank %1%, Bill keeps %2%."
pt = "Guardar %1% no banco, Bill fica com %2%."

[.beefybill_13]
en = "Pleasure doing business with ya, mate!"
pt = "Um prazer fazer negócio com você, parceiro!"

[.beefybill_14]
en = "Forget it."
pt = "Esqueça."

[.beefybill_15]
en = "Let's trade."
pt = "Vamos negociar."

[.beefybill_16]
en = "I want you to bank things for me."
pt = "Quero que você leve coisas ao banco para mim."

[.beefybill_17]
en = "Excellent. Just hand me the items, and I'll work out a price for you. I charge a 10% commission."
pt = "Excelente. É só me entregar os itens que eu calculo o preço. Cobro 10% de comissão."

[.beefybill_18]
en = "I'll have a think about it."
pt = "Vou pensar no assunto."

[.beefybill_19]
en = "Don't waste too much time thinking; time is money."
pt = "Não perca muito tempo pensando; tempo é dinheiro."

# Bob - Lumbridge - Tutorial Island

[.bob_1]
en = "Give me a quest!"
pt = "Me dê uma missão (quest)!"

[.bob_2]
en = "Sorry I don't have any quests for you at the moment."
pt = "Desculpe, no momento não tenho nenhuma missão para você."

[.bob_3]
en = "I'd like to trade."
pt = "Quero negociar."

[.bob_4]
en = "Great! I buy and sell pickaxes and hatchets. There are plenty to choose from, and I've some free samples too. Take your pick... or hatchet."
pt = "Ótimo! Compro e vendo picaretas (pickaxes) e machados (hatchets). Tem muita opção, e algumas amostras grátis. Pode escolher... a picareta ou o machado."

[.bob_5]
en = "Can you repair my items for me?"
pt = "Pode consertar meus itens?"

[.bob_6]
en = "Of course I can, though the material may cost you. Just hand me the item and I'll have a look."
pt = "Claro que posso, mas o material pode sair caro. É só me entregar o item que eu dou uma olhada."

[.bob_7]
en = "Sorry friend, but I can't do anything with that."
pt = "Desculpe, amigo, mas não posso fazer nada com isso."

[.bob_8]
en = "That'll cost you %1% gold coins to fix, are you sure?"
pt = "O conserto vai custar %1% moedas de ouro. Tem certeza?"

[.bob_9]
en = "Yes I'm sure!"
pt = "Sim, tenho certeza!"

[.bob_10]
en = "There you go. It's a pleasure doing business with you!"
pt = "Prontinho. É um prazer fazer negócio com você!"

[.bob_11]
en = "Oh dear, I don't seem to have enough money."
pt = "Puxa, parece que não tenho dinheiro suficiente."

[.bob_12]
en = "On second thoughts, no thanks."
pt = "Pensando bem, não, obrigado."

# Donie - Lumbridge - Tutorial Island

[.donie_1]
en = "Hello there, can I help you?"
pt = "Olá, posso ajudar você?"

[.donie_2]
en = "Where am I"
pt = "Onde estou?"

[.donie_3]
en = "This is the town of Lumbridge my friend."
pt = "Esta é a cidade de Lumbridge, meu amigo."

[.donie_4]
en = "How are you today?"
pt = "Como vai você hoje?"

[.donie_5]
en = "Aye, not too bad thank you. Lovely weather in Gielinor this fine day."
pt = "Ah, nada mal, obrigado. Que tempo lindo em Gielinor neste belo dia."

[.donie_6]
en = "Weather?"
pt = "Tempo?"

[.donie_7]
en = "Yes weather, you know."
pt = "Sim, o tempo, sabe."

[.donie_8]
en = "The state or condition of the atmosphere at a time and place, with respect to variables such as temperature, moisture, wind velocity, and barometric pressure."
pt = "O estado ou condição da atmosfera num dado momento e lugar, quanto a variáveis como temperatura, umidade, velocidade do vento e pressão barométrica."

[.donie_9]
en = "..."
pt = "..."

[.donie_10]
en = "Not just a pretty face eh? Ha ha ha."
pt = "Não sou só um rostinho bonito, hein? Ha ha ha."

[.donie_11]
en = "Are there any quests I can do here?"
pt = "Tem alguma missão (quest) que eu possa fazer aqui?"

[.donie_12]
en = "What kind of quest are you looking for?"
pt = "Que tipo de missão você está procurando?"

[.donie_13]
en = "I fancy a bit of fight, anything dangerous?"
pt = "Quero um pouco de luta, tem algo perigoso?"

[.donie_14]
en = "Hmm.. dangerous you say? What sort of creatures are you looking to fight?"
pt = "Hum.. perigoso, você diz? Que tipo de criatura você quer enfrentar?"

[.donie_15]
en = "Big scary demons!"
pt = "Demônios grandes e assustadores!"

[.donie_16]
en = "You are a brave soul indeed."
pt = "Você é mesmo uma alma corajosa."

[.donie_17]
en = "Now that you mention it, I heard a rumour about a fortune-teller in Varrock who is rambling about some kind of grater evil.. sounds demon-like if you ask me."
pt = "Agora que você falou, ouvi um boato sobre uma vidente em Varrock que vive falando de um tal grande mal.. parece coisa de demônio, se quer saber."

[.donie_18]
en = "Perhaps you could check it out if you are as brave as you say?"
pt = "Talvez você possa investigar, se for tão corajoso quanto diz?"

[.donie_19]
en = "I've already killed the demon Delrith. He was merely a stain on my sword when I was finished with him!"
pt = "Eu já matei o demônio Delrith. Quando acabei com ele, não passava de uma mancha na minha espada!"

[.donie_20]
en = "Well done! However I'm sure if you search around the world you will find more challenging foes to slay."
pt = "Muito bem! Mas tenho certeza de que, procurando pelo mundo, você vai achar inimigos mais desafiadores para matar."

[.donie_21]
en = "Thanks for the tip, perhaps I will."
pt = "Obrigado pela dica, talvez eu vá."

[.donie_22]
en = "Vampyres!"
pt = "Vampiros!"

[.donie_23]
en = "Ha ha. I personally don't believe in such things. However, there is a man in Draynor Village who has been scaring the village folk with stories of vampyres."
pt = "Ha ha. Eu pessoalmente não acredito nessas coisas. Mas tem um homem em Draynor Village que anda assustando o povo da vila com histórias de vampiros."

[.donie_24]
en = "He's named Morgan and can be found in one of the village houses. Perhaps you could see what the matter is?"
pt = "O nome dele é Morgan e ele fica numa das casas da vila. Talvez você possa ver qual é o problema?"

[.donie_25]
en = "Oh i have already killed that nasty blood-sucking vampyre. Draynor will be safe now."
pt = "Ah, eu já matei aquele vampiro nojento chupador de sangue. Draynor agora está segura."

[.donie_26]
en = "Yeah, yeah of course you did. Everyone knows vampyres are not real..."
pt = "Sei, sei, claro que matou. Todo mundo sabe que vampiros não existem..."

[.donie_27]
en = "What! I did slay the beast..I really did."
pt = "O quê! Eu matei a fera, sim.. matei de verdade."

[.donie_28]
en = "You're not fooling anyone you know."
pt = "Você não engana ninguém, sabia?"

[.donie_29]
en = "..Huh.. But... Hey! I did... believe what you like."
pt = "..Hã.. Mas... Ei! Eu matei... acredite no que quiser."

[.donie_30]
en = "Thanks for the tip."
pt = "Obrigado pela dica."

[.donie_31]
en = "Small.. something small would be good."
pt = "Pequenas.. algo pequeno seria bom."

[.donie_32]
en = "Small? Small isn't really that dangerous though is it?"
pt = "Pequeno? Pequeno não é lá muito perigoso, não é?"

[.donie_33]
en = "Yes it can be! There could be anything from an evil chicken to a poisonous spider. They attack in numbers you know!"
pt = "Pode ser, sim! Pode ser qualquer coisa, de uma galinha malvada a uma aranha venenosa. Eles atacam em bando, sabia?"

[.donie_34]
en = "Point taken. Speaking of small monsters, I hear old Wizard Mizgog in the Wizards' Tower has just had his beads taken by a gang of mischievous imps."
pt = "Entendido. Falando em monstrinhos, ouvi dizer que o velho Wizard Mizgog, da Wizards' Tower, teve as contas roubadas por um bando de diabretes (imps) travessos."

[.donie_35]
en = "Sounds like it could be a quest for you?"
pt = "Parece uma missão para você, não?"

[.donie_36]
en = "Yes, I know of Mizgog and have already helped him with his imp problem."
pt = "Sim, conheço o Mizgog e já ajudei ele com o problema dos diabretes."

[.donie_37]
en = "Imps will be imps!"
pt = "Diabrete é diabrete!"

[.donie_38]
en = "Thanks for your help."
pt = "Obrigado pela ajuda."

[.donie_39]
en = "Maybe another time."
pt = "Talvez outra hora."

[.donie_40]
en = "Something easy please, I'm new here."
pt = "Algo fácil, por favor, sou novo aqui."

[.donie_41]
en = "I can tell you about plenty of small easy tasks."
pt = "Posso falar de várias tarefinhas fáceis."

[.donie_42]
en = "The Lumbridge cook has been having problems and the Duke is confused over some strange rocks"
pt = "O cozinheiro de Lumbridge anda com problemas e o Duke está intrigado com umas pedras estranhas"

[.donie_43]
en = "Tell me about.."
pt = "Fale sobre.."

[.donie_44]
en = "The Lumbridge cook."
pt = "O cozinheiro de Lumbridge."

[.donie_45]
en = "Tell me about the Lumbridge cook."
pt = "Fale sobre o cozinheiro de Lumbridge."

[.donie_46]
en = "It's funny really, the cook would forget his head if it wasn't screwed on. This time he forgot to get ingredients for the Duke's birthday cake."
pt = "É engraçado, o cozinheiro esqueceria a cabeça se não fosse grudada. Desta vez ele esqueceu os ingredientes do bolo de aniversário do Duke."

[.donie_47]
en = "Perhaps you could help him? You will probably find him in the Lumbridge Castle kitchen."
pt = "Talvez você possa ajudá-lo? Ele deve estar na cozinha do Lumbridge Castle."

[.donie_48]
en = "I have already helped the cook in Lumbridge"
pt = "Eu já ajudei o cozinheiro de Lumbridge"

[.donie_49]
en = "Oh yes, so you have. I am sure the Duke will be pleased."
pt = "Ah, é verdade, ajudou mesmo. Tenho certeza de que o Duke vai ficar contente."

[.donie_50]
en = "Thank you. I shall go speak with him."
pt = "Obrigado. Vou falar com ele."

[.donie_51]
en = "The Duke's strange stones."
pt = "As pedras estranhas do Duke."

[.donie_52]
en = "Tell me about the Duke's strange stones."
pt = "Fale sobre as pedras estranhas do Duke."

[.donie_53]
en = "Well the Duke of Lumbridge has found a strange stone that no one seems to understand. Perhaps you could help him? You can probably find him upstairs in Lumbridge Castle."
pt = "Bem, o Duke de Lumbridge achou uma pedra estranha que ninguém parece entender. Talvez você possa ajudá-lo? Ele deve estar no andar de cima do Lumbridge Castle."

[.donie_54]
en = "Yes, I have already solved the rune mysteries."
pt = "Sim, eu já resolvi os Rune Mysteries."

[.donie_55]
en = "Ah excellent. Thank you very much adventurer."
pt = "Ah, excelente. Muito obrigado, aventureiro."

[.donie_56]
en = "Sounds mysterious. I may just do that. Thanks."
pt = "Parece misterioso. Acho que vou lá. Obrigado."

[.donie_57]
en = "I'm a thinker rather than a fighter, anything skill oriented?"
pt = "Sou mais pensador que lutador, tem algo voltado a habilidades?"

[.donie_58]
en = "Skills play a big part when you want to progress in knowledge. I know of a few skill-related quests that can get you started."
pt = "As habilidades (skills) contam muito para quem quer evoluir no conhecimento. Conheço algumas missões de habilidade para você começar."

[.donie_59]
en = "You may be able to help out Fred the farmer who is in need of someones crafting expertise."
pt = "Você pode ajudar o Fred the farmer, que precisa de alguém que entenda de Crafting (artesanato)."

[.donie_60]
en = "Or, there's always Doric the dwarf who needs an errand running for him?"
pt = "Ou tem sempre o Doric the dwarf, que precisa de alguém para fazer um serviço para ele."

[.donie_61]
en = "Fred the farmer."
pt = "Fred the farmer."

[.donie_62]
en = "Tell me about Fred the farmer please."
pt = "Fale sobre o Fred the farmer, por favor."

[.donie_63]
en = "You can find Fred next to the field of sheep in Lumbridge. Perhaps you should go and speak with him."
pt = "O Fred fica perto do campo de ovelhas em Lumbridge. Talvez você deva ir falar com ele."

[.donie_64]
en = "I have already helped Fred the farmer. I sheared his sheep and made 20 balls of wool for him."
pt = "Eu já ajudei o Fred the farmer. Tosquiei as ovelhas dele e fiz 20 novelos de lã (balls of wool)."

[.donie_65]
en = "He wouldn't let me kill his chickens though."
pt = "Mas ele não me deixou matar as galinhas dele."

[.donie_66]
en = "Lumbridge chickens do make good target practice."
pt = "As galinhas de Lumbridge são mesmo um bom alvo para treinar."

[.donie_67]
en = "You will have to wait until he isn't looking."
pt = "Vai ter que esperar ele não estar olhando."

[.donie_68]
en = "Thanks, maybe I will."
pt = "Obrigado, talvez eu vá."

[.donie_69]
en = "Doric the dwarf."
pt = "Doric the dwarf."

[.donie_70]
en = "Tell me about Doric the dwarf."
pt = "Fale sobre o Doric the dwarf."

[.donie_71]
en = "Doric the dwarf is located north of Falador. He might be able to help you with smithing. You should speak to him. He may let you use his anvils."
pt = "O Doric the dwarf fica ao norte de Falador. Ele pode ajudar você com Smithing (forja). Fale com ele. Talvez ele deixe você usar as bigornas (anvils) dele."

[.donie_72]
en = "Yes, I've been to see Doric already. He was happy to let me use his anvils after I ran a small errand for him."
pt = "Sim, já fui ver o Doric. Ele me deixou usar as bigornas de bom grado depois que fiz um servicinho para ele."

[.donie_73]
en = "Oh, good. Thank you %1%!"
pt = "Ah, que bom. Obrigado, %1%!"

[.donie_74]
en = "I want to do all kinds of things, do you know of anything like that?"
pt = "Quero fazer de tudo um pouco, você sabe de algo assim?"

[.donie_75]
en = "Of course I do. Gielinor is a huge place you know, now let me think..."
pt = "Claro que sei. Gielinor é um lugar enorme, sabe, agora deixe-me pensar..."

[.donie_76]
en = "Hetty the witch in Rimmington might be able to offer help in the ways of magical abilities.."
pt = "A Hetty the witch, em Rimmington, talvez possa ajudar com as artes mágicas.."

[.donie_77]
en = "Also, pirates are currently docked in Port Sarim, Where pirates are, treasure is never far away..."
pt = "Também tem piratas ancorados em Port Sarim. Onde há piratas, o tesouro nunca está longe..."

[.donie_78]
en = "Or you could go and help out Ernest who got lost in Draynor Manor, spooky place that."
pt = "Ou você pode ajudar o Ernest, que se perdeu na Draynor Manor, lugar sinistro aquele."

[.donie_79]
en = "Hetty the witch."
pt = "Hetty the witch."

[.donie_80]
en = "Tell me about Hetty the witch."
pt = "Fale sobre a Hetty the witch."

[.donie_81]
en = "Hetty the witch can be found in Rimmington, south of Falador. She's currently working on some new potions. Perhaps you could give her a hand? She might be able to offer help with your magical abilities."
pt = "A Hetty the witch fica em Rimmington, ao sul de Falador. Ela está fazendo umas poções (potions) novas. Talvez você possa dar uma mão? Ela pode ajudar com seus poderes mágicos."

[.donie_82]
en = "Yes, I have already been to see Hetty. She gave me super cosmic powers after I helped out with her potion! I could probably destroy you with a single thought."
pt = "Sim, já fui ver a Hetty. Ela me deu superpoderes cósmicos depois que ajudei com a poção! Eu poderia destruir você só com o pensamento."

[.donie_83]
en = "Did she really?"
pt = "Deu mesmo?"

[.donie_84]
en = "No, not really."
pt = "Não, na verdade não."

[.donie_85]
en = "Right..."
pt = "Sei..."

[.donie_86]
en = "Thanks. Let's hope she doesn't turn me into a potato or something.."
pt = "Obrigado. Tomara que ela não me transforme numa batata ou coisa assim.."

[.donie_87]
en = "Pirate's Treasure."
pt = "Pirate's Treasure."

[.donie_88]
en = "Tell me about Pirate's Treasure."
pt = "Fale sobre o Pirate's Treasure."

[.donie_89]
en = "RedBeard Frank in Port Sarim's bar, the Rusty Anchor might be able to tell you about the rumored treasure that is buried somewhere in the world."
pt = "O RedBeard Frank, no bar de Port Sarim, o Rusty Anchor, pode contar sobre o tal tesouro que dizem estar enterrado em algum lugar do mundo."

[.donie_90]
en = "Yarr! I already found the booty!"
pt = "Arrr! Eu já achei o butim!"

[.donie_91]
en = "Yarr indeed my friend. A most excellent find."
pt = "Arrr mesmo, meu amigo. Um achado excelente."

[.donie_92]
en = "Yarr!"
pt = "Arrr!"

[.donie_93]
en = "Yarrr!"
pt = "Arrrr!"

[.donie_94]
en = "YARRR!"
pt = "ARRRR!"

[.donie_95]
en = "Right, that's enough of that!"
pt = "Certo, chega disso!"

[.donie_96]
en = "..Sorry."
pt = "..Desculpe."

[.donie_97]
en = "Sounds adventurous, I may have to check that out. Thank you."
pt = "Parece uma aventura, talvez eu vá conferir. Obrigado."

[.donie_98]
en = "Ernest and Draynor Manor."
pt = "Ernest e a Draynor Manor."

[.donie_99]
en = "Tell me about Ernest please."
pt = "Fale sobre o Ernest, por favor."

[.donie_100]
en = "The best place to start would be at the gate to Draynor Manor. There you will find Veronica who will be able to tell you more."
pt = "O melhor lugar para começar é o portão da Draynor Manor. Lá você vai encontrar a Veronica, que pode contar mais."

[.donie_101]
en = "I suggest you tread carefully in that place; it's haunted."
pt = "Sugiro que pise com cuidado naquele lugar; é assombrado."

[.donie_102]
en = "Yeah, I found Ernest already. Professor Oddstein had turned him into a chicken!"
pt = "É, eu já achei o Ernest. O Professor Oddstein tinha transformado ele numa galinha!"

[.donie_103]
en = "A chicken!?"
pt = "Uma galinha!?"

[.donie_104]
en = "Yeah a chicken. It could have been worse though."
pt = "É, uma galinha. Mas podia ter sido pior."

[.donie_105]
en = "Very true, poor guy."
pt = "Verdade, coitado."

[.donie_106]
en = "Sounds like fun. I've never been to a Haunted Manor before."
pt = "Parece divertido. Nunca estive numa mansão assombrada."

[.donie_107]
en = "Your shoe lace is untied."
pt = "O cadarço do seu sapato está desamarrado."

[.donie_108]
en = "No it's not!"
pt = "Não está, não!"

[.donie_109]
en = "No you're right. I have nothing to back that up."
pt = "É, você tem razão. Não tenho como provar."

[.donie_110]
en = "Fool! Leave me alone!"
pt = "Tolo! Me deixe em paz!"

[.donie_111]
en = "Can i buy your stick?"
pt = "Posso comprar o seu graveto?"

[.donie_112]
en = "It's not a stick! I'll have you know it's a very powerful staff!"
pt = "Não é um graveto! Fique sabendo que é um cajado (staff) muito poderoso!"

[.donie_113]
en = "Really? Show me what it can do!"
pt = "Sério? Mostre do que ele é capaz!"

[.donie_114]
en = "Um..It's a bit low on power at the moment.."
pt = "Hum.. Ele está meio sem energia no momento.."

[.donie_115]
en = "It's a stick isn't it?"
pt = "É um graveto, não é?"

[.donie_116]
en = "...Ok it's a stick.. But only while I save up for a staff. Zaff in Varrock square sells them in his shop."
pt = "...Tá, é um graveto.. Mas só até eu juntar para um cajado. O Zaff vende na loja dele na praça de Varrock."

[.donie_117]
en = "Well good luck with that."
pt = "Bem, boa sorte com isso."

[.donie_118]
en = "Do you have anything of value which I can have?"
pt = "Você tem algo de valor que possa me dar?"

[.donie_119]
en = "Are you asking for free stuff?"
pt = "Você está pedindo coisa de graça?"

[.donie_120]
en = "Well... er... yes."
pt = "Bem... é... sim."

[.donie_121]
en = "No I do not have anything I can give you. If I did have anything of value I wouldn't want to give it away."
pt = "Não, não tenho nada para te dar. Se eu tivesse algo de valor, não ia querer dar para ninguém."

[.donie_122]
en = "Where can I get a haircut like yours?"
pt = "Onde posso cortar o cabelo igual ao seu?"

[.donie_123]
en = "Yes, it does look like you need a hairdresser."
pt = "É, parece mesmo que você precisa de um cabeleireiro."

[.donie_124]
en = "Oh thanks!"
pt = "Ah, obrigado!"

[.donie_125]
en = "No problem. The hairdresser in Falador will probably be able to sort you out."
pt = "De nada. O cabeleireiro de Falador deve dar um jeito em você."

[.donie_126]
en = "The Lumbridge general store sells useful maps if you don't know the way."
pt = "O armazém (general store) de Lumbridge vende mapas úteis, se você não souber o caminho."

# Doomsayer - Lumbridge - Tutorial Island

[.doomsayer_1]
en = "Dooooom!"
pt = "Perdiçããão!"

[.doomsayer_2]
en = "Where?"
pt = "Onde?"

[.doomsayer_3]
en = "All around us! I can feel it in the air, hear it on the wind, smell it... also in the air!"
pt = "Por toda parte! Posso senti-la no ar, ouvi-la no vento, cheirá-la... também no ar!"

[.doomsayer_4]
en = "Is there anything we can do about this doom?"
pt = "Há algo que possamos fazer contra essa perdição?"

[.doomsayer_5]
en = "There is nothing you need to do my friend! I am the Doomsayer, although my real title could be something like the Danger Tutor."
pt = "Você não precisa fazer nada, meu amigo! Eu sou o Doomsayer, embora meu verdadeiro título pudesse ser algo como Tutor do Perigo."

[.doomsayer_6]
en = "Danger Tutor?"
pt = "Tutor do Perigo?"

[.doomsayer_7]
en = "Yes! I roam the world sensing danger."
pt = "Sim! Eu ando pelo mundo farejando o perigo."

[.doomsayer_8]
en = "If I find a dangerous area, the I put up warning signs that will tell you what is so dangerous about that area."
pt = "Se encontro uma área perigosa, coloco placas de aviso que dizem o que há de tão perigoso nela."

[.doomsayer_9]
en = "If you see the signs often enough, then you can turn them off; by that time you likely know what the area has in store for you."
pt = "Se você vir as placas com frequência, pode desligá-las; a essa altura, provavelmente já sabe o que a área reserva para você."

[.doomsayer_10]
en = "But what if I want to see the warnings again?"
pt = "Mas e se eu quiser ver os avisos de novo?"

[.doomsayer_11]
en = "That's why I'm waiting here!"
pt = "É por isso que estou esperando aqui!"

[.doomsayer_12]
en = "If you want to see the warning messages again, I can turn them back on for you."
pt = "Se quiser ver as mensagens de aviso de novo, posso reativá-las para você."

[.doomsayer_13]
en = "Thanks, I'll remember that if I see any warning messages."
pt = "Valeu, vou lembrar disso se eu vir alguma mensagem de aviso."

[.doomsayer_14]
en = "You're welcome!"
pt = "De nada!"

[.doomsayer_15]
en = "Do you need to turn on any warnings right now?"
pt = "Precisa reativar algum aviso agora?"

[.doomsayer_16]
en = "Yes, I do."
pt = "Sim, preciso."

[.doomsayer_17]
en = "Not right now."
pt = "Agora não."

[.doomsayer_18]
en = "Ok, keep an eye out for the messages though!"
pt = "Tudo bem, mas fique de olho nas mensagens!"

[.doomsayer_19]
en = "I will."
pt = "Pode deixar."

# ExplorerJack - Lumbridge - Tutorial Island

[.explorerjack_1]
en = "Ah! Welcome to %server%, lad. My name's Explorer jack. I'm an explorer by trade, and I'm one of the Taskmasters around these parts"
pt = "Ah! Bem-vindo a %server%, rapaz. Meu nome é Explorer Jack. Sou explorador de profissão e um dos Taskmasters destas bandas"

[.explorerjack_2]
en = "Taskmaster? What Tasks are you Master of?"
pt = "Taskmaster? Você é mestre de que tarefas (Tasks)?"

[.explorerjack_3]
en = "I think I've finished all of the Beginner Tasks in the Lumbridge set."
pt = "Acho que terminei todas as tarefas de dificuldade Iniciante do conjunto de Lumbridge."

[.explorerjack_4]
en = "You have? Oh, well done! We'll make an explorer of you yet."
pt = "Terminou? Ora, muito bem! Ainda vamos fazer de você um explorador."

[.explorerjack_5]
en = "Thank you. Is there a reward?"
pt = "Obrigado. Tem alguma recompensa?"

[.explorerjack_6]
en = "Ah, yes indeed."
pt = "Ah, mas é claro."

[.explorerjack_7]
en = "You don't seem to have space, speak to me again when you have two free spaces in your inventory."
pt = "Parece que você não tem espaço. Fale comigo de novo quando tiver dois espaços livres no inventário."

[.explorerjack_8]
en = "Having completed the beginner tasks, you have been granted the ability to use the Explorer emote to show your friends."
pt = "Por ter completado as tarefas de dificuldade Iniciante, você ganhou o emote Explorer para mostrar aos seus amigos."

[.explorerjack_9]
en = "I have also given you an explorer's ring. Now, this is more than just any old ring. Aside from looking good, it also has magical properties giving you a small but useful boost to your Magic and Prayer."
pt = "Também te dei um explorer's ring (anel de explorador). Não é um anel qualquer. Além de bonito, tem propriedades mágicas que dão um bônus pequeno mas útil em Magic (magia) e Prayer (oração)."

[.explorerjack_10]
en = "Your ring has the ability to restore some of your run energy to you."
pt = "Seu anel consegue restaurar parte da sua energia de corrida (run energy)."

[.explorerjack_11]
en = "For each of the first three sections of the diary you complete, your ring will gain an extra charge; so the ring you receive from the medium level tasks will have 3 charges for example."
pt = "Para cada uma das três primeiras seções do diário que você completar, o anel ganha uma carga extra; o anel das tarefas de dificuldade Média, por exemplo, terá 3 cargas."

[.explorerjack_12]
en = "If they should run out, the ring is recharged by the sun each day, so you will be able to use it again tomorrow and so on."
pt = "Se as cargas acabarem, o sol recarrega o anel todo dia, então você poderá usá-lo de novo amanhã, e assim por diante."

[.explorerjack_13]
en = "As an extra reward, you can have this old magical lamp to help with your skills. I was going to use it myself, but I don't really need it."
pt = "Como recompensa extra, fique com esta velha lâmpada mágica (lamp) para ajudar nas suas habilidades. Eu ia usá-la, mas não preciso mesmo."

[.explorerjack_14]
en = "Thanks very much."
pt = "Muito obrigado."

[.explorerjack_15]
en = "If you should lose your ring, come back to see me and I'm sure I'll have another. Now, did you have anything further to ask?"
pt = "Se perder o anel, volte aqui que com certeza terei outro. Agora, mais alguma pergunta?"

[.explorerjack_16]
en = "Tell me about the Task System."
pt = "Me fale sobre o Task System."

[.explorerjack_17]
en = "Can I claim any rewards from you?"
pt = "Posso resgatar alguma recompensa com você?"

[.explorerjack_18]
en = "Sorry, you're not owed any achievement rewards at the moment. Look at your Achievement System for things to do to earn more."
pt = "Desculpe, não te devo nenhuma recompensa de conquista no momento. Veja o seu Achievement System para saber o que fazer para ganhar mais."

[.explorerjack_19]
en = "You certainly can!"
pt = "Claro que pode!"

[.explorerjack_20]
en = "Where would you like the items sent?"
pt = "Para onde quer que os itens sejam enviados?"

[.explorerjack_21]
en = "Inventory."
pt = "Inventário."

[.explorerjack_22]
en = "Bank."
pt = "Banco."

[.explorerjack_23]
en = "Sorry, I was just leaving."
pt = "Desculpe, eu já estava de saída."

[.explorerjack_24]
en = "What ho! Where did you come from?"
pt = "Ora viva! De onde você saiu?"

[.explorerjack_25]
en = "Um... Well, I was in the cellar of some old guy called Roddeck, and then there was a dragon, and we had to break through your wall to escape."
pt = "Hã... Bem, eu estava no porão de um velho chamado Roddeck, aí apareceu um dragão e tivemos que derrubar a sua parede para fugir."

[.explorerjack_26]
en = "Hahaha! I always told Roddeck he shouldn't keep a dragon in his cellar. They're wild creatures, you know. It takes real skill to rear them as pets."
pt = "Hahaha! Sempre disse ao Roddeck que não devia guardar um dragão no porão. São criaturas selvagens, sabe. É preciso muita habilidade para criá-los como bichos de estimação."

[.explorerjack_27]
en = "I don't think he'll be trying it again. You're not angry about your wall?"
pt = "Acho que ele não vai tentar de novo. Você não está bravo com a sua parede?"

[.explorerjack_28]
en = "No, no. I'm an explorer; my house is just a place where I sleep between expeditions. Anyway, can I do anything for you?"
pt = "Não, não. Sou explorador; minha casa é só um lugar para dormir entre expedições. Enfim, posso fazer algo por você?"

[.explorerjack_29]
en = "I can tell you about the Achievement Diary."
pt = "Posso te falar sobre o Achievement Diary (diário de conquistas)."

[.explorerjack_30]
en = "What is the Achievement Diary?"
pt = "O que é o Achievement Diary?"

[.explorerjack_31]
en = "Ah, well it's a diary that helps you keep track of particular achievements in the world of %server%. In Lumbridge and Draynor, it can help you discover some very useful things indeed."
pt = "Ah, é um diário que ajuda a acompanhar certas conquistas no mundo de %server%. Em Lumbridge e Draynor, ele pode te ajudar a descobrir coisas muito úteis."

[.explorerjack_32]
en = "Eventually, with enough exploration, you will be rewarded for your explorative efforts."
pt = "Com o tempo, explorando bastante, você será recompensado pelos seus esforços de exploração."

[.explorerjack_33]
en = "You can find your Achievement Diary by clicking on the green star icon."
pt = "Você encontra o seu Achievement Diary clicando no ícone da estrela verde."

[.explorerjack_34]
en = "You should see the icon flashing now. Go ahead and click on it to find your Achievement Diary. If you have any questions, feel free to speak to me again."
pt = "O ícone deve estar piscando agora. Clique nele para abrir o seu Achievement Diary. Se tiver dúvidas, fique à vontade para falar comigo de novo."

[.explorerjack_35]
en = "I say, there's nothing interesting in my cellar! Better go exploring elsewhere, eh?"
pt = "Ora essa, não há nada de interessante no meu porão! Melhor ir explorar em outro lugar, hein?"

[.explorerjack_36]
en = "What's down there?"
pt = "O que tem lá embaixo?"

[.explorerjack_37]
en = "Crates, boxes, shelves - nothing you won't see in dozens of houses across Runescape. Go on, explore somewhere else!"
pt = "Caixotes, caixas, prateleiras - nada que você não veja em dezenas de casas por Runescape. Vamos, vá explorar outro lugar!"

[.explorerjack_38]
en = "Well, the Task System is a potent method of guiding yourself to useful things to do around the world."
pt = "Bem, o Task System é um jeito poderoso de se guiar até coisas úteis para fazer pelo mundo."

[.explorerjack_39]
en = "You'll see up to six Tasks in your side bar if you click on the glowing Task List icon. You can click on one for more information about it, hints, waypoint arrows, that sort of thing."
pt = "Você verá até seis tarefas (Tasks) na barra lateral se clicar no ícone brilhante da Task List. Clique em uma para mais informações, dicas, setas de direção, esse tipo de coisa."

[.explorerjack_40]
en = "Every Task you do will earn you something of value which you can claim from me. It'll be money, mostly, but the Rewards tab for a Task will tell you more.<br>Good luck!"
pt = "Cada tarefa que você fizer rende algo de valor que pode resgatar comigo. Quase sempre dinheiro, mas a aba Recompensas da tarefa diz mais.<br>Boa sorte!"

[.explorerjack_41]
en = "I'll just fill your %1% with what you need, then."
pt = "Então vou só encher o seu %1% com o que você precisa."

[.explorerjack_42]
en = "There you go. You didn't have enough space for everything you're owed, so I've held on to the rest."
pt = "Pronto. Você não tinha espaço para tudo o que te devo, então guardei o resto comigo."

[.explorerjack_43]
en = "There you go."
pt = "Pronto."

# FredTheFarmer - Lumbridge - Tutorial Island

[.fredthefarmer_1]
en = "What are you doing on my land? You're not the one who keeps leaving all my gates open and letting out all my sheep are you?"
pt = "O que você está fazendo nas minhas terras? Não é você quem vive deixando minhas porteiras abertas e soltando minhas ovelhas, é?"

[.fredthefarmer_2]
en = "I've got some wool. I've not managed to make it into a ball, though."
pt = "Consegui um pouco de lã (wool), mas ainda não consegui transformá-la em novelo."

[.fredthefarmer_3]
en = "Well, go find a spinning wheel then. You can find one on the first floor of Lumbridge Castle; just turn right and follow the path when leaving my house and you'll find Lumbridge."
pt = "Então vá achar uma roda de fiar (spinning wheel). Tem uma no primeiro andar do Lumbridge Castle; ao sair da minha casa, vire à direita e siga o caminho que você chega a Lumbridge."

[.fredthefarmer_4]
en = "That wool is white, I'm dealing with a guy looking to do business with black wool only."
pt = "Essa lã é branca. Estou negociando com um sujeito que só quer saber de lã preta."

[.fredthefarmer_5]
en = "I'm looking for something to kill."
pt = "Estou procurando algo para matar."

[.fredthefarmer_6]
en = "What, on my land? Leave my livestock alone!"
pt = "O quê, nas minhas terras? Deixe meus animais em paz!"

[.fredthefarmer_7]
en = "I'm lost."
pt = "Estou perdido."

[.fredthefarmer_8]
en = "How can you be lost? Just follow the road east and south. You'll end up in Lumbridge fairly quickly."
pt = "Como alguém consegue se perder aqui? É só seguir a estrada para o leste e para o sul. Você chega a Lumbridge rapidinho."

[.fredthefarmer_9]
en = "I'm looking for work."
pt = "Estou procurando trabalho."

[.fredthefarmer_10]
en = "Oh? Well, I could do with a bit of help, since you're offering."
pt = "Ah, é? Bem, uma ajudinha até que viria a calhar, já que você está oferecendo."

[.fredthefarmer_11]
en = "I need to collect some black wool from my sheep and I'd be much obliged if you could shear them for me. While you're at it, spin the wool into balls for me too."
pt = "Preciso juntar lã preta (black wool) das minhas ovelhas e ficaria muito grato se você as tosquiasse para mim. E já que vai fazer isso, fie a lã em novelos também."

[.fredthefarmer_12]
en = "Does it have to be black wool?"
pt = "Precisa ser lã preta?"

[.fredthefarmer_13]
en = "Has to be. I'm doing business with some guy after black clothing - something to do with black looking 'cool'."
pt = "Precisa. Estou negociando com um sujeito atrás de roupa preta - algo a ver com preto ser 'estiloso'."

[.fredthefarmer_14]
en = "It takes all sorts, I suppose."
pt = "Tem gosto para tudo, eu acho."

[.fredthefarmer_15]
en = "Indeed. So if you bring me twenty balls of black wool, I'm sure I could sort out some sort of payment."
pt = "Pois é. Então, se você me trouxer vinte novelos de lã preta (balls of black wool), com certeza arranjo algum pagamento."

[.fredthefarmer_16]
en = "So is this a quest?"
pt = "Então isso é uma missão (quest)?"

[.fredthefarmer_17]
en = "No, it isn't. It's work. You do what I say, then you get paid."
pt = "Não, não é. É trabalho. Você faz o que eu mando e depois recebe."

[.fredthefarmer_18]
en = "Black clothing cool? I'm not sure that's true."
pt = "Roupa preta estilosa? Não sei se isso é verdade."

[.fredthefarmer_19]
en = "That's what I thought, but I'm certainly not going to turn down the business. So if you bring me twenty balls of black wool, I'm sure I could sort out some sort of payment."
pt = "Foi o que eu pensei, mas é claro que não vou recusar o negócio. Então, se você me trouxer vinte novelos de lã preta (balls of black wool), com certeza arranjo algum pagamento."

[.fredthefarmer_20]
en = "That doesn't sound very exciting."
pt = "Isso não parece muito emocionante."

[.fredthefarmer_21]
en = "Well, what do you expect if you ask a farmer?"
pt = "Bem, o que você esperava pedindo emprego a um fazendeiro?"

[.fredthefarmer_22]
en = "I'll take the job."
pt = "Aceito o trabalho."

[.fredthefarmer_23]
en = "Of course!"
pt = "É claro!"

[.fredthefarmer_24]
en = "And you know how to spin wool into balls?"
pt = "E você sabe fiar a lã em novelos?"

[.fredthefarmer_25]
en = "I don't know how to spin wool, sorry."
pt = "Desculpe, não sei fiar lã."

[.fredthefarmer_26]
en = "Don't worry it's quite simple!"
pt = "Não se preocupe, é bem simples!"

[.fredthefarmer_27]
en = "The nearest Spinning Wheel can be found on the first floor of Lumbridge Castle."
pt = "A roda de fiar (Spinning Wheel) mais próxima fica no primeiro andar do Lumbridge Castle."

[.fredthefarmer_28]
en = "To get to Lumbridge Castle just follow the road east."
pt = "Para chegar ao Lumbridge Castle, é só seguir a estrada para o leste."

[.fredthefarmer_29]
en = "This icon denotes a Spinning Wheel on the world map."
pt = "Este ícone indica uma roda de fiar (Spinning Wheel) no mapa-múndi."

[.fredthefarmer_30]
en = "Thank you!"
pt = "Obrigado!"

[.fredthefarmer_31]
en = "I'm something of an expert, actually."
pt = "Na verdade, sou meio que um especialista."

[.fredthefarmer_32]
en = "Well, you can stop grinning and get to work then."
pt = "Então pode parar de sorrir à toa e ir trabalhar."

[.fredthefarmer_33]
en = "I'm not paying you by the hour!"
pt = "Não estou pagando por hora!"

[.fredthefarmer_34]
en = "Actually, no, I don't."
pt = "Na verdade, não, não sei."

[.fredthefarmer_35]
en = "Well, you're halfway there already! You have a set of shears in your inventory. Just use those on a Sheep to shear it."
pt = "Bem, você já está no meio do caminho! Tem uma tesoura de tosquia (shears) no inventário. É só usá-la numa Sheep para tosquiá-la."

[.fredthefarmer_36]
en = "That's all I have to do?"
pt = "É só isso que eu tenho que fazer?"

[.fredthefarmer_37]
en = "Well, once you've collected some wool you'll need to spin it into balls."
pt = "Bem, depois de juntar a lã, você vai precisar fiá-la em novelos."

[.fredthefarmer_38]
en = "Do you know how to spin wool?"
pt = "Você sabe fiar lã?"

[.fredthefarmer_39]
en = "Well, first things first, you need some shears. There's a pair in my house on the table."
pt = "Bem, primeiro o mais importante: você precisa de uma tesoura de tosquia (shears). Tem uma na mesa da minha casa."

[.fredthefarmer_40]
en = "Or you could buy your own pair from Lumbridge General Store or from the Grand Exchange in Varrock."
pt = "Ou você pode comprar a sua na Lumbridge General Store ou no Grand Exchange, em Varrock."

[.fredthefarmer_41]
en = "To get to the store, turn right when leaving the farm then follow the path. The store will be just down the road on your right."
pt = "Para chegar à loja, vire à direita ao sair da fazenda e siga o caminho. A loja fica logo adiante, do lado direito."

[.fredthefarmer_42]
en = "General stores are marked on the map by this symbol."
pt = "Os armazéns gerais (general stores) são marcados no mapa por este símbolo."

[.fredthefarmer_43]
en = "Once you have some shears, use them on the sheep in my field."
pt = "Quando tiver a tesoura, use-a nas ovelhas do meu pasto."

[.fredthefarmer_44]
en = "Sounds easy."
pt = "Parece fácil."

[.fredthefarmer_45]
en = "That's what they all say! Some of the sheep don't like it and will run away from you. Persistence is the key."
pt = "É o que todos dizem! Algumas ovelhas não gostam e vão fugir de você. O segredo é insistir."

[.fredthefarmer_46]
en = "And watch out for rams! They will attack you if you try to shear them. You can tell them apart from the rest of the sheep by their curly horns."
pt = "E cuidado com os carneiros (rams)! Eles atacam se você tentar tosquiá-los. Dá para diferenciá-los das ovelhas pelos chifres enrolados."

[.fredthefarmer_47]
en = "Once you've collected some wool you can spin it into balls."
pt = "Depois de juntar a lã, você pode fiá-la em novelos."

[.fredthefarmer_48]
en = "Good. Hopefully, you'll be safe from 'The Thing'! Do you actually know how to shear a sheep?"
pt = "Ótimo. Tomara que você fique a salvo da 'Coisa'! Você sabe mesmo tosquiar uma ovelha?"

[.fredthefarmer_49]
en = "What do you mean, 'The Thing'?"
pt = "Como assim, 'a Coisa'?"

[.fredthefarmer_50]
en = "Well now, no one has ever seen 'The Thing'. That's why we call it 'The Thing, cos we don't know what it is."
pt = "Pois é, ninguém nunca viu 'a Coisa'. É por isso que chamamos de 'a Coisa', porque não sabemos o que é."

[.fredthefarmer_51]
en = "Some say it's a black hearted shapeshifter, hungering for the souls of hard working decent folk like me. Others say it's just a sheep."
pt = "Uns dizem que é um metamorfo de coração negro, faminto pelas almas de gente honesta e trabalhadora como eu. Outros dizem que é só uma ovelha."

[.fredthefarmer_52]
en = "Well I don't have all day to stand around and gossip. Did you say you knew how to shear sheep?"
pt = "Bem, não tenho o dia todo para ficar de fofoca. Você disse que sabia tosquiar ovelhas?"

[.fredthefarmer_53]
en = "I have some balls of black wool for you."
pt = "Tenho uns novelos de lã preta para você."

[.fredthefarmer_54]
en = "Give 'em here then."
pt = "Então passe para cá."

[.fredthefarmer_55]
en = "How many more balls of wool do you need?"
pt = "Quantos novelos de lã você ainda precisa?"

[.fredthefarmer_56]
en = "You need to collect %1% more balls of wool"
pt = "Você precisa juntar mais %1% novelos de lã"

[.fredthefarmer_57]
en = "I haven't got any at the moment."
pt = "No momento não tenho nenhum."

[.fredthefarmer_58]
en = "Ah well at least you haven't been eaten."
pt = "Ah, bem, pelo menos você não foi devorado."

[.fredthefarmer_59]
en = "Can you remind me how to get balls of wool?"
pt = "Pode me lembrar como conseguir novelos de lã?"

[.fredthefarmer_60]
en = "Sure. You need to shear sheep and then spin the wool on a spinning wheel. Anything else?"
pt = "Claro. Você precisa tosquiar ovelhas e depois fiar a lã numa roda de fiar. Mais alguma coisa?"

[.fredthefarmer_61]
en = "That's all, thanks."
pt = "É só isso, obrigado."

[.fredthefarmer_62]
en = "Fred! Fred! I've seen 'The Thing!'"
pt = "Fred! Fred! Eu vi 'a Coisa'!"

[.fredthefarmer_63]
en = "You...you actually saw it?"
pt = "Você... você viu mesmo?"

[.fredthefarmer_64]
en = "Run for the hills! %1%, grab as many chickens as you can! We have to..."
pt = "Fujam para as colinas! %1%, pegue o máximo de galinhas que puder! Temos que..."

[.fredthefarmer_65]
en = "Fred!"
pt = "Fred!"

[.fredthefarmer_66]
en = "..flee! Oh, woe is me! The shape-shifter is coming! We're all..."
pt = "..fugir! Ai de mim! O metamorfo está vindo! Estamos todos..."

[.fredthefarmer_67]
en = "FRED!"
pt = "FRED!"

[.fredthefarmer_68]
en = "..doomed. What?"
pt = "..condenados. O quê?"

[.fredthefarmer_69]
en = "It's not a shape-shifter or any other kind of monster."
pt = "Não é um metamorfo nem nenhum outro tipo de monstro."

[.fredthefarmer_70]
en = "Well, what is it, boy?"
pt = "Bem, então o que é, rapaz?"

[.fredthefarmer_71]
en = "Well, it's just two penguins...disguised as a sheep."
pt = "Bem, são só dois pinguins... disfarçados de ovelha."

[.fredthefarmer_72]
en = "Have you been out in the sun too long?"
pt = "Você ficou tempo demais no sol?"

[.fredthefarmer_73]
en = "Can you tell me how to shear sheep?"
pt = "Pode me dizer como tosquiar ovelhas?"

[.fredthefarmer_74]
en = "Anything else?"
pt = "Mais alguma coisa?"

[.fredthefarmer_75]
en = "Can you tell me how to spin wool?"
pt = "Pode me dizer como fiar lã?"

[.fredthefarmer_76]
en = "That's all I've got so far."
pt = "Isso é tudo o que tenho até agora."

[.fredthefarmer_77]
en = "I need %1% more before I can pay you."
pt = "Preciso de mais %1% antes de poder te pagar."

[.fredthefarmer_78]
en = "Okay, I'll work on it."
pt = "Certo, vou cuidar disso."

[.fredthefarmer_79]
en = "That's the last of them."
pt = "Esses são os últimos."

[.fredthefarmer_80]
en = "A pleasure doing business with you. You can shear my sheep whenever you want. You could even sell the wool to the Grand Exchange."
pt = "Foi um prazer fazer negócio com você. Pode tosquiar minhas ovelhas quando quiser. Pode até vender a lã no Grand Exchange."

[.fredthefarmer_81]
en = "But that's the white ones only, mind you!"
pt = "Mas só as brancas, veja bem!"

[.fredthefarmer_82]
en = "Anyway, I guess I'd better pay you."
pt = "Enfim, acho melhor eu te pagar."

[.fredthefarmer_83]
en = "Fred gives you some money and teaches you some Crafting techniques."
pt = "Fred te dá um dinheiro e ensina algumas técnicas de Crafting (artesanato)."

[.fredthefarmer_84]
en = "Hello again"
pt = "Olá de novo"

[.fredthefarmer_85]
en = "What are you doing on my land? Ah, it's the sheep shearer! The black wool you helped me with sold exceptionally well. Please accept this as an extra thanks."
pt = "O que você está fazendo nas minhas terras? Ah, é o tosquiador! A lã preta que você me ajudou a juntar vendeu muitíssimo bem. Aceite isto como um agradecimento extra."

[.fredthefarmer_86]
en = "The farmer hands over 1,940 coins."
pt = "O fazendeiro te entrega 1.940 moedas (coins)."

[.fredthefarmer_87]
en = "Great news, but I need to free up some inventory space first. I'll be right back."
pt = "Ótima notícia, mas preciso liberar espaço no inventário primeiro. Já volto."

# Hank - Lumbridge - Tutorial Island

[.hank_1]
en = "Good day to you! Welcome to my fishing shop. Would you like to buy some fishing equipment or sell some fish?"
pt = "Bom dia para você! Bem-vindo à minha loja de pesca. Quer comprar equipamento de pesca ou vender peixe?"

[.hank_2]
en = "Can I see your fishing supplies?"
pt = "Posso ver seus suprimentos de pesca?"

[.hank_3]
en = "Farewell."
pt = "Adeus."

# Lachtopher - Lumbridge - Tutorial Island

[.lachtopher_1]
en = "Hello, I suppose. I'm Lachtopher. Could you lend me some money?"
pt = "Olá, acho. Sou o Lachtopher. Pode me emprestar um dinheiro?"

[.lachtopher_2]
en = "Lend you money? I really don't think so. Don't you have any of your own?"
pt = "Emprestar dinheiro? Acho que não mesmo. Você não tem o seu?"

[.lachtopher_3]
en = "I spent it all and I can't be bothered to earn any more."
pt = "Gastei tudo e estou com preguiça de ganhar mais."

[.lachtopher_4]
en = "Right, and you want my hard-earned money instead? No chance!"
pt = "Certo, e aí quer o meu dinheiro suado? Nem pensar!"

[.lachtopher_5]
en = "You're just like my sister, Victoria. She won't give me any money."
pt = "Você é igualzinho à minha irmã, a Victoria. Ela não me dá dinheiro nenhum."

[.lachtopher_6]
en = "Your sister sounds like she has the right idea."
pt = "Parece que a sua irmã está certa."

[.lachtopher_7]
en = "Yeah, I've heard it all before. 'Oh,' she says, 'It's easy to make money: just complete Tasks for cash."
pt = "É, já ouvi isso tudo antes. 'Ah', ela diz, 'É fácil ganhar dinheiro: é só completar Tasks (tarefas) por grana."

[.lachtopher_8]
en = "Well, if you want to make money..."
pt = "Bem, se você quer ganhar dinheiro..."

[.lachtopher_9]
en = "That's just it. I don't want to make money. I just want to have money."
pt = "Aí é que está. Eu não quero ganhar dinheiro. Só quero ter dinheiro."

[.lachtopher_10]
en = "I've had it with you! I don't think I've come across a less worthwhile person."
pt = "Cansei de você! Acho que nunca conheci uma pessoa que valesse tão pouco."

[.lachtopher_11]
en = "I think I'll call you Lazy Lachtopher, from now on."
pt = "Acho que vou te chamar de Lachtopher Preguiçoso daqui para a frente."

# LumbridgeMen - Lumbridge - Tutorial Island

[.lumbridgemen_1]
en = "Howdy."
pt = "Opa, olá."

[.lumbridgemen_2]
en = "Salutations!"
pt = "Salve!"

[.lumbridgemen_3]
en = "Good day."
pt = "Bom dia."

[.lumbridgemen_4]
en = "Nice to meet you."
pt = "Prazer em conhecê-lo."

[.lumbridgemen_5]
en = "Greetings."
pt = "Saudações."

[.lumbridgemen_6]
en = "I have to go all the way through the swamp to go mining. My poor feet!"
pt = "Tenho que atravessar o pântano inteiro para ir minerar. Meus pobres pés!"

[.lumbridgemen_7]
en = "Hello. I'm Sorry to say that Lumbridge is not what it once was."
pt = "Olá. Lamento dizer que Lumbridge não é mais o que era."

[.lumbridgemen_8]
en = "You're not from around here, are you? I can see it in your eyes."
pt = "Você não é daqui, é? Dá para ver nos seus olhos."

[.lumbridgemen_9]
en = "Sorry, were you speaking to me? I was daydreaming. Hello, anyway."
pt = "Desculpe, falou comigo? Eu estava sonhando acordado. Olá, de qualquer forma."

[.lumbridgemen_10]
en = "Sorry, I don't speak to strangers. They're weird."
pt = "Desculpe, não falo com estranhos. Eles são esquisitos."

[.lumbridgemen_11]
en = "Hello to you too, adventurer."
pt = "Olá para você também, aventureiro."

[.lumbridgemen_12]
en = "I wish people would stop ringing the church bell. I can't tell what time it is."
pt = "Queria que parassem de tocar o sino da igreja. Assim eu não sei que horas são."

[.lumbridgemen_13]
en = "I can't believe that Lachtopher boy. He tried to borrow money from me again."
pt = "Não acredito naquele garoto, o Lachtopher. Tentou me pedir dinheiro emprestado de novo."

[.lumbridgemen_14]
en = "They really need to fix the castle flag. Every time you raise it, it just comes back down. Shoddy maintenance."
pt = "Precisam mesmo consertar a bandeira do castelo. Toda vez que alguém a hasteia, ela desce de novo. Manutenção malfeita."

[.lumbridgemen_15]
en = "Hello, I'm glad to see an adventurer about. There's an increase in goblins hanging around the area."
pt = "Olá, que bom ver um aventureiro por aqui. Tem cada vez mais goblins rondando a região."

[.lumbridgemen_16]
en = "Another adventurer, off to save the world, eh?"
pt = "Mais um aventureiro indo salvar o mundo, é?"

[.lumbridgemen_17]
en = "Don't come near me, I have a cold!"
pt = "Não chegue perto de mim, estou resfriado!"

[.lumbridgemen_18]
en = "Hey, do you like my clothes? They're new."
pt = "Ei, gostou das minhas roupas? São novas."

[.lumbridgemen_19]
en = "Don't ask me for directions, I'm just a tourist here."
pt = "Não me peça informações, sou só um turista aqui."

[.lumbridgemen_20]
en = "Welcome to Lumbridge"
pt = "Bem-vindo a Lumbridge"

# LumbridgeSage - Lumbridge - Tutorial Island

[.lumbridgesage_1]
en = "Greetings, adventurer. How may I help you?"
pt = "Saudações, aventureiro. Como posso ajudar?"

[.lumbridgesage_2]
en = "I'm fine for now, thanks."
pt = "Por enquanto estou bem, obrigado."

[.lumbridgesage_3]
en = "I am Phileas, the Lumbridge Sage. In times past, people came from all around to ask me for advice. My renown seems to have diminished somewhat in recent years, though. Can I help you with anything?"
pt = "Sou Phileas, o Lumbridge Sage. Antigamente, vinha gente de toda parte me pedir conselhos. Mas minha fama parece ter diminuído um pouco nos últimos anos. Posso ajudar em algo?"

[.lumbridgesage_4]
en = "Tell me about the town of Lumbridge."
pt = "Me fale sobre a cidade de Lumbridge."

[.lumbridgesage_5]
en = "Lumbridge is one of the older towns in the human-controlled kingdoms. It was founded over two hundred years ago towards the end of the Fourth Age. It's called Lumbridge because of this bridge built over the"
pt = "Lumbridge é uma das cidades mais antigas dos reinos humanos. Foi fundada há mais de duzentos anos, perto do fim da Quarta Era. Chama-se Lumbridge por causa desta ponte construída sobre o"

[.lumbridgesage_6]
en = "River Lum. The town is governed by Duke Horacio, who is a good friend of our monarch, King Roald of Misthalin."
pt = "River Lum. A cidade é governada pelo Duke Horacio, bom amigo do nosso monarca, o King Roald de Misthalin."

[.lumbridgesage_7]
en = "Goodbye."
pt = "Adeus."

[.lumbridgesage_8]
en = "Good adventuring, traveller."
pt = "Boas aventuras, viajante."

# Victoria - Lumbridge - Tutorial Island

[.victoria_1]
en = "To you too, traveller. I am Victoria. Tell me, have you seen my brother, Lachtopher, around the town?"
pt = "Para você também, viajante. Eu sou Victoria. Diga, você viu meu irmão, Lachtopher, pela cidade?"

[.victoria_2]
en = "Yes, I've seen Lachtopher."
pt = "Sim, eu vi o Lachtopher."

[.victoria_3]
en = "Ah, he'll have asked you for money, no doubt. I hope you didn't give him any."
pt = "Ah, ele deve ter te pedido dinheiro, sem dúvida. Espero que você não tenha dado nada."

[.victoria_4]
en = "No, I didn't give him a single coin."
pt = "Não, não dei uma única moeda a ele."

[.victoria_5]
en = "Oh, good! If you had, then you would never have got it back. My brother is such a waste of space. I've been lending him things for years and he never gives them back."
pt = "Ah, que bom! Se tivesse dado, nunca mais veria o dinheiro de volta. Meu irmão é um imprestável. Faz anos que empresto coisas a ele e ele nunca devolve."

[.victoria_6]
en = "Yes, I loaned him money, just like he asked."
pt = "Sim, emprestei dinheiro a ele, como ele pediu."

[.victoria_7]
en = "Oh dear. I'm sorry to tell you this, but that's the last you'll see of that money. My brother is such a waste of space. I've been lending him things for years and he never gives them back."
pt = "Ai, ai. Sinto dizer, mas você nunca mais vai ver esse dinheiro. Meu irmão é um imprestável. Faz anos que empresto coisas a ele e ele nunca devolve."

[.victoria_8]
en = "No, I haven't seen him."
pt = "Não, não o vi."

[.victoria_9]
en = "Well, if you do meet him, he'll ask you for money, no doubt. Please don't give him any."
pt = "Bem, se encontrá-lo, ele vai te pedir dinheiro, sem dúvida. Por favor, não dê nada a ele."

[.victoria_10]
en = "Why not?"
pt = "Por que não?"

[.victoria_11]
en = "Sorry to tell you this, but if you lend him money you'll never see it again. My brother is such a waste of space. I've been lending him things for years and he never gives them back."
pt = "Sinto dizer, mas se emprestar dinheiro a ele, nunca mais vai ver a cor dele. Meu irmão é um imprestável. Faz anos que empresto coisas a ele e ele nunca devolve."

[.victoria_12]
en = "Oh dear. Has he always been this way?"
pt = "Nossa. Ele sempre foi assim?"

[.victoria_13]
en = "Yes, but it never used to be this bad. You see..."
pt = "Sim, mas nunca tinha sido tão ruim. Sabe..."

[.victoria_14]
en = "Lachtopher used to live on the east side of the river, before it was overrun with goblins. Although he didn't have a steady job, he used to help out around farms when he needed cash."
pt = "O Lachtopher morava no lado leste do rio, antes de ser tomado pelos goblins. Não tinha emprego fixo, mas costumava ajudar nas fazendas quando precisava de dinheiro."

[.victoria_15]
en = "Then, one day, the Duke told us it was no longer safe to live on the east riverbank, so some villagers had to move across here."
pt = "Então, um dia, o Duke nos disse que não era mais seguro morar na margem leste do rio, e alguns aldeões tiveram que se mudar para cá."

[.victoria_16]
en = "With no money for lodgings, and nowhere else to go, Lachtopher came to live with me. I've only a small house, so he sleeps downstairs on the floor."
pt = "Sem dinheiro para hospedagem e sem ter para onde ir, o Lachtopher veio morar comigo. Minha casa é pequena, então ele dorme lá embaixo, no chão."

[.victoria_17]
en = "Goodness. That sounds quite uncomfortable."
pt = "Nossa. Isso parece bem desconfortável."

[.victoria_18]
en = "Not uncomfortable enough, it seems."
pt = "Não desconfortável o bastante, pelo visto."

[.victoria_19]
en = "I thought he'd only be staying for a couple of weeks, just until he'd got some money together, but he's been here for ages now."
pt = "Achei que ele só ia ficar umas duas semanas, só até juntar algum dinheiro, mas ele já está aqui há séculos."

[.victoria_20]
en = "So, why not just throw him out on to the streets?"
pt = "Então, por que não botá-lo no olho da rua de uma vez?"

[.victoria_21]
en = "Oh, no! I couldn't do that to my brother."
pt = "Ah, não! Eu não poderia fazer isso com meu irmão."

[.victoria_22]
en = "Besides, my parents taught me to support and care for those in need. I'm sure that, if I try hard enough, I can change my brother's ways."
pt = "Além disso, meus pais me ensinaram a apoiar e cuidar de quem precisa. Tenho certeza de que, se eu me esforçar bastante, consigo mudar o jeito do meu irmão."

[.victoria_23]
en = "That doesn't mean he's having any more money out of me, however. He can have a roof over his head, but that's all."
pt = "Mas isso não quer dizer que ele vai arrancar mais dinheiro de mim. Ele pode ter um teto sobre a cabeça, e só."

[.victoria_24]
en = "Good luck with that. I don't think Lachtopher deserves a sister like you."
pt = "Boa sorte com isso. Acho que o Lachtopher não merece uma irmã como você."

[.victoria_25]
en = "Such kind words. Thank you. Remember: don't give him any money - tell him to get a job instead."
pt = "Que palavras gentis. Obrigada. Lembre-se: não dê dinheiro a ele - mande ele arranjar um emprego."

[.victoria_26]
en = "Okay, I'll try to remember that."
pt = "Certo, vou tentar me lembrar disso."

# Xenia - Lumbridge - Tutorial Island

[.xenia_1]
en = "I'm glad you've come by. I need some help."
pt = "Que bom que você apareceu. Preciso de ajuda."

[.xenia_2]
en = "We've got no time to lose. You head down the stairs, and I'll follow."
pt = "Não temos tempo a perder. Desça as escadas, que eu vou logo atrás."

[.xenia_3]
en = "There's a guard in the room ahead. Together we should be able to take him out."
pt = "Há um guarda na sala à frente. Juntos, devemos conseguir derrubá-lo."

[.xenia_4]
en = "You'll need a weapon. Equip this bronze dagger, then talk to me again."
pt = "Você vai precisar de uma arma. Equipe esta adaga de bronze (bronze dagger) e depois fale comigo de novo."

[.xenia_5]
en = "Ah..."
pt = "Ah..."

[.xenia_6]
en = "It looks like I'm too old for this after all. You'll have to do the rest without me."
pt = "Parece que estou velha demais para isso, afinal. Você vai ter que fazer o resto sem mim."

[.xenia_7]
en = "The first cultist is using a ranged weapon, so you should attack him with your melee weapon."
pt = "O primeiro cultista usa uma arma de longo alcance, então ataque-o com sua arma corpo a corpo (melee)."

[.xenia_8]
en = "I'll follow you, but I'll stay out of combat. Return to me if you're wounded. I have some food to share."
pt = "Vou te seguir, mas vou ficar fora do combate. Volte até mim se estiver ferido. Tenho comida para dividir."

[.xenia_9]
en = "The first cultist is defeated, but not dead. I'll leave it up to you to how to deal with him."
pt = "O primeiro cultista foi derrotado, mas não está morto. Deixo com você a decisão do que fazer com ele."

[.xenia_10]
en = "You're holding the sling right. You should be able to attack the second cultist without any trouble."
pt = "Você está segurando a funda (sling) direitinho. Deve conseguir atacar o segundo cultista sem problemas."

[.xenia_11]
en = "I see you've brought your own ranged weapon. I'll assume you know how to use it!"
pt = "Vejo que trouxe sua própria arma de longo alcance. Vou supor que sabe usá-la!"

[.xenia_12]
en = "You'll need to equip the sling before you can attack the second cultist."
pt = "Você precisa equipar a funda antes de atacar o segundo cultista."

[.xenia_13]
en = "You'll need to pick up the sling and equip it before you can attack the second cultist."
pt = "Você precisa pegar a funda e equipá-la antes de atacar o segundo cultista."

[.xenia_14]
en = "The second cultist is defeated, but not dead. I'll leave it up to you how to deal with her."
pt = "A segunda cultista foi derrotada, mas não está morta. Deixo com você a decisão do que fazer com ela."

[.xenia_15]
en = "You're holding the staff. You should be able to attack the last cultist without any trouble."
pt = "Você está segurando o cajado (staff). Deve conseguir atacar o último cultista sem problemas."

[.xenia_16]
en = "I see you've brought your own magic weapon. I'll assume you know how to use it!"
pt = "Vejo que trouxe sua própria arma mágica. Vou supor que sabe usá-la!"

[.xenia_17]
en = "You'll need to equip the staff before you can attack the last cultist."
pt = "Você precisa equipar o cajado antes de atacar o último cultista."

[.xenia_18]
en = "You'll need to pick up the staff and equip it before you can attack the last cultist."
pt = "Você precisa pegar o cajado e equipá-lo antes de atacar o último cultista."

[.xenia_19]
en = "You've defeated the last cultist. Now you need to untie their prisoner."
pt = "Você derrotou o último cultista. Agora precisa desamarrar a prisioneira deles."

[.xenia_20]
en = "If you've defeated the last cultist, you'll need to decide how to deal with him."
pt = "Se você derrotou o último cultista, precisa decidir o que fazer com ele."

[.xenia_21]
en = "The last cultist is a swordsman. Magic is the best thing to use against melee fighters."
pt = "O último cultista é um espadachim. Magic (magia) é a melhor coisa contra lutadores corpo a corpo."

[.xenia_22]
en = "Ha ha! I thought you might put Dragith Nurn's mask back together."
pt = "Ha ha! Achei mesmo que você ia remontar a máscara de Dragith Nurn."

[.xenia_23]
en = "Oh, take it off. It doesn't suit you. You look ridiculous!"
pt = "Ah, tire isso. Não combina com você. Você está ridículo!"

[.xenia_24]
en = "Hello again, adventurer."
pt = "Olá de novo, aventureiro."

[.xenia_25]
en = "Is there anything you want to ask before you go to seek out new adventures?"
pt = "Quer perguntar mais alguma coisa antes de partir em busca de novas aventuras?"

[.xenia_26]
en = "Sorry, I've got to go."
pt = "Desculpe, preciso ir."

[.xenia_27]
en = "You're lightly wounded. You should eat some of the food you're carrying."
pt = "Você está levemente ferido. Devia comer um pouco da comida que está carregando."

[.xenia_28]
en = "You're badly wounded! You should eat some of the food you're carrying."
pt = "Você está gravemente ferido! Devia comer um pouco da comida que está carregando."

[.xenia_29]
en = "You're lightly wounded. Here, have some food..."
pt = "Você está levemente ferido. Tome, coma alguma coisa..."

[.xenia_30]
en = "Xenia gives you a piece of cooked meat. Eat food to heal yourself."
pt = "Xenia te dá um pedaço de carne cozida (cooked meat). Coma para se curar."

[.xenia_31]
en = "You're badly wounded! Eat some food, quickly..."
pt = "Você está gravemente ferido! Coma alguma coisa, rápido..."

[.xenia_32]
en = "Xenia gives you 4 pieces of cooked meat. Eat food to heal yourself."
pt = "Xenia te dá 4 pedaços de carne cozida (cooked meat). Coma para se curar."

[.xenia_33]
en = "I think I'll go now."
pt = "Acho que vou indo."

[.xenia_34]
en = "Farewell, adventurer."
pt = "Adeus, aventureiro."

[.xenia_35]
en = "What do you need help with?"
pt = "Precisa de ajuda com o quê?"

[.xenia_36]
en = "Some cultists of Zamorak have gone into the catacombs with a prisoner. I don't know what they're planning, but I'm pretty sure it's not a tea party."
pt = "Uns cultistas de Zamorak entraram nas catacumbas com uma prisioneira. Não sei o que estão tramando, mas tenho quase certeza de que não é um chá da tarde."

[.xenia_37]
en = "There are three of them, and I'm not as young as I was the last time I was here. I don't want to go down there without backup."
pt = "São três, e não sou mais tão jovem quanto da última vez em que estive aqui. Não quero descer lá sem reforço."

[.xenia_38]
en = "I'll help you."
pt = "Eu ajudo você."

[.xenia_39]
en = "I knew you would!"
pt = "Eu sabia que você ia ajudar!"

[.xenia_40]
en = "Not Right Now."
pt = "Agora não."

[.xenia_41]
en = "I need to know more before I help you."
pt = "Preciso saber mais antes de ajudar você."

[.xenia_42]
en = "Very wise. I got into a lot of trouble in my youth by rushing in without knowing a situation."
pt = "Muito sensato. Eu me meti em muita encrenca na juventude por me atirar nas coisas sem conhecer a situação."

[.xenia_43]
en = "Tell me more about these cultists."
pt = "Me conte mais sobre esses cultistas."

[.xenia_44]
en = "Lumbridge is a Saradominist town, but there will always be some people drawn to worship Zamorak. They must have found some ritual that they think will give them power over other people."
pt = "Lumbridge é uma cidade saradominista, mas sempre vai ter gente atraída pelo culto a Zamorak. Devem ter achado algum ritual que acham que vai lhes dar poder sobre os outros."

[.xenia_45]
en = "Who did they kidnap?"
pt = "Quem eles sequestraram?"

[.xenia_46]
en = "A young woman named Ilona. She had just left Lumbridge to apprentice at the Wizards' Tower."
pt = "Uma jovem chamada Ilona. Ela tinha acabado de sair de Lumbridge para ser aprendiz na Wizards' Tower."

[.xenia_47]
en = "They grabbed her on the road. Without training she didn't have a chance."
pt = "Eles a pegaram na estrada. Sem treinamento, ela não teve chance."

[.xenia_48]
en = "The catacombs of Lumbridge Church. The dead of Lumbridge have been buried there since...well, for about forty years now."
pt = "As catacumbas da Lumbridge Church. Os mortos de Lumbridge são enterrados lá desde...bem, há uns quarenta anos."

[.xenia_49]
en = "Is there a reward if I help you?"
pt = "Tem alguma recompensa se eu te ajudar?"

[.xenia_50]
en = "The cultists all have weapons, and you'll be able to keep them if we succeed. This adventure will also help to train your combat skills."
pt = "Todos os cultistas têm armas, e você vai poder ficar com elas se der certo. Esta aventura também vai ajudar a treinar suas habilidades de combate."

[.xenia_51]
en = "Enough questions."
pt = "Chega de perguntas."

[.xenia_52]
en = "So, will you help me, adventurer?"
pt = "E então, vai me ajudar, aventureiro?"

[.xenia_53]
en = "My name's Xenia. I'm an adventurer."
pt = "Meu nome é Xenia. Sou aventureira."

[.xenia_54]
en = "I'm one of the old guard, I suppose. I helped found the Champions' Guild, and I've done a fair few quests in my time."
pt = "Acho que sou da velha guarda. Ajudei a fundar a Champions' Guild e fiz um bom número de missões (quests) no meu tempo."

[.xenia_55]
en = "Now I'm starting to get a bit old for action, which is why I need your help."
pt = "Agora estou ficando meio velha para a ação, e é por isso que preciso da sua ajuda."

[.xenia_56]
en = "How did you know who I am?"
pt = "Como você sabia quem eu sou?"

[.xenia_57]
en = "Oh, I have my ways. I get the feeling that you're one to watch; you could be quite the hero some day."
pt = "Ah, eu tenho meus meios. Sinto que você é alguém para se ficar de olho; pode virar um grande herói algum dia."

[.xenia_58]
en = "I've lost some of the cultists' weapons."
pt = "Perdi algumas das armas dos cultistas."

[.xenia_59]
en = "Yes, one of my contacts in the Champion's Guild found them and returned them to me."
pt = "Sim, um dos meus contatos na Champion's Guild as encontrou e devolveu para mim."

[.xenia_60]
en = "I've found part of a mask in the catacombs."
pt = "Encontrei um pedaço de máscara nas catacumbas."

[.xenia_61]
en = "Oh, yes, I remember that Dragith Nurn had an enchanted ritual mask. If you can find all the pieces, you might be able to put it back together."
pt = "Ah, sim, lembro que Dragith Nurn tinha uma máscara ritual encantada. Se achar todos os pedaços, talvez consiga remontá-la."

[.xenia_62]
en = "I've got a question about my adventure in the catacombs..."
pt = "Tenho uma pergunta sobre a minha aventura nas catacumbas..."

[.xenia_63]
en = "You weren't really wounded, were you?"
pt = "Você não estava ferida de verdade, estava?"

[.xenia_64]
en = "Very perceptive, adventurer. I was wounded, but not as badly as I looked. I took the opportunity to see how you would fare."
pt = "Muito perspicaz, aventureiro. Eu estava ferida, mas não tanto quanto parecia. Aproveitei a chance para ver como você se sairia."

[.xenia_65]
en = "What will happen in the catacombs now?"
pt = "O que vai acontecer nas catacumbas agora?"

[.xenia_66]
en = " Reese managed to complete the ritual with his own death. He's opened the staircase to the nest of undead creatures in the lower level of the catacombs. Without a necromancer to control them, the creatures won't leave the tomb. I'll warn Father Aereck not to let people go down there. You're an adventurer, though. If you want to, you can venture into the tomb and fight the creatures."
pt = " Reese conseguiu completar o ritual com a própria morte. Ele abriu a escada para o ninho de criaturas mortas-vivas no nível inferior das catacumbas. Sem um necromante para controlá-las, as criaturas não vão sair da tumba. Vou avisar o Father Aereck para não deixar ninguém descer lá. Mas você é aventureiro. Se quiser, pode se aventurar na tumba e lutar contra as criaturas."

[.xenia_67]
en = "What is a blood pact?"
pt = "O que é um pacto de sangue?"

[.xenia_68]
en = " It's something Zamorakian cults do sometimes; a way of swearing loyalty to their leader. A blood pact doesn't have real magical power, but that kind of thing can have great power over a person if they believe strongly enough."
pt = " É algo que os cultos zamorakianos fazem às vezes; um jeito de jurar lealdade ao líder. Um pacto de sangue não tem poder mágico de verdade, mas esse tipo de coisa pode ter grande poder sobre uma pessoa se ela acreditar com força suficiente."

[.xenia_69]
en = "Who was Dragith Nurn?"
pt = "Quem era Dragith Nurn?"

[.xenia_70]
en = "You risked that woman's life for the sake of a test?"
pt = "Você arriscou a vida daquela mulher só por um teste?"

[.xenia_71]
en = " I was prepared to step in and rescue her if you failed, but I won't always be that ready. That's why I had to do this. The world needs heroes. I was a hero, once, but I'm not getting any younger. I need to make sure the news generation has its own heroes."
pt = " Eu estava pronta para intervir e salvá-la se você falhasse, mas nem sempre vou estar tão preparada. Por isso eu tinha que fazer isso. O mundo precisa de heróis. Já fui uma heroína, mas não estou ficando mais jovem. Preciso garantir que a nova geração tenha seus próprios heróis."

[.xenia_72]
en = "You risked my life for the sake of a test?"
pt = "Você arriscou a minha vida só por um teste?"

[.xenia_73]
en = "You're a born adventurer. I can practically smell it on you. People like you have a habit of coming back from things that would kill an ordinary person."
pt = "Você é um aventureiro nato. Quase dá para sentir o cheiro em você. Gente como você tem o hábito de voltar de coisas que matariam uma pessoa comum."

[.xenia_74]
en = "So how did I do?"
pt = "E então, como eu me saí?"

[.xenia_75]
en = "Very well indeed. You're a hero. You're exactly the sort of person the world needs. I'm glad I met you."
pt = "Muito bem mesmo. Você é um herói. É exatamente o tipo de pessoa de que o mundo precisa. Fico feliz por ter te conhecido."

[.xenia_76]
en = "What's the plan of attack?"
pt = "Qual é o plano de ataque?"

[.xenia_77]
en = "It looks like the cultist has a sling. The best way to deal with someone with a ranged weapon is to get close to them and attack with melee."
pt = "Parece que o cultista tem uma funda (sling). O melhor jeito de lidar com alguém com arma de longo alcance é chegar perto e atacar corpo a corpo."

[.xenia_78]
en = "What's a blood pact?"
pt = "O que é um pacto de sangue?"

[.xenia_79]
en = "It's something Zamorakian cults do sometimes; a way of swearing loyalty to their leader."
pt = "É algo que os cultos zamorakianos fazem às vezes; um jeito de jurar lealdade ao líder."

[.xenia_80]
en = "A blood pact doesn't have real magical power, but that kind of thing can have great power over a person if they believe strongly enough."
pt = "Um pacto de sangue não tem poder mágico de verdade, mas esse tipo de coisa pode ter grande poder sobre uma pessoa se ela acreditar com força suficiente."

[.xenia_81]
en = "Let's get on with this."
pt = "Vamos logo com isso."

[.xenia_82]
en = "Tell me more about melee combat."
pt = "Me fale mais sobre combate corpo a corpo (melee)."

[.xenia_83]
en = "There's not much to tell. Just run up and attack. You don't even need a weapon - you can use your fists. Melee combat is strong against rangers. Avoid magic users, though."
pt = "Não há muito o que dizer. É só correr e atacar. Você nem precisa de arma - pode usar os punhos. O corpo a corpo é forte contra arqueiros. Mas evite os magos."

[.xenia_84]
en = "Are you going to be alright?"
pt = "Você vai ficar bem?"

[.xenia_85]
en = "Don't worry about me. I've survived worse wounds than this. I'm going to hang back from combat, but I'll be here to give you advice if you need it. I'm sure you can beat these cultists on your own."
pt = "Não se preocupe comigo. Já sobrevivi a ferimentos piores que este. Vou ficar longe do combate, mas estarei aqui para dar conselhos se precisar. Tenho certeza de que você vence esses cultistas sozinho."

[.xenia_86]
en = "I can handle this."
pt = "Eu dou conta disso."

[.xenia_87]
en = "Tell me more about ranged combat."
pt = "Me fale mais sobre combate à distância (ranged)."

[.xenia_88]
en = "In order to use ranged combat, you'll need to wield a ranged weapon. For most weapons you'll also need ammunition, but if you use a sling you'll always be able to fire low power stones. After that it's easy; just attack your enemy. Ranged combat is good against magic users. It's not so good against melee fighters, since projectiles have trouble getting through heavy armour."
pt = "Para usar combate à distância, você precisa empunhar uma arma de longo alcance. Para a maioria das armas você também vai precisar de munição, mas com uma funda sempre dá para atirar pedras fracas. Depois disso é fácil; é só atacar o inimigo. O combate à distância é bom contra magos. Não é tão bom contra lutadores corpo a corpo, já que os projéteis têm dificuldade para atravessar armaduras pesadas."

[.xenia_89]
en = "Tell me more about magic combat."
pt = "Me fale mais sobre combate mágico (magic)."

[.xenia_90]
en = "Magic is based on runes. The runes contain magical power, and you can cast spells by combining them in specific ways. It's like cooking: the runes are ingredients, and a spell is a recipe."
pt = "A magia se baseia em runas. As runas contêm poder mágico, e você lança feitiços combinando-as de jeitos específicos. É como cozinhar: as runas são os ingredientes, e o feitiço é a receita."

[.xenia_91]
en = "Some magical staves act as an infinite supply of a certain type of rune. Magic is very useful against melee fighters. Watch out for rangers, though; arrows go straight through mage robes."
pt = "Alguns cajados mágicos funcionam como um suprimento infinito de um certo tipo de runa. A magia é muito útil contra lutadores corpo a corpo. Mas cuidado com os arqueiros; flechas atravessam direto as túnicas de mago."

[.xenia_92]
en = "Back to my other questions..."
pt = "Voltando às minhas outras perguntas..."

[.xenia_93]
en = "I'm ready for my reward."
pt = "Estou pronto para a minha recompensa."

[.xenia_94]
en = "What should I do now?"
pt = "O que devo fazer agora?"

[.xenia_95]
en = "The cultists' ritual opened up the lower level of the catacombs, which is swarming with undead creatures. If you want to practice your combat skills, you could go down there."
pt = "O ritual dos cultistas abriu o nível inferior das catacumbas, que está infestado de mortos-vivos. Se quiser praticar suas habilidades de combate, pode descer lá."

[.xenia_96]
en = "Alternatively, if you explore the world I'm sure you'll find other quests you can do."
pt = "Ou então, se explorar o mundo, tenho certeza de que vai encontrar outras missões para fazer."

[.xenia_97]
en = "Very perceptive, adventurer."
pt = "Muito perspicaz, aventureiro."

[.xenia_98]
en = "I was wounded, but not as badly as I looked. I took the opportunity to see how you would fare."
pt = "Eu estava ferida, mas não tanto quanto parecia. Aproveitei a chance para ver como você se sairia."

[.xenia_99]
en = "Reese managed to complete the ritual with his own death. He's opened the staircase to the nest of undead creatures in the lower level of the catacombs, which is swarming with undead."
pt = "Reese conseguiu completar o ritual com a própria morte. Ele abriu a escada para o ninho de criaturas no nível inferior das catacumbas, que está infestado de mortos-vivos."

[.xenia_100]
en = "Without a necromancer to control them, the creatures won't leave the tomb. I'll warn Father Aereck not to let people go down there."
pt = "Sem um necromante para controlá-las, as criaturas não vão sair da tumba. Vou avisar o Father Aereck para não deixar ninguém descer lá."

[.xenia_101]
en = "You're an adventurer, though. If you want to, you can venture into the tomb and fight the creatures."
pt = "Mas você é aventureiro. Se quiser, pode se aventurar na tumba e lutar contra as criaturas."

[.xenia_102]
en = "I was prepared to step in and rescue her if you failed, but I won't always be that ready. That's why I had to do this. The world needs heroes. I was a hero, once, but I'm not getting any younger. I need to make sure the new generation has its own heroes."
pt = "Eu estava pronta para intervir e salvá-la se você falhasse, mas nem sempre vou estar tão preparada. Por isso eu tinha que fazer isso. O mundo precisa de heróis. Já fui uma heroína, mas não estou ficando mais jovem. Preciso garantir que a nova geração tenha seus próprios heróis."

[.xenia_103]
en = "Speak to me again when you have some free inventory space."
pt = "Fale comigo de novo quando tiver espaço livre no inventário."

[.xenia_104]
en = "You've found some of Dragith Nurn's statuettes!"
pt = "Você encontrou algumas estatuetas (statuettes) de Dragith Nurn!"

[.xenia_105]
en = "%1%, would you sell the statuettes to me? There are several statuettes down there, and I'll pay you for any you can find."
pt = "%1%, você me venderia as estatuetas? Há várias estatuetas lá embaixo, e eu pago por qualquer uma que você encontrar."

[.xenia_106]
en = "I'll sell you the statuettes."
pt = "Vendo as estatuetas para você."

[.xenia_107]
en = "Why do you want the statuettes?"
pt = "Por que você quer as estatuetas?"

[.xenia_108]
en = "I want to talk about something else."
pt = "Quero falar sobre outra coisa."

[.xenia_109]
en = "They don't have magical power or anything like that. It's just...you'll probably think this is silly."
pt = "Elas não têm poder mágico nem nada disso. É só que...você provavelmente vai achar bobagem."

[.xenia_110]
en = "Meeting Dragith Nurn, all those years ago, was my first real adventure. That was when I changed from a curious kid to an adventurer."
pt = "Conhecer Dragith Nurn, tantos anos atrás, foi minha primeira aventura de verdade. Foi quando deixei de ser uma criança curiosa e virei aventureira."

[.xenia_111]
en = "I'd just like to have something to remember it. I've got souvenirs of a lot of my later adventures, but I never got a souvenir from the very first. Those statuettes would be perfect."
pt = "Eu só queria ter algo para me lembrar disso. Tenho lembranças de muitas das minhas aventuras posteriores, mas nunca guardei uma da primeira. Essas estatuetas seriam perfeitas."

[.xenia_112]
en = "Thank you, adventurer."
pt = "Obrigada, aventureiro."

# Cook - Lumbridge - Tutorial Island

[.cook_1]
en = "What am I to do?"
pt = "O que eu vou fazer?"

[.cook_2]
en = "What's wrong?"
pt = "Qual é o problema?"

[.cook_3]
en = "Can you make me a cake?"
pt = "Você pode fazer um bolo para mim?"

[.cook_4]
en = "*sniff* Don't talk to me about cakes..."
pt = "*snif* Nem me fale de bolos..."

[.cook_5]
en = "You don't look very happy."
pt = "Você não parece muito feliz."

[.cook_6]
en = "Nice hat!"
pt = "Belo chapéu!"

[.cook_7]
en = "How are you getting on with finding the ingredients?"
pt = "Como vai a busca pelos ingredientes?"

[.cook_8]
en = "You give the top-quality milk to the cook."
pt = "Você entrega o leite de primeira (top-quality milk) ao cozinheiro."

[.cook_9]
en = "Here's some top-quality milk."
pt = "Aqui está o leite de primeira."

[.cook_10]
en = "You give the extra fine flour to the cook."
pt = "Você entrega a farinha extrafina (extra fine flour) ao cozinheiro."

[.cook_11]
en = "Here's the extra fine flour."
pt = "Aqui está a farinha extrafina."

[.cook_12]
en = "You give the super large egg to the cook."
pt = "Você entrega o ovo extragrande (super large egg) ao cozinheiro."

[.cook_13]
en = "Here's a super large egg."
pt = "Aqui está um ovo extragrande."

[.cook_14]
en = "I've this egg."
pt = "Tenho este ovo."

[.cook_15]
en = "No, I need a super large egg. You'll probably find one near the local chickens."
pt = "Não, eu preciso de um ovo extragrande (super large egg). Você deve achar um perto das galinhas daqui."

[.cook_16]
en = "I've this flour."
pt = "Tenho esta farinha."

[.cook_17]
en = "That's not fine enough. I imagine if you speak with Millie at the mill to the north she'll help you out."
pt = "Não está fina o bastante. Acho que se você falar com a Millie, no moinho ao norte, ela vai te ajudar."

[.cook_18]
en = "I've this milk."
pt = "Tenho este leite."

[.cook_19]
en = "Not bad, but not good enough. There's a milk maid that looks after the cows to the north-east. She might have some advice."
pt = "Nada mal, mas não serve. Tem uma leiteira que cuida das vacas a nordeste. Talvez ela tenha algum conselho."

[.cook_20]
en = "You've brought me everything I need! I am saved! Thank you!"
pt = "Você me trouxe tudo o que eu precisava! Estou salvo! Obrigado!"

[.cook_21]
en = "So, do I get to go to the Duke's party?"
pt = "E então, eu vou poder ir à festa do Duke?"

[.cook_22]
en = "I'm afraid not. Only the big cheeses get to dine with the Duke."
pt = "Receio que não. Só a nata da nobreza janta com o Duke."

[.cook_23]
en = "Well, maybe one day, I'll be important enough to sit at the Duke's table."
pt = "Bem, quem sabe um dia eu seja importante o bastante para sentar à mesa do Duke."

[.cook_24]
en = "Maybe, but I won't be holding my breath."
pt = "Talvez, mas não vou ficar esperando sentado."

[.cook_25]
en = "Ah, I have some rewards for you but your inventory seems to be full."
pt = "Ah, tenho umas recompensas para você, mas o seu inventário parece estar cheio."

[.cook_26]
en = "Thanks for the ingredients you have got so far. Please get the rest quickly. I'm running out of time! The Duke will throw me out onto the street!"
pt = "Obrigado pelos ingredientes que você trouxe até agora. Por favor, consiga o resto depressa. Meu tempo está acabando! O Duke vai me jogar na rua!"

[.cook_27]
en = "I haven't got any of them yet, I'm still looking."
pt = "Ainda não consegui nenhum, ainda estou procurando."

[.cook_28]
en = "Please get the ingredients quickly. I'm running out of time! The Duke will throw me out onto the street!"
pt = "Por favor, consiga os ingredientes depressa. Meu tempo está acabando! O Duke vai me jogar na rua!"

[.cook_29]
en = "Hello, friend, how is the adventuring going?"
pt = "Olá, amigo, como vão as aventuras?"

[.cook_30]
en = "I'm getting strong and mighty."
pt = "Estou ficando forte e poderoso."

[.cook_31]
en = "I'm getting strong and mighty. Grr."
pt = "Estou ficando forte e poderoso. Grr."

[.cook_32]
en = "Glad to hear it."
pt = "Fico feliz em saber."

[.cook_33]
en = "I keep on dying."
pt = "Eu vivo morrendo."

[.cook_34]
en = "Ah, well, at least you keep coming back to life too!"
pt = "Ah, bem, pelo menos você também vive voltando à vida!"

[.cook_35]
en = "Can I use your range?"
pt = "Posso usar o seu fogão (range)?"

[.cook_36]
en = "Oh dear, oh dear, oh dear, I'm in a terrible terrible mess! It's the Duke's birthday today, and I should be making him a lovely big birthday cake using special ingredients..."
pt = "Ai, ai, ai, estou numa enrascada terrível, terrível! Hoje é o aniversário do Duke, e eu devia fazer para ele um lindo bolo de aniversário com ingredientes especiais..."

[.cook_37]
en = "...but I've forgotten to get the ingredients. I'll never get them in time now. He'll sack me! What will I do? I have four children and a goat to look after. Would you help me? Please?"
pt = "...mas eu me esqueci de buscar os ingredientes. Agora não vou conseguir a tempo. Ele vai me demitir! O que eu faço? Tenho quatro filhos e uma cabra para cuidar. Você me ajuda? Por favor?"

[.cook_38]
en = "Start the Cook's Assistant quest?"
pt = "Começar a missão Cook's Assistant?"

[.cook_39]
en = "I'm always happy to help a cook in distress."
pt = "É sempre um prazer ajudar um cozinheiro em apuros."

[.cook_40]
en = "Oh thank you, thank you. I must tell you that this is no ordinary cake, though - only the best ingredients will do! I need a super large egg, top-quality milk and some extra fine flour."
pt = "Ah, obrigado, obrigado. Mas preciso avisar que este não é um bolo comum - só os melhores ingredientes servem! Preciso de um ovo extragrande (super large egg), leite de primeira (top-quality milk) e farinha extrafina (extra fine flour)."

[.cook_41]
en = "Where can I find those, then?"
pt = "E onde eu encontro isso?"

[.cook_42]
en = "No, I don't feel like it. Maybe later."
pt = "Não, não estou a fim. Quem sabe depois."

[.cook_43]
en = "Fine. I always knew you Adventurer types were callous beasts. Go on your merry way!"
pt = "Tudo bem. Sempre soube que vocês, aventureiros, eram umas feras sem coração. Pode seguir seu caminho todo feliz!"

[.cook_44]
en = "That's the problem: I don't exactly know. I usually send my assistant to get them for me but he quit."
pt = "Esse é o problema: eu não sei direito. Normalmente mando meu assistente buscar, mas ele se demitiu."

[.cook_45]
en = "I've marked some places on your world map in red. You might want to consider investigating them."
pt = "Marquei alguns lugares em vermelho no seu mapa-múndi (world map). Talvez valha a pena investigá-los."

[.cook_46]
en = "You still need to get: %1%%2%%3%"
pt = "Você ainda precisa conseguir: %1%%2%%3%"

[.cook_47]
en = "I'll get right on it."
pt = "Vou cuidar disso agora mesmo."

[.cook_48]
en = "Where can I find the ingredients?"
pt = "Onde encontro os ingredientes?"

[.cook_49]
en = "Err thank you. It's a pretty ordinary cooks hat really."
pt = "Hã, obrigado. Na verdade é um chapéu de cozinheiro bem comum."

[.cook_50]
en = "Still, suits you. The trousers are pretty special too. "
pt = "Mesmo assim, combina com você. As calças também são bem especiais."

[.cook_51]
en = "Its all standard cook's issue uniform..."
pt = "É tudo o uniforme padrão de cozinheiro..."

[.cook_52]
en = "The whole hat, apron, stripey trousers ensemble - it works. It make you looks like a real cook."
pt = "O conjunto todo, chapéu, avental e calças listradas - funciona. Faz você parecer um cozinheiro de verdade."

[.cook_53]
en = "I am a real cook! I haven't got time to be chatting about Culinary Fashion. I am in desperate need of help!"
pt = "Eu SOU um cozinheiro de verdade! Não tenho tempo para papear sobre Moda Culinária. Preciso de ajuda desesperadamente!"

[.cook_54]
en = "Go ahead! It's very good range; it's better than most other ranges."
pt = "Fique à vontade! É um ótimo fogão; é melhor que a maioria dos outros fogões."

[.cook_55]
en = "It's called the Cook-o-Matic 25 and it uses a combination of state-of-the-art temperature regulation and magic."
pt = "Ele se chama Cook-o-Matic 25 e usa uma combinação de regulagem de temperatura de última geração e magia."

[.cook_56]
en = "Will it mean my food will burn less often?"
pt = "Isso quer dizer que minha comida vai queimar menos?"

[.cook_57]
en = "As long as the food is fairly easy to cook in the first place!"
pt = "Desde que a comida já seja razoavelmente fácil de cozinhar!"

[.cook_58]
en = "The manual you have in your inventory should tell you more."
pt = "O manual que está no seu inventário deve explicar melhor."

[.cook_59]
en = "I'd give you the manual, but you don't have room to take it. Ask me again when you have some space."
pt = "Eu te daria o manual, mas você não tem espaço para pegá-lo. Fale comigo de novo quando tiver espaço."

[.cook_60]
en = "Here, take this manual. It should tell you everything you need to know about this range."
pt = "Tome, pegue este manual. Ele deve explicar tudo o que você precisa saber sobre este fogão."

[.cook_61]
en = "The cook hands you a manual."
pt = "O cozinheiro te entrega um manual."

[.cook_62]
en = "Thanks!"
pt = "Obrigado!"

[.cook_63]
en = "No, I'm not. The world is caving in around me - I am overcome by dark feelings of impending doom."
pt = "Não, não estou. O mundo está desabando ao meu redor - sinto um terrível pressentimento de desgraça iminente."

[.cook_64]
en = "I'd take the rest of the day off if I were you."
pt = "Se eu fosse você, tirava o resto do dia de folga."

[.cook_65]
en = "No, that's the worst thing I could do. I'd get in terrible trouble."
pt = "Não, é a pior coisa que eu poderia fazer. Eu me meteria numa encrenca terrível."

[.cook_66]
en = "Well maybe you need to take a holiday..."
pt = "Bom, talvez você precise tirar férias..."

[.cook_67]
en = "That would be nice, but the Duke doesn't allow holidays for core staff."
pt = "Seria ótimo, mas o Duke não dá férias para a equipe essencial."

[.cook_68]
en = "Hmm, why not run away to the sea and start a new life as a Pirate?"
pt = "Hmm, por que não foge para o mar e começa uma vida nova como Pirata?"

[.cook_69]
en = "My wife gets sea sick, and I have an irrational fear of eyepatches. I don't see it working myself."
pt = "Minha esposa enjoa no mar, e eu tenho um medo irracional de tapa-olhos. Não vejo isso dando certo."

[.cook_70]
en = "I'm afraid I've run out of ideas."
pt = "Receio que minhas ideias acabaram."

[.cook_71]
en = "I know I'm doomed."
pt = "Eu sei que estou condenado."

# DukeHoracio - Lumbridge - Tutorial Island

[.dukehoracio_1]
en = "Greetings. Welcome to my castle."
pt = "Saudações. Bem-vindo ao meu castelo."

[.dukehoracio_2]
en = "What did you want me to do again?"
pt = "O que você queria que eu fizesse mesmo?"

[.dukehoracio_3]
en = "Take that talisman I gave you to Sedridor at the Wizards' Tower. You'll find it south west of here, across the bridge from Draynor Village."
pt = "Leve aquele talismã (talisman) que te dei para Sedridor, na Wizards' Tower. Ela fica a sudoeste daqui, depois da ponte, saindo de Draynor Village."

[.dukehoracio_4]
en = "Okay, will do."
pt = "Certo, pode deixar."

[.dukehoracio_5]
en = "Did you take that talisman to Sedridor?"
pt = "Você levou aquele talismã (talisman) para Sedridor?"

[.dukehoracio_6]
en = "No, I lost it."
pt = "Não, eu o perdi."

[.dukehoracio_7]
en = "Ah, well that explains things. One of my servants found it outside, and it seemed too much of a coincidence that another would suddenly show up."
pt = "Ah, isso explica as coisas. Um dos meus criados o achou lá fora, e parecia coincidência demais outro aparecer de repente."

[.dukehoracio_8]
en = "The Duke tries to hand you the talisman, but you don't have enough room to take it."
pt = "O duque tenta te entregar o talismã, mas você não tem espaço para pegá-lo."

[.dukehoracio_9]
en = "Here, take it to the Wizards' Tower, south west of here. Please try not to lose it this time."
pt = "Tome, leve-o à Wizards' Tower, a sudoeste daqui. Por favor, tente não perdê-lo desta vez."

[.dukehoracio_10]
en = "The Duke hands you the talisman."
pt = "O duque te entrega o talismã."

[.dukehoracio_11]
en = "Have you any quests for me?"
pt = "Tem alguma missão (quest) para mim?"

[.dukehoracio_12]
en = "Well, I wouldn't describe it as a quest, but there is something I could use some help with."
pt = "Bem, eu não chamaria de missão, mas há algo em que uma ajuda viria a calhar."

[.dukehoracio_13]
en = "What is it?"
pt = "O que é?"

[.dukehoracio_14]
en = "We were recently sorting through some of the things stored down in the cellar, and we found this old talisman."
pt = "Há pouco estávamos organizando algumas coisas guardadas no porão e encontramos este talismã (talisman) antigo."

[.dukehoracio_15]
en = "The Duke shows you a talisman."
pt = "O duque te mostra um talismã."

[.dukehoracio_16]
en = "The Order of Wizards over at the Wizards' Tower have been on the hunt for magical artefacts recently. I wonder if this might be just the kind of thing they're after."
pt = "A Ordem dos Magos, lá na Wizards' Tower, anda à caça de artefatos mágicos ultimamente. Será que isto não é bem o tipo de coisa que eles procuram?"

[.dukehoracio_17]
en = "Would you be willing to take it to them for me?"
pt = "Você estaria disposto a levá-lo até eles para mim?"

[.dukehoracio_18]
en = "The only job I had was the delivery of that talisman, so I'm afraid not."
pt = "O único trabalho que eu tinha era a entrega daquele talismã, então receio que não."

[.dukehoracio_19]
en = "Where can I find money?"
pt = "Onde posso arranjar dinheiro?"

[.dukehoracio_20]
en = "I've heard that the blacksmiths are prosperous amongst the peasantry. Maybe you could try your hand at that?"
pt = "Ouvi dizer que os ferreiros prosperam entre a plebe. Talvez você possa tentar a sorte nisso?"

[.dukehoracio_21]
en = "Start the Rune Mysteries quest?"
pt = "Começar a quest Rune Mysteries?"

[.dukehoracio_22]
en = "Sure, no problem."
pt = "Claro, sem problemas."

[.dukehoracio_23]
en = "Thank you very much. You'll find the Wizards' Tower south west of here, across the bridge from Draynor Village. When you arrive, look for Sedridor. He is the Archmage of the wizards there."
pt = "Muito obrigado. A Wizards' Tower fica a sudoeste daqui, depois da ponte, saindo de Draynor Village. Quando chegar, procure Sedridor. Ele é o Arquimago dos magos de lá."

[.dukehoracio_24]
en = "As you wish. Hopefully I can find someone else to help."
pt = "Como quiser. Espero encontrar outra pessoa que ajude."

# Hans - Lumbridge - Tutorial Island

[.hans_1]
en = "Hello. What are you doing here?"
pt = "Olá. O que você está fazendo aqui?"

[.hans_2]
en = "I'm looking for whoever is in charge of this place."
pt = "Estou procurando quem manda neste lugar."

[.hans_3]
en = "Who, the Duke? He's in his study, on the first floor."
pt = "Quem, o Duke? Ele está no escritório dele, no primeiro andar."

[.hans_4]
en = "I have come to kill everyone in this castle!"
pt = "Vim matar todo mundo neste castelo!"

[.hans_5]
en = "I don't know. I'm lost. Where am I?"
pt = "Não sei. Estou perdido. Onde estou?"

[.hans_6]
en = "You are in Lumbridge Castle."
pt = "Você está no Lumbridge Castle."

# LumbridgeGuardsman - Lumbridge - Tutorial Island

[.lumbridgeguardsman_1]
en = "Well met, adventurer."
pt = "Bom te ver, aventureiro."

[.lumbridgeguardsman_2]
en = "Well, hello there."
pt = "Ora, olá."

[.lumbridgeguardsman_3]
en = "Good day to you, adventurer."
pt = "Bom dia para você, aventureiro."

[.lumbridgeguardsman_4]
en = "Bye."
pt = "Tchau."

[.lumbridgeguardsman_5]
en = "Tell me about the Lumbridge Guardsmen."
pt = "Me fale sobre os Lumbridge Guardsmen."

[.lumbridgeguardsman_6]
en = "I won't pretend that we're an elite fighting force, but we know how to work with the castle's defences. That means just a few of us can hold a fairly strong defence, if we ever need to."
pt = "Não vou fingir que somos uma força de elite, mas sabemos usar as defesas do castelo. Assim, bastam poucos de nós para manter uma defesa bem forte, se um dia for preciso."

[.lumbridgeguardsman_7]
en = "I spoke to a few people who asked me about joining the Lumbridge Guardsmen. To be asked, you need to be a true local. I mean, when the call to arms is raised, you don't want your troops to be scattered across the world: they need to be waiting here, ready to spring in to action."
pt = "Falei com algumas pessoas que me perguntaram sobre entrar para os Lumbridge Guardsmen. Para ser convidado, você precisa ser um verdadeiro morador local. Quer dizer, quando soa o chamado às armas, você não quer suas tropas espalhadas pelo mundo: elas precisam estar esperando aqui, prontas para entrar em ação."

[.lumbridgeguardsman_8]
en = "What is there to do around here?"
pt = "O que há para fazer por aqui?"

[.lumbridgeguardsman_9]
en = "If you're interested in learning to make leather armour, there's the cow field to get hides. Then, you can take your the hides to a tanner."
pt = "Se você quer aprender a fazer armadura de couro (leather armour), tem o pasto das vacas para conseguir couros (hides). Depois, pode levar os couros a um curtidor (tanner)."

[.lumbridgeguardsman_10]
en = "If you'd like to make a bit of spending money, try speaking to the skill tutors. They go through a lot of supplies, so I'm sure they'd be happy to pay you to make the supplies they need."
pt = "Se quiser ganhar um dinheirinho, tente falar com os tutores de habilidades. Eles gastam muitos suprimentos, então com certeza pagariam para você fazer o que eles precisam."

[.lumbridgeguardsman_11]
en = "Tell me about Lumbridge."
pt = "Me fale sobre Lumbridge."

[.lumbridgeguardsman_12]
en = "It used to be much nicer here, before the goblins overran the east side of town. You'd think that the Guardsmen would be sent to flush them out, but for every one we slay, three more appear in its place."
pt = "Isto aqui era muito mais agradável antes de os goblins tomarem o lado leste da cidade. Era de se esperar que mandassem os Guardsmen expulsá-los, mas para cada um que matamos, aparecem mais três no lugar."

[.lumbridgeguardsman_13]
en = "If I'm honest, I don't much care for it here. I understand why so many do enjoy the lifestyle, but I long for the city life. If I do well in my job here, perhaps I could move to Varrock, or Falador, and join the guards there."
pt = "Para ser sincero, não gosto muito daqui. Entendo por que tanta gente aprecia esse estilo de vida, mas sinto falta da vida na cidade grande. Se eu me sair bem aqui, talvez possa me mudar para Varrock ou Falador e entrar para a guarda de lá."

[.lumbridgeguardsman_14]
en = "I suppose it's a good place to find your feet in the world. There's reasonable fishing in the river, and with lots of farmland around it's rare that you go hungry. Yes, there's plenty worse places you could live in than Lumbridge."
pt = "Acho que é um bom lugar para se firmar no mundo. A pesca no rio é razoável, e com tanta terra cultivada por perto é raro passar fome. É, há lugares bem piores para se viver do que Lumbridge."

[.lumbridgeguardsman_15]
en = "What exactly are you guarding?"
pt = "O que exatamente você está guardando?"

[.lumbridgeguardsman_16]
en = "Peace, happiness, tranquillity, that sort of thing. So, let me know if you see anything upsetting. Dragons in cellars, goblins under beds, that sort of thing."
pt = "Paz, felicidade, tranquilidade, esse tipo de coisa. Então, me avise se vir algo perturbador. Dragões no porão, goblins debaixo da cama, esse tipo de coisa."

[.lumbridgeguardsman_17]
en = "I suppose I'm guarding the castle, and the Lumbridge way of life. Although, there was once a dragon near here, and I helped defend the castle from it. That was an exciting time!"
pt = "Acho que estou guardando o castelo e o modo de vida de Lumbridge. Se bem que uma vez houve um dragão aqui perto, e eu ajudei a defender o castelo dele. Foi uma época emocionante!"

# FatherAereck - Lumbridge - Tutorial Island

[.fatheraereck_1]
en = "Welcome to the church of holy Saradomin."
pt = "Bem-vindo à igreja do sagrado Saradomin."

[.fatheraereck_2]
en = "I'm looking for a quest."
pt = "Estou procurando uma missão (quest)."

[.fatheraereck_3]
en = "That's lucky, I need someone to do a quest for me."
pt = "Que sorte, preciso de alguém para fazer uma missão para mim."

[.fatheraereck_4]
en = "Okay, let me help then."
pt = "Certo, então deixe-me ajudar."

[.fatheraereck_5]
en = "Thank you. The problem is, there is a ghost in the church graveyard. I would like you to get rid of it."
pt = "Obrigado. O problema é que há um fantasma no cemitério da igreja. Gostaria que você se livrasse dele."

[.fatheraereck_6]
en = "If you need any help, my friend Father Urhney is an expert on ghosts."
pt = "Se precisar de ajuda, meu amigo Father Urhney é especialista em fantasmas."

[.fatheraereck_7]
en = "I believe he is currently living as a hermit in Lumbridge swamp. He has a little shack in the far west of the swamps."
pt = "Acredito que ele esteja vivendo como eremita no pântano de Lumbridge. Ele tem um casebre no extremo oeste do pântano."

[.fatheraereck_8]
en = "Exit the graveyard through the south gate to reach the swamp. I'm sure if you told him that I sent you he'd be willing to help."
pt = "Saia do cemitério pelo portão sul para chegar ao pântano. Tenho certeza de que, se disser que fui eu que mandei, ele vai querer ajudar."

[.fatheraereck_9]
en = "My name is Father Aereck by the way. Pleased to meet you."
pt = "Aliás, meu nome é Father Aereck. Muito prazer."

[.fatheraereck_10]
en = "Likewise."
pt = "O prazer é meu."

[.fatheraereck_11]
en = "Take care travelling through the swamps, I have heard they can be quite dangerous."
pt = "Tome cuidado ao atravessar o pântano, ouvi dizer que pode ser bem perigoso."

[.fatheraereck_12]
en = "I will, thanks."
pt = "Vou tomar, obrigado."

[.fatheraereck_13]
en = "Actually, I don't have time right now."
pt = "Na verdade, não tenho tempo agora."

[.fatheraereck_14]
en = "Oh well. If you do have some spare time on your hands, come back and talk to me."
pt = "Que pena. Se tiver algum tempo livre, volte e fale comigo."

[.fatheraereck_15]
en = "The Wise Old Man of Draynor Village said you might reward me if I brought you this."
pt = "O Wise Old Man de Draynor Village disse que você talvez me recompensasse se eu trouxesse isto."

[.fatheraereck_16]
en = "Oh, did he?"
pt = "Ah, ele disse, é?"

[.fatheraereck_17]
en = "Faether Aereck gives you some runes."
pt = "Father Aereck te dá algumas runas (runes)."

[.fatheraereck_18]
en = "Well, maybe you'll have a use for these?"
pt = "Bem, quem sabe estas te sejam úteis?"

[.fatheraereck_19]
en = "Faether Aereck gives you some herbs."
pt = "Father Aereck te dá algumas ervas (herbs)."

[.fatheraereck_20]
en = "Faether Aereck gives you some seeds."
pt = "Father Aereck te dá algumas sementes (seeds)."

[.fatheraereck_21]
en = "Well, maybe you'll find a use for these seeds?"
pt = "Bem, quem sabe você encontre uso para estas sementes?"

[.fatheraereck_22]
en = "Well, it's still nice of you to bring the message here. Here, I shall bless you..."
pt = "Bem, ainda assim foi gentil trazer a mensagem até aqui. Venha, vou te abençoar..."

[.fatheraereck_23]
en = "Faether Aereck gives you some coins."
pt = "Father Aereck te dá algumas moedas (coins)."

[.fatheraereck_24]
en = "I suppose gems are always acceptable rewards!"
pt = "Acho que gemas são sempre uma recompensa aceitável!"

[.fatheraereck_25]
en = "Have you got rid of the ghost yet?"
pt = "Você já se livrou do fantasma?"

[.fatheraereck_26]
en = "I can't find Father Urhney at the moment."
pt = "Não estou conseguindo encontrar o Father Urhney."

[.fatheraereck_27]
en = "Well, you can get to the swamp he lives in by going south through the cemetery."
pt = "Bem, você chega ao pântano onde ele vive indo para o sul pelo cemitério."

[.fatheraereck_28]
en = "You'll have to go right into the far western depths of the swamp, near the coastline. That is where his house is."
pt = "Você vai ter que entrar bem fundo no extremo oeste do pântano, perto do litoral. É lá que fica a casa dele."

[.fatheraereck_29]
en = "I had a talk with Father Urhney. He has given me this funny amulet to talk to the ghost with."
pt = "Conversei com o Father Urhney. Ele me deu este amuleto engraçado para falar com o fantasma."

[.fatheraereck_30]
en = "I always wondered what that amulet was... Well, I hope it's useful. Tell me when you get rid of the ghost!"
pt = "Sempre me perguntei o que era aquele amuleto... Bem, espero que seja útil. Me avise quando se livrar do fantasma!"

[.fatheraereck_31]
en = "I've found out that the ghost's corpse has lost its skull. If I can find the skull, the ghost should leave."
pt = "Descobri que o cadáver do fantasma perdeu o crânio. Se eu achar o crânio, o fantasma deve ir embora."

[.fatheraereck_32]
en = "That WOULD explain it."
pt = "Isso EXPLICARIA tudo."

[.fatheraereck_33]
en = "Hmmmmm. Well, I haven't seen any skulls."
pt = "Hmmmmm. Bem, não vi nenhum crânio por aí."

[.fatheraereck_34]
en = "Yes, I think a warlock has stolen it."
pt = "Pois é, acho que um bruxo o roubou."

[.fatheraereck_35]
en = "I hate warlocks."
pt = "Odeio bruxos."

[.fatheraereck_36]
en = "Ah well, good luck!"
pt = "Bem, boa sorte!"

[.fatheraereck_37]
en = "I've finally found the ghost's skull!"
pt = "Finalmente encontrei o crânio do fantasma!"

[.fatheraereck_38]
en = "Great! Put it in the ghost's coffin and see what happens!"
pt = "Ótimo! Coloque-o no caixão do fantasma e veja o que acontece!"

[.fatheraereck_39]
en = "Well, I found the ghost's skull but then lost it."
pt = "Bem, eu encontrei o crânio do fantasma, mas depois perdi."

[.fatheraereck_40]
en = "Don't worry, I'm sure you'll find it again."
pt = "Não se preocupe, tenho certeza de que você vai encontrá-lo de novo."

[.fatheraereck_41]
en = "Thank you for getting rid of that awful ghost for me! May Saradomin always smile upon you!"
pt = "Obrigado por me livrar daquele fantasma horrível! Que Saradomin sempre sorria para você!"

[.fatheraereck_42]
en = "Can you change my gravestone now?"
pt = "Pode trocar a minha lápide agora?"

[.fatheraereck_43]
en = "Certainly! All proceeds will be donated to the Varrockian Guards' Widows & Orphans Fund."
pt = "Claro! Toda a renda será doada ao Fundo das Viúvas e Órfãos dos Guardas de Varrock."

[.fatheraereck_44]
en = "I'm looking for a new quest."
pt = "Estou procurando uma nova missão."

[.fatheraereck_45]
en = "Sorry, I only had the one quest."
pt = "Desculpe, eu só tinha aquela missão."

[.fatheraereck_46]
en = "Can you bless my ring?"
pt = "Pode abençoar o meu anel?"

[.fatheraereck_47]
en = "Ah, you wish to show your devotion to Saradomin by dedicating a ring to him? Very well, it would be my pleasure to assist."
pt = "Ah, deseja mostrar sua devoção a Saradomin dedicando um anel a ele? Muito bem, será um prazer ajudar."

[.fatheraereck_48]
en = "Father Aereck inscribes the symbol of Saradomin on your ring's signet face, and offers a brief benediction over it."
pt = "Father Aereck grava o símbolo de Saradomin no sinete do seu anel e faz uma breve bênção sobre ele."

[.fatheraereck_49]
en = "Who's Saradomin?"
pt = "Quem é Saradomin?"

[.fatheraereck_50]
en = "Surely you have heard of the god, Saradomin?"
pt = "Certamente você já ouviu falar do deus Saradomin, não?"

[.fatheraereck_51]
en = "He who creates the forces of goodness and purity in this world? I cannot believe your ignorance!"
pt = "Aquele que cria as forças da bondade e da pureza neste mundo? Não acredito na sua ignorância!"

[.fatheraereck_52]
en = "This is the god with more followers than any other! ...At least in this part of the world."
pt = "É o deus com mais seguidores que qualquer outro! ...Pelo menos nesta parte do mundo."

[.fatheraereck_53]
en = "He who created this world along with his brothers Guthix and Zamorak?"
pt = "Aquele que criou este mundo junto com seus irmãos Guthix e Zamorak?"

[.fatheraereck_54]
en = "Oh, THAT Saradomin..."
pt = "Ah, ESSE Saradomin..."

[.fatheraereck_55]
en = "There... is only one Saradomin..."
pt = "Só... existe um Saradomin..."

[.fatheraereck_56]
en = "Yeah... I, uh, thought you said something else."
pt = "É... eu, hã, achei que você tinha dito outra coisa."

[.fatheraereck_57]
en = "Oh, sorry. I'm not from this world."
pt = "Ah, desculpe. Eu não sou deste mundo."

[.fatheraereck_58]
en = "That's... strange."
pt = "Que... estranho."

[.fatheraereck_59]
en = "I thought things not from this world were all... You know. Slime and tentacles."
pt = "Eu achava que coisas de outro mundo eram todas... Sabe como é. Gosma e tentáculos."

[.fatheraereck_60]
en = "You don't understand. This is an online game!"
pt = "Você não entende. Isto é um jogo online!"

[.fatheraereck_61]
en = "I... beg your pardon?"
pt = "Como... é que é?"

[.fatheraereck_62]
en = "Never mind."
pt = "Deixa pra lá."

[.fatheraereck_63]
en = "I am - do you like my disguise?"
pt = "Sou - gostou do meu disfarce?"

[.fatheraereck_64]
en = "Aargh! Avaunt foul creature from another dimension! Avaunt! Begone in the name of Saradomin!"
pt = "Aargh! Para trás, criatura imunda de outra dimensão! Para trás! Suma, em nome de Saradomin!"

[.fatheraereck_65]
en = "Ok, ok, I was only joking..."
pt = "Tá bom, tá bom, eu só estava brincando..."

[.fatheraereck_66]
en = "Nice place you've got here."
pt = "Belo lugar você tem aqui."

[.fatheraereck_67]
en = "It is, isn't it? It was built over 230 years ago."
pt = "É mesmo, não é? Foi construída há mais de 230 anos."

# MagicTutor - Lumbridge - Tutorial Island

[.magictutor_1]
en = "Hello there adventurer, I am the Magic combat tutor. Would you like to learn about magic combat, or perhaps how to make runes?"
pt = "Olá, aventureiro, sou o tutor de combate com Magic (magia). Quer aprender sobre combate mágico, ou talvez como fazer runas (runes)?"

[.magictutor_2]
en = "Tell me about magic combat please."
pt = "Me fale sobre combate mágico, por favor."

[.magictutor_3]
en = "Of course %1%! As a rule of thumb, if you cast the highest spell of which you're capable, you'll get the best experience possible."
pt = "Claro, %1%! Via de regra, se lançar o feitiço mais alto que conseguir, você ganha a melhor experiência possível."

[.magictutor_4]
en = "Wearing metal armour and ranged armour can seriously impair your magical abilities. Make sure you wear some robes to maximise your capabilities."
pt = "Usar armadura de metal ou de arqueiro pode prejudicar muito suas habilidades mágicas. Use mantos (robes) para aproveitar ao máximo sua capacidade."

[.magictutor_5]
en = "Superheat Item and the Alchemy spells are good ways to level magic if you are not interested in the combat aspect of magic."
pt = "Superheat Item e os feitiços de Alchemy são bons jeitos de subir Magic se você não liga para o lado de combate da magia."

[.magictutor_6]
en = "There's always the Magic Training Arena. You can find it north of the Duel Arena in Al Kharid. You will be able to earn some special rewards there by practicing your magic there."
pt = "Sempre tem a Magic Training Arena. Fica ao norte da Duel Arena em Al Kharid. Praticando sua magia lá, você pode ganhar algumas recompensas especiais."

[.magictutor_7]
en = "I see you already have access to the ancient magicks. Well done, these will aid you greatly."
pt = "Vejo que você já tem acesso às magias antigas (ancient magicks). Muito bem, elas vão te ajudar bastante."

[.magictutor_8]
en = "Is there anything else you would like to know?"
pt = "Há mais alguma coisa que você gostaria de saber?"

[.magictutor_9]
en = "How do I make runes?"
pt = "Como eu faço runas?"

[.magictutor_10]
en = "There are a couple of things you will need to make runes, rune essence and a talisman to enter the temple ruins."
pt = "Você vai precisar de duas coisas para fazer runas: rune essence (essência de runa) e um talismã (talisman) para entrar nas ruínas do templo."

[.magictutor_11]
en = "To get rune essence you will need to gather them in the essence mine. You can get to the mine by talking to Aubury who owns the runes shop in south east Varrock."
pt = "Para conseguir rune essence, você precisa coletá-la na mina de essência. Chega-se à mina falando com o Aubury, dono da loja de runas no sudeste de Varrock."

[.magictutor_12]
en = "I see you have some experience already in Runecrafting. Perhaps you should try crafting some runes which you can then use in magic."
pt = "Vejo que você já tem alguma experiência em Runecrafting (criação de runas). Que tal criar algumas runas para usar em magia?"

[.magictutor_13]
en = "Check the skill guide to see which runes you can craft."
pt = "Veja o guia da habilidade (skill guide) para saber que runas você pode criar."

[.magictutor_14]
en = "To get rune essence you will need to gather them somehow. You should talk to the Duke of Lumbridge, he may be able to help you with that. Alternatively, other players may sell you the essence."
pt = "Para conseguir rune essence, você precisa coletá-la de algum jeito. Fale com o Duke of Lumbridge, ele pode te ajudar com isso. Ou então outros jogadores podem te vender a essência."

[.magictutor_15]
en = "As you're fairly new to runecrafting you should start with air runes and mind runes."
pt = "Como você é bem novo em Runecrafting (criação de runas), deve começar com air runes (runas de ar) e mind runes (runas da mente)."

[.magictutor_16]
en = "You will need a talisman for the rune you would like to create. You can right-click on it and select the Locate option. This will tell you the rough location of the altar."
pt = "Você vai precisar de um talismã da runa que quer criar. Clique nele com o botão direito e escolha 'Locate'. Isso mostra a localização aproximada do altar."

[.magictutor_17]
en = "When you find the ruined altar, use the talisman on it to be transported to a temple where you can craft your runes."
pt = "Quando achar o altar em ruínas, use o talismã nele para ser levado a um templo onde pode criar suas runas."

[.magictutor_18]
en = "Clicking on the temple's altar will imbue your rune essence with the altar's magical property."
pt = "Clicar no altar do templo imbui a sua rune essence com a propriedade mágica do altar."

[.magictutor_19]
en = "If you want to save yourself an inventory space, you could always try binding the talisman to a tiara."
pt = "Se quiser economizar um espaço no inventário, pode tentar unir o talismã a uma tiara (tiara)."

[.magictutor_20]
en = "To make one, take a tiara and talisman to the ruins and use the tiara on the temple altar. This will bind the talisman to your tiara."
pt = "Para fazer uma, leve uma tiara e o talismã até as ruínas e use a tiara no altar do templo. Isso une o talismã à sua tiara."

[.magictutor_21]
en = "I'd like some air and mind runes."
pt = "Eu queria algumas air runes e mind runes."

[.magictutor_22]
en = "I work with the Ranged Combat tutor to give out consumable items that you may need for combat such as arrows and runes. However we have had some cheeky people try to take both!"
pt = "Trabalho com o tutor de Ranged Combat distribuindo itens de consumo para combate, como flechas e runas. Mas teve gente espertinha tentando pegar os dois!"

[.magictutor_23]
en = "So, every half an hour, you may come back and claim either arrows OR runes, but not both. Come back in a while for runes, or simply make your own."
pt = "Então, a cada meia hora, você pode voltar e pegar flechas OU runas, mas não os dois. Volte daqui a pouco para pegar runas, ou faça as suas."

[.magictutor_24]
en = "If you had enough space in your inventory I'd give you some mind runes, come back when you do."
pt = "Se tivesse espaço no inventário, eu te daria algumas mind runes. Volte quando tiver."

[.magictutor_25]
en = "If you had enough space in your inventory I'd give you some air runes, come back when you do."
pt = "Se tivesse espaço no inventário, eu te daria algumas air runes. Volte quando tiver."

[.magictutor_26]
en = "Mikasi gives you 30 air runes."
pt = "Mikasi te dá 30 air runes (runas de ar)."

[.magictutor_27]
en = "Mikasi gives you 30 mind runes."
pt = "Mikasi te dá 30 mind runes (runas da mente)."

[.magictutor_28]
en = "You have some mind runes in your bank."
pt = "Você tem algumas mind runes no banco."

[.magictutor_29]
en = "You have some air runes in your bank."
pt = "Você tem algumas air runes no banco."

[.magictutor_30]
en = "You have some runes in your bank. Climb the stairs in Lumbridge Castle until you see this icon on your minimap. There you will find a bank."
pt = "Você tem runas no banco. Suba as escadas do Lumbridge Castle até ver este ícone no minimapa. Lá você encontra um banco."

[.magictutor_31]
en = "You already have some mind runes."
pt = "Você já tem algumas mind runes."

[.magictutor_32]
en = "You already have some air runes."
pt = "Você já tem algumas air runes."

# MeleeTutor - Lumbridge - Tutorial Island

[.meleetutor_1]
en = "Greetings adventurer, I am the Melee combat tutor. Is there anything I can do for you?"
pt = "Saudações, aventureiro, sou o tutor de combate Melee (corpo a corpo). Posso fazer algo por você?"

[.meleetutor_2]
en = "Tell me about melee combat."
pt = "Fale-me sobre o combate corpo a corpo."

[.meleetutor_3]
en = "Well adventurer, the first thing you will need is a sword and a shield appropriate for your level."
pt = "Bem, aventureiro, a primeira coisa de que você vai precisar é uma espada (sword) e um escudo (shield) adequados ao seu nível."

[.meleetutor_4]
en = "Make sure to equip your sword and shield. Click on them in your inventory, they will disappear from your inventory and move to your worn items. You can see your worn items in the worn items tab here."
pt = "Não deixe de equipar sua espada e seu escudo. Clique neles no seu inventário; eles vão sair do inventário e passar para os itens vestidos. Você pode vê-los aqui na aba de itens vestidos (worn items)."

[.meleetutor_5]
en = "When you are wielding your sword you will then be able to see the correct options in the combat interface."
pt = "Quando estiver empunhando sua espada, você verá as opções certas na interface de combate."

[.meleetutor_6]
en = "There are four different melee styles. Accurate, aggressive, defensive and controlled. Not all weapons will have all four styles though."
pt = "Há quatro estilos corpo a corpo: Accurate (preciso), Aggressive (agressivo), Defensive (defensivo) e Controlled (controlado). Mas nem toda arma tem os quatro."

[.meleetutor_7]
en = "Interesting, what does each style do?"
pt = "Interessante, o que cada estilo faz?"

[.meleetutor_8]
en = "Well I am glad you asked. The accurate style will give you experience points in your Attack skill, you will also find you will deal damage more frequently as a result of being, well, more accurate."
pt = "Que bom que perguntou. O estilo Accurate dá pontos de experiência na habilidade Attack (ataque), e você também vai causar dano com mais frequência por ser, bem, mais preciso."

[.meleetutor_9]
en = "Next we have the aggressive style. This style will give you experience points in your Strength skill. When using this style you will notice that your attacks will hit a little harder."
pt = "Depois temos o estilo Aggressive. Ele dá pontos de experiência na habilidade Strength (força). Usando esse estilo, você vai notar que seus golpes acertam um pouco mais forte."

[.meleetutor_10]
en = "Now for the defensive style, this style will give you experience points in your Defensive skill. When using this style you will notice that you get hit less often."
pt = "Agora o estilo Defensive: ele dá pontos de experiência na habilidade Defence (defesa). Usando esse estilo, você vai notar que é atingido com menos frequência."

[.meleetutor_11]
en = "Finally, we have the controlled style. This style will give you the same amount of experience as the other styles would but shared across all three of the combat skills."
pt = "Por fim, temos o estilo Controlled. Ele dá a mesma quantidade de experiência que os outros estilos, mas dividida entre as três habilidades de combate."

[.meleetutor_12]
en = "If you were using the training sword for example, there are four different attack types. Stab, lunge, slash and block."
pt = "Com a espada de treino (training sword), por exemplo, há quatro tipos de ataque: Stab (estocada), Lunge (investida), Slash (corte) e Block (bloqueio)."

[.meleetutor_13]
en = "Each type uses one of the attack styles. Stab uses accurate, lunge and slash use aggressive and block uses defensive."
pt = "Cada tipo usa um dos estilos de ataque. Stab usa Accurate, Lunge e Slash usam Aggressive, e Block usa Defensive."

[.meleetutor_14]
en = "To find out which style an attack type uses, hover your mouse cursor over the style button."
pt = "Para saber qual estilo um tipo de ataque usa, passe o cursor do mouse sobre o botão do estilo."

[.meleetutor_15]
en = "What if I wanted to fight something a bit more... human."
pt = "E se eu quisesse lutar contra algo um pouco mais... humano?"

[.meleetutor_16]
en = "Well adventurer, there are a few places you might be able to do this."
pt = "Bem, aventureiro, há alguns lugares onde você pode fazer isso."

[.meleetutor_17]
en = "You could try your luck at castle wars. Here, two teams fight each other to defend their respective flags. To win the game you will need to get the other team's flag and return it to your flag stand."
pt = "Você pode tentar a sorte no Castle Wars. Lá, duas equipes lutam para defender suas bandeiras. Para vencer, você precisa pegar a bandeira da outra equipe e levá-la até o suporte da sua."

[.meleetutor_18]
en = "Capture the flag, sounds like a lot of fun."
pt = "Captura de bandeira, parece bem divertido."

[.meleetutor_19]
en = "If you are in a clan, you should gather some clan members and try out clan wars. There you can see which clan is better than the other by fighting each other in an arena."
pt = "Se você estiver num clã, junte alguns membros e experimente o Clan Wars. Lá vocês podem ver qual clã é melhor lutando uns contra os outros numa arena."

[.meleetutor_20]
en = "Both activities are safe minigame, which means if you die you will not loose any of your items. You can get to them by using the teleport option in your minigames tab."
pt = "As duas atividades são minigames seguros, ou seja, se você morrer não perde nenhum item. Você chega até elas usando a opção de teleporte na aba Minigames."

[.meleetutor_21]
en = "There is also the wilderness. The wilderness is north of Varrock and you can fight other players there. But bare in mind if you die to another player in the wilderness you will lose your stuff."
pt = "Também há a Wilderness (região selvagem). Ela fica ao norte de Varrock e lá você pode lutar contra outros jogadores. Mas lembre-se: se morrer para outro jogador na Wilderness, você perde suas coisas."

[.meleetutor_22]
en = "But this also means that if you kill another player you will be able to take their stuff too."
pt = "Mas isso também quer dizer que, se você matar outro jogador, pode pegar as coisas dele também."

[.meleetutor_23]
en = "Only go into the wilderness with items you are willing to lose and pay attention to the wilderness level you are in. The higher the level you go, more player will be able to attack you."
pt = "Só entre na Wilderness com itens que aceita perder e preste atenção no nível da Wilderness em que você está. Quanto mais alto o nível, mais jogadores podem atacar você."

[.meleetutor_24]
en = "You can find which player can attack you by checking your combat level."
pt = "Você descobre quais jogadores podem te atacar conferindo seu nível de combate."

[.meleetutor_25]
en = "Minus the wilderness level from your combat level to find the lowest level that you can attack, then add the wilderness level to your combat level to find the highest level that you can attack."
pt = "Subtraia o nível da Wilderness do seu nível de combate para achar o menor nível que você pode atacar; depois some o nível da Wilderness ao seu nível de combate para achar o maior."

[.meleetutor_26]
en = "Tell me about different weapon types I can use."
pt = "Fale-me sobre os tipos de arma que posso usar."

[.meleetutor_27]
en = "Well let me see now...There are stabbing type weapons such as daggers, then you have swords which are slashing, maces that have great crushing abilities, battle axes which are powerful."
pt = "Ora, deixe-me ver...Há armas de estocada, como as adagas (daggers), depois as espadas, que cortam, as maças (maces), ótimas para esmagar, e os machados de batalha (battleaxes), que são poderosos."

[.meleetutor_28]
en = "There are also spears. Spears can be good for Defence and many forms of Attack."
pt = "Também há as lanças (spears). Lanças podem ser boas para Defence e para várias formas de Attack."

[.meleetutor_29]
en = "It depends a lot on how you want to fight. Experiment and find out what is best for you. Never be scared to try out a new weapon; you never know, you might like it!"
pt = "Depende muito de como você quer lutar. Experimente e descubra o que é melhor para você. Nunca tenha medo de testar uma arma nova; nunca se sabe, você pode gostar!"

[.meleetutor_30]
en = "While I tried all of them for a while, I settled on this rather good sword."
pt = "Experimentei todas por um tempo, mas acabei ficando com esta espada muito boa."

[.meleetutor_31]
en = "You might also find that different weapon types are more accurate against different monsters."
pt = "Você também pode descobrir que certos tipos de arma são mais precisos contra certos monstros."

[.meleetutor_32]
en = "Tell me about skillcapes."
pt = "Fale-me sobre as skillcapes."

[.meleetutor_33]
en = "Of course. Skillcapes are a symbol of achievement. Only people who have mastered a skill and reached level 99 can get their hands on them and gain the benefits they carry."
pt = "Claro. As skillcapes (capas de habilidade) são um símbolo de conquista. Só quem dominou uma habilidade e chegou ao nível 99 pode tê-las e ganhar os benefícios que elas trazem."

[.meleetutor_34]
en = "The Cape of Defence will act as ring of life, saving you from combat if your hitpoints become low."
pt = "A Cape of Defence funciona como um ring of life (anel da vida), tirando você do combate se seus pontos de vida ficarem baixos."

[.meleetutor_35]
en = "Ah, but I can see you're already a master in the fine art of Defence. Perhaps you have come to me to purchase a Skillcape of Defence, and thus join the elite few who have mastered this exacting skill?"
pt = "Ah, mas vejo que você já é mestre na nobre arte da Defence. Talvez tenha vindo comprar uma Skillcape of Defence e assim se juntar aos poucos que dominaram esta habilidade tão exigente?"

[.meleetutor_36]
en = "In recognition of your defensive abilities, when you have it equipped it will act as ring of life, saving you from combat if your hitpoints become low."
pt = "Em reconhecimento às suas habilidades defensivas, quando equipada ela funciona como um ring of life (anel da vida), tirando você do combate se seus pontos de vida ficarem baixos."

[.meleetutor_37]
en = "May I buy a Skillcape of Defence, please?"
pt = "Posso comprar uma Skillcape of Defence, por favor?"

[.meleetutor_38]
en = "Can I ask about something else?"
pt = "Posso perguntar sobre outra coisa?"

[.meleetutor_39]
en = "Skillcape"
pt = "Skillcape"

[.meleetutor_40]
en = "Hood"
pt = "Capuz"

[.meleetutor_41]
en = "May I have another hood for my cape, please?"
pt = "Pode me dar outro capuz (hood) para minha capa, por favor?"

[.meleetutor_42]
en = "Most certainly, and free of charge!"
pt = "Com certeza, e de graça!"

[.meleetutor_43]
en = "The tutor hands you another hood for your skillcape."
pt = "O tutor te dá outro capuz para sua skillcape."

[.meleetutor_44]
en = "You wish to join the elite defenders of this world? I'm afraid such things do not come cheaply - in fact they cost 99000 coins, to be precise!"
pt = "Deseja se juntar à elite dos defensores deste mundo? Receio que isso não saia barato - na verdade, custa 99000 moedas (coins), para ser exato!"

[.meleetutor_45]
en = "99000 coins? That's much too expensive."
pt = "99000 moedas? Isso é caro demais."

[.meleetutor_46]
en = "Not at all; there are many other adventurers who would love the opportunity to purchase such a prestigious item! You can find me here if you change your mind."
pt = "De modo algum; há muitos outros aventureiros que adorariam a chance de comprar um item tão prestigioso! Você me encontra aqui se mudar de ideia."

[.meleetutor_47]
en = "I think I have the money right here, actually."
pt = "Acho que tenho o dinheiro aqui comigo, na verdade."

[.meleetutor_48]
en = "I'd like a training sword and shield."
pt = "Eu queria uma espada e um escudo de treino."

[.meleetutor_49]
en = "You already have a training sword and shield. Save some for the other adventurers."
pt = "Você já tem uma espada e um escudo de treino. Deixe alguns para os outros aventureiros."

[.meleetutor_50]
en = "Is there anything else I can help you with?"
pt = "Posso ajudar com mais alguma coisa?"

[.meleetutor_51]
en = "You don't have enough space for me to give you a training sword, nor a shield."
pt = "Você não tem espaço suficiente para eu te dar uma espada de treino, nem um escudo."

[.meleetutor_52]
en = "Harlan gives you a Training sword."
pt = "Harlan te dá uma espada de treino (Training sword)."

[.meleetutor_53]
en = "Harlan gives you a Training shield."
pt = "Harlan te dá um escudo de treino (Training shield)."

[.meleetutor_54]
en = "There you go, use it well."
pt = "Aqui está, use bem."

# RangeTutor - Lumbridge - Tutorial Island

[.rangetutor_1]
en = "Hey there adventurer, I am the Ranged combat tutor. Is there anything you would like to know?"
pt = "Olá, aventureiro, eu sou o tutor de combate Ranged (à distância). Quer saber alguma coisa?"

[.rangetutor_2]
en = "I'd like some arrows and a training bow."
pt = "Quero flechas (arrows) e um arco de treino (training bow)."

[.rangetutor_3]
en = "How can I train my Ranged?"
pt = "Como posso treinar meu Ranged?"

[.rangetutor_4]
en = "To start with you'll need a bow and arrows, you were given a Shortbow and some arrows when you arrived here from Tutorial island."
pt = "Para começar, você vai precisar de um arco e flechas; você ganhou um arco curto (Shortbow) e algumas flechas (arrows) quando chegou aqui da Tutorial Island."

[.rangetutor_5]
en = "Alternatively, you can claim a training bow and some arrows from me."
pt = "Ou então, você pode pegar comigo um arco de treino (training bow) e algumas flechas."

[.rangetutor_6]
en = "Mikasi, the Magic Combat tutor and I both give out items every 30 minutes, however you must choose whether you want runes or ranged equipment."
pt = "Eu e o Mikasi, o tutor de combate Magic, distribuímos itens a cada 30 minutos, mas você precisa escolher se quer runas ou equipamento de Ranged."

[.rangetutor_7]
en = "Not all bows can use every type of arrow, most bows have a limit. You can find out your bows limit by checking the Ranged skill guide."
pt = "Nem todo arco usa todo tipo de flecha; a maioria dos arcos tem um limite. Você pode descobrir o limite do seu arco no guia da habilidade Ranged."

[.rangetutor_8]
en = "If you do decide to use the Training bow, you will only be able to use the Training arrows with it. Remember to pick up your arrows, re-use them and come back when you need more."
pt = "Se decidir usar o arco de treino (Training bow), só vai poder usar as flechas de treino (Training arrows) com ele. Lembre-se de recolher suas flechas, reutilizá-las e voltar quando precisar de mais."

[.rangetutor_9]
en = "Once you have your bow and arrows, equip them by selecting their Wield option in your inventory."
pt = "Quando tiver seu arco e flechas, equipe-os escolhendo a opção 'Wield' no seu inventário."

[.rangetutor_10]
en = "You can change the way you attack by going to the combat options tab. There are three attack styles for bows. Those styles are Accurate, Rapid and Longrange."
pt = "Você pode mudar o jeito de atacar na aba de opções de combate (combat options). Há três estilos de ataque para arcos: Accurate, Rapid e Longrange."

[.rangetutor_11]
en = "Accurate increases your bows attack accuracy. Rapid will increase your attack speed with the bow. Longrange will let you attack your enemies from a greater distance."
pt = "Accurate aumenta a precisão do seu arco. Rapid aumenta a velocidade dos seus ataques com o arco. Longrange permite atacar inimigos de uma distância maior."

[.rangetutor_12]
en = "If you are ever in the market for a new bow or some arrows, you should head on over to Lowe's Archery Emporium in Varrock."
pt = "Se um dia estiver procurando um arco novo ou flechas, dê uma passada no Lowe's Archery Emporium em Varrock."

[.rangetutor_13]
en = "Is there anything else you want to know?"
pt = "Quer saber mais alguma coisa?"

[.rangetutor_14]
en = "How do I create a bow and arrows?"
pt = "Como faço um arco e flechas?"

[.rangetutor_15]
en = "Ahh the art of fletching. Fletching is used to create your own bow and arrows."
pt = "Ahh, a arte do Fletching (confecção de arcos e flechas). Com Fletching você cria seus próprios arcos e flechas."

[.rangetutor_16]
en = "It's quite simple really. You'll need an axe to cut some logs from trees and a knife. Knives can be found in and around the Lumbridge castle and in the Varrock General store upstairs."
pt = "É bem simples, na verdade. Você vai precisar de um machado (axe) para cortar toras (logs) das árvores e de uma faca (knife). Há facas dentro e em volta do Lumbridge Castle e no andar de cima da General Store de Varrock."

[.rangetutor_17]
en = "Use your knife on the logs. This will bring up a menu listing items you can fletch."
pt = "Use a faca nas toras. Isso abre um menu com os itens que você pode fazer."

[.rangetutor_18]
en = "For arrows you will need to smith some arrow heads and kill some chickens for feathers."
pt = "Para as flechas, você vai precisar forjar pontas de flecha (arrowheads) e matar algumas galinhas para pegar penas (feathers)."

[.rangetutor_19]
en = "Add the feathers to your Arrow shafts to make Headless arrows, then use your chosen arrow heads on the Headless arrows to make your arrows."
pt = "Junte as penas às hastes de flecha (Arrow shafts) para fazer flechas sem ponta (Headless arrows) e depois use as pontas escolhidas nelas para fazer suas flechas."

[.rangetutor_20]
en = "Now for making bows. When accessing the fletching menu, instead of choosing Arrows shafts, you can make an unstrung bow instead."
pt = "Agora, os arcos. No menu de Fletching, em vez de escolher hastes de flecha (Arrow shafts), você pode fazer um arco sem corda (unstrung bow)."

[.rangetutor_21]
en = "To complete the bow you will need to get your hands on a Bow string."
pt = "Para completar o arco, você vai precisar arranjar uma corda de arco (Bow string)."

[.rangetutor_22]
en = "First you will need to get some flax from a flax field. There's one south of Seers' Village. Gather flax, then spin it on a spinning wheel, there's one in Seers' Village too."
pt = "Primeiro você precisa pegar linho (flax) num campo de linho. Tem um ao sul de Seers' Village. Colha o linho e fie numa roda de fiar (spinning wheel); também tem uma em Seers' Village."

[.rangetutor_23]
en = "This makes bow strings which you can then use on the unstrung bows to make a working bow!"
pt = "Isso faz cordas de arco, que você pode usar nos arcos sem corda para ter um arco pronto para usar!"

[.rangetutor_24]
en = "Brilliant. If I forget anything I'll come talk to you again."
pt = "Excelente. Se eu esquecer alguma coisa, volto para falar com você."

[.rangetutor_25]
en = "I work with the Magic tutor to give out consumable items that you may need for combat such as arrows and runes. However we have had some cheeky people try to take both!"
pt = "Eu trabalho com o tutor de Magic para distribuir itens de consumo que você pode precisar em combate, como flechas e runas. Mas teve gente atrevida tentando pegar os dois!"

[.rangetutor_26]
en = "So, every half an hour, you may come back and claim either arrows OR runes, but not both. Come back in a while for arrows, or simply make your own."
pt = "Então, a cada meia hora, você pode voltar e pegar flechas OU runas, mas não os dois. Volte daqui a pouco para pegar flechas, ou simplesmente faça as suas."

[.rangetutor_27]
en = "If you had enough space in your inventory I'd give you a training bow, come back when you do."
pt = "Se você tivesse espaço suficiente no inventário, eu te daria um arco de treino. Volte quando tiver."

[.rangetutor_28]
en = "If you had enough space in your inventory I'd give you some arrows, come back when you do."
pt = "Se você tivesse espaço suficiente no inventário, eu te daria algumas flechas. Volte quando tiver."

[.rangetutor_29]
en = "Nemarti gives you a Training shortbow."
pt = "Nemarti te dá um arco curto de treino (Training shortbow)."

[.rangetutor_30]
en = "Mikasi gives you 25 arrows. They can only be used with the Training shortbow."
pt = "Mikasi te dá 25 flechas. Elas só podem ser usadas com o arco curto de treino (Training shortbow)."

[.rangetutor_31]
en = "You have some training arrows in your bank."
pt = "Você tem algumas flechas de treino no seu banco."

[.rangetutor_32]
en = "You have a training bow in your bank."
pt = "Você tem um arco de treino no seu banco."

[.rangetutor_33]
en = "You have some arrows in your bank. Climb the stairs in Lumbridge Castle until you see this icon on your minimap. There you will find a bank."
pt = "Você tem algumas flechas no seu banco. Suba as escadas do Lumbridge Castle até ver este ícone no seu minimapa. Lá você vai encontrar um banco."

[.rangetutor_34]
en = "You already have some training arrows."
pt = "Você já tem algumas flechas de treino."

[.rangetutor_35]
en = "You already have a training bow."
pt = "Você já tem um arco de treino."

# Cows - Lumbridge - Tutorial Island

[.cows_1]
en = "You need to have started the Cold War quest to attempt this."
pt = "Você precisa ter começado a missão Cold War para tentar isso."

# FredsFarmGoblin - Lumbridge - Tutorial Island

[.fredsfarmgoblin_1]
en = "I kill you human!"
pt = "Mim matar você, humano!"

# GillieGroats - Lumbridge - Tutorial Island

[.gilliegroats_1]
en = "Hello, I'm Gillie the Milkmaid. What can I do for you?"
pt = "Olá, sou Gillie, a ordenhadora. O que posso fazer por você?"

[.gilliegroats_2]
en = "I'm after some Top-quality milk."
pt = "Estou atrás de Top-quality milk (leite de primeira)."

[.gilliegroats_3]
en = "Can you tell me how to milk a cow?"
pt = "Pode me dizer como ordenhar uma vaca?"

[.gilliegroats_4]
en = "I'm fine, thanks."
pt = "Estou bem, obrigado."

[.gilliegroats_5]
en = "My name's Gillie Groats. My father is a farmer and I milk the cows for him."
pt = "Meu nome é Gillie Groats. Meu pai é fazendeiro e eu ordenho as vacas para ele."

[.gilliegroats_6]
en = "Do you have any buckets of milk spare?"
pt = "Você tem algum balde de leite (bucket of milk) sobrando?"

[.gilliegroats_7]
en = "I'm afraid not. We need all of our milk to sell to market, but you can milk the cow yourself if you need milk."
pt = "Infelizmente não. Precisamos de todo o leite para vender na feira, mas você mesmo pode ordenhar a vaca se precisar."

[.gilliegroats_8]
en = "Thanks."
pt = "Obrigado."

[.gilliegroats_9]
en = "So how do you get milk from a cow then?"
pt = "Então, como se tira leite de uma vaca?"

[.gilliegroats_10]
en = "It's very easy. First you need an empty bucket to hold the milk."
pt = "É muito fácil. Primeiro você precisa de um balde vazio (bucket) para o leite."

[.gilliegroats_11]
en = "Then find a dairy cow to milk - you can't milk just any cow."
pt = "Depois, encontre uma vaca leiteira (dairy cow) - não dá para ordenhar qualquer vaca."

[.gilliegroats_12]
en = "How do I find a dairy cow?"
pt = "Como eu acho uma vaca leiteira?"

[.gilliegroats_13]
en = "They are easy to spot - they are dark brown and white, unlike beef cows, which are light brown and white. We also tether them to a post to stop them wandering around all over the place."
pt = "São fáceis de achar - são marrom-escuras e brancas, ao contrário das vacas de corte, que são marrom-claras e brancas. Também as amarramos num poste para não saírem vagando por aí."

[.gilliegroats_14]
en = "There are a couple very near, in this field."
pt = "Tem duas bem pertinho, neste pasto."

[.gilliegroats_15]
en = "Then just milk the cow and your bucket will fill with tasty, nutritious milk."
pt = "Aí é só ordenhar a vaca e seu balde vai se encher de leite gostoso e nutritivo."

[.gilliegroats_16]
en = "Really? Is it for something special?"
pt = "É mesmo? É para algo especial?"

[.gilliegroats_17]
en = "Most certainly! It's for the cook to make a cake foe Duke Horacio!"
pt = "Com certeza! É para o Cook fazer um bolo para o Duke Horacio!"

[.gilliegroats_18]
en = "Wow, it's quite an honour that you'd pick my cows. I'd suggest you get some milk from my prized cow."
pt = "Nossa, que honra você escolher as minhas vacas. Sugiro pegar leite da minha vaca premiada."

[.gilliegroats_19]
en = "Which one's that?"
pt = "E qual é ela?"

[.gilliegroats_20]
en = "She's on the east side of the field, over by the cliff. Be gentle!"
pt = "Fica no lado leste do pasto, perto do penhasco. Seja gentil!"

# SethGroats - Lumbridge - Tutorial Island

[.sethgroats_1]
en = "M'arnin'....going to milk me cowsies!"
pt = "Dia, sô!....vô tirá leite das minha vaquinha!"

# Roddeck - Lumbridge - Tutorial Island

[.roddeck_1]
en = "Greetings! I am Roddeck. What can i do for you today?"
pt = "Saudações! Eu sou Roddeck. O que posso fazer por você hoje?"

[.roddeck_2]
en = "My name is Roddeck, and I am the Advisor. Whenever people in Runescape are in need of advice, they click on the Advisor button to seek my help."
pt = "Meu nome é Roddeck, e eu sou o Advisor (conselheiro). Quando alguém em Runescape precisa de conselho, clica no botão Advisor para pedir minha ajuda."

[.roddeck_3]
en = "Apart from that, I'm just an elderly gentleman of Lumbridge, and this is my house."
pt = "Fora isso, sou só um senhor de idade de Lumbridge, e esta é a minha casa."

[.roddeck_4]
en = "Now, was there anything else you wanted?"
pt = "Então, queria mais alguma coisa?"

[.roddeck_5]
en = "Can you offer me any advice?"
pt = "Pode me dar algum conselho?"

[.roddeck_6]
en = "Advice? Certainly, certainly! Click my Advisor button whenever you have a question."
pt = "Conselho? Certamente, certamente! Clique no meu botão Advisor sempre que tiver uma dúvida."

[.roddeck_7]
en = "Nothing, thanks."
pt = "Nada, obrigado."

# CandleSeller - Lumbridge - Tutorial Island

[.candleseller_1]
en = "Do you want a lit candle for 1000 gold?"
pt = "Quer uma vela acesa (lit candle) por 1000 moedas de ouro?"

[.candleseller_2]
en = "Yes please."
pt = "Sim, por favor."

[.candleseller_3]
en = "One thousand gold?!"
pt = "Mil moedas de ouro?!"

[.candleseller_4]
en = "Look, you're not going to be able to survive down that hole without a light source."
pt = "Olha, você não vai sobreviver lá embaixo naquele buraco sem uma fonte de luz."

[.candleseller_5]
en = "So you could go off to the candle shop to buy one more cheaply. You could even make your own lantern, which is a lot better."
pt = "Você poderia ir à loja de velas comprar uma mais barata. Poderia até fazer sua própria lanterna (lantern), que é bem melhor."

[.candleseller_6]
en = "But I bet you want to find out what's down there right now, don't you? And you can pay me 1000 gold for the privilege!"
pt = "Mas aposto que você quer descobrir o que tem lá embaixo agora mesmo, não é? E pode me pagar 1000 moedas pelo privilégio!"

[.candleseller_7]
en = "All right, you win, I'll buy a candle."
pt = "Está bem, você venceu, vou comprar uma vela."

[.candleseller_8]
en = "No way."
pt = "De jeito nenhum."

[.candleseller_9]
en = "No thanks, I'd rather curse the darkness."
pt = "Não, obrigado, prefiro amaldiçoar a escuridão."

[.candleseller_10]
en = "Here you go then."
pt = "Aqui está, então."

[.candleseller_11]
en = "I should warn you, though, it can be dangerous to take a naked flame down there. You'd be better off making a lantern."
pt = "Mas devo avisar: pode ser perigoso levar uma chama exposta lá para baixo. Seria melhor fazer uma lanterna."

[.candleseller_12]
en = "What's so dangerous about a naked flame?"
pt = "O que tem de tão perigoso numa chama exposta?"

[.candleseller_13]
en = "Heh heh... You'll find out."
pt = "Heh heh... Você vai descobrir."

[.candleseller_14]
en = "Thanks, bye."
pt = "Obrigado, tchau."

[.candleseller_15]
en = "How do you make lanterns?"
pt = "Como se fazem lanternas?"

[.candleseller_16]
en = "Out of glass. The more advanced lanterns have a metal component as well."
pt = "Com vidro. As lanternas mais avançadas também têm uma parte de metal."

[.candleseller_17]
en = "Firstly you can make a simple candle lantern out of glass. It's just like a candle, but the flame isn't exposed, so it's safer."
pt = "Primeiro, dá para fazer uma candle lantern simples de vidro. É igual a uma vela, mas a chama não fica exposta, então é mais segura."

[.candleseller_18]
en = "Then you can make an oil lamp, which is brighter but has an exposed flame. But if you make an iron frame for it you can turn it into an oil lantern."
pt = "Depois, dá para fazer uma oil lamp (lamparina), que ilumina mais, mas tem chama exposta. Com uma armação de ferro, ela vira uma oil lantern."

[.candleseller_19]
en = "Finally there's the bullseye lantern. You'll need to make a frame out of steel and add a glass lens."
pt = "Por fim, tem a bullseye lantern (lanterna olho-de-boi). Você vai precisar de uma armação de aço e de uma lente de vidro."

[.candleseller_20]
en = "Once you've made your lamp or lantern, you'll need to make lamp oil for it. The chemist near Rimmington has a machine for that."
pt = "Depois de fazer a lamparina ou a lanterna, você vai precisar de óleo (lamp oil) para ela. O químico perto de Rimmington tem uma máquina para isso."

[.candleseller_21]
en = "For any light source, you'll need a tinderbox to light it. Keep your tinderbox handy in case it goes out!"
pt = "Para acender qualquer fonte de luz, você vai precisar de uma pederneira (tinderbox). Deixe-a à mão caso a luz se apague!"

[.candleseller_22]
en = "But if all that's too complicated, you can buy a candle right here for 1000 gold!"
pt = "Mas se tudo isso for complicado demais, pode comprar uma vela bem aqui por 1000 moedas!"

[.candleseller_23]
en = "But I don't have that kind of money on me."
pt = "Mas eu não tenho tanto dinheiro comigo."

[.candleseller_24]
en = "Well then, no candle for you!"
pt = "Então nada de vela para você!"

# LostCityAdventurers - Lumbridge - Tutorial Island

[.lostcityadventurers_1]
en = "Why are you guys hanging around here?"
pt = "Por que vocês, caras, estão de bobeira por aqui?"

[.lostcityadventurers_2]
en = "(ahem)...'Guys'?"
pt = "(aham)...'Caras'?"

[.lostcityadventurers_3]
en = "Uh... yeah, sorry about that. Why are you all standing around out here?"
pt = "Hã... é, desculpe por isso. Por que vocês estão todos parados aqui fora?"

[.lostcityadventurers_4]
en = "Well, that's really none of your business."
pt = "Bem, isso realmente não é da sua conta."

[.lostcityadventurers_5]
en = "So you didn't find the entrance to Zanaris yet, huh?"
pt = "Então vocês ainda não acharam a entrada de Zanaris, hein?"

[.lostcityadventurers_6]
en = "Don't tell me a novice like YOU has found it!"
pt = "Não me diga que um novato como VOCÊ achou!"

[.lostcityadventurers_7]
en = "Yep. Found it REALLY easily too."
pt = "Pois é. E achei MUITO fácil, ainda por cima."

[.lostcityadventurers_8]
en = "...I cannot believe that someone like YOU could find the portal where experienced adventurers such as ourselves could not."
pt = "...Não acredito que alguém como VOCÊ achou o portal que aventureiros experientes como nós não conseguiram achar."

[.lostcityadventurers_9]
en = "Believe what you want. Enjoy your little camp fire."
pt = "Acredite no que quiser. Aproveite sua fogueirinha."

[.lostcityadventurers_10]
en = "Why are all of you standing around here?"
pt = "Por que vocês todos estão parados aqui?"

[.lostcityadventurers_11]
en = "Hahaha you dare talk to a mighty wizard such as myself? I bet you can't even cast windstrike yet amateur!"
pt = "Hahaha, você ousa falar com um mago poderoso como eu? Aposto que nem sabe lançar Wind Strike ainda, amador!"

[.lostcityadventurers_12]
en = "...You're an idiot."
pt = "...Você é um idiota."

[.lostcityadventurers_13]
en = "Hahaha you're such an amateur!"
pt = "Hahaha, você é muito amador!"

[.lostcityadventurers_14]
en = "Go away and play with some cabbage amateur!"
pt = "Vá brincar com uns repolhos (cabbage), amador!"

[.lostcityadventurers_15]
en = "...right."
pt = "...tá bom."

[.lostcityadventurers_16]
en = "None of your business. Get lost."
pt = "Não é da sua conta. Suma daqui."

[.lostcityadventurers_17]
en = "I already told you. I'm not talking to you anymore."
pt = "Eu já disse. Não falo mais com você."

[.lostcityadventurers_18]
en = "Hello there traveller."
pt = "Olá, viajante."

[.lostcityadventurers_19]
en = "What are you camped out here for?"
pt = "Por que vocês estão acampados aqui?"

[.lostcityadventurers_20]
en = "What are you camped here for?"
pt = "Por que vocês acamparam aqui?"

[.lostcityadventurers_21]
en = "Do you know any good adventures I can go on?"
pt = "Conhece alguma boa aventura que eu possa fazer?"

[.lostcityadventurers_22]
en = "Well we're on an adventure right now. Mind you, this is OUR adventure and we don't want to share it - find your own!"
pt = "Bem, estamos numa aventura agora mesmo. Mas veja bem, essa aventura é NOSSA e não queremos dividir - arrume a sua!"

[.lostcityadventurers_23]
en = "I don't think you've found a good adventure at all!"
pt = "Acho que vocês não acharam aventura boa nenhuma!"

[.lostcityadventurers_24]
en = "Hah! Adventurers of our calibre don't just hang around in forests for fun, whelp!"
pt = "Rá! Aventureiros do nosso calibre não ficam à toa em florestas por diversão, fedelho!"

[.lostcityadventurers_25]
en = "Oh really?"
pt = "Ah, é mesmo?"

[.lostcityadventurers_26]
en = "Have you found anything yet?"
pt = "Já acharam alguma coisa?"

[.lostcityadventurers_27]
en = "We're still searching for Zanaris...GAH! I mean we're not doing anything here at all."
pt = "Ainda estamos procurando Zanaris...ARGH! Quer dizer, não estamos fazendo nada aqui."

[.lostcityadventurers_28]
en = "I haven't found it yet either."
pt = "Eu também ainda não achei."

[.lostcityadventurers_29]
en = "Hey, thanks for all the information. It REALLY helped me out in finding the lost city of Zanaris and all."
pt = "Ei, obrigado por todas as informações. Me ajudaram MUITO a achar a cidade perdida de Zanaris e tudo mais."

[.lostcityadventurers_30]
en = "Oh, please don't say that anymore! If the rest of my party knew I'd helped you, they'd probably throw me out and make me walk home by myself!"
pt = "Ah, por favor, não diga mais isso! Se o resto do meu grupo soubesse que te ajudei, iam me expulsar e me fazer voltar a pé para casa sozinho!"

[.lostcityadventurers_31]
en = "So anyway, what have you found out? Where is the fabled Zanaris? Is it all the legends say it is?"
pt = "Enfim, o que você descobriu? Onde fica a lendária Zanaris? É tudo o que as lendas dizem?"

[.lostcityadventurers_32]
en = "You know...I think I'll keep that to myself."
pt = "Sabe...acho que vou guardar isso para mim."

[.lostcityadventurers_33]
en = "We're looking for Zanaris...GAH! I mean we're not here for any particular reason at all."
pt = "Estamos procurando Zanaris...ARGH! Quer dizer, não estamos aqui por nenhum motivo especial."

[.lostcityadventurers_34]
en = "Who's Zanaris?"
pt = "Quem é Zanaris?"

[.lostcityadventurers_35]
en = "Ahahahaha! Zanaris isn't a person! It's a magical hidden city filled with treasures and rich.. uh, nothing. It's nothing."
pt = "Ahahahaha! Zanaris não é uma pessoa! É uma cidade mágica escondida, cheia de tesouros e rique.. hã, nada. Não é nada."

[.lostcityadventurers_36]
en = "If it's hidden how are you planning to find it?"
pt = "Se ela é escondida, como vocês pretendem achá-la?"

[.lostcityadventurers_37]
en = "Well, we don't want to tell anyone else about that, because we don't want anyone else sharing in all that glory and treasure."
pt = "Bem, não queremos contar isso a ninguém, porque não queremos dividir toda essa glória e tesouro com mais ninguém."

[.lostcityadventurers_38]
en = "Looks like you don't know either."
pt = "Parece que vocês também não sabem."

[.lostcityadventurers_39]
en = "Well, it looks to me like YOU don't know EITHER seeing as you're all just sat around here."
pt = "Bem, me parece que VOCÊS também NÃO sabem, já que estão todos sentados aqui à toa."

[.lostcityadventurers_40]
en = "Of course we know! We will find Zanaris, just you wait. Now go away!"
pt = "Claro que sabemos! Vamos achar Zanaris, você vai ver. Agora vá embora!"

[.lostcityadventurers_41]
en = "Of course we know! We just haven't found which tree the stupid leprechaun's hiding in yet!"
pt = "Claro que sabemos! Só não descobrimos ainda em que árvore aquele duende idiota está escondido!"

[.lostcityadventurers_42]
en = "Leprechaun?"
pt = "Duende?"

[.lostcityadventurers_43]
en = "GAH! I didn't mean to tell you that! Look, just forget I said anything okay?"
pt = "ARGH! Eu não queria ter contado isso! Olha, esqueça o que eu disse, tá bom?"

[.lostcityadventurers_44]
en = "So a leprechaun knows where Zanaris is eh?"
pt = "Então um duende sabe onde fica Zanaris, é?"

[.lostcityadventurers_45]
en = "Ye.. uh, no. No, not at all. And even if he did - which he doesn't - he DEFINITELY ISN'T hiding in some tree around here. Nope, definitely not. Honestly."
pt = "Si.. hã, não. Não, de jeito nenhum. E mesmo que soubesse - e não sabe - ele DEFINITIVAMENTE NÃO está escondido em alguma árvore por aqui. Não, nada disso. Sério."

[.lostcityadventurers_46]
en = "Thanks for the help!"
pt = "Obrigado pela ajuda!"

[.lostcityadventurers_47]
en = "Help? What help? I didn't help! Please don't say I did, I'll get in trouble!"
pt = "Ajuda? Que ajuda? Eu não ajudei! Por favor, não diga que ajudei, vou me encrencar!"

[.lostcityadventurers_48]
en = "So let me get this straight: I need to search the trees around here for a leprechaun; and then when I find him, he will tell me where this 'Zanaris' is?"
pt = "Deixa eu ver se entendi: preciso procurar um duende nas árvores por aqui; e quando eu o achar, ele vai me dizer onde fica essa tal 'Zanaris'?"

[.lostcityadventurers_49]
en = "What? How did you know that? Uh... I mean, no, no you're very wrong. Very wrong, and not right at all, and I definitely didn't tell you about that at all."
pt = "O quê? Como você sabe disso? Hã... quer dizer, não, não, você está muito enganado. Muito enganado, nada certo, e eu definitivamente não te contei nada disso."

[.lostcityadventurers_50]
en = "There's no such thing."
pt = "Isso não existe."

[.lostcityadventurers_51]
en = "There's no such thing!"
pt = "Isso não existe!"

[.lostcityadventurers_52]
en = "When we've found Zanaris you'll... GAH! I mean, we're not here for any particular reason at all."
pt = "Quando acharmos Zanaris, você vai... ARGH! Quer dizer, não estamos aqui por nenhum motivo especial."

[.lostcityadventurers_53]
en = "Please tell me."
pt = "Por favor, me conte."

[.lostcityadventurers_54]
en = "Please tell me?"
pt = "Me conta, por favor?"

[.lostcityadventurers_55]
en = "Please?"
pt = "Por favor?"

[.lostcityadventurers_56]
en = "No!"
pt = "Não!"

[.lostcityadventurers_57]
en = "PLEEEEEEEEEEEEEEEEEEEEEEASE???"
pt = "POR FAVOOOOOOOOOOOOOOOOOOOOOOR???"

[.lostcityadventurers_58]
en = "NO!"
pt = "NÃO!"

[.lostcityadventurers_59]
en = "What makes you think it's out here?"
pt = "Por que vocês acham que ela fica por aqui?"

[.lostcityadventurers_60]
en = "Don't you know of the legends that tell of the magical city, hidden in the swam... Uh, no, you're right, we're wasting our time here."
pt = "Você não conhece as lendas da cidade mágica escondida no pânt... Hã, não, você tem razão, estamos perdendo tempo aqui."

[.lostcityadventurers_61]
en = "What's Zanaris?"
pt = "O que é Zanaris?"

[.lostcityadventurers_62]
en = "I don't think we want other people competing with us to find it. Forget I said anything."
