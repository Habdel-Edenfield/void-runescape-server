# Skills - summoning/familiar/IronTitan.kt

[.skill_summoning_familiar_irontitan_1]
en = "Titan?"
pt = "Titã?"

[.skill_summoning_familiar_irontitan_2]
en = "Yes, boss?"
pt = "Sim, chefe?"

[.skill_summoning_familiar_irontitan_3]
en = "What's that in your hand?"
pt = "O que é isso na sua mão?"

[.skill_summoning_familiar_irontitan_4]
en = "I'm glad you asked that, boss."
pt = "Que bom que perguntou, chefe."

[.skill_summoning_familiar_irontitan_5]
en = "This is the prototype for the Iron Titan (tm) action figure. You just pull this string here and he fights crime with real action sounds."
pt = "Este é o protótipo do boneco de ação Iron Titan (tm). É só puxar esta cordinha aqui e ele combate o crime com sons de ação de verdade."

[.skill_summoning_familiar_irontitan_6]
en = "Boss!"
pt = "Chefe!"

[.skill_summoning_familiar_irontitan_7]
en = "I've just had a vision of the future."
pt = "Acabei de ter uma visão do futuro."

[.skill_summoning_familiar_irontitan_8]
en = "I didn't know you were a fortune teller. Let's hear it then."
pt = "Não sabia que você era vidente. Então conta aí."

[.skill_summoning_familiar_irontitan_9]
en = "Just imagine, boss, an Iron Titan (tm) on every desk."
pt = "Imagine só, chefe: um Iron Titan (tm) em cada mesa."

[.skill_summoning_familiar_irontitan_10]
en = "That doesn't even make sense."
pt = "Isso nem faz sentido."

[.skill_summoning_familiar_irontitan_11]
en = "Hmm. It was a bit blurry, perhaps the future is having technical issues at the moment."
pt = "Hmm. Estava meio borrado, talvez o futuro esteja com problemas técnicos no momento."

[.skill_summoning_familiar_irontitan_12]
en = "Riiight."
pt = "Seeei."

[.skill_summoning_familiar_irontitan_13]
en = "Boss?"
pt = "Chefe?"

[.skill_summoning_familiar_irontitan_14]
en = "Yes, titan?"
pt = "Sim, titã?"

[.skill_summoning_familiar_irontitan_15]
en = "You know how you're the boss and I'm the titan?"
pt = "Sabe como você é o chefe e eu sou o titã?"

[.skill_summoning_familiar_irontitan_16]
en = "Do you think we could swap for a bit?"
pt = "Será que a gente podia trocar um pouquinho?"

[.skill_summoning_familiar_irontitan_17]
en = "No, titan!"
pt = "Não, titã!"

[.skill_summoning_familiar_irontitan_18]
en = "Aww..."
pt = "Aaah..."

[.skill_summoning_familiar_irontitan_19]
en = "How are you today, titan?"
pt = "Como vai hoje, titã?"

[.skill_summoning_familiar_irontitan_20]
en = "I'm very happy."
