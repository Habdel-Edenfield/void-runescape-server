# Skills - hunter/MagicBox.kt

[.skill_hunter_magicbox_1]
en = "This is your magic box, ready to catch an imp."
pt = "Esta é a sua caixa mágica (magic box), pronta para capturar um imp."

[.skill_hunter_magicbox_2]
en = "This isn't your magic box."
pt = "Esta caixa mágica não é sua."

[.skill_hunter_magicbox_3]
en = "The imp refuses to take that to your bank."
pt = "O imp se recusa a levar isso para o seu banco."

[.skill_hunter_magicbox_4]
en = "The imp takes the item to your bank."
pt = "O imp leva o item para o seu banco."

[.skill_hunter_magicbox_5]
en = "The imp takes the item to your bank and escapes from the box."
pt = "O imp leva o item para o seu banco e foge da caixa."

[.skill_hunter_magicbox_6]
en = "A magical force prevents you from banking this item."
pt = "Uma força mágica impede você de guardar este item no banco."

[.skill_hunter_magicbox_7]
en = "The imp takes your items to the bank and escapes from the box."
pt = "O imp leva os seus itens para o banco e foge da caixa."

[.skill_hunter_magicbox_8]
en = "The imp refuses to visit your bank from this deep in the wilderness."
pt = "O imp se recusa a ir até o seu banco estando tão fundo na Wilderness."

[.skill_hunter_magicbox_9]
en = "Hey imp, are you still there?"
pt = "Ei, imp, você ainda está aí?"

[.skill_hunter_magicbox_10]
en = "Of course I can hear ya, ya great big ape. You know, there's not even enuf space to swing Bob about in 'ere. How about a breather? You know, stretch me pins for a bit?"
pt = "Craro que te escuto, seu macacão grandão. Sabe, num tem espaço nem pra girar o Bob aqui dentro. Que tal uma folguinha? Esticar as canela um pouco?"

[.skill_hunter_magicbox_11]
en = "No, I'm going to keep you in there."
pt = "Não, vou manter você aí dentro."

[.skill_hunter_magicbox_12]
en = "No, I'm going to keep you in there. I might keep you as a pet."
pt = "Não, vou manter você aí dentro. Talvez eu fique com você de bichinho de estimação."

[.skill_hunter_magicbox_13]
en = "Pet!! Nah mate. I fink you'd find dat you'd be my pet!! We is not makin good pets."
pt = "Bichinho!! Nada disso, parça. Acho que cê ia descobrir que é tu que ia ser meu bichinho!! Nóis num é bom de bichinho."

[.skill_hunter_magicbox_14]
en = "Really? Why not?"
pt = "Sério? Por que não?"

[.skill_hunter_magicbox_15]
en = "Coz...errr..."
pt = "Porque... ééé..."

[.skill_hunter_magicbox_16]
en = "We bite! Yeah we is biting and...and...er..."
pt = "Nóis morde! É, nóis morde e... e... é..."

[.skill_hunter_magicbox_17]
en = "We is fire risk! Yeah dat's it! We be burning down your housey and stealin' all ya shiny gems. Oh, and da beads!! Mmmm, beads."
pt = "Nóis pega fogo fácil! É isso! Nóis queima tua casinha e rouba tuas pedra brilhante tudinho. Ah, e as miçanga!! Hmmm, miçanga."

[.skill_hunter_magicbox_18]
en = "Fire risk? How does that work?"
pt = "Pegam fogo fácil? Como assim?"

[.skill_hunter_magicbox_19]
en = "Is those wizzies. Dey don't like de imps so dey make us go BOOOM!!"
pt = "É aqueles mago. Eles num gosta dos imp, aí faz nóis fazer BUUUM!!"

[.skill_hunter_magicbox_20]
en = "It's not that bad."
pt = "Não é tão ruim assim."

[.skill_hunter_magicbox_21]
en = "It's not that bad. You've got four big windows, charming company...er..."
pt = "Não é tão ruim assim. Você tem quatro janelas grandes, uma companhia encantadora... é..."

[.skill_hunter_magicbox_22]
en = "Yeah, we's love tiny, crampt space. It be magical. But I is a busy imp, innit? Dragons needin' ticklin', shiny relics needin' stealin', you know how it goes."
pt = "É, nóis ama lugar apertadinho, é mágico. Mas eu sou um imp ocupado, né não? Dragão pra fazer cócega, relíquia brilhante pra roubar, cê sabe como é."

[.skill_hunter_magicbox_23]
en = "So, if you's know whas good for ya, you'd be lettin' me go, right?"
pt = "Então, se cê sabe o que é bom pra tu, cê vai me soltar, né?"

[.skill_hunter_magicbox_24]
en = "Don't I get three wishes?"
pt = "Eu não ganho três desejos?"

[.skill_hunter_magicbox_25]
en = "Nah, mate. Dunno what you're chirpin' about."
pt = "Nada, parça. Num sei do que cê tá piando."

[.skill_hunter_magicbox_26]
en = "Well, you're a magical creature aren't you? Surely I get some wishes for capturing you, or releasing you, or something?"
pt = "Bom, você é uma criatura mágica, não é? Eu devia ganhar uns desejos por capturar você, ou por soltar você, ou algo assim."

[.skill_hunter_magicbox_27]
en = "I'm finking dat you be a bit confoosed. I is an imp, not some namby-pamby genie or some kinda fairy. Ye can tell by the horns."
pt = "Acho que cê tá meio confuzo. Eu sou um imp, num sou gênio frescurento nem fada nenhuma. Dá pra ver pelos chifre."

[.skill_hunter_magicbox_28]
en = "Sayin' dat, I don't fancy being cooped up like one of me uncle's pigeons. Tell you what, is there anything you need deliverin' to the bank?"
pt = "Mas falando nisso, num quero ficar preso que nem os pombo do meu tio. Faz assim: tem alguma coisa que cê precisa mandar pro banco?"

[.skill_hunter_magicbox_29]
en = "I may not be no cunjerer or sommink like dat, but I can get about nice an quick like. If you let me scarper, I'll take a couple of fings to the bank for ya. You game?"
pt = "Posso num ser feiticero nem nada disso, mas eu me mexo rapidinho. Se cê me deixar vazar, eu levo umas duas coisa pro banco pra tu. Topa?"

[.skill_hunter_magicbox_30]
en = "Okay, that sounds fair."
pt = "Certo, parece justo."

[.skill_hunter_magicbox_31]
en = "Surely it should be three items?"
pt = "Não deviam ser três itens?"

[.skill_hunter_magicbox_32]
en = "Surely it should be three items? Then it's one item per wish."
pt = "Não deviam ser três itens? Aí seria um item por desejo."

[.skill_hunter_magicbox_33]
en = "I've already told ya, I ain't no bloomin' fairy. Besides, you know wot dey say, three's a crowd innit? I don't fink I can hop about carryin' more dan 2 fings."
pt = "Eu já te falei, num sou fada nenhuma, ora bolas. E outra, cê sabe o que dizem: três é demais, né não? Acho que num consigo pular por aí carregando mais que 2 coisa."

[.skill_hunter_magicbox_34]
en = "I've got nothing I need banking right now."
pt = "Não tenho nada para mandar ao banco agora."

[.skill_hunter_magicbox_35]
en = "Great, just blinkin great, dat is. I'll just sit about countin' zombie sheep then. One...two...two and a bit...three and a bit more... I don't fink sheep 'ave dat many legs..."
pt = "Ótimo, simplesmente ótimo. Vou ficar aqui sentado contando ovelha zumbi. Uma... duas... duas e um pouco... três e mais um pouco... Acho que ovelha num tem tanta perna assim..."

[.skill_hunter_magicbox_36]
en = "You've caught an %1%!"
pt = "Você capturou: %1%!"

