en = "Well I'm not giving it to you, now! I'll never get it back."
pt = "Então agora é que eu não te dou! Nunca mais ia ver ele de volta."

[.skill_summoning_familiar_spiritkyatt_7]
en = "Then you leave me no choice but to destroy YOU, human!"
pt = "Então não me deixa escolha a não ser destruir VOCÊ, humano!"

[.skill_summoning_familiar_spiritkyatt_8]
en = "Bad kitty!"
pt = "Gatinho malvado!"

[.skill_summoning_familiar_spiritkyatt_9]
en = "Guess who wants a belly rub, human."
pt = "Adivinhe quem quer um carinho na barriga, humano."

[.skill_summoning_familiar_spiritkyatt_10]
en = "Umm...is it me?"
pt = "Hum...sou eu?"

[.skill_summoning_familiar_spiritkyatt_11]
en = "No, human, it is not you. Guess again."
pt = "Não, humano, não é você. Tente de novo."

[.skill_summoning_familiar_spiritkyatt_12]
en = "Is it the Duke of Lumbridge?"
pt = "É o Duke de Lumbridge?"

[.skill_summoning_familiar_spiritkyatt_13]
en = "You try my patience, human!"
pt = "Você testa a minha paciência, humano!"

[.skill_summoning_familiar_spiritkyatt_14]
en = "Is it Zamorak? That would explain why he's so cranky."
pt = "É o Zamorak? Isso explicaria por que ele é tão rabugento."

[.skill_summoning_familiar_spiritkyatt_15]
en = "Please do not make me destroy you before I get my belly rub!"
pt = "Por favor, não me faça destruir você antes do meu carinho na barriga!"

[.skill_summoning_familiar_spiritkyatt_16]
en = "Here, kitty!"
pt = "Vem cá, gatinho!"

[.skill_summoning_familiar_spiritkyatt_17]
en = "What do you want, human?"
pt = "O que você quer, humano?"

[.skill_summoning_familiar_spiritkyatt_18]
en = "I just thought I would see how you were."
pt = "Só queria saber como você estava."

[.skill_summoning_familiar_spiritkyatt_19]
en = "I do not have time for your distractions. Leave me be!"
pt = "Não tenho tempo para as suas distrações. Deixe-me em paz!"

[.skill_summoning_familiar_spiritkyatt_20]
en = "Well, sorry! Would a ball of wool cheer you up?"
pt = "Bom, desculpa! Um novelo de lã te animaria?"

[.skill_summoning_familiar_spiritkyatt_21]
en = "How dare you insult my intelli- what colour wool?"
pt = "Como ousa insultar a minha intelig- de que cor é a lã?"

[.skill_summoning_familiar_spiritkyatt_22]
en = "Umm...white?"
pt = "Hum...branca?"

[.skill_summoning_familiar_spiritkyatt_23]
en = "I will end you!"
pt = "Eu vou acabar com você!"

[.skill_summoning_familiar_spiritkyatt_24]
en = "Hello, kitty cat!"
pt = "Olá, gatinho!"

[.skill_summoning_familiar_spiritkyatt_25]
en = "Human, leave me be. I'm far too busy to deal with your nonsense."
pt = "Humano, me deixe em paz. Estou ocupado demais para as suas bobagens."

[.skill_summoning_familiar_spiritkyatt_26]
en = "What are you up to?"
pt = "O que você está fazendo?"

[.skill_summoning_familiar_spiritkyatt_27]
en = "I am engaged in an intricate dirt-purging operation!"
pt = "Estou empenhado numa complexa operação de remoção de sujeira!"

[.skill_summoning_familiar_spiritkyatt_28]
en = "Aww, kitty's cleaning his paws! How cute!"
pt = "Own, o gatinho está limpando as patinhas! Que fofo!"

[.skill_summoning_familiar_spiritkyatt_29]
en = "Know this, human. Once I finish cleaning my paws..."
pt = "Saiba de uma coisa, humano. Assim que eu terminar de limpar as patas..."

[.skill_summoning_familiar_spiritkyatt_30]
en = "I will destroy you!"
pt = "Eu vou destruir você!"

[.skill_summoning_familiar_spiritkyatt_31]
en = "Do not toy with me, human!"
pt = "Não brinque comigo, humano!"

[.skill_summoning_familiar_spiritkyatt_32]
en = "What about under your chin?"
pt = "E embaixo do queixo?"

[.skill_summoning_familiar_spiritkyatt_33]
en = "I am not one of your playful kittens, human. I eat playful kittens for breakfast!"
pt = "Não sou um dos seus gatinhos brincalhões, humano. Eu como gatinhos brincalhões no café da manhã!"

[.skill_summoning_familiar_spiritkyatt_34]
en = "Not even behind your ears?"
pt = "Nem atrás das orelhas?"

[.skill_summoning_familiar_spiritkyatt_35]
en = "You lean down and tickle the kyatt behind the ears."
pt = "Você se abaixa e faz cócegas atrás das orelhas do kyatt."

[.skill_summoning_familiar_spiritkyatt_36]
en = "I will...purrrrr...ooh that's quite nice...destroy...purrrrrrr...you."
pt = "Eu vou...purrrrr...ooh, que gostoso...destruir...purrrrrrr...você."

# Skills - summoning/familiar/SpiritLarupia.kt

[.skill_summoning_familiar_spiritlarupia_1]
en = "Kitty cat!"
pt = "Gatinho!"

[.skill_summoning_familiar_spiritlarupia_2]
en = "What is your wish master?"
pt = "Qual é o seu desejo, mestre?"

[.skill_summoning_familiar_spiritlarupia_3]
en = "Have you ever thought about doing something other than hunting and serving me?"
pt = "Você já pensou em fazer outra coisa além de caçar e me servir?"

[.skill_summoning_familiar_spiritlarupia_4]
en = "You mean, like stand-up comedy, master?"
pt = "Quer dizer, tipo comédia stand-up, mestre?"

[.skill_summoning_familiar_spiritlarupia_5]
en = "Umm...yes, like that."
pt = "Hum...é, tipo isso."

[.skill_summoning_familiar_spiritlarupia_6]
en = "No, master."
pt = "Não, mestre."

[.skill_summoning_familiar_spiritlarupia_7]
en = "Hello friend!"
pt = "Olá, amigo!"

[.skill_summoning_familiar_spiritlarupia_8]
en = "'Friend', master? I do not understand this word."
pt = "'Amigo', mestre? Não entendo essa palavra."

[.skill_summoning_familiar_spiritlarupia_9]
en = "Friends are people, or animals, who like one another. I think we are friends."
pt = "Amigos são pessoas, ou animais, que gostam uns dos outros. Acho que nós somos amigos."

[.skill_summoning_familiar_spiritlarupia_10]
en = "Ah, I think I understand friends, master."
pt = "Ah, acho que entendo o que são amigos, mestre."

[.skill_summoning_familiar_spiritlarupia_11]
en = "Great!"
pt = "Ótimo!"

[.skill_summoning_familiar_spiritlarupia_12]
en = "A friend is someone who looks tasty, but you don't eat."
pt = "Amigo é alguém que parece delicioso, mas que você não devora."

[.skill_summoning_familiar_spiritlarupia_13]
en = "What are we doing today, master?"
pt = "O que vamos fazer hoje, mestre?"

[.skill_summoning_familiar_spiritlarupia_14]
en = "I don't know, what do you want to do?"
pt = "Não sei, o que você quer fazer?"

[.skill_summoning_familiar_spiritlarupia_15]
en = "I desire only to hunt and to serve my master."
pt = "Desejo apenas caçar e servir ao meu mestre."

[.skill_summoning_familiar_spiritlarupia_16]
en = "Err...great! I guess I'll decide then."
pt = "Hã...ótimo! Acho que eu decido, então."

[.skill_summoning_familiar_spiritlarupia_17]
en = "Master, do you ever worry that I might eat you?"
pt = "Mestre, você nunca tem medo de que eu te devore?"

[.skill_summoning_familiar_spiritlarupia_18]
en = "No, of course not! We're pals."
pt = "Não, claro que não! Somos parceiros."

[.skill_summoning_familiar_spiritlarupia_19]
en = "That is good, master."
pt = "Isso é bom, mestre."

[.skill_summoning_familiar_spiritlarupia_20]
en = "Should I?"
pt = "Deveria?"

[.skill_summoning_familiar_spiritlarupia_21]
en = "Of course not, master."
pt = "Claro que não, mestre."

[.skill_summoning_familiar_spiritlarupia_22]
en = "Oh. Good."
pt = "Ah. Que bom."

# Skills - summoning/familiar/SpiritMosquito.kt

[.skill_summoning_familiar_spiritmosquito_1]
en = "You have lovely ankles."
pt = "Que tornozelos lindos você tem."

[.skill_summoning_familiar_spiritmosquito_2]
en = "Am I meant to be pleased by that?"
pt = "Era para eu ficar lisonjeado com isso?"

[.skill_summoning_familiar_spiritmosquito_3]
en = "Thin skin. Your delicious blood is easier to get too."
pt = "Pele fina. Fica mais fácil chegar no seu sangue delicioso."

[.skill_summoning_familiar_spiritmosquito_4]
en = "I knew I couldn't trust you."
pt = "Eu sabia que não podia confiar em você."

[.skill_summoning_familiar_spiritmosquito_5]
en = "Oh come on, you won't feel a thing..."
pt = "Ah, qual é, você nem vai sentir nada..."

[.skill_summoning_familiar_spiritmosquito_6]
en = "How about that local sports team?"
pt = "E aquele time da cidade, hein?"

[.skill_summoning_familiar_spiritmosquito_7]
en = "Which one? The gnomeball team?"
pt = "Qual? O time de gnomeball?"

[.skill_summoning_familiar_spiritmosquito_8]
en = "I must confess: I have no idea."
pt = "Confesso: não faço ideia."

[.skill_summoning_familiar_spiritmosquito_9]
en = "Why did you ask, then?"
pt = "Então por que perguntou?"

[.skill_summoning_familiar_spiritmosquito_10]
en = "I was just trying to be friendly."
pt = "Só estava tentando ser simpático."

[.skill_summoning_familiar_spiritmosquito_11]
en = "Just trying to get to my veins, more like!"
pt = "Tentando chegar nas minhas veias, isso sim!"

[.skill_summoning_familiar_spiritmosquito_12]
en = "Have you ever tasted pirate blood?"
pt = "Você já provou sangue de pirata?"

[.skill_summoning_familiar_spiritmosquito_13]
en = "Why would I drink pirate blood?"
pt = "Por que eu beberia sangue de pirata?"

[.skill_summoning_familiar_spiritmosquito_14]
en = "How about dwarf blood?"
pt = "E sangue de anão?"

[.skill_summoning_familiar_spiritmosquito_15]
en = "I don't think you quite understand..."
pt = "Acho que você não está entendendo..."

[.skill_summoning_familiar_spiritmosquito_16]
en = "Gnome blood, then?"
pt = "Sangue de gnomo, então?"

[.skill_summoning_familiar_spiritmosquito_17]
en = "I'm soooo hungry!"
pt = "Tô com taaaanta fome!"

[.skill_summoning_familiar_spiritmosquito_18]
en = "What would you like to eat?"
pt = "O que você gostaria de comer?"

[.skill_summoning_familiar_spiritmosquito_19]
en = "Well, if you're not too attached to your elbow..."
pt = "Bem, se você não for muito apegado ao seu cotovelo..."

[.skill_summoning_familiar_spiritmosquito_20]
en = "You can't eat my elbow! You don't have teeth!"
pt = "Você não pode comer meu cotovelo! Você nem tem dentes!"

[.skill_summoning_familiar_spiritmosquito_21]
en = "Tell me about it. Cousin Nigel always makes fun of me. Calls me 'No-teeth'."
pt = "Nem me fale. O primo Nigel vive tirando sarro de mim. Me chama de 'Banguela'."

# Skills - summoning/familiar/SpiritScorpion.kt

[.skill_summoning_familiar_spiritscorpion_1]
en = "Hey, boss, how about we go to the bank?"
pt = "Ô chefe, que tal a gente ir ao banco?"

[.skill_summoning_familiar_spiritscorpion_2]
en = "And do what?"
pt = "Para fazer o quê?"

[.skill_summoning_familiar_spiritscorpion_3]
en = "Well, we could open by shouting, 'Stand and deliver!'"
pt = "Bom, a gente podia começar gritando: 'Isto é um assalto!'"

[.skill_summoning_familiar_spiritscorpion_4]
en = "Why does everything with you end with something getting held up?"
pt = "Por que tudo com você acaba em assalto?"

[.skill_summoning_familiar_spiritscorpion_5]
en = "That isn't true! Give me one example."
pt = "Não é verdade! Me dá um exemplo."

[.skill_summoning_familiar_spiritscorpion_6]
en = "How about the post office?"
pt = "Que tal a agência dos correios?"

[.skill_summoning_familiar_spiritscorpion_7]
en = "How about another?"
pt = "Que tal outro?"

[.skill_summoning_familiar_spiritscorpion_8]
en = "Those junior White Knights? The ones selling the gnome crunchies?"
pt = "Aqueles escoteiros dos White Knights? Os que vendiam gnome crunchies?"

[.skill_summoning_familiar_spiritscorpion_9]
en = "That was self defence."
pt = "Foi legítima defesa."

[.skill_summoning_familiar_spiritscorpion_10]
en = "No! No more hold-ups, stick-ups, thefts, or heists, you got that?"
pt = "Não! Chega de assaltos, roubos, furtos e golpes, entendeu?"

[.skill_summoning_familiar_spiritscorpion_11]
en = "Say hello to my little friend!"
pt = "Diga olá para o meu amiguinho!"

[.skill_summoning_familiar_spiritscorpion_12]
en = "My little friend: you ignored him last time you met him."
pt = "Meu amiguinho: você o ignorou da última vez que o viu."

[.skill_summoning_familiar_spiritscorpion_13]
en = "So, who is your friend?"
pt = "Tá, e quem é o seu amigo?"

[.skill_summoning_familiar_spiritscorpion_14]
en = "If I tell you, what is the point?"
pt = "Se eu contar, qual é a graça?"

[.skill_summoning_familiar_spiritscorpion_15]
en = "Hey, boss, I've been thinking."
pt = "Ô chefe, eu andei pensando."

[.skill_summoning_familiar_spiritscorpion_16]
en = "That's never a good sign."
pt = "Isso nunca é bom sinal."

[.skill_summoning_familiar_spiritscorpion_17]
en = "See, I heard about this railway..."
pt = "Sabe, ouvi falar de uma ferrovia..."

[.skill_summoning_familiar_spiritscorpion_18]
en = "We are not robbing it!"
pt = "Não vamos assaltar trem nenhum!"

[.skill_summoning_familiar_spiritscorpion_19]
en = "I might not have wanted to suggest that, boss..."
pt = "Talvez eu nem fosse sugerir isso, chefe..."

[.skill_summoning_familiar_spiritscorpion_20]
en = "Then what were you going to suggest?"
pt = "Então o que você ia sugerir?"

[.skill_summoning_familiar_spiritscorpion_21]
en = "That isn't important right now."
pt = "Isso não importa agora."

[.skill_summoning_familiar_spiritscorpion_22]
en = "I thought as much."
pt = "Foi o que pensei."

[.skill_summoning_familiar_spiritscorpion_23]
en = "Why do we never go to crossroads and rob travelers?"
pt = "Por que a gente nunca vai a uma encruzilhada roubar viajantes?"

[.skill_summoning_familiar_spiritscorpion_24]
en = "There are already highwaymen at the good spots."
pt = "Os salteadores já ocuparam os melhores pontos."

[.skill_summoning_familiar_spiritscorpion_25]
en = "Maybe we need to think bigger."
pt = "Talvez a gente precise pensar grande."

# Skills - summoning/familiar/SpiritSpider.kt

[.skill_summoning_familiar_spiritspider_1]
en = "So, do I get any of those flies?"
pt = "E aí, eu vou ganhar alguma dessas moscas?"

[.skill_summoning_familiar_spiritspider_2]
en = "I don't know, I was saving these for a pet."
pt = "Sei lá, eu estava guardando pra um bichinho de estimação."

[.skill_summoning_familiar_spiritspider_3]
en = "I see..."
pt = "Entendi..."

[.skill_summoning_familiar_spiritspider_4]
en = "Look, you can have some if you want."
pt = "Olha, pode pegar umas, se quiser."

[.skill_summoning_familiar_spiritspider_5]
en = "Oh, don't do me any favours."
pt = "Ah, não precisa me fazer favor nenhum."

[.skill_summoning_familiar_spiritspider_6]
en = "Look, here, have some!"
pt = "Olha, toma, pega umas!"

[.skill_summoning_familiar_spiritspider_7]
en = "Don't want them now."
pt = "Agora não quero mais."

[.skill_summoning_familiar_spiritspider_8]
en = "Siiiigh...spiders."
pt = "Aaaaaff... aranhas."

[.skill_summoning_familiar_spiritspider_9]
en = "Where are we going?"
pt = "Pra onde a gente vai?"

[.skill_summoning_familiar_spiritspider_10]
en = "I've not decided yet."
pt = "Ainda não decidi."

[.skill_summoning_familiar_spiritspider_11]
en = "Fine, don't tell me..."
pt = "Tá bom, não me conta..."

[.skill_summoning_familiar_spiritspider_12]
en = "Oh, okay, well, we are going..."
pt = "Ah, tá, bom, a gente vai..."

[.skill_summoning_familiar_spiritspider_13]
en = "Don't want to know now."
pt = "Agora não quero mais saber."

[.skill_summoning_familiar_spiritspider_14]
en = "Who is that?"
pt = "Quem é aquele?"

[.skill_summoning_familiar_spiritspider_15]
en = "Who?"
pt = "Quem?"

[.skill_summoning_familiar_spiritspider_16]
en = "The two-legs over there."
pt = "O duas-pernas ali."

[.skill_summoning_familiar_spiritspider_17]
en = "I can't see who you mean..."
pt = "Não estou vendo quem você quer dizer..."

[.skill_summoning_familiar_spiritspider_18]
en = "Never mind..."
pt = "Deixa pra lá..."

[.skill_summoning_familiar_spiritspider_19]
en = "Can you describe them a little better..."
pt = "Dá pra descrever um pouco melhor..."

[.skill_summoning_familiar_spiritspider_20]
en = "It doesn't matter now."
pt = "Agora não importa mais."

[.skill_summoning_familiar_spiritspider_21]
en = "What are you doing?"
pt = "O que você está fazendo?"

[.skill_summoning_familiar_spiritspider_22]
en = "Nothing that you should concern yourself with."
pt = "Nada com que você precise se preocupar."

[.skill_summoning_familiar_spiritspider_23]
en = "I see, you don't think I'm smart enough to understand..."
pt = "Entendi, você acha que eu não sou esperto o bastante pra entender..."

[.skill_summoning_familiar_spiritspider_24]
en = "That's not it at all! Look, I was..."
pt = "Não é nada disso! Olha, eu estava..."

[.skill_summoning_familiar_spiritspider_25]
en = "Don't wanna know now."
pt = "Agora não quero saber."

[.skill_summoning_familiar_spiritspider_26]
en = "What is it now?"
pt = "O que foi agora?"

[.skill_summoning_familiar_spiritspider_27]
en = "Nothing really."
pt = "Nada, na verdade."

[.skill_summoning_familiar_spiritspider_28]
en = "Oh, well that's a relief."
pt = "Ufa, que alívio."

# Skills - summoning/familiar/SpiritTerrorbird.kt

[.skill_summoning_familiar_spiritterrorbird_1]
en = "This is a fun little walk."
pt = "Que passeio divertido."

[.skill_summoning_familiar_spiritterrorbird_2]
en = "Why do I get the feeling you'll change your tune when I start loading you up with items?"
pt = "Por que será que eu acho que você vai cantar outra música quando eu começar a te encher de itens?"

[.skill_summoning_familiar_spiritterrorbird_3]
en = "I can keep this up for hours."
pt = "Aguento isso por horas."

[.skill_summoning_familiar_spiritterrorbird_4]
en = "I'm glad, as we still have plenty of time to go."
pt = "Que bom, porque ainda temos muito caminho pela frente."

[.skill_summoning_familiar_spiritterrorbird_5]
en = "Are we going to visit a bank soon?"
pt = "A gente vai passar num banco logo?"

[.skill_summoning_familiar_spiritterrorbird_6]
en = "I'm not sure, you still have plenty of room for more stuff."
pt = "Não sei, você ainda tem bastante espaço pra mais coisas."

[.skill_summoning_familiar_spiritterrorbird_7]
en = "Just don't leave it too long, okay?"
pt = "Só não demora muito, tá?"

[.skill_summoning_familiar_spiritterrorbird_8]
en = "Can we go to a bank now?"
pt = "Podemos ir pro banco agora?"

[.skill_summoning_familiar_spiritterrorbird_9]
en = "Just give me a little longer, okay?"
pt = "Só me dá mais um pouquinho, tá?"

[.skill_summoning_familiar_spiritterrorbird_10]
en = "That's what you said last time!"
pt = "Foi o que você disse da última vez!"

[.skill_summoning_familiar_spiritterrorbird_11]
en = "Did I?"
pt = "Eu disse?"

[.skill_summoning_familiar_spiritterrorbird_12]
en = "Yes!"
pt = "Sim!"

[.skill_summoning_familiar_spiritterrorbird_13]
en = "Well, I mean it this time, promise."
pt = "Bom, dessa vez é sério, prometo."

[.skill_summoning_familiar_spiritterrorbird_14]
en = "So...heavy..."
pt = "Tão... pesado..."

[.skill_summoning_familiar_spiritterrorbird_15]
en = "I knew you'd change your tune once you started carrying things."
pt = "Eu sabia que você ia cantar outra música quando começasse a carregar coisas."

[.skill_summoning_familiar_spiritterrorbird_16]
en = "Can we go bank this stuff now?"
pt = "Podemos ir guardar essas coisas no banco agora?"

[.skill_summoning_familiar_spiritterrorbird_17]
en = "Sure. You do look like you're about to collapse."
pt = "Claro. Você parece que vai desabar a qualquer momento."

# Skills - summoning/familiar/SpiritTzKih.kt

[.skill_summoning_familiar_spirittzkih_1]
en = "You drink pray, me drink pray."
pt = "Você bebe reza, mim bebe reza."

[.skill_summoning_familiar_spirittzkih_2]
en = "What's that, Tz-Kih?"
pt = "Como é, Tz-Kih?"

[.skill_summoning_familiar_spirittzkih_3]
en = "You got pray pray pot. Tz-Kih drink pray pray you, you drink pray pray pot."
pt = "Você tem pote de reza reza. Tz-Kih bebe reza reza de você, você bebe pote de reza reza."

[.skill_summoning_familiar_spirittzkih_4]
en = "You want to drink my Prayer points?"
pt = "Você quer beber os meus pontos de oração?"

[.skill_summoning_familiar_spirittzkih_5]
en = "Yes. Pray pray."
pt = "Sim. Reza reza."

[.skill_summoning_familiar_spirittzkih_6]
en = "Err, not right now, Tz-Kih. I, er, need them myself."
pt = "Hã, agora não, Tz-Kih. Eu, hã, preciso deles."

[.skill_summoning_familiar_spirittzkih_7]
en = "But, pray praaaay...?"
pt = "Mas... reza rezaaaa...?"

[.skill_summoning_familiar_spirittzkih_8]
en = "How's it going, Tz-kih?"
pt = "Como vai, Tz-Kih?"

[.skill_summoning_familiar_spirittzkih_9]
en = "Pray pray?"
pt = "Reza reza?"

[.skill_summoning_familiar_spirittzkih_10]
en = "Don't start with all that again."
pt = "Não começa com isso de novo."

[.skill_summoning_familiar_spirittzkih_11]
en = "Hmph, silly JalYt."
pt = "Hmpf, JalYt bobo."

[.skill_summoning_familiar_spirittzkih_12]
en = "Does JalYt think Tz-kih as strong as Jad Jad?"
pt = "JalYt acha Tz-Kih forte igual Jad Jad?"

[.skill_summoning_familiar_spirittzkih_13]
en = "Are you as strong as TzTok-Jad? Yeah, sure, why not."
pt = "Se você é tão forte quanto o TzTok-Jad? Claro, por que não."

[.skill_summoning_familiar_spirittzkih_14]
en = "Really? Thanks, JalYt. Tz-Kih strong and happy."
pt = "Verdade? Obrigado, JalYt. Tz-Kih forte e feliz."

[.skill_summoning_familiar_spirittzkih_15]
en = "Have you heard of blood bat, JalYt?"
pt = "Você conhece morcego de sangue, JalYt?"

[.skill_summoning_familiar_spirittzkih_16]
en = "Blood bats? You mean vampire bats?"
pt = "Morcegos de sangue? Quer dizer morcegos-vampiros?"

[.skill_summoning_familiar_spirittzkih_17]
en = "Yes. Blood bat."
pt = "Sim. Morcego de sangue."

[.skill_summoning_familiar_spirittzkih_18]
en = "Yes, I've heard of them. What about them?"
pt = "Sim, já ouvi falar. O que tem eles?"

[.skill_summoning_familiar_spirittzkih_19]
en = "Tz-Kih like blood bat, but drink pray pray not blood blood. Blood blood is yuck."
pt = "Tz-Kih parece morcego de sangue, mas bebe reza reza, não sangue sangue. Sangue sangue é eca."

[.skill_summoning_familiar_spirittzkih_20]
en = "Thanks, Tz-Kih, that's nice to know."
pt = "Obrigado, Tz-Kih, bom saber."

[.skill_summoning_familiar_spirittzkih_21]
en = "Pray pray pray pray pray pray pray pray!"
pt = "Reza reza reza reza reza reza reza reza!"

[.skill_summoning_familiar_spirittzkih_22]
en = "Calm down, Tz-Kih, we'll find you something to drink soon."
pt = "Calma, Tz-Kih, logo a gente acha algo para você beber."

[.skill_summoning_familiar_spirittzkih_23]
en = "Pray praaaaaaaaaaaaaay!"
pt = "Reza rezaaaaaaaaaaaaaa!"

[.skill_summoning_familiar_spirittzkih_24]
en = "Okay, okay. Calm down!"
pt = "Tá bom, tá bom. Calma!"

# Skills - summoning/familiar/SpiritWolf.kt

[.skill_summoning_familiar_spiritwolf_1]
en = "Whuff-whuff! Arf!<br>(Throw the bone! I want to chase!)"
pt = "Whuff-whuff! Arf!<br>(Joga o osso! Quero correr atrás!)"

[.skill_summoning_familiar_spiritwolf_2]
en = "I can't just throw bones away - I need them to train my Prayer!"
pt = "Não posso sair jogando ossos fora - preciso deles para treinar Prayer (oração)!"

[.skill_summoning_familiar_spiritwolf_3]
en = "Whurf?<br>(What are you doing?)"
pt = "Whurf?<br>(O que você está fazendo?)"

[.skill_summoning_familiar_spiritwolf_4]
en = "Oh, just some...biped thing. I'm sure it would bored you."
pt = "Ah, só uma... coisa de bípede. Tenho certeza de que ia te entediar."

[.skill_summoning_familiar_spiritwolf_5]
en = "Bark! Bark!<br>(Danger!)"
pt = "Au! Au!<br>(Perigo!)"

[.skill_summoning_familiar_spiritwolf_6]
en = "Whiiiine...<br>(False alarm...)"
pt = "Whiiiine...<br>(Alarme falso...)"

[.skill_summoning_familiar_spiritwolf_7]
en = "Pant pant whine?<br>(When am I going to get to chase something?)"
pt = "Pant pant whine?<br>(Quando é que eu vou poder correr atrás de alguma coisa?)"

[.skill_summoning_familiar_spiritwolf_8]
en = "Oh, I'm sure we'll find something for you in a bit."
pt = "Ah, tenho certeza de que logo vamos achar alguma coisa para você."

[.skill_summoning_familiar_spiritwolf_9]
en = "Whuff whuff. Pantpant awf!<br>(I smell something good. Hunting time!)"
pt = "Whuff whuff. Pantpant awf!<br>(Sinto um cheiro bom. Hora da caçada!)"

[.skill_summoning_familiar_spiritwolf_10]
en = "We can go hunting in a moment. I just have to take care of something first."
pt = "Daqui a pouco a gente vai caçar. Só preciso resolver uma coisa antes."

# Skills - summoning/familiar/SteelTitan.kt

[.skill_summoning_familiar_steeltitan_1]
en = "Forward, master, to a battle that will waken the gods!"
pt = "Avante, mestre, para uma batalha que despertará os deuses!"

[.skill_summoning_familiar_steeltitan_2]
en = "I'd rather not, if it's all the same to you."
pt = "Prefiro não, se para você tanto faz."

[.skill_summoning_familiar_steeltitan_3]
en = "I shall never meet my end at this rate..."
pt = "Nesse ritmo, jamais encontrarei o meu fim..."

[.skill_summoning_familiar_steeltitan_4]
en = "How do you wish to meet your end, master?"
pt = "Como deseja encontrar o seu fim, mestre?"

[.skill_summoning_familiar_steeltitan_5]
en = "Hopefully not for a very long time."
pt = "De preferência, só daqui a muito tempo."

[.skill_summoning_familiar_steeltitan_6]
en = "You do not wish to be torn asunder by the thousand limbs of a horde of demons?"
pt = "Não deseja ser despedaçado pelos mil membros de uma horda de demônios?"

[.skill_summoning_familiar_steeltitan_7]
en = "No! I'm quite happy picking flax and turning unstrung bows into gold..."
pt = "Não! Estou muito feliz colhendo linho (flax) e transformando arcos sem corda em ouro..."

[.skill_summoning_familiar_steeltitan_8]
en = "Why must we dawdle when glory awaits?"
pt = "Por que perder tempo quando a glória nos aguarda?"

[.skill_summoning_familiar_steeltitan_9]
en = "I'm beginning to think you just want me to die horribly..."
pt = "Estou começando a achar que você só quer que eu morra de um jeito horrível..."

[.skill_summoning_familiar_steeltitan_10]
en = "We could have deaths that bards sing of for a thousand years."
pt = "Poderíamos ter mortes cantadas pelos bardos por mil anos."

[.skill_summoning_familiar_steeltitan_11]
en = "That's not much compensation."
pt = "Isso não me consola muito."

[.skill_summoning_familiar_steeltitan_12]
en = "Master, we should be marching into glorious battle!"
pt = "Mestre, devíamos estar marchando rumo a uma batalha gloriosa!"

[.skill_summoning_familiar_steeltitan_13]
en = "You know, I think you're onto something."
pt = "Sabe, acho que você tem razão."

[.skill_summoning_familiar_steeltitan_14]
en = "We could find a death befitting such heroes of RuneScape!"
pt = "Poderíamos encontrar uma morte digna de tais heróis de RuneScape!"

[.skill_summoning_familiar_steeltitan_15]
en = "Ah. You know, I'd prefer not to die..."
pt = "Ah. Sabe, eu prefiro não morrer..."

[.skill_summoning_familiar_steeltitan_16]
en = "Beneath the claws of a mighty foe shall I be sent into the embrace of death!"
pt = "Sob as garras de um inimigo poderoso serei lançado ao abraço da morte!"

[.skill_summoning_familiar_steeltitan_17]
en = "Let us go forth to battle, my lord!"
pt = "Partamos para a batalha, meu senhor!"

[.skill_summoning_familiar_steeltitan_18]
en = "Why do you like fighting so much? It's not very nice to kill things."
pt = "Por que você gosta tanto de lutar? Não é muito legal matar as coisas."

[.skill_summoning_familiar_steeltitan_19]
en = "It is the most honourable thing in life."
pt = "É o que há de mais honrado na vida."

[.skill_summoning_familiar_steeltitan_20]
en = "But I summoned you, I'm not sure I can even say that you're alive..."
pt = "Mas fui eu que te invoquei, nem sei se dá para dizer que você está vivo..."

[.skill_summoning_familiar_steeltitan_21]
en = "Alas, you have discovered the woe of all summoned creatures' existence."
pt = "Ai de mim, você descobriu a desgraça da existência de toda criatura invocada."

[.skill_summoning_familiar_steeltitan_22]
en = "Really? I was right?"
pt = "Sério? Eu acertei?"

[.skill_summoning_familiar_steeltitan_23]
en = "Oh, woe...woe!"
pt = "Oh, desgraça... desgraça!"

# Skills - summoning/familiar/Stormbringer.kt

[.skill_summoning_familiar_stormbringer_1]
en = "Little cub, I see you have questions for me."
pt = "Pequeno filhote, vejo que tem perguntas para mim."

[.skill_summoning_familiar_stormbringer_2]
en = "How do you cast magic? You don't seem to carry any runes."
pt = "Como você lança magia? Parece que não carrega nenhuma runa."

[.skill_summoning_familiar_stormbringer_3]
en = "So, how can I possibly form magic?"
pt = "Então, como posso eu formar magia?"

[.skill_summoning_familiar_stormbringer_4]
en = "Yes, I guess."
pt = "É, acho que sim."

[.skill_summoning_familiar_stormbringer_5]
en = "You are right, we have no runes, but some of us are born with currents of magic rippling over our bodies. Such is the power generated by a stormbringer that we render our mothers blind and infertile during childbirth."
pt = "Tem razão, não temos runas, mas alguns de nós nascem com correntes de magia ondulando pelo corpo. Tamanho é o poder gerado por um stormbringer que deixamos nossas mães cegas e inférteis no parto."

[.skill_summoning_familiar_stormbringer_6]
en = "One day I hope to be a Blind Mother. They are highly esteemed and carried on the back of their own worldbearer."
pt = "Um dia espero ser uma Mãe Cega. Elas são muito estimadas e carregadas nas costas do seu próprio worldbearer."

[.skill_summoning_familiar_stormbringer_7]
en = "How powerful is a stormbringer? Have you killed a dragon?"
pt = "Quão poderoso é um stormbringer? Você já matou um dragão?"

[.skill_summoning_familiar_stormbringer_8]
en = "A drah-gon? Is that like the triple-bellied wolflok?"
pt = "Um dra-gão? É parecido com o wolflok de três barrigas?"

[.skill_summoning_familiar_stormbringer_9]
en = "Probably not. Twenty-feet high, firebreathing?"
pt = "Acho que não. Seis metros de altura, cospe fogo?"

[.skill_summoning_familiar_stormbringer_10]
en = "Oh, it sounds much like! Seven heads? Large bellows on its sides, pumping out acid?"
pt = "Oh, parece bem igual! Sete cabeças? Grandes foles nos lados, bombeando ácido?"

[.skill_summoning_familiar_stormbringer_11]
en = "Bellows? No, definitely no bellows."
pt = "Foles? Não, com certeza nada de foles."

[.skill_summoning_familiar_stormbringer_12]
en = "Then it is a shame. The creatures on our plane sound far more dangerous."
pt = "Então é uma pena. As criaturas do nosso plano parecem muito mais perigosas."

[.skill_summoning_familiar_stormbringer_13]
en = "I like it very little. I grow tired of this place."
pt = "Gosto muito pouco. Estou me cansando deste lugar."

[.skill_summoning_familiar_stormbringer_14]
en = "Then why don't you just leave? If you're so tired of floating about behind me, why don't you just go?"
pt = "Então por que não vai embora? Se está tão cansado de flutuar atrás de mim, por que não vai logo?"

[.skill_summoning_familiar_stormbringer_15]
en = "Do not tempt me. You are like a tiny pup, nibbling and barking at my heel. I am here because the gorajos greatest duty is to hinder the one who created this place."
pt = "Não me tente. Você é como um filhotinho, mordiscando e latindo no meu calcanhar. Estou aqui porque o maior dever dos gorajos é atrapalhar quem criou este lugar."

[.skill_summoning_familiar_stormbringer_16]
en = "We sense that great headway has been made; that we have dropped over a waterfall and risen, coughing and spluttering to the surface. Yet, there are many turns and falls ahead."
pt = "Sentimos que avançamos muito; que caímos de uma cachoeira e voltamos à superfície, tossindo e cuspindo água. Mas ainda há muitas curvas e quedas pela frente."

[.skill_summoning_familiar_stormbringer_17]
en = "I follow you because you have shown a remarkable habit of stumbling into trouble, young fawn. When that trouble comes, we shall push you aside and finish this."
pt = "Sigo você porque mostrou um talento notável para tropeçar em encrencas, jovem cervo. Quando a encrenca vier, vamos tirar você do caminho e acabar com isso."

[.skill_summoning_familiar_stormbringer_18]
en = "Charming."
pt = "Que simpático."

[.skill_summoning_familiar_stormbringer_19]
en = "That is a good thing. We must prepare for the next battle."
pt = "Isso é bom. Precisamos nos preparar para a próxima batalha."

# Skills - summoning/familiar/StrangerPlant.kt

[.skill_summoning_familiar_strangerplant_1]
en = "I'M STRANGER PLANT!"
pt = "EU SOU A STRANGER PLANT!"

[.skill_summoning_familiar_strangerplant_2]
en = "I know you are."
pt = "Eu sei que é."

[.skill_summoning_familiar_strangerplant_3]
en = "I KNOW! I'M JUST SAYING!"
pt = "EU SEI! SÓ ESTOU DIZENDO!"

[.skill_summoning_familiar_strangerplant_4]
en = "Do you have to shout like that all of the time?"
pt = "Você precisa gritar assim o tempo todo?"

[.skill_summoning_familiar_strangerplant_5]
en = "WHO'S SHOUTING?"
pt = "QUEM ESTÁ GRITANDO?"

[.skill_summoning_familiar_strangerplant_6]
en = "If this is you speaking normally, I'd hate to hear you shouting."
pt = "Se isso é você falando normal, não quero nem ouvir você gritando."

[.skill_summoning_familiar_strangerplant_7]
en = "OH, SNAP!"
pt = "AI, ESSA DOEU!"

[.skill_summoning_familiar_strangerplant_8]
en = "WILL WE HAVE TO BE HERE LONG?"
pt = "VAMOS TER QUE FICAR AQUI MUITO TEMPO?"

[.skill_summoning_familiar_strangerplant_9]
en = "We'll be here until I am finished."
pt = "Vamos ficar aqui até eu terminar."

[.skill_summoning_familiar_strangerplant_10]
en = "BUT THERE'S NO DRAMA HERE!"
pt = "MAS AQUI NÃO TEM DRAMA NENHUM!"

[.skill_summoning_familiar_strangerplant_11]
en = "Well, how about you pretend to be an undercover agent."
pt = "Bem, que tal você fingir que é um agente secreto?"

[.skill_summoning_familiar_strangerplant_12]
en = "WONDERFUL! WHAT'S MY MOTIVATION?"
pt = "MARAVILHOSO! QUAL É A MINHA MOTIVAÇÃO?"

[.skill_summoning_familiar_strangerplant_13]
en = "You're trying to remain stealthy and secretive, while looking out for clues."
pt = "Você tenta passar despercebido e guardar segredo enquanto procura pistas."

[.skill_summoning_familiar_strangerplant_14]
en = "I'LL JUST GET INTO CHARACTER! AHEM!"
pt = "VOU ENTRAR NO PERSONAGEM! HUM-HUM!"

[.skill_summoning_familiar_strangerplant_15]
en = "PAPER! PAPER! VARROCK HERALD FOR SALE!"
pt = "OLHA O JORNAL! OLHA O VARROCK HERALD! QUEM VAI QUERER?"

[.skill_summoning_familiar_strangerplant_16]
en = "What kind of spy yells loudly like that?"
pt = "Que tipo de espião grita desse jeito?"

[.skill_summoning_familiar_strangerplant_17]
en = "ONE WHOSE COVER IDENTITY IS A PAPER-SELLER, OF COURSE!"
pt = "UM DISFARÇADO DE VENDEDOR DE JORNAL, É CLARO!"

[.skill_summoning_familiar_strangerplant_18]
en = "Ask a silly question..."
pt = "Pergunta boba, resposta boba..."

[.skill_summoning_familiar_strangerplant_19]
en = "DIIIIVE!"
pt = "ABAIXAAAAA!"

[.skill_summoning_familiar_strangerplant_20]
en = "What? Help! Why dive?"
pt = "O quê? Socorro! Abaixar por quê?"

[.skill_summoning_familiar_strangerplant_21]
en = "OH, DON'T WORRY! I JUST LIKE TO YELL THAT FROM TIME TO TIME!"
pt = "AH, NÃO SE PREOCUPE! EU SÓ GOSTO DE GRITAR ISSO DE VEZ EM QUANDO!"

[.skill_summoning_familiar_strangerplant_22]
en = "Well, can you give me a little warning next time?"
pt = "Bem, dá para me avisar antes da próxima vez?"

[.skill_summoning_familiar_strangerplant_23]
en = "WHAT, AND TAKE ALL THE FUN OUT OF LIFE?"
pt = "O QUÊ, E TIRAR TODA A GRAÇA DA VIDA?"

[.skill_summoning_familiar_strangerplant_24]
en = "If by 'fun' you mean 'sudden heart attacks', then yes, please take them out of my life!"
pt = "Se por 'graça' você quer dizer 'ataques do coração', então sim, tire isso da minha vida, por favor!"

[.skill_summoning_familiar_strangerplant_25]
en = "I THINK I'M WILTING!"
pt = "ACHO QUE ESTOU MURCHANDO!"

[.skill_summoning_familiar_strangerplant_26]
en = "Do you need some water?"
pt = "Você precisa de água?"

[.skill_summoning_familiar_strangerplant_27]
en = "DON'T BE SILLY! I CAN PULL THAT OUT OF THE GROUND!"
pt = "DEIXE DE BOBAGEM! EU PUXO ÁGUA DO CHÃO!"

[.skill_summoning_familiar_strangerplant_28]
en = "Then why are you wilting?"
pt = "Então por que está murchando?"

[.skill_summoning_familiar_strangerplant_29]
en = "IT'S SIMPLE: THERE'S A DISTINCT LACK OF DRAMA!"
pt = "É SIMPLES: ESTÁ FALTANDO DRAMA, E MUITO!"

[.skill_summoning_familiar_strangerplant_30]
en = "Drama?"
pt = "Drama?"

[.skill_summoning_familiar_strangerplant_31]
en = "YES, DRAMA!"
pt = "SIM, DRAMA!"

[.skill_summoning_familiar_strangerplant_32]
en = "Okay..."
pt = "Tá bom..."

[.skill_summoning_familiar_strangerplant_33]
en = "Let's see if we can find some for you."
pt = "Vamos ver se achamos um pouco para você."

[.skill_summoning_familiar_strangerplant_34]
en = "LEAD ON!"
pt = "VÁ NA FRENTE!"

# Skills - summoning/familiar/SwampTitan.kt

[.skill_summoning_familiar_swamptitan_1]
en = "I'm alone, all alone I say."
pt = "Estou só, completamente só, ouviu bem?"

[.skill_summoning_familiar_swamptitan_2]
en = "Oh, stop being so melodramatic."
pt = "Ah, pare de ser tão melodramático."

[.skill_summoning_familiar_swamptitan_3]
en = "It's not easy being greenery...well, decomposing greenery."
pt = "Não é fácil ser verdura... bem, verdura em decomposição."

[.skill_summoning_familiar_swamptitan_4]
en = "Surely, you're not the only swamp...thing in the world? What about the other swamp titans?"
pt = "Com certeza você não é a única... coisa do pântano no mundo, né? E os outros swamp titans?"

[.skill_summoning_familiar_swamptitan_5]
en = "They're not my friends...they pick on me...they're so mean..."
pt = "Eles não são meus amigos... eles implicam comigo... são tão malvados..."

[.skill_summoning_familiar_swamptitan_6]
en = "Why would they do that?"
pt = "Por que eles fariam isso?"

[.skill_summoning_familiar_swamptitan_7]
en = "They think I DON'T smell."
pt = "Eles acham que eu NÃO sou fedido."

[.skill_summoning_familiar_swamptitan_8]
en = "Oh, yes. That is, er, mean..."
pt = "Ah, sim. Isso é, hã, maldade..."

# Skills - summoning/familiar/TalonBeast.kt

[.skill_summoning_familiar_talonbeast_1]
en = "Is this all you apes do all day, then?"
pt = "Então é só isso que vocês, macacos, fazem o dia todo?"

[.skill_summoning_familiar_talonbeast_2]
en = "Well, we do a lot of other things, too."
pt = "Bem, a gente faz muitas outras coisas também."

[.skill_summoning_familiar_talonbeast_3]
en = "That's dull. Lets go find something and bite it."
pt = "Que chato. Vamos achar alguma coisa para morder."

[.skill_summoning_familiar_talonbeast_4]
en = "I wouldn't want to spoil my dinner."
pt = "Não quero perder o apetite antes do jantar."

[.skill_summoning_familiar_talonbeast_5]
en = "So, I have to watch you trudge about again? Talk about boring."
pt = "Então vou ter que ver você se arrastando por aí de novo? Que tédio."

[.skill_summoning_familiar_talonbeast_6]
en = "This place smells odd..."
pt = "Este lugar tem um cheiro estranho..."

[.skill_summoning_familiar_talonbeast_7]
en = "Odd?"
pt = "Estranho?"

[.skill_summoning_familiar_talonbeast_8]
en = "Yes, not enough is rotting..."
pt = "É, tem pouca coisa apodrecendo..."

[.skill_summoning_familiar_talonbeast_9]
en = "For which I am extremely grateful."
pt = "E por isso eu sou extremamente grato."

[.skill_summoning_familiar_talonbeast_10]
en = "Aaaargh!"
pt = "Aaaaaah!"

[.skill_summoning_familiar_talonbeast_11]
en = "Why d'you always do that?"
pt = "Por que você sempre faz isso?"

[.skill_summoning_familiar_talonbeast_12]
en = "I don't think I'll ever get used to having a huge, ravenous feline sneaking around behind me all the time."
pt = "Acho que nunca vou me acostumar com um felino enorme e faminto se esgueirando atrás de mim o tempo todo."

[.skill_summoning_familiar_talonbeast_13]
en = "That's okay, I doubt I'll get used to following an edible, furless monkey prancing in front of me all the time either."
pt = "Tudo bem, duvido que eu me acostume a seguir um macaco pelado e comestível saltitando na minha frente o tempo todo."

[.skill_summoning_familiar_talonbeast_14]
en = "C'mon! Lets go fight stuff!"
pt = "Vamos! Bora lutar com umas coisas!"

[.skill_summoning_familiar_talonbeast_15]
en = "What sort of stuff?"
pt = "Que tipo de coisas?"

[.skill_summoning_familiar_talonbeast_16]
en = "I dunno? Giants, monsters, vaguely-defined philosophical concepts. You know: stuff."
pt = "Sei lá? Gigantes, monstros, conceitos filosóficos vagamente definidos. Sabe: coisas."

[.skill_summoning_familiar_talonbeast_17]
en = "How are we supposed to fight a philosophical concept?"
pt = "Como a gente vai lutar contra um conceito filosófico?"

[.skill_summoning_familiar_talonbeast_18]
en = "With subtle arguments and pointy sticks!"
pt = "Com argumentos sutis e paus pontudos!"

[.skill_summoning_familiar_talonbeast_19]
en = "Well, I can see you're going to go far in debates."
pt = "Bem, já vi que você vai longe nos debates."

# Skills - summoning/familiar/ThornySnail.kt

[.skill_summoning_familiar_thornysnail_1]
en = "Check your head..."
pt = "Olha a sua cabeça..."

[.skill_summoning_familiar_thornysnail_2]
en = "What about it... Oh, wait! Oh, this is pretty awkward..."
pt = "O que tem ela... Ah, espera! Ah, que situação constrangedora..."

[.skill_summoning_familiar_thornysnail_3]
en = "You're wearing the spine of one of my relatives as a hat..."
pt = "Você está usando a concha de um parente meu como chapéu..."

[.skill_summoning_familiar_thornysnail_4]
en = "Well more of a faux-pas, then."
pt = "Bom, digamos que foi mais uma gafe, então."

[.skill_summoning_familiar_thornysnail_5]
en = "Just a bit..."
pt = "Só um pouquinho..."

[.skill_summoning_familiar_thornysnail_6]
en = "All this running around the place is fun!"
pt = "Ficar correndo para lá e para cá é divertido!"

[.skill_summoning_familiar_thornysnail_7]
en = "I'll be it's a step up from your usually sedentary lifestyle!"
pt = "Aposto que é um passo à frente da sua vida sedentária de sempre!"

[.skill_summoning_familiar_thornysnail_8]
en = "True, but it's mostly seeing the sort of sights you don't get at home."
pt = "É verdade, mas o melhor é ver coisas que eu não vejo em casa."

[.skill_summoning_familiar_thornysnail_9]
en = "Living things for a start."
pt = "Coisas vivas, para começar."

[.skill_summoning_familiar_thornysnail_10]
en = "Those are in short supply in Mort Myre, I admit."
pt = "Isso anda em falta em Mort Myre, admito."

[.skill_summoning_familiar_thornysnail_11]
en = "I think my stomach is drying out..."
pt = "Acho que a minha barriga está ressecando..."

[.skill_summoning_familiar_thornysnail_12]
en = "Your stomach? How do you know how it's feeling?"
pt = "Sua barriga? Como você sabe como ela está?"

[.skill_summoning_familiar_thornysnail_13]
en = "I am walking on it, you know..."
pt = "Eu ando em cima dela, né..."

[.skill_summoning_familiar_thornysnail_14]
en = "Urrgh..."
pt = "Urrgh..."

[.skill_summoning_familiar_thornysnail_15]
en = "Okay, I have to ask, what are those things you people totter about on?"
pt = "Tá, preciso perguntar: que coisas são essas em que vocês ficam cambaleando por aí?"

[.skill_summoning_familiar_thornysnail_16]
en = "You mean my legs?"
pt = "Você quer dizer as minhas pernas?"

[.skill_summoning_familiar_thornysnail_17]
en = "Yes, those. How are you supposed to eat anything through them?"
pt = "Isso. Como vocês conseguem comer alguma coisa por elas?"

[.skill_summoning_familiar_thornysnail_18]
en = "Well, we don't. That's what our mouths are for."
pt = "Bom, a gente não come. Para isso serve a boca."

[.skill_summoning_familiar_thornysnail_19]
en = "Oh, right! I thought those were for expelling waste gas and hot air!"
pt = "Ah, tá! Eu achava que a boca servia para soltar gases e conversa fiada!"

[.skill_summoning_familiar_thornysnail_20]
en = "Well, for a lot of people they are."
pt = "Bom, para muita gente serve mesmo."

[.skill_summoning_familiar_thornysnail_21]
en = "Can you slow down?"
pt = "Dá para ir mais devagar?"

[.skill_summoning_familiar_thornysnail_22]
en = "Are we going too fast for you?"
pt = "Estamos rápidos demais para você?"

[.skill_summoning_familiar_thornysnail_23]
en = "I bet if you had to run on your internal organs you'd want a break now and then!"
pt = "Aposto que, se você tivesse que correr em cima dos seus órgãos internos, também ia querer uma pausa de vez em quando!"

# Skills - summoning/familiar/UnicornStallion.kt

[.skill_summoning_familiar_unicornstallion_1]
en = "Whicker snort! Whinny whinny whinny. (You're hurt! Let me try to heal you.)"
pt = "Whicker snort! Whinny whinny whinny. (Você está ferido! Deixa eu tentar te curar.)"

[.skill_summoning_familiar_unicornstallion_2]
en = "Yes, please do!"
pt = "Sim, por favor!"

[.skill_summoning_familiar_unicornstallion_3]
en = "Snuffle whicker whicker neigh neigh... (Okay, we'll begin with acupuncture and some reiki, then I'll get my crystals...)"
pt = "Snuffle whicker whicker neigh neigh... (Beleza, vamos começar com acupuntura e um pouco de reiki, depois eu pego meus cristais...)"

[.skill_summoning_familiar_unicornstallion_4]
en = "Or you could use some sort of magic...like the other unicorns..."
pt = "Ou você podia usar algum tipo de magia... como os outros unicórnios..."

[.skill_summoning_familiar_unicornstallion_5]
en = "Whicker whinny whinny neigh. (Yes, but I believe in alternative medicine.)"
pt = "Whicker whinny whinny neigh. (É, mas eu acredito em medicina alternativa.)"

[.skill_summoning_familiar_unicornstallion_6]
en = "Riiight. Don't worry about it, then; I'll be fine."
pt = "Seeei. Deixa para lá, então; eu vou ficar bem."

[.skill_summoning_familiar_unicornstallion_7]
en = "Neigh neigh neighneigh snort? (Isn't everything so awesomely wonderful?)"
pt = "Neigh neigh neighneigh snort? (Não está tudo, tipo, maravilhoso demais, bicho?)"

[.skill_summoning_familiar_unicornstallion_8]
en = "Err...yes?"
pt = "Hã... está?"

[.skill_summoning_familiar_unicornstallion_9]
en = "Whicker whicker snuffle. (I can see you're not tuning in, %1%.)"
pt = "Whicker whicker snuffle. (Tô sacando que você não está sintonizado, %1%.)"

[.skill_summoning_familiar_unicornstallion_10]
en = "No, no, I'm completely at one with...you know...everything."
pt = "Não, não, eu estou em total sintonia com... sabe... tudo."

[.skill_summoning_familiar_unicornstallion_11]
en = "Whicker! (Cosmic.)"
pt = "Whicker! (Cósmico.)"

[.skill_summoning_familiar_unicornstallion_12]
en = "Whicker whicker. Neigh, neigh, whinny. (I feel so, like, enlightened. Let's meditate and enhance our auras.)"
pt = "Whicker whicker. Neigh, neigh, whinny. (Eu me sinto tão, tipo, iluminado. Vamos meditar e elevar nossas auras.)"

[.skill_summoning_familiar_unicornstallion_13]
en = "I can't do that! I barely even know you."
pt = "Não posso fazer isso! Eu mal te conheço."

[.skill_summoning_familiar_unicornstallion_14]
en = "Whicker... (Bipeds...)"
pt = "Whicker... (Bípedes...)"

[.skill_summoning_familiar_unicornstallion_15]
en = "Whinny whinny whinny. (I think I'm astrally projecting.)"
pt = "Whinny whinny whinny. (Acho que estou fazendo projeção astral.)"

[.skill_summoning_familiar_unicornstallion_16]
en = "Okay... Hang on. Seeing as I summoned you here, wouldn't that mean you are physically projecting instead?"
pt = "Tá... Peraí. Já que fui eu que te invoquei aqui, isso não seria projeção física?"

[.skill_summoning_familiar_unicornstallion_17]
en = "Whicker whicker whicker. (You're, like, no fun at all, man.)"
pt = "Whicker whicker whicker. (Você é, tipo, nada divertido, bicho.)"

[.skill_summoning_familiar_unicornstallion_18]
en = "Whinny, neigh! (Oh, happy day!)"
pt = "Whinny, neigh! (Oh, dia feliz!)"

[.skill_summoning_familiar_unicornstallion_19]
en = "Happy day? Is that some sort of holiday or something?"
pt = "Dia feliz? É algum feriado ou coisa assim?"

[.skill_summoning_familiar_unicornstallion_20]
en = "Snuggle whicker (Man, you're totally, like, uncosmic, %1%.)"
pt = "Snuggle whicker (Bicho, você é, tipo, totalmente descósmico, %1%.)"

[.skill_summoning_familiar_unicornstallion_21]
en = "This isn't your familiar."
pt = "Este não é o seu familiar."

[.skill_summoning_familiar_unicornstallion_22]
en = "You're not suffering from poison!"
pt = "Você não está envenenado!"

# Skills - summoning/familiar/VampireBat.kt

[.skill_summoning_familiar_vampirebat_1]
en = "You're vasting all that blood, can I have some?"
pt = "Focê está desperdiçando todo esse sangue, me dá um pouco?"

[.skill_summoning_familiar_vampirebat_2]
en = "Ven are you going to feed me?"
pt = "Quando focê fai me dar de comer?"

[.skill_summoning_familiar_vampirebat_3]
en = "Well for a start, I'm not giving you any of my blood."
pt = "Bom, para começar, não vou te dar nada do meu sangue."

[.skill_summoning_familiar_vampirebat_4]
en = "I want to eat something."
pt = "Eu quero comer alguma coisa."

[.skill_summoning_familiar_vampirebat_5]
en = "I'm sure you do; let's go see what we can find."
pt = "Imagino que sim; vamos ver o que a gente acha."

[.skill_summoning_familiar_vampirebat_6]
en = "Ven can I eat something?"
pt = "Quando eu fou poder comer alguma coisa?"

[.skill_summoning_familiar_vampirebat_7]
en = "Just as soon as I find something to attack."
pt = "Assim que eu achar alguma coisa para atacar."

# Skills - summoning/familiar/VoidRavager.kt

[.skill_summoning_familiar_voidravager_1]
en = "You look delicious!"
pt = "Você parece delicioso!"

[.skill_summoning_familiar_voidravager_2]
en = "Don't make me dismiss you!"
pt = "Não me faça te dispensar!"

[.skill_summoning_familiar_voidravager_3]
en = "Take me to the rift!"
pt = "Me leve até a fenda!"

[.skill_summoning_familiar_voidravager_4]
en = "I'm not taking you there! Goodness knows what you'd get up to."
pt = "Não vou te levar lá! Sabe-se lá o que você aprontaria."

[.skill_summoning_familiar_voidravager_5]
en = "I promise not to destroy your world..."
pt = "Prometo não destruir o seu mundo..."

[.skill_summoning_familiar_voidravager_6]
en = "If only I could believe you..."
pt = "Se ao menos eu pudesse acreditar em você..."

[.skill_summoning_familiar_voidravager_7]
en = "How do you bear life without ravaging?"
pt = "Como você aguenta a vida sem devastar nada?"

[.skill_summoning_familiar_voidravager_8]
en = "It's not always easy."
pt = "Nem sempre é fácil."

[.skill_summoning_familiar_voidravager_9]
en = "I could show you how to ravage, if you like..."
pt = "Posso te ensinar a devastar, se quiser..."

# Skills - summoning/familiar/VoidShifter.kt

[.skill_summoning_familiar_voidshifter_1]
en = "Your void shifter teleports you to safety."
pt = "O seu void shifter teletransporta você para um lugar seguro."

[.skill_summoning_familiar_voidshifter_2]
en = "What a splendid day, sir!"
pt = "Que dia esplêndido, senhor!"

[.skill_summoning_familiar_voidshifter_3]
en = "Yes, it is!"
pt = "É mesmo!"

[.skill_summoning_familiar_voidshifter_4]
en = "It could only be marginally improved, perhaps, by tea and biscuits."
pt = "Só poderia ser ligeiramente melhorado, talvez, com chá e biscoitos."

[.skill_summoning_familiar_voidshifter_5]
en = "What a marvellous idea!"
pt = "Que ideia maravilhosa!"

[.skill_summoning_familiar_voidshifter_6]
en = "I'm sorry to bother you, but could you assist me briefly?"
pt = "Perdoe-me o incômodo, mas poderia me ajudar por um instante?"

[.skill_summoning_familiar_voidshifter_7]
en = "I suppose so."
pt = "Acho que sim."

[.skill_summoning_familiar_voidshifter_8]
en = "I was wondering, briefly, if perchance you might care to dance?"
pt = "Estava me perguntando, brevemente, se por acaso gostaria de dançar?"

[.skill_summoning_familiar_voidshifter_9]
en = "Dance? With a pest?"
pt = "Dançar? Com uma praga?"

[.skill_summoning_familiar_voidshifter_10]
en = "Well, you see, I'm dreadfully out of practice and now I can barely leap, let alone teleport."
pt = "Bem, veja, estou terrivelmente sem prática e agora mal consigo saltar, que dirá teletransportar."

[.skill_summoning_familiar_voidshifter_11]
en = "I'm not going to help you remember how to destroy the world!"
pt = "Não vou te ajudar a lembrar como destruir o mundo!"

[.skill_summoning_familiar_voidshifter_12]
en = "What a beastly world we live in where one gentleman/lady will not aid a pest in need..."
pt = "Que mundo horrendo este em que vivemos, onde um cavalheiro/uma dama não socorre uma praga necessitada..."

[.skill_summoning_familiar_voidshifter_13]
en = "How do you do?"
pt = "Como tem passado?"

[.skill_summoning_familiar_voidshifter_14]
en = "Okay, I suppose."
pt = "Bem, eu acho."

[.skill_summoning_familiar_voidshifter_15]
en = "Marvellous, simply marvellous!"
pt = "Maravilhoso, simplesmente maravilhoso!"

[.skill_summoning_familiar_voidshifter_16]
en = "Lets go and see to those cads and bounders!"
pt = "Vamos dar um jeito naqueles patifes e canalhas!"

[.skill_summoning_familiar_voidshifter_17]
en = "Which 'cads and bounders' did you mean, exactly?"
pt = "Que 'patifes e canalhas' você quis dizer, exatamente?"

[.skill_summoning_familiar_voidshifter_18]
en = "Why, the ones with no honour, of course."
pt = "Ora, os que não têm honra, é claro."

[.skill_summoning_familiar_voidshifter_19]
en = "I don't think he knows what pests do..."
pt = "Acho que ele não sabe o que as pragas fazem..."

# Skills - summoning/familiar/VoidSpinner.kt

[.skill_summoning_familiar_voidspinner_1]
en = "Let's go play hide an' seek!"
pt = "Vamo brincá de esconde-esconde!"

[.skill_summoning_familiar_voidspinner_2]
en = "Okay, you hide and I'll come find you."
pt = "Tá bom, você se esconde e eu vou te procurar."

[.skill_summoning_familiar_voidspinner_3]
en = "You'll never find me!"
pt = "Você nunca vai me achar!"

[.skill_summoning_familiar_voidspinner_4]
en = "What a disaster that would be..."
pt = "Que tragédia seria..."

[.skill_summoning_familiar_voidspinner_5]
en = "My mummy told me I was clever."
pt = "Minha mamãe disse que eu sou espertinho."

[.skill_summoning_familiar_voidspinner_6]
en = "Aren't you meant to be the essence of a spinner? How do you have a mother?"
pt = "Você não devia ser a essência de um spinner? Como é que você tem mãe?"

[.skill_summoning_familiar_voidspinner_7]
en = "What you mean, 'essence'?"
pt = "Que que é 'essência'?"

[.skill_summoning_familiar_voidspinner_8]
en = "Never mind, I don't think it matters."
pt = "Deixa pra lá, acho que não importa."

[.skill_summoning_familiar_voidspinner_9]
en = "My logimical powers has proved me smarterer than you!"
pt = "Meus poderes lógimicos provou que eu sou mais espertíssimo que você!"

[.skill_summoning_familiar_voidspinner_10]
en = "I'm coming to tickle you!"
pt = "Vou te fazer cócegas!"

[.skill_summoning_familiar_voidspinner_11]
en = "No! You've got so many tentacles!"
pt = "Não! Você tem tentáculos demais!"

[.skill_summoning_familiar_voidspinner_12]
en = "Aieee!"
pt = "Aiiiii!"

[.skill_summoning_familiar_voidspinner_13]
en = "Where's the sweeties?"
pt = "Cadê os docinho?"

[.skill_summoning_familiar_voidspinner_14]
en = "They are wherever good spinners go."
pt = "Estão no lugar para onde vão os spinners bonzinhos."

[.skill_summoning_familiar_voidspinner_15]
en = "Yay for me!"
pt = "Eba, então são meus!"

# Skills - summoning/familiar/VoidTorcher.kt

[.skill_summoning_familiar_voidtorcher_1]
en = "You okay there, spinner?"
pt = "Tudo certo aí, spinner?"

[.skill_summoning_familiar_voidtorcher_2]
en = "I not spinner!"
pt = "Eu não spinner!"

[.skill_summoning_familiar_voidtorcher_3]
en = "Sorry, splatter?"
pt = "Desculpa, splatter?"

[.skill_summoning_familiar_voidtorcher_4]
en = "I not splatter either!"
pt = "Eu também não splatter!"

[.skill_summoning_familiar_voidtorcher_5]
en = "No, wait, I meant defiler."
pt = "Não, espera, eu quis dizer defiler."

[.skill_summoning_familiar_voidtorcher_6]
en = "I torcher!"
pt = "Eu torcher!"

[.skill_summoning_familiar_voidtorcher_7]
en = "Hehe, I know. I was just messing with you."
pt = "Hehe, eu sei. Só estava te zoando."

[.skill_summoning_familiar_voidtorcher_8]
en = "Grr. Don't be such a pest."
pt = "Grr. Não seja tão peste."

[.skill_summoning_familiar_voidtorcher_9]
en = "'T' is for torcher, that's good enough for me... 'T' is for torcher, I'm happy you can see."
pt = "'T' é de torcher, e isso me basta... 'T' é de torcher, e minha alegria não se gasta."

[.skill_summoning_familiar_voidtorcher_10]
en = "You're just a bit weird, aren't you?"
pt = "Você é meio esquisito, né?"

[.skill_summoning_familiar_voidtorcher_11]
en = "Burn, baby, burn! Torcher inferno!"
pt = "Queima, baby, queima! Torcher inferno!"

[.skill_summoning_familiar_voidtorcher_12]
en = "*Wibble*"
pt = "*Tremelique*"

[.skill_summoning_familiar_voidtorcher_13]
en = "So hungry... must devour..."
pt = "Tanta fome... preciso devorar..."

[.skill_summoning_familiar_voidtorcher_14]
en = "*Gulp* Er, yeah, I'll find you something to eat in a minute."
pt = "*Glup* Hã, tá, já já eu acho algo para você comer."

[.skill_summoning_familiar_voidtorcher_15]
en = "Is flesh-bag scared of torcher?"
pt = "Saco-de-carne tem medo de torcher?"

[.skill_summoning_familiar_voidtorcher_16]
en = "No, no. I, er, always look like this... honest."
pt = "Não, não. Eu, hã, sempre tenho essa cara... juro."

# Skills - summoning/familiar/WarTortoise.kt

[.skill_summoning_familiar_wartortoise_1]
en = "*The tortoise waggles its head about*"
pt = "*A tartaruga balança a cabeça de um lado para o outro*"

[.skill_summoning_familiar_wartortoise_2]
en = "What are we doing in this dump?"
pt = "O que estamos fazendo nesta espelunca?"

[.skill_summoning_familiar_wartortoise_3]
en = "Well, I was just going to take care of a few things."
pt = "Bem, eu só ia resolver umas coisinhas."

[.skill_summoning_familiar_wartortoise_4]
en = "*The tortoise shakes its head*"
pt = "*A tartaruga sacode a cabeça*"

[.skill_summoning_familiar_wartortoise_5]
en = "I don't believe it. Stuck here with this young whippersnapper running around having fun."
pt = "Não acredito. Ter que aguentar esse fedelho correndo pra lá e pra cá se divertindo."

[.skill_summoning_familiar_wartortoise_6]
en = "You know, I'm sure you would enjoy it if you gave it a chance."
pt = "Sabe, tenho certeza de que você ia gostar se desse uma chance."

[.skill_summoning_familiar_wartortoise_7]
en = "Oh, you would say that, wouldn't you?"
pt = "Ah, claro que você ia dizer isso, não é?"

[.skill_summoning_familiar_wartortoise_8]
en = "Hold up a minute, there."
pt = "Opa, espere um minutinho aí."

[.skill_summoning_familiar_wartortoise_9]
en = "What do you want?"
pt = "O que você quer?"

[.skill_summoning_familiar_wartortoise_10]
en = "*The tortoise bobs its head*"
pt = "*A tartaruga balança a cabeça para cima e para baixo*"

[.skill_summoning_familiar_wartortoise_11]
en = "For you to slow down!"
pt = "Que você vá mais devagar!"

[.skill_summoning_familiar_wartortoise_12]
en = "Well, I've stopped now."
pt = "Bom, agora eu parei."

[.skill_summoning_familiar_wartortoise_13]
en = "Yes, but you'll soon start up again, won't you?"
pt = "Sim, mas logo vai sair correndo de novo, não vai?"

[.skill_summoning_familiar_wartortoise_14]
en = "Probably."
pt = "Provavelmente."

[.skill_summoning_familiar_wartortoise_15]
en = "* The tortoise waggles its head despondently.*"
pt = "*A tartaruga balança a cabeça, desanimada.*"

[.skill_summoning_familiar_wartortoise_16]
en = " I don't believe it...."
pt = "Não acredito..."

[.skill_summoning_familiar_wartortoise_17]
en = "* The tortoise bobs its head around energetically.*"
pt = "*A tartaruga balança a cabeça toda animada.*"

[.skill_summoning_familiar_wartortoise_18]
en = "Oh, so now you're paying attention to me, are you?"
pt = "Ah, então agora você resolveu me dar atenção, é?"

[.skill_summoning_familiar_wartortoise_19]
en = "I pay you plenty of attention!"
pt = "Eu te dou muita atenção!"

[.skill_summoning_familiar_wartortoise_20]
en = "Only when you want me to carry those heavy things of yours."
pt = "Só quando quer que eu carregue aquelas suas tralhas pesadas."

[.skill_summoning_familiar_wartortoise_21]
en = "I don't ask you to carry anything heavy."
pt = "Eu não peço para você carregar nada pesado."

[.skill_summoning_familiar_wartortoise_22]
en = "What about those lead ingots?"
pt = "E aqueles lingotes de chumbo?"

[.skill_summoning_familiar_wartortoise_23]
en = "What lead ingots?"
pt = "Que lingotes de chumbo?"

[.skill_summoning_familiar_wartortoise_24]
en = "*The tortoise droops its head*"
pt = "*A tartaruga abaixa a cabeça*"

[.skill_summoning_familiar_wartortoise_25]
en = "Well, that's what it felt like...."
pt = "Bom, pelo peso, bem que pareciam..."

[.skill_summoning_familiar_wartortoise_26]
en = "*grumble grumble*"
pt = "*resmungo resmungo*"

[.skill_summoning_familiar_wartortoise_27]
en = "*The tortoise exudes an air of reproach*"
pt = "*A tartaruga exala um ar de reprovação*"

[.skill_summoning_familiar_wartortoise_28]
en = "Are you going to keep rushing around all day?"
pt = "Vai ficar correndo para lá e para cá o dia todo?"

[.skill_summoning_familiar_wartortoise_29]
en = "Only for as long as I have the energy to."
pt = "Só enquanto eu tiver energia."

[.skill_summoning_familiar_wartortoise_30]
en = "Oh. I'm glad that my not being able to keep up with you brings you such great amusement."
pt = "Ah. Que bom que você se diverte tanto por eu não conseguir te acompanhar."

[.skill_summoning_familiar_wartortoise_31]
en = "I didn't mean it like that."
pt = "Não foi isso que eu quis dizer."

[.skill_summoning_familiar_wartortoise_32]
en = "*The tortoise waggles its head disapprovingly.*"
pt = "*A tartaruga balança a cabeça em desaprovação.*"

[.skill_summoning_familiar_wartortoise_33]
en = "Well, when you are QUITE finished laughing at my expense, how about you pick up a rock larger than your body and go crawling about with it?"
pt = "Bom, quando você TERMINAR de rir às minhas custas, que tal pegar uma pedra maior que o seu corpo e sair rastejando com ela por aí?"

[.skill_summoning_familiar_wartortoise_34]
en = "We'll see how energetic you are after an hour or two of that."
pt = "Quero ver essa energia toda depois de uma ou duas horas disso."

# Skills - summoning/familiar/Wolpertinger.kt

[.skill_summoning_familiar_wolpertinger_1]
en = "Rawr!"
pt = "Rawr!"

# Skills - summoning/familiar/Worldbearer.kt

[.skill_summoning_familiar_worldbearer_1]
en = "I am not a great talker, little cub. For my sake, make it quick."
pt = "Não sou de muita conversa, filhote. Pelo meu bem, seja rápido."

[.skill_summoning_familiar_worldbearer_2]
en = "Do you need help carrying?"
pt = "Precisa de ajuda para carregar?"

[.skill_summoning_familiar_worldbearer_3]
en = "Little cub, there is no greater insult to a worldbearer. Shall I rub your belly so you can digest? Shall I move your feet so you can walk?"
pt = "Filhote, não há insulto maior para um worldbearer. Devo esfregar sua barriga para você digerir? Devo mover seus pés para você andar?"

[.skill_summoning_familiar_worldbearer_4]
en = "Garra! I know your culture: you call us pack mules and servants. There is no indignity in what I do! There is only honour in bearing another's burdens."
pt = "Garra! Conheço a sua cultura: vocês nos chamam de mulas de carga e de criados. Não há indignidade no que faço! Só há honra em carregar o fardo dos outros."

[.skill_summoning_familiar_worldbearer_5]
en = "I didn't mean to insult you."
pt = "Não quis ofender você."

[.skill_summoning_familiar_worldbearer_6]
en = "Bah, you are right. I must have woken on the wrong side of the stream today, little cub. Ignore me."
pt = "Bah, você tem razão. Devo ter acordado do lado errado do riacho hoje, filhote. Ignore-me."

[.skill_summoning_familiar_worldbearer_7]
en = "You're carrying a few burdens of your own."
pt = "Parece que você carrega uns fardos seus também."

[.skill_summoning_familiar_worldbearer_8]
en = "Grrrr! Although my role is to carry - and I carry for you now - I like it as much as I like your stale odour. Can we press on before I do something that I will get exiled for?"
pt = "Grrrr! Meu papel é carregar - e agora carrego para você -, mas gosto disso tanto quanto do seu cheiro de mofo. Podemos seguir antes que eu faça algo que me custe o exílio?"

[.skill_summoning_familiar_worldbearer_9]
en = "You shouldn't complain so much."
pt = "Você não devia reclamar tanto."

[.skill_summoning_familiar_worldbearer_10]
en = "Do not pretend that we are in the servant and master role, little cub! Our alliance is a delicate one and will end some day, through good means or bad."
pt = "Não finja que somos criado e mestre, filhote! Nossa aliança é delicada e um dia vai acabar, por bem ou por mal."

[.skill_summoning_familiar_worldbearer_11]
en = "When that day comes, you may not find that I am so helpful. Our goal is to blast this dungeon apart, but I have no issue with leaving you behind."
pt = "Quando esse dia chegar, talvez eu não seja tão prestativo. Nosso objetivo é pôr esta masmorra abaixo, mas não me importo de deixar você para trás."

[.skill_summoning_familiar_worldbearer_12]
en = "What is it like to be a worldbearer?"
pt = "Como é ser um worldbearer?"

[.skill_summoning_familiar_worldbearer_13]
en = "The worldbearers are the legs and back of the gorajo; we bear the provisions, tents and tools from one destination to another."
pt = "Os worldbearers são as pernas e as costas dos gorajo; levamos as provisões, as tendas e as ferramentas de um destino a outro."

[.skill_summoning_familiar_worldbearer_14]
en = "And when the gorajo are not moving, the worldbearers prepare and serve the food. It is an important role, and one that is esteemed among my clansmen."
pt = "E quando os gorajo não estão em marcha, os worldbearers preparam e servem a comida. É um papel importante e muito estimado entre os do meu clã."

[.skill_summoning_familiar_worldbearer_15]
en = "It sounds like hard work. There can't be much time to enjoy yourself."
pt = "Parece trabalho duro. Não deve sobrar muito tempo para se divertir."

[.skill_summoning_familiar_worldbearer_16]
en = "It is rewarding in its own way. When a worldbearer is put to rest, they are stripped of all belongings, to be reincarnated as a creature without burden: a sparrowhawk or a wildcat, perhaps."
pt = "É gratificante à sua maneira. Quando um worldbearer vai ao descanso final, é despido de todos os bens para reencarnar como uma criatura sem fardos: um gavião ou um gato-selvagem, talvez."

[.skill_summoning_familiar_worldbearer_17]
en = "Although we face trials in this life, our next is free and joyful."
pt = "Embora enfrentemos provações nesta vida, a próxima é livre e alegre."

[.skill_summoning_familiar_worldbearer_18]
en = "You carry everything and have to serve it too?"
pt = "Você carrega tudo e ainda tem que servir?"

[.skill_summoning_familiar_worldbearer_19]
en = "The clan sees the worldbearer as the nurturing mother wolf: proudly defending her pack while carrying the food and delivering it to her pups."
pt = "O clã vê o worldbearer como a loba-mãe protetora: defende com orgulho a matilha enquanto carrega a comida e a entrega aos filhotes."

[.skill_summoning_familiar_worldbearer_20]
en = "I would prefer a more masculine comparison; never mind, it has been so for centuries."
pt = "Eu preferiria uma comparação mais masculina; enfim, é assim há séculos."

[.skill_summoning_familiar_worldbearer_21]
en = "That is good to hear. I am not one to talk."
pt = "Bom saber. Não sou de conversa."

# Skills - summoning/pet/ClockworkCat.kt

[.skill_summoning_pet_clockworkcat_1]
en = "This isn't your pet."
pt = "Este mascote não é seu."

[.skill_summoning_pet_clockworkcat_2]
en = "The clockwork cat winds down and stops."
pt = "O gato de corda (clockwork cat) perde a corda e para."

[.skill_summoning_pet_clockworkcat_3]
en = "You choose not to shoo away the clockwork cat."
pt = "Você decide não enxotar o gato de corda (clockwork cat)."

# Skills - summoning/pet/Incubator.kt

[.skill_summoning_pet_incubator_1]
en = "The incubator is currently empty."
pt = "A incubadora está vazia no momento."

[.skill_summoning_pet_incubator_2]
en = "The egg inside has finished incubating."
pt = "O ovo lá dentro terminou de incubar."

[.skill_summoning_pet_incubator_3]
en = "There is currently a %1% egg incubating."
pt = "Há um ovo incubando no momento: %1%."

[.skill_summoning_pet_incubator_4]
en = "That egg hasn't finished incubating!"
pt = "Esse ovo ainda não terminou de incubar!"

[.skill_summoning_pet_incubator_5]
en = "You don't have enough room in your inventory."
pt = "Você não tem espaço suficiente no inventário."

[.skill_summoning_pet_incubator_6]
en = "You take your %1% out of the incubator."
pt = "Você tira da incubadora: %1%."

[.skill_summoning_pet_incubator_7]
en = "Your previous egg has finished hatching, take it out first."
pt = "O seu ovo anterior já chocou; tire-o primeiro."

[.skill_summoning_pet_incubator_8]
en = "You already have an egg in this incubator."
pt = "Você já tem um ovo nesta incubadora."

[.skill_summoning_pet_incubator_9]
en = "You need a Summoning level of %1% to incubate this egg."
pt = "Você precisa de nível %1% em Summoning para incubar este ovo."

[.skill_summoning_pet_incubator_10]
en = "You place the egg in the incubator."
pt = "Você coloca o ovo na incubadora."

[.skill_summoning_pet_incubator_11]
en = "<col=00cc00>Your %1% egg has finished hatching.</col>"
pt = "<col=00cc00>O seu ovo terminou de chocar: %1%.</col>"

# Skills - summoning/pet/KittenInteract.kt

[.skill_summoning_pet_kitteninteract_1]
en = "Interact with %1%"
pt = "Interagir com: %1%"

[.skill_summoning_pet_kitteninteract_2]
en = "Interact with Kitten"
pt = "Interagir com o filhote (Kitten)"

[.skill_summoning_pet_kitteninteract_3]
en = "Stroke"
pt = "Fazer carinho"

[.skill_summoning_pet_kitteninteract_4]
en = "Chase vermin"
pt = "Caçar pragas"

[.skill_summoning_pet_kitteninteract_5]
en = "Shoo away"
pt = "Enxotar"

[.skill_summoning_pet_kitteninteract_6]
en = "You softly stroke your cat."
pt = "Você faz carinho no seu gato com delicadeza."

[.skill_summoning_pet_kitteninteract_7]
en = "Who's a good cat then?"
pt = "Quem é um gatinho bonzinho, hein?"

[.skill_summoning_pet_kitteninteract_8]
en = "Me, me. Scratch me behind the ears. Purr...purr..."
pt = "Eu, eu. Coça atrás das minhas orelhas. Purr...purr..."

[.skill_summoning_pet_kitteninteract_9]
en = "The cat turns on its side while you bend down to pet it."
pt = "O gato deita de lado enquanto você se abaixa para fazer carinho."

[.skill_summoning_pet_kitteninteract_10]
en = "That cat sure loves to be stroked."
pt = "Esse gato adora mesmo um carinho."

[.skill_summoning_pet_kitteninteract_11]
en = "Go on get that nasty rodent."
pt = "Vai lá, pega esse roedor nojento."

[.skill_summoning_pet_kitteninteract_12]
en = "Yesss, food."
pt = "Simmm, comida."

[.skill_summoning_pet_kitteninteract_13]
en = "Do you fancy a bit of hunting?"
pt = "Que tal uma caçadinha?"

[.skill_summoning_pet_kitteninteract_14]
en = "Meoowww. Yeah! Let's go kick some fur!"
pt = "Miauuu. Isso! Vamos arrancar uns pelos!"

[.skill_summoning_pet_kitteninteract_15]
en = "Take it easy sport, just don't hurt yourself."
pt = "Calma, campeão, só não vá se machucar."

[.skill_summoning_pet_kitteninteract_16]
en = "There aren't any vermin around."
pt = "Não há nenhuma praga por perto."

[.skill_summoning_pet_kitteninteract_17]
en = "Your cat cannot get to its prey."
pt = "O seu gato não consegue alcançar a presa."

[.skill_summoning_pet_kitteninteract_18]
en = "Hey well done puss, you got it!"
pt = "Ei, muito bem, bichano, você pegou!"

[.skill_summoning_pet_kitteninteract_19]
en = "Well done puss! %1% horrible rodents caught!"
pt = "Muito bem, bichano! %1% roedores horríveis capturados!"

[.skill_summoning_pet_kitteninteract_20]
en = "The rat manages to get away!"
pt = "O rato consegue fugir!"

[.skill_summoning_pet_kitteninteract_21]
en = "Are you sure you want to shoo away the cat?"
pt = "Tem certeza de que quer enxotar o gato?"

[.skill_summoning_pet_kitteninteract_22]
en = "Yes I am."
pt = "Tenho, sim."

[.skill_summoning_pet_kitteninteract_23]
en = "The cat has run away."
pt = "O gato fugiu."

[.skill_summoning_pet_kitteninteract_24]
en = "No I'm not."
pt = "Não, não tenho."

[.skill_summoning_pet_kitteninteract_25]
en = "You choose not to shoo away the cat."
pt = "Você decide não enxotar o gato."

[.skill_summoning_pet_kitteninteract_26]
en = "What would you like to ask?"
pt = "O que você quer perguntar?"

[.skill_summoning_pet_kitteninteract_27]
en = "How are you doing?"
pt = "Como você está?"

[.skill_summoning_pet_kitteninteract_28]
en = "I'm good. But could we go adventuring soon? I'm tired of talkin, meeoow."
pt = "Estou bem. Mas podemos sair em aventura logo? Cansei de conversa, miauu."

[.skill_summoning_pet_kitteninteract_29]
en = "How old are you now?"
pt = "Quantos anos você tem agora?"

[.skill_summoning_pet_kitteninteract_30]
en = "I'm not too old, and not too young. In fact I think I'm just right."
pt = "Nem velho demais, nem novo demais. Aliás, acho que estou na medida certa."

[.skill_summoning_pet_kitteninteract_31]
en = "Where do you want to go?"
pt = "Aonde você quer ir?"

[.skill_summoning_pet_kitteninteract_32]
en = "Can we go to Varrock Sewer and chase some rats?"
pt = "Podemos ir ao Varrock Sewer caçar uns ratos?"

[.skill_summoning_pet_kitteninteract_33]
en = "What do you want to do now?"
pt = "O que você quer fazer agora?"

[.skill_summoning_pet_kitteninteract_34]
en = "I want to go chase things, kill them and then eat them. Purrr."
pt = "Quero correr atrás das coisas, matá-las e depois comê-las. Purrr."

[.skill_summoning_pet_kitteninteract_35]
en = "Did you understand what went on in that quest with the devourer and Icthlarin?"
pt = "Você entendeu o que aconteceu naquela missão com a Devoradora e o Icthlarin?"

[.skill_summoning_pet_kitteninteract_36]
en = "That's enough talking for now."
pt = "Chega de conversa por enquanto."

[.skill_summoning_pet_kitteninteract_37]
en = "Can you explain to me about Icthlarin and the devourer again?"
pt = "Pode me explicar de novo a história do Icthlarin e da Devoradora?"

[.skill_summoning_pet_kitteninteract_38]
en = "I'm getting a little bit sick of talking about Icthlarin and all that stuff. If you didn't understand it the first time around, nor when I filled you in on a few details and then when I spelt it out to you what happened I don't think you'll ever get it."
pt = "Estou ficando meio cansado de falar do Icthlarin e de tudo aquilo. Se você não entendeu da primeira vez, nem quando eu contei uns detalhes, nem quando expliquei tintim por tintim, acho que nunca vai entender."

[.skill_summoning_pet_kitteninteract_39]
en = "Aw come on. Just tell me one more time."
pt = "Ah, vai. Só mais uma vez."

[.skill_summoning_pet_kitteninteract_40]
en = "Look, can we just leave it. Ask one of your adventuring friends."
pt = "Olha, vamos deixar isso pra lá. Pergunte a um dos seus amigos aventureiros."

[.skill_summoning_pet_kitteninteract_41]
en = "Alright puss."
pt = "Tudo bem, bichano."

[.skill_summoning_pet_kitteninteract_42]
en = "It wasn't all that difficult to understand."
pt = "Não foi tão difícil de entender assim."

[.skill_summoning_pet_kitteninteract_43]
en = "Really? I was, no actually am, still confused."
pt = "Sério? Eu fiquei, não, na verdade ainda estou, confuso."

[.skill_summoning_pet_kitteninteract_44]
en = "Ok, I'll tell you what I think happened."
pt = "Certo, vou te contar o que eu acho que aconteceu."

[.skill_summoning_pet_kitteninteract_45]
en = "Great! Story time."
pt = "Ótimo! Hora da história."

[.skill_summoning_pet_kitteninteract_46]
en = "There once was a high priest of some crazy religion called Klenter."
pt = "Era uma vez um sumo sacerdote de uma religião maluca chamada Klenter."

[.skill_summoning_pet_kitteninteract_47]
en = "What, a religion called Klenter? What kind of name is that?"
pt = "O quê, uma religião chamada Klenter? Que nome é esse?"

[.skill_summoning_pet_kitteninteract_48]
en = "No no. The high priest was called Klenter and he was the high priest of Icthlarin, god of the dead."
pt = "Não, não. O sumo sacerdote se chamava Klenter, e ele era o sumo sacerdote de Icthlarin, deus dos mortos."

[.skill_summoning_pet_kitteninteract_49]
en = "Ok, I'm with you that far."
pt = "Certo, até aí eu entendi."

[.skill_summoning_pet_kitteninteract_50]
en = "He dies, and a struggle starts for his soul. Another god - the Devourer - wants to destroy his soul because she has some dispute with Icthlarin. So she takes on the guise of a human."
pt = "Ele morre e começa uma disputa pela alma dele. Outra divindade, a Devoradora (Devourer), quer destruir a alma dele porque tem uma rixa com Icthlarin. Então ela se disfarça de humana."

[.skill_summoning_pet_kitteninteract_51]
en = "Ah - the wanderer."
pt = "Ah - a andarilha (wanderer)."

[.skill_summoning_pet_kitteninteract_52]
en = "Very good. Now she needs help in getting Klenter's soul so she tricks some gullible fool into helping her."
pt = "Muito bem. Agora ela precisa de ajuda para pegar a alma de Klenter, então engana um tolo ingênuo para ajudá-la."

[.skill_summoning_pet_kitteninteract_53]
en = "So who was that?"
pt = "E quem foi esse?"

[.skill_summoning_pet_kitteninteract_54]
en = "You!"
pt = "Você!"

[.skill_summoning_pet_kitteninteract_55]
en = "Oh. So why doesn't she have a high priest too like Icthlarin."
pt = "Ah. E por que ela não tem um sumo sacerdote também, como o Icthlarin?"

[.skill_summoning_pet_kitteninteract_56]
en = "Well she's the god of destruction. If she had a priest or a temple or anything she would just destroy it."
pt = "Bom, ela é a deusa da destruição. Se tivesse um sacerdote, um templo ou qualquer coisa, ia simplesmente destruir."

[.skill_summoning_pet_kitteninteract_57]
en = "So if she's so powerful why does she need this gullible fool's help?"
pt = "Se ela é tão poderosa, por que precisa da ajuda desse tolo ingênuo?"

[.skill_summoning_pet_kitteninteract_58]
en = "Because of my kind."
pt = "Por causa da minha espécie."

[.skill_summoning_pet_kitteninteract_59]
en = "Your kind?"
pt = "Da sua espécie?"

[.skill_summoning_pet_kitteninteract_60]
en = "Cats!"
pt = "Gatos!"

[.skill_summoning_pet_kitteninteract_61]
en = "What? Why would she care about you? All you ever want is a bit of attention and the odd fish or two."
pt = "O quê? Por que ela ligaria para vocês? Vocês só querem um pouco de atenção e um peixinho de vez em quando."

[.skill_summoning_pet_kitteninteract_62]
en = "We have other powers, not clear to you. Anyway I'm moving away from the story. The wanderer recruits your help by hypnotising you. Do you remember that?"
pt = "Temos outros poderes, que você não entende. Enfim, estou fugindo da história. A andarilha consegue sua ajuda hipnotizando você. Lembra disso?"

[.skill_summoning_pet_kitteninteract_63]
en = "Vaguely, I think. Why did she choose me to help her then."
pt = "Vagamente, acho. E por que ela me escolheu para ajudar?"

[.skill_summoning_pet_kitteninteract_64]
en = "Because of me."
pt = "Por minha causa."

[.skill_summoning_pet_kitteninteract_65]
en = "I don't understand."
pt = "Não entendi."

[.skill_summoning_pet_kitteninteract_66]
en = "Cats are the only things that can open the pyramid's door, so she needed an adventurer with one. So you entered the pyramid with me - under her mind control - and stole a canopic jar containing an organ belonging to Klenter."
pt = "Só gatos conseguem abrir a porta da pirâmide, então ela precisava de um aventureiro com um. Aí você entrou na pirâmide comigo - controlado por ela - e roubou um vaso canópico com um órgão do Klenter."

[.skill_summoning_pet_kitteninteract_67]
en = "Ahh I think I'm beginning to get a better understanding."
pt = "Ahh, acho que estou começando a entender melhor."

[.skill_summoning_pet_kitteninteract_68]
en = "You then started to return with the jar to the Devourer, but as a sting on the tail she made you plant one of her symbols in the ceremonial room of the pyramid. You then tried to flee the pyramid but Icthlarin appeared just as you reached the exit."
pt = "Depois você começou a levar o vaso para a Devoradora, mas, de quebra, ela fez você deixar um símbolo dela na sala cerimonial da pirâmide. Aí você tentou fugir, mas Icthlarin apareceu bem quando você chegou à saída."

[.skill_summoning_pet_kitteninteract_69]
en = "The guy with the head of a dog?"
pt = "O cara com cabeça de cachorro?"

[.skill_summoning_pet_kitteninteract_70]
en = "Yes Player. Well he either broke the devourer's hold on you or else Klenter did."
pt = "Sim, Player. Bom, ou ele quebrou o domínio da Devoradora sobre você, ou foi o Klenter."

[.skill_summoning_pet_kitteninteract_71]
en = "Klenter? I thought he was dead."
pt = "Klenter? Achei que ele estivesse morto."

[.skill_summoning_pet_kitteninteract_72]
en = "He was, and still is. Ok, Icthlarin summoned Klenter's soul to torment you into returning the jar, the end result was that you were freed from the devourer's grasp."
pt = "Estava, e ainda está. Certo, Icthlarin invocou a alma de Klenter para te atormentar até você devolver o vaso, e no fim você se livrou das garras da Devoradora."

[.skill_summoning_pet_kitteninteract_73]
en = "So that's when I woke up with that jar in my inventory and had that intolerable ghost harassing me."
pt = "Então foi aí que acordei com aquele vaso no inventário e aquele fantasma insuportável me perseguindo."

[.skill_summoning_pet_kitteninteract_74]
en = "You then bumbled around for a bit and returned the jar, discovering that the high priest still hadn't completed the final ceremony so you got him all the bits and pieces."
pt = "Depois você ficou zanzando um tempo e devolveu o vaso, descobrindo que o sumo sacerdote ainda não tinha feito a cerimônia final, então arranjou tudo de que ele precisava."

[.skill_summoning_pet_kitteninteract_75]
en = "So then I remembered about the devourer's symbol which I placed in the ceremonial room and had to rush back and warn the priests about the devourer."
pt = "Aí lembrei do símbolo da Devoradora que eu tinha deixado na sala cerimonial e tive que correr de volta para avisar os sacerdotes sobre ela."

[.skill_summoning_pet_kitteninteract_76]
en = "And the rest is simple enough to piece together."
pt = "E o resto é fácil de juntar."

[.skill_summoning_pet_kitteninteract_77]
en = "Thanks cat, you know you're quite smart for a fish-eating animated ball of fluff."
pt = "Valeu, gato. Sabe que você é bem esperto para uma bola de pelo ambulante comedora de peixe?"

[.skill_summoning_pet_kitteninteract_78]
en = "You say the sweetest things. Hiss."
pt = "Você diz cada coisa fofa. Fsss."

[.skill_summoning_pet_kitteninteract_79]
en = "I'm as happy as a demon in a lava pit."
pt = "Estou feliz como um demônio num poço de lava."

[.skill_summoning_pet_kitteninteract_80]
en = "I'm feeling a bit like a ghost in a cake shop."
pt = "Estou me sentindo meio como um fantasma numa confeitaria."

[.skill_summoning_pet_kitteninteract_81]
en = "A ghost in a cake shop? What do you mean?"
pt = "Um fantasma numa confeitaria? Como assim?"

[.skill_summoning_pet_kitteninteract_82]
en = "You know, in need of exorcise."
pt = "Sabe, precisando de um exorcismo... digo, exercício."

[.skill_summoning_pet_kitteninteract_83]
