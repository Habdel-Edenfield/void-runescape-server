pt = "Cê quer que eu te mande pra Winkin's Farm pra uma partidinha de Vinesweeper?"

# FatherUrhney - Lumbridge - Tutorial Island

[.fatherurhney_1]
en = "Go away! I'm meditating!"
pt = "Vá embora! Estou meditando!"

[.fatherurhney_2]
en = "Well, that's friendly."
pt = "Nossa, que simpático."

[.fatherurhney_3]
en = "I SAID go AWAY."
pt = "Eu DISSE para ir EMBORA."

[.fatherurhney_4]
en = "Okay, okay... sheesh, what a grouch."
pt = "Tá bom, tá bom... credo, que rabugento."

[.fatherurhney_5]
en = "Father Aereck sent me to talk to you."
pt = "O Father Aereck me mandou falar com você."

[.fatherurhney_6]
en = "I suppose I'd better talk to you then. What problems has he got himself into this time?"
pt = "Acho melhor eu falar com você, então. Em que confusão ele se meteu desta vez?"

[.fatherurhney_7]
en = "He's got a ghost haunting his graveyard."
pt = "Tem um fantasma assombrando o cemitério dele."

[.fatherurhney_8]
en = "You mean he gets himself into lots of problems?"
pt = "Quer dizer que ele vive se metendo em confusão?"

[.fatherurhney_9]
en = "Yeah. For example, when we were trainee priests he kept on getting stuck up bell ropes."
pt = "Pois é. Por exemplo, quando éramos padres aprendizes, ele vivia ficando preso nas cordas dos sinos."

[.fatherurhney_10]
en = "Anyway. I don't have time for chitchat. What's his problem THIS time?"
pt = "Enfim. Não tenho tempo para conversa fiada. Qual é o problema dele DESTA vez?"

[.fatherurhney_11]
en = "I've lost the Amulet of Ghostspeak."
pt = "Perdi o Amulet of Ghostspeak (amuleto da fala fantasma)."

[.fatherurhney_12]
en = "Father Urhney sighs."
pt = "O Father Urhney suspira."

[.fatherurhney_13]
en = "What are you talking about? I can see you've got it with you!"
pt = "Do que você está falando? Estou vendo que ele está com você!"

[.fatherurhney_14]
en = "You come here wasting my time... Has it even occurred to you that you've got it stored somewhere? Now GO AWAY!"
pt = "Você vem aqui desperdiçar o meu tempo... Já te ocorreu que pode ter guardado ele em algum lugar? Agora VÁ EMBORA!"

[.fatherurhney_15]
en = "How careless can you get? Those things aren't easy to come by you know! Now clear some space in your inventory and I'll give you another one."
pt = "Como alguém pode ser tão descuidado? Essas coisas não são fáceis de conseguir, sabia? Agora abra espaço no seu inventário e eu te dou outro."

[.fatherurhney_16]
en = "How careless can you get? Those things aren't easy to come by you know! It's a good job I've got a spare."
pt = "Como alguém pode ser tão descuidado? Essas coisas não são fáceis de conseguir, sabia? Sorte sua que eu tenho um sobrando."

[.fatherurhney_17]
en = "Father Urhney hands you an amulet."
pt = "O Father Urhney te entrega um amuleto (amulet)."

[.fatherurhney_18]
en = "Be more careful this time."
pt = "Tenha mais cuidado desta vez."

[.fatherurhney_19]
en = "Okay, I'll try to be."
pt = "Tá bom, vou tentar."

[.fatherurhney_20]
en = "I've come to repossess your house."
pt = "Vim confiscar a sua casa."

[.fatherurhney_21]
en = "Under what grounds???"
pt = "Com base em quê???"

[.fatherurhney_22]
en = "Repeated failure on mortgage repayments."
pt = "Atrasos repetidos nas parcelas da hipoteca."

[.fatherurhney_23]
en = "What?"
pt = "O quê?"

[.fatherurhney_24]
en = "But... I don't have a mortgage! I built this house myself!"
pt = "Mas... eu não tenho hipoteca nenhuma! Eu mesmo construí esta casa!"

[.fatherurhney_25]
en = "Sorry. I must have got the wrong address. All the houses look the same around here."
pt = "Desculpe. Devo ter errado o endereço. Todas as casas por aqui são iguais."

[.fatherurhney_26]
en = "What? What houses? What ARE you talking about???"
pt = "O quê? Que casas? Do que você ESTÁ falando???"

[.fatherurhney_27]
en = "I don't know. I just wanted this house..."
pt = "Sei lá. Eu só queria esta casa..."

[.fatherurhney_28]
en = "Oh... go away and stop wasting my time!"
pt = "Ah... vá embora e pare de desperdiçar o meu tempo!"

[.fatherurhney_29]
en = "Oh, the silly fool."
pt = "Ah, aquele tolo."

[.fatherurhney_30]
en = "I leave town for just five months, and ALREADY he can't manage."
pt = "Saio da cidade por apenas cinco meses e ele JÁ não dá conta."

[.fatherurhney_31]
en = "(sigh)"
pt = "(suspiro)"

[.fatherurhney_32]
en = "Well, I can't go back and exorcise it. I vowed not to leave this place. Until I had done a full two years of prayer and meditation."
pt = "Bem, não posso voltar lá e exorcizá-lo. Jurei não sair deste lugar. Não antes de completar dois anos inteiros de oração e meditação."

[.fatherurhney_33]
en = "Tell you what I can do though; take this amulet."
pt = "Mas vou te dizer o que posso fazer: pegue este amuleto."

[.fatherurhney_34]
en = "It is an Amulet of Ghostspeak."
pt = "É um Amulet of Ghostspeak (amuleto da fala fantasma)."

[.fatherurhney_35]
en = "So called, because when you wear it you can speak to ghosts. A lot of ghosts are doomed to be ghosts because they have left some important task uncompleted."
pt = "Tem esse nome porque, quando você o usa, consegue falar com fantasmas. Muitos fantasmas estão condenados a ser fantasmas porque deixaram alguma tarefa importante por terminar."

[.fatherurhney_36]
en = "Maybe if you know what this task is, you can get rid of the ghost. I'm not making any guarantees mind you, but it is the best I can do right now."
pt = "Talvez, se você descobrir que tarefa é essa, consiga se livrar do fantasma. Não estou garantindo nada, veja bem, mas é o melhor que posso fazer agora."

[.fatherurhney_37]
en = "Thank you. I'll give it a try!"
pt = "Obrigado. Vou tentar!"

# Farmer - Lumbridge - Tutorial Island

[.farmer_1]
en = "Would you chop my %1%tree down for me?"
pt = "Pode derrubar a minha árvore (%1%tree) para mim?"

[.farmer_2]
en = "Why? You look like you could chop it down yourself!"
pt = "Por quê? Você parece capaz de derrubar sozinho!"

[.farmer_3]
en = "Yes, you're right - I'll do it myself."
pt = "É, você tem razão - eu mesmo faço."

[.farmer_4]
en = "I can't be bothered - I'd rather pay you to do it."
pt = "Estou com preguiça - prefiro pagar para você fazer."

[.farmer_5]
en = "Well, it's a lot of hard work - if you pay me 200 Coins I'll chop it down for you."
pt = "Bem, dá muito trabalho - se me pagar 200 Coins (moedas), eu derrubo para você."

[.farmer_6]
en = "I don't have 200 Coins I'm afraid."
pt = "Receio que não tenho 200 Coins."

[.farmer_7]
en = "Here's 200 Coins - chop my tree down please."
pt = "Aqui estão 200 Coins - derrube minha árvore, por favor."

[.farmer_8]
en = "I don't want to pay that much, sorry."
pt = "Não quero pagar tanto, desculpe."

[.farmer_9]
en = "Would you look after my crops for me?"
pt = "Pode cuidar da minha plantação para mim?"

[.farmer_10]
en = "I might - which patch were you thinking of?"
pt = "Talvez - em qual canteiro (patch) você está pensando?"

[.farmer_11]
en = "The northwestern allotment"
pt = "O canteiro (allotment) do noroeste"

[.farmer_12]
en = "The southeastern allotment"
pt = "O canteiro (allotment) do sudeste"

[.farmer_13]
en = "Can you give me any farming advice?"
pt = "Pode me dar algum conselho de Farming (agricultura)?"

[.farmer_14]
en = "I'll come back another time."
pt = "Volto outra hora."

[.farmer_15]
en = "I'll want 200 Coins to chop down your tree."
pt = "Vou querer 200 Coins (moedas) para derrubar sua árvore."

[.farmer_16]
en = "Pay 200 Coins to have your tree chopped down?"
pt = "Pagar 200 Coins para derrubar a sua árvore?"

[.farmer_17]
en = "That patch is diseased - you should cure it before asking me to be responsible for it!"
pt = "Esse canteiro está doente - cure ele antes de me pedir para ficar responsável!"

[.farmer_18]
en = "That's a stump. It'll grow back if you just leave it a alone for a while."
pt = "Isso é um toco. Ele cresce de novo se você deixar ele em paz um tempo."

[.farmer_19]
en = "That patch is already fully grown! I don't know what you want me to do with it!"
pt = "Esse canteiro já está todo crescido! Não sei o que você quer que eu faça com ele!"

[.farmer_20]
en = "I'm already looking after that patch for you."
pt = "Eu já estou cuidando desse canteiro para você."

[.farmer_21]
en = "If you like, but I want %1% for that."
pt = "Se quiser, mas vou querer %1% por isso."

[.farmer_22]
en = "I'm afraid I don't have any of those at the moment."
pt = "Receio que não tenho nada disso no momento."

[.farmer_23]
en = "Well, I'm not wasting my time for free."
pt = "Bem, não vou perder meu tempo de graça."

[.farmer_24]
en = "That'll do nicely, %1%. Leave it with me - I'll make sure that patch grows for you."
pt = "Está ótimo, %1%. Deixe comigo - vou garantir que esse canteiro cresça para você."

# ToolLeprechaun - Lumbridge - Tutorial Island

[.toolleprechaun_1]
en = "Ah, 'tis a foine day to be sure! Were yez wantin' me to store yer tools, or maybe ye might be wantin' yer stuff back from me?"
pt = "Ah, mas que dia bonito, pode crer! Cê tá querendo que eu guarde suas ferramenta, ou quem sabe cê quer suas coisa de volta?"

[.toolleprechaun_2]
en = "Nay, there's no such thing as a banknote for that."
pt = "Nada, num existe nota bancária (banknote) pra isso não."

[.toolleprechaun_3]
en = "Nay, I've got no banknotes to exchange for that item."
pt = "Nada, num tenho nota bancária pra trocar por esse item."

[.toolleprechaun_4]
en = "The leprechaun exchanges your items for banknotes."
pt = "O leprechaun troca seus itens por notas bancárias (banknotes)."

[.toolleprechaun_5]
en = "What can you store?"
pt = "O que você pode guardar?"

[.toolleprechaun_6]
en = "We'll hold onto yer rake, yer seed dibber, yer spade, yer secateurs, yer waterin' can and yer trowel - but mind it's not one of them fancy trowels only archaeologists use!"
pt = "A gente guarda seu ancinho (rake), seu plantador (seed dibber), sua pá (spade), sua tesoura de poda (secateurs), seu regador (watering can) e sua pazinha (trowel) - mas num vale aquelas pazinha chique que só arqueólogo usa!"

[.toolleprechaun_7]
en = "We'll take a few buckets off yer hands too, and even yer compost, supercompost an' ultracompost! Also plant cure vials."
pt = "Também tiro uns baldes (buckets) das suas mão, e até seu adubo (compost), supercompost e ultracompost! E também frascos de cura de planta (plant cure)."

[.toolleprechaun_8]
en = "Aside from that, if ye hands me yer farming produce, I can mebbe change it into banknotes for ye."
pt = "Fora isso, se cê me der o que colheu na lavoura, quem sabe eu troco por nota bancária pro cê."

[.toolleprechaun_9]
en = "So... do ye want to be using the store?"
pt = "Então... cê quer usar o depósito?"

[.toolleprechaun_10]
en = "No thanks, I'll keep hold of my stuff."
pt = "Não, obrigado, vou ficar com as minhas coisas."

[.toolleprechaun_11]
en = "Ye must be dafter than ye look if ye likes luggin' yer tools everywhere ye goes!"
pt = "Cê deve ser mais tonto do que parece, se gosta de carregar suas ferramenta pra todo lado que vai!"

[.toolleprechaun_12]
en = "What do you do with the tools you're storing?"
pt = "O que você faz com as ferramentas que guarda?"

[.toolleprechaun_13]
en = "What do you do with the tools you're storing? They can't possibly all fit in your pockets!"
pt = "O que você faz com as ferramentas que guarda? Elas não podem caber todas nos seus bolsos!"

[.toolleprechaun_14]
en = "We leprechauns have a shed where we keep 'em. It's a magic shed, so ye can get yer items back from any of us leprechauns whenever ye want. Saves ye havin' to carry loads of stuff around the country!"
pt = "Nós, leprechauns, temos um galpão onde guarda elas. É um galpão mágico, então cê pode pegar seus item de volta com qualquer leprechaun quando quiser. Poupa ocê de carregar um monte de tralha pelo país todo!"

