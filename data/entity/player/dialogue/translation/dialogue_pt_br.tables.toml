# Skill data - data/skill/slayer/master/chaeldar.tables.toml

[.data_skill_slayer_master_chaeldar_tables_1]
en = "Aberrant spectres are fetid, vile ghosts. The very smell of them will paralyse and harm you. A nosepeg will help negate their stink and their attacks are most definitely magical in nature. You'll be able to make the world more fragrant if you kill the ones lurking in the Slayer Tower near Canifis."
pt = "Os Aberrant spectres são fantasmas fétidos e asquerosos. Só o cheiro deles já paralisa e machuca você. Um prendedor de nariz (nosepeg) ajuda a anular o fedor, e os ataques deles são sem dúvida de natureza mágica. Você vai deixar o mundo mais perfumado se matar os que espreitam na Slayer Tower perto de Canifis."

[.data_skill_slayer_master_chaeldar_tables_2]
en = "Abyssal Demons are nasty creatures to fight. They aren't really part of this realm, and are able to move very quickly to trap their prey."
pt = "Os Abyssal Demons são criaturas terríveis de enfrentar. Eles não pertencem de verdade a este mundo e conseguem se mover muito rápido para encurralar a presa."

[.data_skill_slayer_master_chaeldar_tables_3]
en = "Aviansies are bird-like creatures found in the icy dungeons of the north. Melee weapons can't reach them, so use Magic or Ranged attacks."
pt = "Os Aviansies são criaturas parecidas com aves que vivem nas masmorras geladas do norte. Armas corpo a corpo não os alcançam, então use ataques de Magic ou Ranged."

[.data_skill_slayer_master_chaeldar_tables_4]
en = "Basilisks, like cockatrices, have a gaze that will paralyse and harm their prey. You'll need a mirror shield to protect you. I am sure you know that there is a Basilisk colony in the Rellekka Slayer Caves."
pt = "Os Basilisks, como as cockatrices, têm um olhar que paralisa e machuca a presa. Você vai precisar de um escudo espelhado (mirror shield) para se proteger. Com certeza você sabe que há uma colônia de Basilisks nas Rellekka Slayer Caves."

[.data_skill_slayer_master_chaeldar_tables_5]
en = "Bloodveld are strange, demonic creatures. They use their long, rasping tongue to feed on just about anything they can find. Their tongue assaults physically, so using magic attacks might be the best choice. If you can stand being licked by a half-ton demon, you should take a trip to the Slayer Tower near Canifis."
pt = "Os Bloodveld são criaturas demoníacas estranhas. Usam a língua comprida e áspera para comer quase tudo o que encontram. A língua ataca fisicamente, então ataques mágicos podem ser a melhor escolha. Se você aguenta levar lambidas de um demônio de meia tonelada, faça uma visita à Slayer Tower perto de Canifis."

[.data_skill_slayer_master_chaeldar_tables_6]
en = "Brine rats can be found in caves that are near the sea. They are hairless, bad-tempered and generally unfriendly. You may have spotted them while looking for pirate treasures."
pt = "Os Brine rats ficam em cavernas perto do mar. São pelados, mal-humorados e nada amigáveis. Talvez você já os tenha visto enquanto procurava tesouros de pirata."

[.data_skill_slayer_master_chaeldar_tables_7]
en = "Powerful weapons known as demonbane weapons can be used to quickly defeat even powerful demons like the Black Demon with greater ease."
pt = "Armas poderosas conhecidas como demonbane servem para derrotar rápido e com mais facilidade até demônios fortes como o Black Demon."

[.data_skill_slayer_master_chaeldar_tables_8]
en = "Blue dragons aren't as strong as other dragons, but they're still very powerful. Watch out for their fiery breath. Taverley Dungeon has a clutch of these creatures, which it can be profitable to slay."
pt = "Os Blue dragons não são tão fortes quanto outros dragões, mas ainda são muito poderosos. Cuidado com o sopro de fogo. A Taverley Dungeon tem uma ninhada dessas criaturas, e matá-las pode dar lucro."

[.data_skill_slayer_master_chaeldar_tables_9]
en = "Cave horrors can be found in the caves under Mos Le'Harmless which favour the use of missiles or Magic. You will need a witchwood icon to fight them effectively. They drop the famous black Slayer mask, so the trip may be worth it."
pt = "Os Cave horrors ficam nas cavernas embaixo de Mos Le'Harmless e são fracos contra projéteis ou Magic. Você vai precisar de um ícone de witchwood (witchwood icon) para enfrentá-los direito. Eles deixam cair a famosa máscara negra de Slayer (black mask), então a viagem pode valer a pena."

[.data_skill_slayer_master_chaeldar_tables_10]
en = "Crabs can be found all across Gielinor. They don't hit very hard but they can take a while to kill."
pt = "Há caranguejos (crabs) por toda Gielinor. Não batem muito forte, mas podem demorar para morrer."

[.data_skill_slayer_master_chaeldar_tables_11]
en = "Dust devils use clouds of dust, sand, ash and whatever else they can inhale to blind and disorientate their victims. They typically lurk in the smoky dungeon west of Pollnivneach."
pt = "Os Dust devils usam nuvens de poeira, areia, cinzas e o que mais conseguirem aspirar para cegar e desorientar as vítimas. Costumam ficar na masmorra enfumaçada a oeste de Pollnivneach."

[.data_skill_slayer_master_chaeldar_tables_12]
en = "Dagannoth are large, sea-dwelling creatures that are very aggressive. You'll often find them in caves near sea water. I can tell that you've seen the vile creatures, so you know where to go. Remember: they attack with missiles, so protect yourself accordingly."
pt = "Os Dagannoth são criaturas grandes do mar e muito agressivas. Costumam ficar em cavernas perto da água do mar. Dá para ver que você já viu essas criaturas nojentas, então sabe aonde ir. Lembre-se: elas atacam com projéteis, então proteja-se de acordo."

[.data_skill_slayer_master_chaeldar_tables_13]
en = "Like other giants, Fire giants often wield large weapons. Learn to recognise what kind of weapon it is and act accordingly. The smoke dungeon to the west of Pollnivneach has a population of these large and irritating creatures, so go smite them."
pt = "Como outros gigantes, os Fire giants costumam empunhar armas grandes. Aprenda a reconhecer o tipo de arma e aja de acordo. A masmorra enfumaçada a oeste de Pollnivneach tem uma população dessas criaturas grandes e irritantes, então vá castigá-las."

[.data_skill_slayer_master_chaeldar_tables_14]
en = "Fever spiders are giant spiders that carry the deadly spider fever. If you don't want to catch it, I suggest you wear Slayer gloves to fight them. I've heard they cause problems in breweries, if you want to find some."
pt = "As Fever spiders são aranhas gigantes que transmitem a mortal febre da aranha. Se não quiser pegá-la, sugiro usar luvas de Slayer (Slayer gloves) para lutar com elas. Ouvi dizer que causam problemas em cervejarias, se quiser encontrar algumas."

[.data_skill_slayer_master_chaeldar_tables_15]
en = "Gargoyles are winged creatures of stone. You'll need to fight them until they are close to death before breaking them apart with a rock hammer. There is a thriving population of Gargoyles in the Slayer Tower near Canifis."
pt = "As Gargoyles são criaturas aladas de pedra. Você precisa lutar até elas estarem quase mortas e então quebrá-las com um martelo de pedra (rock hammer). Há uma população próspera de Gargoyles na Slayer Tower perto de Canifis."

[.data_skill_slayer_master_chaeldar_tables_16]
en = "Demons are particularly weak to water spells. Though Greater Demons are not the strongest type of demon they are still dangerous."
pt = "Os demônios são especialmente fracos contra feitiços de água. Os Greater Demons não são o tipo mais forte de demônio, mas ainda são perigosos."

[.data_skill_slayer_master_chaeldar_tables_17]
en = "Hellhounds are a cross between Dogs and Demons. They are dangerous with a fierce bite, but have all of the same weaknesses as most demons."
pt = "Os Hellhounds são um cruzamento de cães com demônios. São perigosos e têm mordida feroz, mas têm todas as fraquezas da maioria dos demônios."

[.data_skill_slayer_master_chaeldar_tables_18]
en = "Jellies are nasty, cube-like, gelatinous creatures which absorb everything they come across. Rellekka's caves are known to harbour these unnatural abominations. You can consider their attacks to be a form of Ranged and protect yourself with this in mind."
pt = "As Jellies são criaturas gelatinosas e asquerosas, em forma de cubo, que absorvem tudo o que encontram. As cavernas de Rellekka abrigam essas aberrações. Pode considerar os ataques delas uma forma de Ranged e se proteger pensando nisso."

[.data_skill_slayer_master_chaeldar_tables_19]
en = "Jungle horrors can be found all over Mos Le'Harmless. They are strong and aggressive, but you should be heroic enough to make short work of them."
pt = "Os Jungle horrors estão por toda Mos Le'Harmless. São fortes e agressivos, mas você deve ser heroico o bastante para acabar com eles rapidinho."

[.data_skill_slayer_master_chaeldar_tables_20]
en = "These tricky creatures burrow beneath the jungle north west of Oo'glog. Be careful, as these poisonous jungle wyrms like to use magical attacks from a distance, while they should be weak to stab attacks."
pt = "Essas criaturas traiçoeiras se enterram embaixo da selva a noroeste de Oo'glog. Cuidado: esses jungle wyrms venenosos gostam de atacar com magia à distância, mas devem ser fracos contra ataques 'Stab'."

[.data_skill_slayer_master_chaeldar_tables_21]
en = "Kalphites are large insects that live in hives under the desert sands. South-west of Shantay Pass they swarm and make themselves a nuisance. Enter deeper into the lair if you are looking for a suitable challenge."
pt = "Os Kalphites são insetos grandes que vivem em colmeias sob a areia do deserto. A sudoeste do Shantay Pass eles enxameiam e incomodam todo mundo. Entre mais fundo no covil se procura um desafio à altura."

[.data_skill_slayer_master_chaeldar_tables_22]
en = "Kurasks are large, brutal creatures with very thick hides. You'll need a leaf-bladed weapon, broad arrows or a magic dart to harm them. Kurask may be found in the caverns east of Rellekka. As they are so large, you may be able to kill them when they cannot reach you."
pt = "Os Kurasks são criaturas grandes e brutais de couro muito grosso. Você vai precisar de uma arma de lâmina-folha (leaf-bladed), flechas largas (broad arrows) ou um magic dart para feri-los. Há Kurasks nas cavernas a leste de Rellekka. Como são enormes, talvez você consiga matá-los de onde eles não alcançam você."

[.data_skill_slayer_master_chaeldar_tables_23]
en = "Lesser demons are weak to ranged attacks. Although they're relatively weak, they are still dangerous. Taverley's underworld is infested with these hellish pests."
pt = "Os Lesser demons são fracos contra ataques à distância. Embora sejam relativamente fracos, ainda são perigosos. O subterrâneo de Taverley está infestado dessas pestes infernais."

[.data_skill_slayer_master_chaeldar_tables_24]
en = "Mutated zygomites are hard to destroy and attack with mainly magical damage. They regenerate quickly, so you will need to finish them off with fungicide. We have a bit of a problem with them here in Zanaris."
pt = "Os Mutated zygomites são difíceis de destruir e atacam com dano principalmente mágico. Eles se regeneram rápido, então você vai precisar acabar com eles usando fungicida (fungicide). Temos um probleminha com eles aqui em Zanaris."

[.data_skill_slayer_master_chaeldar_tables_25]
en = "Nechryael are demons of decay which summon small winged beings to help them fight their victims. Their minions can bypass protective prayers so be sure to wear thick armour."
pt = "Os Nechryael são demônios da decomposição que invocam pequenos seres alados para ajudar a lutar com as vítimas. Os lacaios deles atravessam as orações de proteção, então use uma armadura grossa."

[.data_skill_slayer_master_chaeldar_tables_26]
en = "Skeletal Wyverns are extremely dangerous and they are hard to hit with arrows as they slip right through. To stand a good chance of surviving you'll need some elemental shielding from its icy breath."
pt = "Os Skeletal Wyverns são extremamente perigosos e difíceis de acertar com flechas, que passam direto por eles. Para ter boa chance de sobreviver, você vai precisar de uma proteção elemental contra o sopro gelado."

[.data_skill_slayer_master_chaeldar_tables_27]
en = "Shadow warriors are dark and mysterious. They hide in the shadows, so be wary of ambushes. Apparently, a large number may be found lurking beneath the Legends' Guild."
pt = "Os Shadow warriors são sombrios e misteriosos. Escondem-se nas sombras, então cuidado com emboscadas. Pelo jeito, muitos deles espreitam embaixo da Legends' Guild."

[.data_skill_slayer_master_chaeldar_tables_28]
en = "Spiritual Creatures can be found in the icy caverns near Trollheim, supporting the cause of their chosen god. Wearing equipment aligned with each of the gods can help you avoid undesired conflict."
pt = "As Spiritual Creatures ficam nas cavernas geladas perto de Trollheim, apoiando a causa do deus que escolheram. Usar equipamento de cada um dos deuses ajuda a evitar conflitos indesejados."

[.data_skill_slayer_master_chaeldar_tables_29]
en = "Turoths are large, vicious creatures with thick hides. You'll need a leaf-bladed weapon, broad arrows, or a magic dart to harm them. Seek them out in the Rellekka Slayer Caves."
pt = "Os Turoths são criaturas grandes e cruéis de couro grosso. Você vai precisar de uma arma de lâmina-folha (leaf-bladed), flechas largas (broad arrows) ou um magic dart para feri-los. Procure-os nas Rellekka Slayer Caves."

[.data_skill_slayer_master_chaeldar_tables_30]
en = "Trolls regenerate quickly but are still vulnerable to poisons. They usually use crushing weapons. Perhaps you should head to the snowy islands where these creatures are both fierce and aggressive."
pt = "Os trolls se regeneram rápido, mas ainda são vulneráveis a venenos. Costumam usar armas de esmagamento. Talvez você deva ir às ilhas nevadas, onde essas criaturas são ferozes e agressivas."

[.data_skill_slayer_master_chaeldar_tables_31]
en = "Tzhaar reside in their cave under the Karamja volcano. Beware as they can call to their fellows for aid."
pt = "Os TzHaar vivem na caverna embaixo do vulcão de Karamja. Cuidado, eles podem chamar os companheiros para ajudar."

[.data_skill_slayer_master_chaeldar_tables_32]
en = "Vampyres are extremely powerful beings. An underground group known as the Myreque have been searching for tools to defeat them, which they may be willing to share if you can find them."
pt = "Os Vampyres são seres extremamente poderosos. Um grupo clandestino chamado Myreque anda procurando ferramentas para derrotá-los, e talvez as compartilhe se você os encontrar."

# Skill data - data/skill/slayer/master/duradel.tables.toml

[.data_skill_slayer_master_duradel_tables_1]
en = "Aberrant spectres are fetid, vile ghosts. The very smell of them will paralyse and harm you. A nosepeg will help ignore their stink and weak slayers might decide to pray when fighting them. They can be found in the Slayer Tower near Canifis and I have heard rumours that they also live beneath Pollnivneach in the desert."
pt = "Aberrant spectres são fantasmas fétidos e asquerosos. Só o cheiro deles já paralisa e machuca. Um prendedor de nariz (nosepeg) ajuda a ignorar o fedor, e caçadores fracos talvez prefiram rezar ao enfrentá-los. Ficam na Slayer Tower, perto de Canifis, e ouvi boatos de que também vivem embaixo de Pollnivneach, no deserto."

[.data_skill_slayer_master_duradel_tables_2]
en = "Abyssal demons are nasty creatures to deal with. They aren't really part of this realm and are able to move very quickly to trap their prey. The Slayer Tower is home to a number of these creatures."
pt = "Abyssal demons são criaturas terríveis de enfrentar. Não pertencem de verdade a este mundo e se movem muito rápido para encurralar a presa. A Slayer Tower abriga vários deles."

[.data_skill_slayer_master_duradel_tables_3]
en = "Aquanites are amphibious creatures that attract prey using the glowing lures on their heads. They attack stronger opponents from a distance with water magic, and dislike those who pray against it. They dwell in the Fremennik Slayer Dungeon, in a chamber past the kurasks."
pt = "Aquanites são criaturas anfíbias que atraem a presa com as iscas luminosas da cabeça. Atacam oponentes mais fortes de longe com magia da água e não gostam de quem reza contra ela. Vivem na Fremennik Slayer Dungeon, numa câmara depois dos kurasks."

[.data_skill_slayer_master_duradel_tables_4]
en = "Aviansies can be found in the Godwars Dungeon north of Trollheim. As they are flying, you'll find melee attacks are not going to cut it."
pt = "Aviansies ficam na Godwars Dungeon, ao norte de Trollheim. Como eles voam, você vai ver que ataques corpo a corpo não vão dar conta."

[.data_skill_slayer_master_duradel_tables_5]
en = "Bloodveld are strange, demonic creatures. They use their long, rasping tongue to feed on just about anything they can find. Remember that their tongues are magical in nature but, moreso, they deserve to die."
pt = "Bloodvelds são criaturas estranhas e demoníacas. Usam a língua comprida e áspera para se alimentar de quase tudo que encontram. Lembre-se de que a língua deles é de natureza mágica, mas, acima de tudo, eles merecem morrer."

[.data_skill_slayer_master_duradel_tables_6]
en = "Black demons are weak to ranged attacks. They're still the strongest demon and very dangerous, however. Seek them out in the Edgeville or Brimhaven dungeons."
pt = "Black demons são fracos contra ataques à distância. Mesmo assim, são os demônios mais fortes e muito perigosos. Procure-os nas masmorras de Edgeville ou de Brimhaven."

[.data_skill_slayer_master_duradel_tables_7]
en = "Black dragons are among the strongest dragons and are very fierce. Watch out for their fiery breath. I am sure you will have seen them in your travels and have honed your techniques on lesser dragons."
pt = "Black dragons estão entre os dragões mais fortes e são muito ferozes. Cuidado com o sopro de fogo. Tenho certeza de que você já os viu nas suas viagens e aperfeiçoou suas técnicas em dragões menores."

[.data_skill_slayer_master_duradel_tables_8]
en = "Dark beasts are large, dog-like predators with massively muscled bodies that protect them from crushing weapons. You'll find them near the Temple of Light, attracted to the power of the Death Altar."
pt = "Dark beasts são grandes predadores parecidos com cães, de corpo tão musculoso que os protege de armas de esmagamento. Você os encontra perto do Temple of Light, atraídos pelo poder do Death Altar."

[.data_skill_slayer_master_duradel_tables_9]
en = "Head east of Al Kharid to find them on the hills above the Shantay Pass. Watch out for their vicious ranged attacks."
pt = "Vá para o leste de Al Kharid para encontrá-los nas colinas acima do Shantay Pass. Cuidado com os ataques à distância cruéis deles."

[.data_skill_slayer_master_duradel_tables_10]
en = "Dust devils use clouds of dust, sand, ash and whatever else they can inhale to blind and disorientate their victims. Good luck on obtaining a dragon chainmail from their dusty remains."
pt = "Dust devils usam nuvens de poeira, areia, cinzas e tudo o mais que conseguem aspirar para cegar e desorientar suas vítimas. Boa sorte para conseguir uma cota de malha de dragão (dragon chainmail) dos restos poeirentos deles."

[.data_skill_slayer_master_duradel_tables_11]
en = "Dagannoth are large, sea-dwelling creatures that are very aggressive. You'll often find them in caves near sea water. There is no joy so great as to cleanse these from the face of Gielinor."
pt = "Dagannoths são criaturas marinhas grandes e muito agressivas. É comum encontrá-los em cavernas perto da água do mar. Não há alegria maior do que limpar Gielinor deles."

[.data_skill_slayer_master_duradel_tables_12]
en = "Like other giants, Fire giants often wield large weapons. Learn to recognise what kind of weapon it is and act accordingly. Remember the days when these were a challenge to you, and laugh."
pt = "Como outros gigantes, os Fire giants costumam empunhar armas grandes. Aprenda a reconhecer que arma é e aja de acordo. Lembre-se dos tempos em que eles eram um desafio para você, e ria."

[.data_skill_slayer_master_duradel_tables_13]
en = "Gargoyles are winged creatures of stone. You'll need to fight them until they are close to death before breaking them apart with a rock hammer. Exterminate those in the Slayer Tower."
pt = "Gargoyles são criaturas aladas de pedra. Você vai ter que lutar até que estejam quase mortos e então quebrá-los com um martelo de pedra (rock hammer). Extermine os da Slayer Tower."

[.data_skill_slayer_master_duradel_tables_14]
en = "Goraks are extremely aggressive creatures. They have been imprisoned on an alternate plane, which is only accessible by using the fairy rings. Be extremely careful: their touch drains life points as well as skills!"
pt = "Goraks são criaturas extremamente agressivas. Foram aprisionados num plano alternativo, que só se alcança pelos fairy rings. Tome muito cuidado: o toque deles drena pontos de vida e também habilidades!"

[.data_skill_slayer_master_duradel_tables_15]
en = "Greater demons are weak to ranged attacks. Though not the strongest of the demons, they are still dangerous. Slaughter them easily in Brimhaven's depths, and revel in your power."
pt = "Greater demons são fracos contra ataques à distância. Não são os demônios mais fortes, mas ainda são perigosos. Massacre-os com facilidade nas profundezas de Brimhaven e deleite-se com o seu poder."

[.data_skill_slayer_master_duradel_tables_16]
en = "Hellhounds are a cross between dogs and demons; they are also dangerous with a fierce bite. Make them know fear."
pt = "Hellhounds são um cruzamento de cães e demônios; também são perigosos, com uma mordida feroz. Faça-os conhecer o medo."

[.data_skill_slayer_master_duradel_tables_17]
en = "The strongest and coldest of their kind, they are found beneath the Fremennik mountains. Be careful of all their attacks; but, as they are beings of ice, I've found my fire spells inflict far more damage against them."
pt = "Os mais fortes e frios da sua espécie, eles ficam embaixo das montanhas Fremennik. Cuidado com todos os ataques deles; mas, como são seres de gelo, percebi que meus feitiços de fogo causam muito mais dano a eles."

[.data_skill_slayer_master_duradel_tables_18]
en = "Iron dragons are some of the weaker metallic dragons; their iron scales are far thicker than normal iron armour. Their fiery breath and sharp claws can be negated by a number of means. If you haven't visited Brimhaven Dungeon's depths then I advise you do - if only for the interesting creatures like these to kill there."
pt = "Iron dragons estão entre os dragões metálicos mais fracos; suas escamas de ferro são bem mais grossas que uma armadura de ferro comum. O sopro de fogo e as garras afiadas podem ser anulados de várias formas. Se ainda não visitou as profundezas da Brimhaven Dungeon, recomendo - nem que seja pelas criaturas interessantes como estas para matar lá."

[.data_skill_slayer_master_duradel_tables_19]
en = "Kalphites are large insects that live in hives under the desert sands. I am sure that, by now, you have seen them to the south-west of Shantay Pass."
pt = "Kalphites são insetos grandes que vivem em colmeias sob as areias do deserto. Tenho certeza de que, a esta altura, você já os viu a sudoeste do Shantay Pass."

[.data_skill_slayer_master_duradel_tables_20]
en = "Mithril dragons are very dangerous opponents. They live beneath the Baxtorian Falls and devour most of those who seek to slay them. You are a battlemaster; test your skills."
pt = "Mithril dragons são oponentes muito perigosos. Vivem embaixo das Baxtorian Falls e devoram a maioria dos que tentam matá-los. Você é um mestre de batalha; ponha suas habilidades à prova."

[.data_skill_slayer_master_duradel_tables_21]
en = "Nechryael are demons of decay that summon small winged beings to help them fight their victims. They can be found in the Slayer Tower near Canifis."
pt = "Nechryael são demônios da decomposição que invocam pequenos seres alados para ajudá-los a lutar contra suas vítimas. Ficam na Slayer Tower, perto de Canifis."

[.data_skill_slayer_master_duradel_tables_22]
en = "Skeletal wyverns are extremely dangerous and they are hard to hit with arrows, as they slip right through. To stand a good chance of surviving, you'll need some elemental shielding from their icy breath."
pt = "Skeletal wyverns são extremamente perigosos e difíceis de acertar com flechas, que passam direto por eles. Para ter boa chance de sobreviver, você vai precisar de uma proteção elemental contra o sopro gelado deles."

[.data_skill_slayer_master_duradel_tables_23]
en = "Spiritual mages are the strongest of the spiritual guardians. They are devastating against warriors, but a smart ranger can sometimes defeat them. Of course, Prayer might serve you well, too. They can be found in the icy caverns near Trollheim, supporting the cause of their chosen god."
pt = "Spiritual mages são os mais fortes dos guardiões espirituais. São devastadores contra guerreiros, mas um arqueiro esperto às vezes consegue vencê-los. Claro que Prayer (oração) também pode ajudar. Ficam nas cavernas geladas perto de Trollheim, apoiando a causa do deus que escolheram."

[.data_skill_slayer_master_duradel_tables_24]
en = "Steel dragons are dangerous and metallic, with steel scales that are far thicker than normal steel armour. As you are an accomplished slayer, I am sure you'll be able to deal with them easily."
pt = "Steel dragons são perigosos e metálicos, com escamas de aço bem mais grossas que uma armadura de aço comum. Como você é um caçador de Slayer experiente, tenho certeza de que vai lidar com eles facilmente."

[.data_skill_slayer_master_duradel_tables_25]
en = "Suqahs can only be found on the mystical Lunar Isle. They use melee and magical attacks, and they often drop hide, teeth and herbs."
pt = "Suqahs só existem na mística Lunar Isle. Usam ataques corpo a corpo e mágicos, e costumam deixar couro, dentes e ervas."

[.data_skill_slayer_master_duradel_tables_26]
en = "Waterfiends are creatures of water that live under the Baxtorian Lake. Those followed by familiars are keen to slay these elemental forces."
pt = "Waterfiends são criaturas de água que vivem sob o Baxtorian Lake. Quem anda com familiares tem vontade de matar essas forças elementais."

