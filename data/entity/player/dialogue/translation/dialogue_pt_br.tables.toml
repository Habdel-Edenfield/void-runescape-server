# Skills - summoning/familiar/GraniteCrab.kt

[.skill_summoning_familiar_granitecrab_1]
en = "Can I have some fish?"
pt = "Me dá um peixe?"

[.skill_summoning_familiar_granitecrab_2]
en = "No, I have to cook these for later."
pt = "Não, tenho que cozinhar estes para depois."

[.skill_summoning_familiar_granitecrab_3]
en = "Free fish, please?"
pt = "Peixe de graça, por favor?"

[.skill_summoning_familiar_granitecrab_4]
