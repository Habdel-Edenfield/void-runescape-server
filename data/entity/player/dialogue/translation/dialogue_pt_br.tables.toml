# Skills - summoning/familiar/Minotaur.kt

[.skill_summoning_familiar_minotaur_1]
en = "Are you having a laugh?"
pt = "Tá tirando com a minha cara?"

[.skill_summoning_familiar_minotaur_2]
en = "I'm not sure I know what you-"
pt = "Acho que não entendi o que você-"

[.skill_summoning_familiar_minotaur_3]
en = "Listen, no-horns, you have two choices: take off the horns yourself or I'll headbutt you until they fall off."
pt = "Escuta aqui, sem-chifre, você tem duas opções: tira esses chifres você mesmo ou eu te dou cabeçada até eles caírem."

[.skill_summoning_familiar_minotaur_4]
en = "Yessir."
pt = "Sim, senhor."

[.skill_summoning_familiar_minotaur_5]
en = "Good, no-horns. Let's not have this conversation again."
pt = "Muito bem, sem-chifre. Não vamos ter esta conversa de novo."

[.skill_summoning_familiar_minotaur_6]
en = "All this walking about is making me angry."
pt = "Toda essa andança está me deixando com raiva."

[.skill_summoning_familiar_minotaur_7]
en = "You seem to be quite happy about that."
pt = "Você parece bem feliz com isso."

[.skill_summoning_familiar_minotaur_8]
en = "Yeah! There's nothing like getting a good rage on and then working it out on some no-horns."
pt = "Pois é! Nada como juntar uma boa raiva e depois descarregar num sem-chifre qualquer."

[.skill_summoning_familiar_minotaur_9]
en = "I can't say I know what you mean."
pt = "Não posso dizer que entendo."

[.skill_summoning_familiar_minotaur_10]
en = "Well I didn't think a no-horns like you would get it!"
pt = "Bem, eu não esperava que um sem-chifre como você fosse entender!"

[.skill_summoning_familiar_minotaur_11]
en = "Can you tell me why we're not fighting yet?"
pt = "Pode me dizer por que ainda não estamos lutando?"

[.skill_summoning_familiar_minotaur_12]
en = "Buck up; I'll find you something to hit soon."
pt = "Anime-se; logo eu acho alguma coisa para você bater."

[.skill_summoning_familiar_minotaur_13]
en = "You'd better, no-horns, because that round head of yours is looking mighty axeable."
pt = "É bom mesmo, sem-chifre, porque essa sua cabeça redonda está parecendo bem machadável."

[.skill_summoning_familiar_minotaur_14]
en = "Hey, no-horns?"
pt = "Ei, sem-chifre?"

[.skill_summoning_familiar_minotaur_15]
en = "Why do you keep calling me no-horns?"
pt = "Por que você vive me chamando de sem-chifre?"

[.skill_summoning_familiar_minotaur_16]
en = "Do I really have to explain that?"
pt = "Preciso mesmo explicar isso?"

[.skill_summoning_familiar_minotaur_17]
en = "No, thinking about it, it's pretty self-evident."
pt = "Não, pensando bem, é bem óbvio."

[.skill_summoning_familiar_minotaur_18]
en = "Glad we're on the same page, no-horns."
pt = "Que bom que estamos de acordo, sem-chifre."

[.skill_summoning_familiar_minotaur_19]
en = "So, what did you want?"
pt = "Então, o que você queria?"

[.skill_summoning_familiar_minotaur_20]
en = "I've forgotten, now. I'm sure it'll come to me later."
pt = "Agora esqueci. Com certeza vou lembrar depois."

[.skill_summoning_familiar_minotaur_21]
en = "Hey no-horns!"
pt = "Ei, sem-chifre!"

[.skill_summoning_familiar_minotaur_22]
en = "Oh, I don't have anything to say, I was just yelling at you."
pt = "Ah, não tenho nada para dizer, só estava gritando com você."

[.skill_summoning_familiar_minotaur_23]
en = "Why?"
pt = "Por quê?"

[.skill_summoning_familiar_minotaur_24]
en = "No reason. I do like to mess with the no-horns, though."
pt = "Por nada. Mas eu adoro provocar os sem-chifre."

