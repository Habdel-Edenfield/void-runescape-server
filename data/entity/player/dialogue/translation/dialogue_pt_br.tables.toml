# LightCreature - Lumbridge - Tutorial Island

# MillieMiller - Lumbridge - Tutorial Island

[.milliemiller_1]
en = "Hello Adventurer. Welcome to Mill Lane Mill. Can I help you?"
pt = "Olá, aventureiro. Bem-vindo ao Mill Lane Mill. Posso ajudar?"

[.milliemiller_2]
en = "I'm looking for extra fine flour."
pt = "Procuro farinha extrafina (extra fine flour)."

[.milliemiller_3]
en = "What's wrong with ordinary flour?"
pt = "Qual o problema da farinha comum?"

[.milliemiller_4]
en = "Well, I'm no expert chef, but apparently it makes better cakes. This cake, you see, is for Duke Horacio."
pt = "Bem, não sou nenhum chef, mas parece que ela faz bolos melhores. E este bolo, sabe, é para o Duke Horacio."

[.milliemiller_5]
en = "Really? How marvellous! Well, I can sure help you out there. Go ahead and use the mill and I'll realign the millstones to produce extra fine flour. Anything else?"
pt = "É mesmo? Que maravilha! Bem, nisso eu posso ajudar. Pode usar o moinho que eu realinho as mós para produzir farinha extrafina. Mais alguma coisa?"

[.milliemiller_6]
en = "I'm Miss Millicent Miller the Miller of Mill Lane Mill.Our family have been milling flour for generations."
pt = "Sou a senhorita Millicent Miller, a moleira do Mill Lane Mill. Nossa família mói farinha (flour) há gerações."

[.milliemiller_7]
en = "Don't you ever get fed up with flour?"
pt = "Você nunca enjoa de farinha?"

[.milliemiller_8]
en = "It's a good business to be in. People will always need flour."
pt = "É um bom negócio. As pessoas sempre vão precisar de farinha."

[.milliemiller_9]
en = "This is Mill Lane Mill. source of the finest flour in Gielinor, and home to the Miller family for many generations"
pt = "Este é o Mill Lane Mill, fonte da melhor farinha (flour) de Gielinor e lar da família Miller há muitas gerações."

[.milliemiller_10]
en = "We take wheat from the field nearby and mill into flour."
pt = "Pegamos trigo (wheat) do campo aqui perto e o moemos em farinha."

[.milliemiller_11]
en = "How do I mill flour?"
pt = "Como faço para moer farinha?"

[.milliemiller_12]
en = "Making flour is pretty easy. First of all you need to get some wheat. You can pick some from wheat fields. There is one just outside the Mill, but there are many others scattered across the world."
pt = "Fazer farinha (flour) é bem fácil. Primeiro você precisa de trigo (wheat). Dá para colher em campos de trigo. Há um bem aqui fora do moinho, mas há muitos outros espalhados pelo mundo."

[.milliemiller_13]
en = "feel free to pick from our field! There always seems to be plenty of wheat there."
pt = "Fique à vontade para colher no nosso campo! Sempre parece ter bastante trigo lá."

[.milliemiller_14]
en = "Then I bring my wheat here?"
pt = "E aí eu trago meu trigo para cá?"

[.milliemiller_15]
en = "Yes, or one of the other mills in Gielinor. They all work the same way."
pt = "Sim, ou para um dos outros moinhos de Gielinor. Todos funcionam do mesmo jeito."

[.milliemiller_16]
en = "Just take your wheat up two levels to the top floor of the mill and place some into the hopper."
pt = "É só levar o trigo dois andares acima, até o último andar do moinho, e colocar um pouco na tremonha (hopper)."

[.milliemiller_17]
en = "Then you need to start the grinding process by pulling the lever near the hopper. You add more wheat, but each time you add wheat you'll have to pull the hopper lever again."
pt = "Depois você inicia a moagem puxando a alavanca perto da tremonha. Pode pôr mais trigo, mas toda vez que puser, terá de puxar a alavanca da tremonha de novo."

[.milliemiller_18]
en = "So where does the flour go then?"
pt = "E para onde vai a farinha?"

[.milliemiller_19]
en = "The flour appears in this room here, you'll need an empty pot to put the flour into. One pot will hold the flour made by one load of wheat"
pt = "A farinha aparece aqui nesta sala; você vai precisar de um pote vazio (empty pot) para colocá-la. Um pote guarda a farinha de uma carga de trigo."

[.milliemiller_20]
en = "That's all there is to it and you'll have a pot of flour."
pt = "É só isso, e você terá um pote de farinha (pot of flour)."

[.milliemiller_21]
en = "Great! Thanks for your help."
pt = "Ótimo! Obrigado pela ajuda."

# MilkSellers - Lumbridge - Tutorial Island

[.milksellers_1]
en = "Would you like to buy some milk?"
pt = "Gostaria de comprar um pouco de leite?"

[.milksellers_2]
en = "Sure."
pt = "Claro."

[.milksellers_3]
