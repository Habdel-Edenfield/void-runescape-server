[.text_quest_free_the_restless_ghost_restlessghost_48]
en = "WOOOOOOOOO!"
pt = "WOOOOOOOOO!"

[.text_quest_free_the_restless_ghost_restlessghost_49]
en = "Wooo woo?"
pt = "Wooo woo?"

[.text_quest_free_the_restless_ghost_restlessghost_50]
en = "Well, if you INSIST."
pt = "Bem, se você INSISTE."

[.text_quest_free_the_restless_ghost_restlessghost_51]
en = "Wooooooooo!"
pt = "Wooooooooo!"

[.text_quest_free_the_restless_ghost_restlessghost_52]
en = "Ah well, better be off now..."
pt = "Bom, é melhor eu ir andando..."

[.text_quest_free_the_restless_ghost_restlessghost_53]
en = "I should think it's because I've lost my head."
pt = "Acho que é porque perdi a cabeça."

[.text_quest_free_the_restless_ghost_restlessghost_54]
en = "What? I can see your head perfectly fine well, see through it at least."
pt = "O quê? Estou vendo a sua cabeça direitinho... bem, vendo através dela, pelo menos."

[.text_quest_free_the_restless_ghost_restlessghost_55]
en = "No, no, I mean from my REAL body. If you look in my coffin you'll see my corpse is without its skull. Last thing I remember was being attacked by a warlock while I was mining. It was at the mine just south of this"
pt = "Não, não, do meu corpo DE VERDADE. Se olhar no meu caixão, vai ver que meu cadáver está sem o crânio. A última coisa de que me lembro é de ser atacado por um bruxo enquanto minerava. Foi na mina logo ao sul deste"

[.text_quest_free_the_restless_ghost_restlessghost_56]
en = "graveyard."
pt = "cemitério."

[.text_quest_free_the_restless_ghost_restlessghost_57]
en = "Okay. I'll try to get your skull back for you so you can rest in peace."
pt = "Certo. Vou tentar recuperar o seu crânio para você descansar em paz."

[.text_quest_free_the_restless_ghost_restlessghost_58]
en = "Yes, ok. Do you know WHY you're a ghost?"
pt = "Tá bom. Você sabe POR QUE é um fantasma?"

[.text_quest_free_the_restless_ghost_restlessghost_59]
en = "No, you're scary!"
pt = "Não, você dá medo!"

[.text_quest_free_the_restless_ghost_restlessghost_60]
en = "..and they're an idiot."
pt = "..e é um idiota."

[.text_quest_free_the_restless_ghost_restlessghost_61]
en = "How are you doing finding my skull?"
pt = "Como vai a busca pelo meu crânio?"

[.text_quest_free_the_restless_ghost_restlessghost_62]
en = "I have found it!"
pt = "Encontrei!"

[.text_quest_free_the_restless_ghost_restlessghost_63]
en = "Hurrah! Now I can stop being a ghost! You just need to put it in my coffin there, and I will be free!"
pt = "Viva! Agora posso deixar de ser fantasma! É só colocar o crânio no meu caixão ali que eu fico livre!"

[.text_quest_free_the_restless_ghost_restlessghost_64]
en = "Sorry, I can't find it at the moment."
pt = "Desculpe, ainda não encontrei."

[.text_quest_free_the_restless_ghost_restlessghost_65]
en = "Ah well. Keep on looking."
pt = "Ah, tudo bem. Continue procurando."

[.text_quest_free_the_restless_ghost_restlessghost_66]
en = "I'm pretty sure it's somewhere near the mining spot south of here. I really hope it's still there somewhere."
pt = "Tenho quase certeza de que está perto da mina ao sul daqui. Espero mesmo que ainda esteja por lá."

