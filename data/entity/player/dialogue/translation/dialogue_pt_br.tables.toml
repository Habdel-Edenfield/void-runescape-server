# Text - area/misthalin/lumbridge/swamp/LumbridgeSwamp.kt

[.text_area_misthalin_lumbridge_swamp_lumbridgeswamp_1]
en = "There's nothing of any interest."
pt = "Não há nada de interessante."

[.text_area_misthalin_lumbridge_swamp_lumbridgeswamp_2]
en = "You already have the ghost's skull."
pt = "Você já tem o crânio do fantasma."

[.text_area_misthalin_lumbridge_swamp_lumbridgeswamp_3]
en = "There's nothing there of any use to you."
pt = "Não há nada aí que sirva para você."

[.text_area_misthalin_lumbridge_swamp_lumbridgeswamp_4]
en = "You can see the skull under the rocks, but you don't have enough space to carry it."
pt = "Você vê o crânio debaixo das pedras, mas não tem espaço para carregá-lo."

[.text_area_misthalin_lumbridge_swamp_lumbridgeswamp_5]
en = "You take the skull from the pile of rocks."
pt = "Você pega o crânio do monte de pedras."

[.text_area_misthalin_lumbridge_swamp_lumbridgeswamp_6]
en = "A skeleton warlock has appeared."
pt = "Um skeleton warlock apareceu."

# Text - area/misthalin/lumbridge/swamp/LumbridgeSwampCave.kt

[.text_area_misthalin_lumbridge_swamp_lumbridgeswampcave_1]
en = "You should find a tinderbox before going down there."
pt = "É bom arranjar uma pederneira (tinderbox) antes de descer aí."

[.text_area_misthalin_lumbridge_swamp_lumbridgeswampcave_2]
en = "Attach a rope to the top of the hole?"
pt = "Amarrar uma corda (rope) na beira do buraco?"

[.text_area_misthalin_lumbridge_swamp_lumbridgeswampcave_3]
en = "You tie the rope to the top of the hole and throw it down."
pt = "Você amarra a corda na beira do buraco e a joga para baixo."

[.text_area_misthalin_lumbridge_swamp_lumbridgeswampcave_4]
en = "There is a sheer drop below the hole. You will need a rope."
pt = "Há uma queda vertical embaixo do buraco. Você vai precisar de uma corda (rope)."

# Text - area/misthalin/lumbridge/swamp/LumbridgeSwampShed.kt

[.text_area_misthalin_lumbridge_swamp_lumbridgeswampshed_1]
en = "The world starts to shimmer..."
pt = "O mundo começa a tremeluzir..."

[.text_area_misthalin_lumbridge_swamp_lumbridgeswampshed_2]
en = "You haven't got room to hold them."
pt = "Você não tem espaço para carregá-los."

[.text_area_misthalin_lumbridge_swamp_lumbridgeswampshed_3]
en = "You've already got a spade and a rake."
pt = "Você já tem uma pá (spade) e um ancinho (rake)."

[.text_area_misthalin_lumbridge_swamp_lumbridgeswampshed_4]
en = "Which would you like to take?"
pt = "Qual você quer pegar?"

[.text_area_misthalin_lumbridge_swamp_lumbridgeswampshed_5]
en = "Rake"
pt = "Ancinho (rake)"

[.text_area_misthalin_lumbridge_swamp_lumbridgeswampshed_6]
en = "You 'borrow' a rake."
pt = "Você 'pega emprestado' um ancinho (rake)."

[.text_area_misthalin_lumbridge_swamp_lumbridgeswampshed_7]
en = "Spade"
pt = "Pá (spade)"

[.text_area_misthalin_lumbridge_swamp_lumbridgeswampshed_8]
en = "You 'borrow' a spade."
pt = "Você 'pega emprestada' uma pá (spade)."

[.text_area_misthalin_lumbridge_swamp_lumbridgeswampshed_9]
en = "You 'borrow' a rake and a spade."
pt = "Você 'pega emprestados' um ancinho (rake) e uma pá (spade)."

[.text_area_misthalin_lumbridge_swamp_lumbridgeswampshed_10]
en = "Congratulations, Quest complete!"
pt = "Parabéns, missão concluída!"

# Text - area/misthalin/lumbridge/swamp/Shamus.kt

[.text_area_misthalin_lumbridge_swamp_shamus_1]
en = "Ay yer big elephant! Yer've caught me, to be sure! What would an elephant like yer be wanting wid ol' Shamus then?"
pt = "Ô seu elefantão! Cê me pegou, pode crer! O que um elefante feito ocê quer com o véio Shamus, hein?"

[.text_area_misthalin_lumbridge_swamp_shamus_2]
en = "I'm not sure."
pt = "Não sei bem."

[.text_area_misthalin_lumbridge_swamp_shamus_3]
en = "Well you'll have to be catchin' me again when yer are, elephant!"
pt = "Pois então cê vai ter que me pegar de novo quando souber, elefante!"

[.text_area_misthalin_lumbridge_swamp_shamus_4]
en = "The leprechaun magically disappears."
pt = "O duende (leprechaun) desaparece como mágica."

[.text_area_misthalin_lumbridge_swamp_shamus_5]
en = "I want to find Zanaris."
pt = "Quero encontrar Zanaris."

[.text_area_misthalin_lumbridge_swamp_shamus_6]
en = "Zanaris is it now? Well well well... Yer'll be needing to be going to that funny little shed out there in the swamp, so you will."
pt = "Zanaris, é? Ora, ora, ora... Cê vai ter que ir naquele barracão esquisito lá no meio do pântano, vai sim."

[.text_area_misthalin_lumbridge_swamp_shamus_7]
en = "...but... I thought... Zanaris was a city...?"
pt = "...mas... eu achei... que Zanaris fosse uma cidade...?"

[.text_area_misthalin_lumbridge_swamp_shamus_8]
en = "Aye that it is!"
pt = "E é mesmo, sô!"

[.text_area_misthalin_lumbridge_swamp_shamus_9]
en = "How does it fit in a shed then?"
pt = "Então como ela cabe num barracão?"

[.text_area_misthalin_lumbridge_swamp_shamus_10]
en = "...How does it fit in a shed then?"
pt = "...Então como ela cabe num barracão?"

[.text_area_misthalin_lumbridge_swamp_shamus_11]
en = "Ah yer stupid elephant! The city isn't IN the shed! The doorway to the shed is being a portal to Zanaris, so it is."
pt = "Ah, seu elefante burro! A cidade num tá DENTRO do barracão! A porta do barracão é um portal pra Zanaris, é sim."

[.text_area_misthalin_lumbridge_swamp_shamus_12]
en = "So I just walk into the shed and end up in Zanaris then?"
pt = "Então é só eu entrar no barracão que vou parar em Zanaris?"

[.text_area_misthalin_lumbridge_swamp_shamus_13]
en = "I've been in that shed, I didn't see a city."
pt = "Já entrei nesse barracão e não vi cidade nenhuma."

[.text_area_misthalin_lumbridge_swamp_shamus_14]
en = "Ha! Look at yer! Look at the stupid elephant who tries to go catching a leprechaun when he don't even be knowing what he wants!"
pt = "Rá! Olha só ocê! Olha o elefante burro que sai caçando duende sem nem saber o que quer!"

[.text_area_misthalin_lumbridge_swamp_shamus_15]
en = "How do I get to Zanaris again?"
pt = "Como eu chego em Zanaris mesmo?"

[.text_area_misthalin_lumbridge_swamp_shamus_16]
en = "Yer stupid elephant! I'll tell yer again! Yer need to be entering the shed in the middle of the swamp while holding a dramenwood staff! Yer can make the Dramen staff"
pt = "Seu elefante burro! Vou falar de novo! Cê tem que entrar no barracão no meio do pântano segurando um cajado de dramen (Dramen staff)! Cê pode fazer o Dramen staff"

[.text_area_misthalin_lumbridge_swamp_shamus_17]
en = "from a dramen tree branch, and there's a Dramen tree on Entrana! Now leave me alone yer great elephant!"
pt = "com um galho (branch) da árvore Dramen, e tem uma árvore Dramen em Entrana! Agora me deixa em paz, seu elefantão!"

[.text_area_misthalin_lumbridge_swamp_shamus_18]
en = "Hey! Yer big elephant! Don't go choppin' down me house, now!"
pt = "Ei! Seu elefantão! Num vai cortar minha casa, não!"

[.text_area_misthalin_lumbridge_swamp_shamus_19]
en = "Oh, was I fergetting to say? Yer need to be carrying a Dramenwood staff to be getting there! Otherwise Yer'll just be ending up in the shed."
pt = "Ih, esqueci de falar? Cê precisa tá carregando um Dramen staff pra chegar lá! Senão cê só vai parar no barracão mesmo."

[.text_area_misthalin_lumbridge_swamp_shamus_20]
en = "So where would I get a staff?"
pt = "E onde eu arranjo um cajado?"

[.text_area_misthalin_lumbridge_swamp_shamus_21]
en = "Dramenwood staffs are crafted from branches of the Dramen tree, so they are. I hear there's a Dramen tree over on the island of Entrana in a cave"
pt = "Os cajados de dramen são feitos de galho da árvore Dramen, são sim. Ouvi dizer que tem uma árvore Dramen lá na ilha de Entrana, numa caverna"

[.text_area_misthalin_lumbridge_swamp_shamus_22]
en = "or some such. There would probably be a good place for an elephant like yer to be starting looking I reckon."
pt = "ou coisa assim. Deve de ser um bom lugar pra um elefante feito ocê começar a procurar, eu acho."

[.text_area_misthalin_lumbridge_swamp_shamus_23]
en = "The monks are running a ship from Port Sarim to Entrana, I hear too. Now leave me alone yer elephant!"
pt = "Ouvi dizer também que os monges têm um navio de Port Sarim pra Entrana. Agora me deixa em paz, seu elefante!"

# Text - area/misthalin/lumbridge/swamp/WallBeast.kt

[.text_area_misthalin_lumbridge_swamp_wallbeast_1]
en = "Your helmet repels the wall beast!"
pt = "O seu capacete repele a fera da parede (wall beast)!"

[.text_area_misthalin_lumbridge_swamp_wallbeast_2]
en = "A giant hand appears and grabs your head!"
pt = "Uma mão gigante aparece e agarra a sua cabeça!"

# Text - area/misthalin/lumbridge/swamp/chams_of_tears/ChasmOfTears.kt

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_chasmoftears_1]
en = "You could climb down here, but it is too uneven to climb up."
pt = "Dá para descer por aqui, mas é irregular demais para subir."

# Text - area/misthalin/lumbridge/swamp/chams_of_tears/Juna.kt

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_1]
en = "I will not permit you to be in the cave for long. Collect as many tears as you can."
pt = "Não vou permitir que você fique muito tempo na caverna. Colete o máximo de lágrimas que puder."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_2]
en = "Okay."
pt = "Certo."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_3]
en = "I want to get out now."
pt = "Quero sair agora."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_4]
en = "Before you can collect the Tears of Guthix you must make a bowl out of the stone in the cave on the south of the chasm."
pt = "Antes de coletar as Tears of Guthix, você precisa fazer uma tigela (bowl) com a pedra da caverna ao sul do abismo."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_5]
en = "I have a bowl."
pt = "Eu tenho uma tigela."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_6]
en = "I will keep your bowl for you, so that you may collect the tears many times in the future."
pt = "Vou guardar a sua tigela, para que você possa coletar as lágrimas muitas vezes no futuro."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_7]
en = "Now... tell me another story, and I will let you collect the tears for the first time."
pt = "Agora... conte-me outra história, e deixarei você coletar as lágrimas pela primeira vez."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_8]
en = "Tell me... a story..."
pt = "Conte-me... uma história..."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_9]
en = "A story?"
pt = "Uma história?"

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_10]
en = "I have been waiting here three thousand years, guarding the Tears of Guthix. I serve my master faithfully, but I am bored."
pt = "Estou esperando aqui há três mil anos, guardando as Tears of Guthix. Sirvo ao meu mestre com fidelidade, mas estou entediada."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_11]
en = "An adventurer such as yourself must have many tales to tell. If you can entertain me, I will let you into the cave for a time."
pt = "Um aventureiro como você deve ter muitas histórias para contar. Se conseguir me entreter, deixarei você entrar na caverna por um tempo."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_12]
en = "The more I enjoy your story, the more time I will give you in the cave."
pt = "Quanto mais eu gostar da sua história, mais tempo darei a você na caverna."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_13]
en = "Then you can drink of the power of balance, which will make you stronger in whatever area you are weakest."
pt = "Então você poderá beber do poder do equilíbrio, que vai fortalecê-lo naquilo em que você for mais fraco."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_14]
en = "What are the Tears of Guthix?"
pt = "O que são as Tears of Guthix?"

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_15]
en = "Not now."
pt = "Agora não."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_16]
en = "You tell me a story."
pt = "Você é que me conta uma história."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_17]
en = "Tell me about the Tears of Guthix"
pt = "Me fale sobre as Tears of Guthix"

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_18]
en = "Very well, when you are eligible to drink from the Tears, you shall be reminded daily."
pt = "Muito bem, quando você puder beber das lágrimas, será lembrado todos os dias."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_19]
en = "Very well, it will be up to you to remember when you can return. It is good that you are willing to take responsibility for yourself in this way."
pt = "Muito bem, caberá a você lembrar quando pode voltar. É bom que esteja disposto a assumir essa responsabilidade por si mesmo."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_20]
en = "If you wish to tell me more stories, come out here first."
pt = "Se quiser me contar mais histórias, saia da caverna primeiro."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_21]
en = "Your time in the caves is up."
pt = "O seu tempo nas cavernas acabou."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_22]
en = "<col=ef1020>You are eligible to drink from the Tears of Guthix."
pt = "<col=ef1020>Você já pode beber das Tears of Guthix."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_23]
en = "Well... Um..."
pt = "Bem... Hã..."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_24]
en = "You try to tell a story, but Juna does not seem impressed."
pt = "Você tenta contar uma história, mas Juna não parece impressionada."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_25]
en = "Hmm. Maybe you should come back when you can tell a good story."
pt = "Hmm. Talvez você deva voltar quando souber contar uma boa história."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_26]
en = "You need at least 43 Quest Points to start this quest."
pt = "Você precisa de pelo menos 43 pontos de missão para começar esta missão."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_27]
en = "I will tell you the story of the light-creatures."
pt = "Vou contar a história das criaturas de luz."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_28]
en = "Myriad and beautiful were the creatures and civilizations of the early ages of the world. Gielinor was a work of art, shaped lovingly over the millennia by the creative mind of Guthix."
pt = "Inúmeras e belas eram as criaturas e civilizações das primeiras eras do mundo. Gielinor era uma obra de arte, moldada com amor ao longo dos milênios pela mente criadora de Guthix."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_29]
en = "Only the sturdiest races survived the Godwars, and even then only by abandoning their high culture and gearing their societies towards war. Of the more delicate races there is now no trace, and almost no memory."
pt = "Só as raças mais resistentes sobreviveram às Godwars, e mesmo assim só abandonando sua alta cultura e voltando suas sociedades para a guerra. Das raças mais delicadas não resta hoje nenhum vestígio, e quase nenhuma lembrança."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_30]
en = "One such race had bodies as fragile as snowflakes, yet they built crystal cities that stood for a thousand years."
pt = "Uma dessas raças tinha corpos frágeis como flocos de neve, mas construiu cidades de cristal que resistiram por mil anos."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_31]
en = "The wind would whisper through the spires and fill them with sweet harmonies, and the rising sun would shine through the precious gems that studded the towers and create inter plays of light as if rainbows were dancing."
pt = "O vento sussurrava pelas torres e as enchia de doces harmonias, e o sol nascente brilhava através das pedras preciosas que cravejavam as torres, criando jogos de luz como se arco-íris dançassem."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_32]
en = "Indeed, so marvellous was this light-show at its height that the patterns of light themselves became alive, and great flocks of luminous creatures rode along the gem- cast beams, each drawn to its own colour."
pt = "De fato, tão maravilhoso era esse espetáculo de luz no seu auge que os próprios padrões de luz ganharam vida, e grandes bandos de criaturas luminosas cavalgavam os raios lançados pelas gemas, cada uma atraída pela sua própria cor."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_33]
en = "The creatures you see floating in this chasm are the last sorry remnants of that age. I do not know how they made their way here and survived to this time, but I am grateful for their company."
pt = "As criaturas que você vê flutuando neste abismo são os últimos e tristes restos daquela era. Não sei como chegaram aqui e sobreviveram até hoje, mas sou grata pela companhia delas."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_34]
en = "Not long after the start of my vigil a party of goblins happened on my cave. These were the ugly brutes of the gods' armies, but their armour bore a faded patch where the symbol of a god had been removed."
pt = "Pouco depois do início da minha vigília, um bando de goblins deu com a minha caverna. Eram os brutos feios dos exércitos dos deuses, mas suas armaduras tinham uma marca desbotada onde o símbolo de um deus fora retirado."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_35]
en = "They looked around hesitantly, squinting in the light of crude torches, but as soon as they saw me they raised their spears and charged."
pt = "Olharam em volta, hesitantes, apertando os olhos à luz de tochas toscas, mas assim que me viram ergueram as lanças e atacaram."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_36]
en = "No one may access the Tears of Guthix by force. I sent them tumbling into the chasm."
pt = "Ninguém pode chegar às Tears of Guthix pela força. Eu os mandei rolando para o abismo."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_37]
en = "Two hundred years later another goblin found me. This one was unarmed, and although she was very wary I succeeded in engaging her in conversation."
pt = "Duzentos anos depois, outra goblin me encontrou. Esta estava desarmada e, embora muito desconfiada, consegui puxar conversa com ela."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_38]
en = "Since then I have had many more visits from the descendants of those lost warriors, and over the centuries I have seen them change."
pt = "Desde então recebi muitas outras visitas dos descendentes daqueles guerreiros perdidos e, ao longo dos séculos, eu os vi mudar."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_39]
en = "They have become timid rather than aggressive, and I have seen the light of intelligence grow in their bulging eyes."
pt = "Deixaram de ser agressivos e ficaram tímidos, e vi a luz da inteligência crescer em seus olhos esbugalhados."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_40]
en = "Their stories are repetitive and grim, of scraping a living out of the harsh rock and through ingenuity and toil shaping it into a home."
pt = "Suas histórias são repetitivas e sombrias: arrancar o sustento da rocha dura e, com engenho e suor, transformá-la num lar."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_41]
en = "I have followed the progress of their race, but their individual stories hold little interest for me."
pt = "Acompanhei o progresso da raça deles, mas suas histórias individuais pouco me interessam."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_42]
en = "The Third Age of the world was a time of great conflict, of destruction never seen before or since, when all the gods save Guthix warred for control."
pt = "A Terceira Era do mundo foi um tempo de grandes conflitos, de uma destruição nunca vista antes nem depois, quando todos os deuses, exceto Guthix, guerrearam pelo controle."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_43]
en = "The colossal Wyrms, of whom today's dragons are a pale reflection, turned all the sky to fire, while on the ground armies of foot soldiers, goblins and trolls and humans, filled the valleys and plains with blood."
pt = "Os colossais Wyrms, dos quais os dragões de hoje são um pálido reflexo, incendiaram o céu inteiro, enquanto em terra exércitos de soldados a pé, goblins, trolls e humanos, enchiam de sangue os vales e as planícies."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_44]
en = "In time the noise of the conflict woke Guthix from His deep slumber, and He rose and stood in the centre of the battlefield so that the splendour of His wrath filled the world, and He called for the conflict to cease!"
pt = "Com o tempo, o barulho do conflito despertou Guthix de Seu sono profundo, e Ele se ergueu e ficou no centro do campo de batalha, e o esplendor de Sua ira encheu o mundo, e Ele ordenou que o conflito cessasse!"

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_45]
en = "Silence fell, for the gods knew that none could challenge the power of the mighty Guthix -- for His power is that of nature itself, to which all other things are subject, in the end."
pt = "Fez-se silêncio, pois os deuses sabiam que ninguém podia desafiar o poder do grandioso Guthix -- pois o poder Dele é o da própria natureza, à qual todas as outras coisas se sujeitam, no fim."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_46]
en = "Guthix reclaimed that which had been stolen from Him, and went back underground to return to His sleep and continue to draw the world's power into Himself."
pt = "Guthix tomou de volta aquilo que Lhe fora roubado e voltou para debaixo da terra, para retornar ao Seu sono e continuar a atrair para Si o poder do mundo."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_47]
en = "But on His way into the depths of the earth He sat and rested in this cave; and, thinking of the battle-scarred desert that now stretched from one side of His world to the other, He wept."
pt = "Mas, a caminho das profundezas da terra, Ele se sentou e descansou nesta caverna; e, pensando no deserto marcado pela guerra que agora se estendia de um lado a outro do Seu mundo, Ele chorou."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_48]
en = "And so great was His sorrow, and so great was His life- giving power, that the rocks themselves began to weep with Him."
pt = "E tão grande era Sua tristeza, e tão grande Seu poder de dar vida, que as próprias rochas começaram a chorar com Ele."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_49]
en = "Later, Guthix noticed that the rocks continued to weep, and that their tears were infused with a small part of His power."
pt = "Mais tarde, Guthix percebeu que as rochas continuavam a chorar, e que suas lágrimas estavam impregnadas de uma pequena parte do Seu poder."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_50]
en = "So He set me, His servant, to guard the cave, and He entrusted to me the task of judging who was and was not worthy to access the tears."
pt = "Então Ele me pôs, Sua serva, para guardar a caverna, e me confiou a tarefa de julgar quem era e quem não era digno de chegar às lágrimas."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_51]
en = "Congratulations, you've completed a quest: <navy>tears of guthix"
pt = "Parabéns, você completou uma missão: <navy>Tears of Guthix"

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_52]
en = "Perhaps you should empty your hands before you begin."
pt = "Talvez você deva esvaziar as mãos antes de começar."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_53]
en = "You tell Juna some stories of your adventures."
pt = "Você conta a Juna algumas histórias das suas aventuras."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_54]
en = "Your stories have entertained me. But I will not permit any adventurer to access the tears more than once a week. Come back in %1%."
pt = "Suas histórias me entretiveram. Mas não permito que nenhum aventureiro chegue às lágrimas mais de uma vez por semana. Volte daqui a %1%."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_55]
en = "Your stories have entertained me. I will let you into the cave for a short time."
pt = "Suas histórias me entretiveram. Vou deixar você entrar na caverna por pouco tempo."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_56]
en = "But first you will need to make a bowl in which to collect the tears."
pt = "Mas antes você precisa fazer uma tigela (bowl) para coletar as lágrimas."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_57]
en = "There is a cave on the south side of the chasm that is similarly infused with the power of Guthix. The stone in that cave is the only substance that can catch the Tears of Guthix."
pt = "Há uma caverna no lado sul do abismo que também está impregnada do poder de Guthix. A pedra daquela caverna é a única substância capaz de recolher as Tears of Guthix."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_58]
en = "Mine some stone from that cave, make it into a bowl, and bring it to me, and then I will let you catch the Tears."
pt = "Minere um pouco de pedra daquela caverna, faça uma tigela com ela e traga-a para mim; então deixarei você recolher as lágrimas."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_juna_59]
en = "Collect as much as you can from the blue streams. If you let in water from the green streams, it will take away from the blue. For Guthix is god of balance, and balance lies in the juxtaposition of opposites."
pt = "Colete o máximo que puder dos fios d'água azuis. Se deixar entrar água dos fios verdes, ela vai tirar do azul. Pois Guthix é o deus do equilíbrio, e o equilíbrio está na justaposição dos opostos."

# Text - area/misthalin/lumbridge/swamp/chams_of_tears/QuestStories.kt

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_1]
en = "... and in the end I found all the ingredients, so the Duke of Lumbridge had a birthday cake after all."
pt = "... e no fim eu achei todos os ingredientes, e o Duke de Lumbridge teve o seu bolo de aniversário afinal."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_2]
en = "Ah, a happy ending. It would not be good for such an anniversary to go unmarked."
pt = "Ah, um final feliz. Não seria bom deixar uma data dessas passar em branco."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_3]
en = "... So I destroyed the demon Delrith and saved Varrock!"
pt = "... Então eu destruí o demônio Delrith e salvei Varrock!"

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_4]
en = "I remember Delrith. A most unpleasant character; I am glad he has been dispatched."
pt = "Eu me lembro de Delrith. Um sujeito dos mais desagradáveis; fico contente que tenha sido despachado."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_5]
en = "... So once I had got all the ores he wanted, Doric let me use his anvils."
pt = "... Então, depois que juntei todos os minérios que ele queria, o Doric me deixou usar as bigornas dele."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_6]
en = "Such a small task hardly seems worthy of the term 'quest'."
pt = "Uma tarefa tão pequena mal parece digna do nome 'missão'."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_7]
en = "...and the chieftain agreed to settle on the land that his ancestors had won."
pt = "...e o chefe concordou em se fixar na terra que seus ancestrais tinham conquistado."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_8]
en = "These militant Fremennik think they serve Guthix, but they serve only themselves."
pt = "Esses Fremennik militantes acham que servem a Guthix, mas só servem a si mesmos."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_9]
en = "... and once I returned the skull, the ghost was able to rest."
pt = "... e quando eu devolvi o crânio, o fantasma pôde descansar."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_10]
en = "A strange attachment to an item that has no use after one's death."
pt = "Um apego estranho a um item que não tem uso nenhum depois da morte."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_11]
en = "... So I brought Aubury's notes to Sedridor the Head Wizard, and from then on I was able to mine Rune Essence."
pt = "... Então levei as anotações do Aubury ao Sedridor, o Head Wizard, e desde então posso minerar essência rúnica (Rune Essence)."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_12]
en = "So the mortals above have discovered magic once more? Very interesting."
pt = "Então os mortais lá de cima redescobriram a magia? Muito interessante."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_13]
en = "...that was how I found the Imcando Dwarves and got the knight a new sword."
pt = "...foi assim que eu achei os anões Imcando e consegui uma espada nova para o cavaleiro."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_14]
en = "... and I had to disguise Prince Ali in order to smuggle him out!"
pt = "... e tive que disfarçar o Prince Ali para tirá-lo de lá escondido!"

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_15]
en = "... It took some time, but I finally got all four beads back, and Mizgog gave me my reward."
pt = "... Levou um tempo, mas finalmente recuperei as quatro contas (beads), e o Mizgog me deu a recompensa."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_16]
en = "Imps! I remember the age of great war, when armies of Zamorak's imps bloodied the ankles of the other gods' creatures."
pt = "Imps! Eu me lembro da era da grande guerra, quando exércitos de imps de Zamorak ensanguentavam os tornozelos das criaturas dos outros deuses."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_17]
en = "... So Kaqemeex taught me how to use the Herblore skill."
pt = "... Então o Kaqemeex me ensinou a usar a habilidade Herblore (herbologia)."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_18]
en = "A generous reward indeed."
pt = "Uma recompensa generosa, de fato."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_19]
en = "... and that was how I rescued Elena from West Ardougne."
pt = "... e foi assim que eu resgatei a Elena de West Ardougne."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_20]
en = "... and when I entered the door carrying the Dramen Staff, I was transported to a whole new world -- a world populated by magical fairies!"
pt = "... e quando passei pela porta carregando o Dramen Staff, fui levado para um mundo totalmente novo -- um mundo povoado por fadas mágicas!"

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_21]
en = "I gained access to the Abyss."
pt = "Consegui acesso ao Abyss."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_22]
en = "... so I presented the head of the Troll King to the Burgher and he gave me his own helm!"
pt = "... então entreguei a cabeça do Troll King ao Burgher e ele me deu o próprio elmo!"

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_23]
en = "... the machine revealed that the cute creatures were actually Arposandran spies! I destroyed them, and King Narnode gave me a crystal seed that belonged to Oaknock the Engineer."
pt = "... a máquina revelou que as criaturinhas fofas eram na verdade espiões de Arposandra! Eu os destruí, e o King Narnode me deu uma semente de cristal (crystal seed) que era do Oaknock the Engineer."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_24]
en = "... and the examiner was very impressed that I had discovered an ancient altar of Zaros."
pt = "... e o examinador ficou muito impressionado por eu ter descoberto um antigo altar de Zaros."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_25]
en = "Zaros? I had not heard that name for a thousand years even before the start of my sojourn here."
pt = "Zaros? Eu já não ouvia esse nome havia mil anos, antes mesmo de começar a minha estadia aqui."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_26]
en = "... and when I planted the shard, it grew into a crystal tree!"
pt = "... e quando plantei o fragmento, ele virou uma árvore de cristal!"

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_27]
en = "... So all three parts of the family crest were reunited."
pt = "... Então as três partes do brasão da família (family crest) foram reunidas."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_28]
en = "... So after I had retrieved all the items, I became a member of the Heroes' Guild!"
pt = "... Então, depois de recuperar todos os itens, virei membro da Heroes' Guild!"

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_29]
en = "... Veliaf was very impressed by the 'Rod of Ivandis', and I can use it to kill Juves and the Juvinates!"
pt = "... O Veliaf ficou muito impressionado com a 'Rod of Ivandis', e eu posso usá-la para matar Juves e Juvinates!"

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_30]
en = "... So I figured out their weird puzzles, and the Temple Knights asked me to join as an initiate member!"
pt = "... Então eu resolvi os enigmas esquisitos deles, e os Temple Knights me convidaram para entrar como membro iniciante!"

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_31]
en = "I have heard tales of these 'Temple Knights' from many years past. Be wary, their motivations are not what they might lead you to believe."
pt = "Ouvi histórias sobre esses 'Temple Knights' há muitos anos. Cuidado: as motivações deles não são o que eles querem que você acredite."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_32]
en = "... So what Rashiliyia wanted all along was to be reunited with her son in the afterlife."
pt = "... Então o que a Rashiliyia queria desde o começo era se reunir com o filho na vida após a morte."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_33]
en = "... when I told Sir Tiffy that I had accidentally freed the Mother Mallum, he promoted me to the rank of Proselyte within the Temple Knights."
pt = "... quando contei ao Sir Tiffy que eu tinha libertado a Mother Mallum sem querer, ele me promoveu ao posto de Proselyte nos Temple Knights."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_34]
en = "That was a strange response to such an unfortunate event. But the motives of the Temple Knights have always been incomprehensibly unbalanced."
pt = "Foi uma reação estranha a um acontecimento tão infeliz. Mas os motivos dos Temple Knights sempre foram incompreensivelmente desequilibrados."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_35]
en = "... So the people of Port Phasmatys were finally able to rest."
pt = "... Então o povo de Port Phasmatys finalmente pôde descansar."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_36]
en = "... the Fairy Queen awoke, and we realised that the Godfather had betrayed her!"
pt = "... a Fairy Queen acordou, e percebemos que o Godfather tinha traído ela!"

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_37]
en = "Politics is never straightforward."
pt = "A política nunca é simples."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_38]
en = "... and once I had gathered all the herbs, Trufitus Shakaya was able to commune with his gods."
pt = "... e depois que juntei todas as ervas, o Trufitus Shakaya pôde comungar com os seus deuses."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_39]
en = "... So I defeated the Jungle Demon and stopped the Monkeys' plot to take over Karamja."
pt = "... Então derrotei o Jungle Demon e acabei com o plano dos macacos de tomar Karamja."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_40]
en = "I see they couldn't make a monkey out of you!"
pt = "Pelo visto não conseguiram te fazer de macaco!"

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_queststories_41]
en = "Well, actually, I was a monkey for a bit."
pt = "Bem, na verdade, eu fui macaco por um tempo."

# Text - area/misthalin/lumbridge/swamp/chams_of_tears/TormentedDemon.kt

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_tormenteddemon_1]
en = "The demon is temporarily weakened by your weapon."
pt = "A sua arma enfraquece o demônio por um tempo."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_tormenteddemon_2]
en = "The Tormented demon regains its strength against your weapon."
pt = "O Tormented demon recupera a força contra a sua arma."

[.text_area_misthalin_lumbridge_swamp_chams_of_tears_tormenteddemon_3]
en = "The demon's magical attack splashes on you."
pt = "O ataque mágico do demônio respinga em você."

# Text - quest/free/the_restless_ghost/RestlessGhost.kt

[.text_quest_free_the_restless_ghost_restlessghost_1]
en = "Wooooo! Ooooooh!"
pt = "Wooooo! Ooooooh!"

[.text_quest_free_the_restless_ghost_restlessghost_2]
en = "I can't understand a word you are saying. Maybe Father Aereck will be able to help."
pt = "Não entendo uma palavra do que você diz. Talvez o Father Aereck possa ajudar."

[.text_quest_free_the_restless_ghost_restlessghost_3]
en = "The ghost doesn't appear to be interested in talking."
pt = "O fantasma não parece interessado em conversar."

[.text_quest_free_the_restless_ghost_restlessghost_4]
en = "Hello ghost, how are you?"
pt = "Olá, fantasma, como vai?"

[.text_quest_free_the_restless_ghost_restlessghost_5]
en = "Not very good actually."
pt = "Não muito bem, na verdade."

[.text_quest_free_the_restless_ghost_restlessghost_6]
en = "What's the problem then?"
pt = "Qual é o problema, então?"

[.text_quest_free_the_restless_ghost_restlessghost_7]
en = "Did you just understand what I said???"
pt = "Você acabou de entender o que eu disse???"

[.text_quest_free_the_restless_ghost_restlessghost_8]
en = "Yep, now tell me what the problem is."
pt = "Entendi, agora me diga qual é o problema."

[.text_quest_free_the_restless_ghost_restlessghost_9]
en = "WOW! This is INCREDIBLE! I didn't expect anyone to ever understand me again!"
pt = "UAU! Isso é INCRÍVEL! Nunca achei que alguém fosse me entender de novo!"

[.text_quest_free_the_restless_ghost_restlessghost_10]
en = "Ok, Ok, I can understand you!"
pt = "Tá, tá, eu entendo você!"

[.text_quest_free_the_restless_ghost_restlessghost_11]
en = "But have you any idea WHY you're doomed to be a ghost?"
pt = "Mas você tem ideia de POR QUE está condenado a ser um fantasma?"

[.text_quest_free_the_restless_ghost_restlessghost_12]
en = "Well, to be honest, I'm not sure."
pt = "Bem, para ser sincero, não tenho certeza."

[.text_quest_free_the_restless_ghost_restlessghost_13]
en = "No, you sound like you're speaking nonsense to me."
pt = "Não, para mim você só fala bobagem."

[.text_quest_free_the_restless_ghost_restlessghost_14]
en = "Oh that's a pity. You got my hopes up there."
pt = "Ah, que pena. Você me deu esperanças."

[.text_quest_free_the_restless_ghost_restlessghost_15]
en = "Yeah, it is a pity. Sorry about that."
pt = "É, é uma pena. Desculpe."

[.text_quest_free_the_restless_ghost_restlessghost_16]
en = "Hang on a second... you CAN understand me!"
pt = "Espere um pouco... você ENTENDE, sim!"

[.text_quest_free_the_restless_ghost_restlessghost_17]
en = "No I can't."
pt = "Não entendo, não."

[.text_quest_free_the_restless_ghost_restlessghost_18]
en = "Great."
pt = "Que ótimo."

[.text_quest_free_the_restless_ghost_restlessghost_19]
en = "The first person I can speak to in ages..."
pt = "A primeira pessoa com quem consigo falar em séculos..."

[.text_quest_free_the_restless_ghost_restlessghost_20]
en = "..and they're a moron."
pt = "..e é um imbecil."

[.text_quest_free_the_restless_ghost_restlessghost_21]
en = "Yep, clever aren't I?"
pt = "Pois é, sou esperto, né?"

[.text_quest_free_the_restless_ghost_restlessghost_22]
en = "I'm impressed. You must be very powerful. I don't suppose you can stop me being a ghost?"
pt = "Estou impressionado. Você deve ser muito poderoso. Será que você consegue me livrar de ser fantasma?"

[.text_quest_free_the_restless_ghost_restlessghost_23]
en = "Wow, this amulet works!"
pt = "Uau, este amuleto funciona!"

[.text_quest_free_the_restless_ghost_restlessghost_24]
en = "Oh! It's your amulet that's doing it! I did wonder. I don't suppose you can help me? I don't like being a ghost."
pt = "Ah! É o seu amuleto que faz isso! Bem que eu desconfiei. Será que você pode me ajudar? Não gosto de ser fantasma."

[.text_quest_free_the_restless_ghost_restlessghost_25]
en = "Wooo wooo wooooo!"
pt = "Wooo wooo wooooo!"

[.text_quest_free_the_restless_ghost_restlessghost_26]
en = "Why can't I understand you? Oh, yeah, it might help if I wear this amulet!"
pt = "Por que não entendo você? Ah, é, talvez ajude se eu usar este amuleto!"

[.text_quest_free_the_restless_ghost_restlessghost_27]
en = "Sorry, I don't speak ghost."
pt = "Desculpe, não falo fantasmês."

[.text_quest_free_the_restless_ghost_restlessghost_28]
en = "Ooh... THAT'S interesting."
pt = "Ooh... ISSO é interessante."

[.text_quest_free_the_restless_ghost_restlessghost_29]
en = "Woo wooo. Woooooooooooooooooo!"
pt = "Woo wooo. Woooooooooooooooooo!"

[.text_quest_free_the_restless_ghost_restlessghost_30]
en = "Did he really?"
pt = "Ele fez isso mesmo?"

[.text_quest_free_the_restless_ghost_restlessghost_31]
en = "Woo."
pt = "Woo."

[.text_quest_free_the_restless_ghost_restlessghost_32]
en = "My brother had EXACTLY the same problem."
pt = "Meu irmão teve EXATAMENTE o mesmo problema."

[.text_quest_free_the_restless_ghost_restlessghost_33]
en = "Woo Wooooo!"
pt = "Woo Wooooo!"

[.text_quest_free_the_restless_ghost_restlessghost_34]
en = "Wooooo Woo woo woo!"
pt = "Wooooo Woo woo woo!"

[.text_quest_free_the_restless_ghost_restlessghost_35]
en = "Goodbye. Thanks for the chat."
pt = "Tchau. Obrigado pela conversa."

[.text_quest_free_the_restless_ghost_restlessghost_36]
en = "Wooo wooo?"
