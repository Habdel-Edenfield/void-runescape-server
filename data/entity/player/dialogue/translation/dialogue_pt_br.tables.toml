# Skills - summoning/familiar/PrayingMantis.kt

[.skill_summoning_familiar_prayingmantis_1]
en = "Clatter click chitter click? (Wouldn't you learn focus better if you used chopsticks?)"
pt = "Clatter click chitter click? (Você não aprenderia a se concentrar melhor usando hashis?)"

[.skill_summoning_familiar_prayingmantis_2]
en = "Huh?"
pt = "Hã?"

[.skill_summoning_familiar_prayingmantis_3]
en = "Clicker chirrpchirrup. (For catching the butterflies, grasshopper.)"
pt = "Clicker chirrpchirrup. (Para pegar as borboletas, gafanhoto.)"

[.skill_summoning_familiar_prayingmantis_4]
en = "Oh, right! Well, if I use anything but the net I squash them."
pt = "Ah, tá! Bem, se eu usar qualquer coisa além da rede, eu esmago elas."

[.skill_summoning_familiar_prayingmantis_5]
en = "Chirrupchirrup click! (Then, I could have them!)"
pt = "Chirrupchirrup click! (Aí elas ficariam para mim!)"

[.skill_summoning_familiar_prayingmantis_6]
en = "Chitter chirrup chirrup? (Have you been following your training, grasshopper?)"
pt = "Chitter chirrup chirrup? (Você tem seguido o seu treinamento, gafanhoto?)"

[.skill_summoning_familiar_prayingmantis_7]
en = "Yes, almost every day."
pt = "Sim, quase todo dia."

[.skill_summoning_familiar_prayingmantis_8]
en = "Chirrupchirrup chirrup. ('Almost' is not good enough.)"
pt = "Chirrupchirrup chirrup. ('Quase' não basta.)"

[.skill_summoning_familiar_prayingmantis_9]
en = "Well, I'm trying as hard as I can."
pt = "Bem, estou me esforçando ao máximo."

[.skill_summoning_familiar_prayingmantis_10]
en = "Chirrup chitter chitter chirrup? (How do you expect to achieve enlightenment at this rate, grasshopper?)"
pt = "Chirrup chitter chitter chirrup? (Como espera alcançar a iluminação nesse ritmo, gafanhoto?)"

[.skill_summoning_familiar_prayingmantis_11]
en = "Spontaneously."
pt = "Espontaneamente."

[.skill_summoning_familiar_prayingmantis_12]
en = "Chitterchitter chirrup clatter. (Today, grasshopper, I will teach you to walk on rice paper.)"
pt = "Chitterchitter chirrup clatter. (Hoje, gafanhoto, vou te ensinar a andar sobre papel de arroz.)"

[.skill_summoning_familiar_prayingmantis_13]
en = "What if I can't find any?"
pt = "E se eu não achar nenhum?"

[.skill_summoning_familiar_prayingmantis_14]
en = "Clatter chitter click chitter... (Then we will wander about and punch monsters in the head...)"
pt = "Clatter chitter click chitter... (Então vamos vagar por aí socando a cabeça de monstros...)"

[.skill_summoning_familiar_prayingmantis_15]
en = "I could do in an enlightened way if you want?"
pt = "Posso fazer isso de um jeito iluminado, se quiser."

[.skill_summoning_familiar_prayingmantis_16]
en = "Chirrupchitter! (That will do!)"
pt = "Chirrupchitter! (Isso serve!)"

[.skill_summoning_familiar_prayingmantis_17]
en = "Clatter chirrup chirp chirrup clatter clatter. (A wise man once said; 'Feed your mantis and it will be happy'.)"
pt = "Clatter chirrup chirp chirrup clatter clatter. (Um sábio certa vez disse: 'Alimente seu louva-a-deus e ele será feliz'.)"

[.skill_summoning_familiar_prayingmantis_18]
en = "Is there any point to that saying?"
pt = "Esse ditado tem algum sentido?"

[.skill_summoning_familiar_prayingmantis_19]
en = "Clatter chirrupchirrup chirp. (I find that a happy mantis is its own point.)"
pt = "Clatter chirrupchirrup chirp. (Para mim, um louva-a-deus feliz é um fim em si mesmo.)"

[.skill_summoning_familiar_prayingmantis_20]
en = "Clatter chirrupchirp- (Today, grasshopper, we will-)"
pt = "Clatter chirrupchirp- (Hoje, gafanhoto, nós vamos-)"

[.skill_summoning_familiar_prayingmantis_21]
en = "You know, I'd rather you call me something other than grasshopper."
pt = "Sabe, eu preferia que você me chamasse de outra coisa que não gafanhoto."

[.skill_summoning_familiar_prayingmantis_22]
en = "Clitterchirp? (Is there a reason for this?)"
pt = "Clitterchirp? (Há algum motivo para isso?)"

[.skill_summoning_familiar_prayingmantis_23]
en = "You drool when you say it."
pt = "Você baba quando fala isso."

[.skill_summoning_familiar_prayingmantis_24]
en = "Clickclatter! Chirrup chirpchirp click chitter... (I do not! Why would I drool when I cann you a juicy...)"
pt = "Clickclatter! Chirrup chirpchirp click chitter... (Não babo, não! Por que eu babaria ao chamar você de um suculento...)"

[.skill_summoning_familiar_prayingmantis_25]
en = "...clickclick chitter clickchitter click... (...succulent, nourishing, crunchy...)"
pt = "...clickclick chitter clickchitter click... (...saboroso, nutritivo, crocante...)"

[.skill_summoning_familiar_prayingmantis_26]
en = "*Drooool*"
pt = "*Baaaaba*"

[.skill_summoning_familiar_prayingmantis_27]
en = "You're doing it again!"
pt = "Está fazendo de novo!"

# Skills - summoning/familiar/Pyrelord.kt

[.skill_summoning_familiar_pyrelord_1]
en = "What are we doing here?"
pt = "O que estamos fazendo aqui?"

[.skill_summoning_familiar_pyrelord_2]
en = "Whatever I feel like doing."
pt = "O que eu tiver vontade."

[.skill_summoning_familiar_pyrelord_3]
en = "I was summoned by a greater demon once you know."
pt = "Sabia que uma vez fui invocado por um greater demon?"

[.skill_summoning_familiar_pyrelord_4]
en = "He said we'd see the world..."
pt = "Ele disse que a gente ia conhecer o mundo..."

[.skill_summoning_familiar_pyrelord_5]
en = "What happened?"
pt = "O que aconteceu?"

[.skill_summoning_familiar_pyrelord_6]
en = "He was slain; it was hilarious!"
pt = "Ele foi morto; foi hilário!"

[.skill_summoning_familiar_pyrelord_7]
en = "I used to be feared across five planes..."
pt = "Eu já fui temido em cinco planos..."

[.skill_summoning_familiar_pyrelord_8]
en = "Oh dear, now you're going to be sad all day!"
pt = "Ai, ai, agora você vai ficar triste o dia todo!"

[.skill_summoning_familiar_pyrelord_9]
en = "At least I won't be the only one."
pt = "Pelo menos não vou ser o único."

[.skill_summoning_familiar_pyrelord_10]
en = "I could teach you to smite your enemies with flames."
pt = "Eu poderia te ensinar a fulminar seus inimigos com chamas."

[.skill_summoning_familiar_pyrelord_11]
en = "You're not the only one: we have runes to do that."
pt = "Você não é o único: temos runas para isso."

[.skill_summoning_familiar_pyrelord_12]
en = "Runes? Oh, that's so cute!"
pt = "Runas? Ah, que fofo!"

[.skill_summoning_familiar_pyrelord_13]
en = "Cute?"
pt = "Fofo?"

[.skill_summoning_familiar_pyrelord_14]
en = "Well, not cute so much as tragic. I could teach you to do it without runes."
pt = "Bom, menos fofo e mais trágico. Eu poderia te ensinar a fazer isso sem runas."

[.skill_summoning_familiar_pyrelord_15]
en = "Really?"
pt = "Sério?"

[.skill_summoning_familiar_pyrelord_16]
en = "Have you never been on fire?"
pt = "Você nunca pegou fogo?"

[.skill_summoning_familiar_pyrelord_17]
en = "You say that like it's a bad thing."
pt = "Você fala como se fosse ruim."

[.skill_summoning_familiar_pyrelord_18]
en = "Isn't it? It gives me the heebie-jeebies!"
pt = "E não é? Me dá arrepios!"

[.skill_summoning_familiar_pyrelord_19]
en = "You're afraid of something?"
pt = "Você tem medo de alguma coisa?"

[.skill_summoning_familiar_pyrelord_20]
en = "Yes: I'm afraid of being you."
pt = "Tenho: medo de ser você."

[.skill_summoning_familiar_pyrelord_21]
en = "I don't think he likes me..."
pt = "Acho que ele não gosta de mim..."

[.skill_summoning_familiar_pyrelord_22]
en = "To cast Immense Heat, use the Cast option or a gold bar on the pyrelord."
pt = "Para lançar Immense Heat, use a opção 'Cast' ou uma barra de ouro (gold bar) no pyrelord."

[.skill_summoning_familiar_pyrelord_23]
en = "The %1% only burns logs."
pt = "O seu familiar (%1%) só queima toras."

[.skill_summoning_familiar_pyrelord_24]
en = "The %1% breathes fire and the logs begin to burn."
pt = "O seu familiar (%1%) solta fogo e as toras começam a queimar."

[.skill_summoning_familiar_pyrelord_25]
en = "The pyrelord can only work its heat on gold bars."
pt = "O pyrelord só consegue usar o seu calor em barras de ouro."

# Skills - summoning/familiar/RavenousLocust.kt

[.skill_summoning_familiar_ravenouslocust_1]
en = "Click whiiine whiiiiine click click? (Hey, man, can you spare some lentils?)"
pt = "Click whiiine whiiiiine click click? (E aí, bicho, tem umas lentilhas sobrando?)"

[.skill_summoning_familiar_ravenouslocust_2]
en = "What would you want with lentils?"
pt = "E para que você quer lentilhas?"

[.skill_summoning_familiar_ravenouslocust_3]
en = "Whiiiiiinewhiiiiiiine click whiiiiiiiine. (I was going to make a casserole.)"
pt = "Whiiiiiinewhiiiiiiine click whiiiiiiiine. (Eu ia fazer um ensopado.)"

[.skill_summoning_familiar_ravenouslocust_4]
en = "How? You don't have a fire, pans or thumbs."
pt = "Como? Você não tem fogo, panela nem polegar."

[.skill_summoning_familiar_ravenouslocust_5]
en = "Whiiiiiiiiiiiiine! (Stop hassling me, man.)"
pt = "Whiiiiiiiiiiiiine! (Não me grila, bicho.)"

[.skill_summoning_familiar_ravenouslocust_6]
en = "Whiiiiiine click click! (Man, it's a totally groovy day.)"
pt = "Whiiiiiine click click! (Bicho, que dia mais bacana.)"

[.skill_summoning_familiar_ravenouslocust_7]
en = "That it is."
pt = "Lá isso é."

[.skill_summoning_familiar_ravenouslocust_8]
en = "Whiiiiine whiiiiine whinewhiiiine. (Now, if only I wasn't being held down by 'The Man'.)"
pt = "Whiiiiine whiiiiine whinewhiiiine. (Agora, se ao menos 'O Sistema' não me oprimisse.)"

[.skill_summoning_familiar_ravenouslocust_9]
en = "Which man?"
pt = "Que sistema?"

[.skill_summoning_familiar_ravenouslocust_10]
en = "Clickclack whiiiiiine whiiiiinewhiiine. ('The Man'; the one that keeps harshing my mellow.)"
pt = "Clickclack whiiiiiine whiiiiinewhiiine. ('O Sistema'; aquele que vive cortando a minha onda.)"

[.skill_summoning_familiar_ravenouslocust_11]
en = "'Harshing your mellow'? Okay, I don't want to know any more."
pt = "'Cortando a sua onda'? Tá, não quero saber mais nada."

[.skill_summoning_familiar_ravenouslocust_12]
en = "Whiiiiiine... (Siiiiigh...)"
pt = "Whiiiiiine... (Suuuuspiro...)"

[.skill_summoning_familiar_ravenouslocust_13]
en = "Whiiiine whiiiineclickwhiiiiine whine... (I was just thinking about how meat is murder...)"
pt = "Whiiiine whiiiineclickwhiiiiine whine... (Eu só estava pensando em como carne é assassinato...)"

[.skill_summoning_familiar_ravenouslocust_14]
en = "But it isn't. Killing someone is murder."
pt = "Mas não é. Matar alguém é que é assassinato."

[.skill_summoning_familiar_ravenouslocust_15]
en = "Click click! (Good point.)"
pt = "Click click! (Bem lembrado.)"

[.skill_summoning_familiar_ravenouslocust_16]
en = "Whiiiiine whinewhiiiine? (Man, how about time?)"
pt = "Whiiiiine whinewhiiiine? (Bicho, e o tempo, hein?)"

[.skill_summoning_familiar_ravenouslocust_17]
en = "I think it's about midday."
pt = "Acho que já é quase meio-dia."

[.skill_summoning_familiar_ravenouslocust_18]
en = "Clickwhiiiiine whiiiiiiiiiiiiine... (No, man. Isn't time, like, massive?)"
pt = "Clickwhiiiiine whiiiiiiiiiiiiine... (Não, bicho. O tempo não é, tipo, muito massa?)"

[.skill_summoning_familiar_ravenouslocust_19]
en = "I don't think an abstract concept can have mass..."
pt = "Acho que um conceito abstrato não pode ter massa..."

[.skill_summoning_familiar_ravenouslocust_20]
en = "Whineclick click! (Oh, man, that's heavy.)"
pt = "Whineclick click! (Puxa, bicho, isso é pesado.)"

# Skills - summoning/familiar/Skinweaver.kt

[.skill_summoning_familiar_skinweaver_1]
en = "This is my first time on this plane, naabe. I hope I can serve you well."
pt = "É a minha primeira vez neste plano, naabe. Espero te servir bem."

[.skill_summoning_familiar_skinweaver_2]
en = "What is your name? My name is %1%, by the way."
pt = "Qual é o seu nome? O meu é %1%, aliás."

[.skill_summoning_familiar_skinweaver_3]
en = "I get confused with these titles you humans take pride in. Fremennik names, first names, last names... Gorajo have no need to be individual - to have a name that no-one else has."
pt = "Eu me confundo com esses títulos de que vocês humanos tanto se orgulham. Nomes Fremennik, nomes, sobrenomes... Os gorajo não precisam ser indivíduos - ter um nome que ninguém mais tem."

[.skill_summoning_familiar_skinweaver_4]
en = "How can you not have a name?"
pt = "Como assim você não tem nome?"

[.skill_summoning_familiar_skinweaver_5]
en = "Everything we do is for the clan. If a problem arises, a role will be required, not an individual. The individual has no place among the gorajo."
pt = "Tudo o que fazemos é pelo clã. Se surge um problema, é preciso uma função, não um indivíduo. O indivíduo não tem lugar entre os gorajo."

[.skill_summoning_familiar_skinweaver_6]
en = "Please do not take it as rudeness, but I cannot understand how your world functions with names and individuals, naabe."
pt = "Por favor, não leve como falta de educação, mas não consigo entender como o seu mundo funciona com nomes e indivíduos, naabe."

[.skill_summoning_familiar_skinweaver_7]
en = "What does a skinweaver do, exactly?"
pt = "O que um skinweaver faz, exatamente?"

[.skill_summoning_familiar_skinweaver_8]
en = "We are healers of livestock, crops and other gorajo. Which reminds me, naabe, do you mind if I ask you a question?"
pt = "Somos curandeiros de rebanhos, plantações e outros gorajo. Isso me lembra, naabe: posso te fazer uma pergunta?"

[.skill_summoning_familiar_skinweaver_9]
en = "Do you find that human organs feel like slippery fish? And that your skin is stretchy like the dried sap of an utuku?"
pt = "Você acha que os órgãos humanos parecem peixes escorregadios? E que a sua pele estica como a seiva seca de um utuku?"

[.skill_summoning_familiar_skinweaver_10]
en = "Uh. I'm feeling a little faint."
pt = "Hã. Estou me sentindo meio tonto."

[.skill_summoning_familiar_skinweaver_11]
en = "Don't worry! I have cat spittle for your head should you fall. And I am on hand to suck any blood clots from your brain."
pt = "Não se preocupe! Tenho cuspe de gato para a sua cabeça, caso você caia. E estou aqui para chupar qualquer coágulo do seu cérebro."

[.skill_summoning_familiar_skinweaver_12]
en = "How do you like it in Daemonheim?."
pt = "O que você está achando de Daemonheim?"

[.skill_summoning_familiar_skinweaver_13]
en = "Naabe, let me tell you something. When I was a few years younger than I am now, I helped to heal a nustukh: a creature as big as three floors of this place."
pt = "Naabe, deixe-me contar uma coisa. Quando eu era alguns anos mais jovem, ajudei a curar um nustukh: uma criatura do tamanho de três andares deste lugar."

[.skill_summoning_familiar_skinweaver_14]
en = "The nustukh do not benefit the gorajo in any way, but they are the reincarnations of our greatest leaders. They have great significance to our people."
pt = "Os nustukh não trazem nenhum benefício aos gorajo, mas são as reencarnações dos nossos maiores líderes. Eles têm grande importância para o nosso povo."

[.skill_summoning_familiar_skinweaver_15]
en = "This nustukh was ravaged by a corruption that ate at every one of its organs. A skinweaver was required to crawl in through an open lesion and heal it: I volunteered immediately. I spent two weeks inside."
pt = "Esse nustukh estava devastado por uma corrupção que corroía cada um dos seus órgãos. Era preciso que um skinweaver entrasse rastejando por uma ferida aberta para curá-lo: eu me ofereci na hora. Passei duas semanas lá dentro."

[.skill_summoning_familiar_skinweaver_16]
en = "I cannot help but be reminded of the nustukh in Daemonheim. The dungeons are as rank and unwholesome, and I feel that my powers are just as ineffective inside."
pt = "Não consigo deixar de me lembrar do nustukh aqui em Daemonheim. As masmorras são igualmente fétidas e insalubres, e sinto que os meus poderes são tão ineficazes aqui dentro quanto lá."

[.skill_summoning_familiar_skinweaver_17]
en = "I can understand your curiosity, naabe. Feel free to talk whenever you need."
pt = "Entendo a sua curiosidade, naabe. Fique à vontade para conversar sempre que precisar."

# Skills - summoning/familiar/SmokeDevil.kt

[.skill_summoning_familiar_smokedevil_1]
en = "When are you going to be done with that?"
pt = "Quando você vai terminar isso aí?"

[.skill_summoning_familiar_smokedevil_2]
en = "Soon, I hope."
pt = "Logo, espero."

[.skill_summoning_familiar_smokedevil_3]
en = "Good, because this place is too breezy."
pt = "Ótimo, porque aqui venta demais."

[.skill_summoning_familiar_smokedevil_4]
en = "I mean, it's tricky to keep hovering in this draft."
