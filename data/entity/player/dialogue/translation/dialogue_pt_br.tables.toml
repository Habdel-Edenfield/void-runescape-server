# Skills - summoning/familiar/ObsidianGolem.kt

[.skill_summoning_familiar_obsidiangolem_1]
en = "Truly, you are a powerful warrior, Master!"
pt = "Sem dúvida, você é um guerreiro poderoso, Mestre!"

[.skill_summoning_familiar_obsidiangolem_2]
en = "I'm pleased you think so."
pt = "Fico contente que pense assim."

[.skill_summoning_familiar_obsidiangolem_3]
en = "It is my duty to respect you, Master."
pt = "É meu dever respeitá-lo, Mestre."

[.skill_summoning_familiar_obsidiangolem_4]
en = "Oh, So you're just saying that to make me happy..."
pt = "Ah, então você só está dizendo isso para me agradar..."

[.skill_summoning_familiar_obsidiangolem_5]
en = "I obey all orders, Master."
pt = "Eu obedeço a todas as ordens, Mestre."

[.skill_summoning_familiar_obsidiangolem_6]
en = "Let us go forth and prove our strength, Master!"
pt = "Avancemos e provemos a nossa força, Mestre!"

[.skill_summoning_familiar_obsidiangolem_7]
en = "Where would you like to prove it?"
pt = "E onde você quer provar?"

[.skill_summoning_familiar_obsidiangolem_8]
en = "The caves of the TzHaar are filled with monsters for us to defeat, Master! TzTok-Jad shall quake in his slippers!"
pt = "As cavernas dos TzHaar estão cheias de monstros para derrotarmos, Mestre! TzTok-Jad vai tremer nas pantufas!"

[.skill_summoning_familiar_obsidiangolem_9]
en = "Have you ever met TzTok-Jad?"
pt = "Você já conheceu o TzTok-Jad?"

[.skill_summoning_familiar_obsidiangolem_10]
en = "Alas, Master, I have not. No Master has ever taken me to see him."
pt = "Infelizmente não, Mestre. Nenhum Mestre jamais me levou para vê-lo."

[.skill_summoning_familiar_obsidiangolem_11]
en = "How many foes have you defeated, Master?"
pt = "Quantos inimigos você já derrotou, Mestre?"

[.skill_summoning_familiar_obsidiangolem_12]
en = "Quite a few, I should think."
pt = "Vários, imagino."

[.skill_summoning_familiar_obsidiangolem_13]
en = "Was your first foe as mighty as the volcano, Master?"
pt = "O seu primeiro inimigo era poderoso como o vulcão, Mestre?"

[.skill_summoning_familiar_obsidiangolem_14]
en = "Um, not quite."
pt = "Hã, não exatamente."

[.skill_summoning_familiar_obsidiangolem_15]
en = "I am sure it must have been a deadly opponent, Master!"
pt = "Tenho certeza de que foi um oponente mortal, Mestre!"

[.skill_summoning_familiar_obsidiangolem_16]
en = "*Cough* It might have been a chicken. *Cough*"
pt = "*Cof* Pode ter sido uma galinha. *Cof*"

[.skill_summoning_familiar_obsidiangolem_17]
en = "Master! We are truly a mighty duo!"
pt = "Mestre! Somos mesmo uma dupla poderosa!"

[.skill_summoning_familiar_obsidiangolem_18]
en = "Do you think so?"
pt = "Você acha?"

[.skill_summoning_familiar_obsidiangolem_19]
en = "Of course, Master! I am programmed to believe so."
pt = "Claro, Mestre! Fui programado para acreditar nisso."

[.skill_summoning_familiar_obsidiangolem_20]
en = "Do you do anything you're not programmed to?"
pt = "E você faz alguma coisa fora da sua programação?"

[.skill_summoning_familiar_obsidiangolem_21]
en = "No, Master."
pt = "Não, Mestre."

[.skill_summoning_familiar_obsidiangolem_22]
en = "I guess that makes things simple for you..."
pt = "Pelo jeito, isso simplifica as coisas para você..."

[.skill_summoning_familiar_obsidiangolem_23]
en = "Do you ever doubt your programming, Master?"
pt = "Você já duvidou da sua programação, Mestre?"

[.skill_summoning_familiar_obsidiangolem_24]
en = "I don't have programming. I can think about whatever I like."
pt = "Eu não tenho programação. Posso pensar no que eu quiser."

[.skill_summoning_familiar_obsidiangolem_25]
en = "What do you think about, Master?"
pt = "E no que você pensa, Mestre?"

[.skill_summoning_familiar_obsidiangolem_26]
en = "Oh, simple things: the sound of one hand clapping, where the gods come from...Simple things."
pt = "Ah, coisas simples: o som de uma só mão batendo palmas, de onde vêm os deuses... Coisas simples."

[.skill_summoning_familiar_obsidiangolem_27]
en = "Paradox check = positive. Error. Reboot."
pt = "Verificação de paradoxo = positiva. Erro. Reiniciar."

