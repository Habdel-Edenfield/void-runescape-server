[.data_skill_slayer_master_kuradal_tables_13]
en = "Found beneath the Dwarven mines, these are tough beings of rock. They can use ranged or melee attacks against you, so plan accordingly!"
pt = "Encontrados debaixo das Dwarven mines, são seres duros de pedra. Podem usar ataques à distância ou corpo a corpo contra você, então planeje bem!"

[.data_skill_slayer_master_kuradal_tables_14]
en = "Mithril dragons are very dangerous opponents. They live just north of where we are now. You are a battle master - test your skills."
pt = "Mithril dragons são oponentes muito perigosos. Vivem logo ao norte de onde estamos. Você é um mestre da batalha: teste suas habilidades."

[.data_skill_slayer_master_kuradal_tables_15]
