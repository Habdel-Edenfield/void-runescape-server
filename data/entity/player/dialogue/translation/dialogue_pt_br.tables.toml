[.skill_summoning_familiar_hydra_11]
en = "Raaaaasp sss rassssp. (Don't pay any attention, they are just feeling whiny.)"
pt = "Raaaaasp sss rassssp. (Não liga, essa aí só está de mimimi.)"

[.skill_summoning_familiar_hydra_12]
en = "But they're you, aren't they?"
pt = "Mas essa aí é você, não é?"

[.skill_summoning_familiar_hydra_13]
en = "Raaaasp raasp rasssp! (Don't remind me!)"
pt = "Raaaasp raasp rasssp! (Nem me lembre!)"

[.skill_summoning_familiar_hydra_14]
en = "Rassssp rasssssp! (You know, two heads are better than one!)"
pt = "Rassssp rasssssp! (Sabe, duas cabeças pensam melhor que uma!)"

[.skill_summoning_familiar_hydra_15]
en = "Raaaasp rassssp sssssp.... (Unless you're the one doing all the heavy thinking....)"
pt = "Raaaasp rassssp sssssp.... (A não ser que só uma faça todo o trabalho pesado de pensar....)"

[.skill_summoning_familiar_hydra_16]
en = "I think I'll stick to one for now, thanks."
pt = "Acho que vou ficar com uma só por enquanto, obrigado."

[.skill_summoning_familiar_hydra_17]
