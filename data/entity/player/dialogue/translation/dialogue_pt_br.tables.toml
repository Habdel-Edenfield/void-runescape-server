# Skills - slayer/master/SlayerMaster.kt

[.skill_slayer_master_slayermaster_1]
en = "I'm one of the elite Slayer Masters."
pt = "Sou um dos mestres de Slayer de elite."

[.skill_slayer_master_slayermaster_2]
en = "What's a slayer?"
pt = "O que é um slayer?"

[.skill_slayer_master_slayermaster_3]
en = "Oh dear, what do they teach you in school?"
pt = "Ai, ai, o que é que ensinam na escola hoje em dia?"

[.skill_slayer_master_slayermaster_4]
en = "Well... er..."
pt = "Bem... é..."

[.skill_slayer_master_slayermaster_5]
en = "I suppose I'll have to educate you then. A slayer is someone who is trained to fight specific creatures. They know these creatures' every weakness and strength. As you can guess it makes killing them a lot easier."
pt = "Pelo jeito vou ter que te ensinar, então. Um slayer é alguém treinado para lutar contra criaturas específicas. Conhece cada fraqueza e cada força dessas criaturas. Como você pode imaginar, isso torna bem mais fácil matá-las."

[.skill_slayer_master_slayermaster_6]
en = "Never heard of you..."
pt = "Nunca ouvi falar de você..."

[.skill_slayer_master_slayermaster_7]
en = "That's because my foe never lives to tell of me. We slayers are a dangerous bunch."
pt = "É porque os meus inimigos nunca sobrevivem para falar de mim. Nós, slayers, somos um bando perigoso."

[.skill_slayer_master_slayermaster_8]
en = "'Ello, and what are you after then?"
pt = "'Lá, e o que é que você procura, hein?"

[.skill_slayer_master_slayermaster_9]
en = "I need another assignment."
pt = "Preciso de outra tarefa."

[.skill_slayer_master_slayermaster_10]
en = "You're actually very strong, are you sure you don't want %1% in %2% to assign you a task?"
pt = "Na verdade você é bem forte. Tem certeza de que não quer que %1%, em %2%, lhe dê uma tarefa?"

[.skill_slayer_master_slayermaster_11]
en = "No that's okay, I'll take a task from you."
pt = "Não, tudo bem, eu pego uma tarefa com você."

[.skill_slayer_master_slayermaster_12]
en = "Oh okay then, I'll go talk to %1%."
pt = "Ah, tá bom então, vou falar com %1%."

[.skill_slayer_master_slayermaster_13]
en = "Have you any rewards for me, or anything to trade?"
pt = "Você tem alguma recompensa para mim, ou algo para trocar?"

[.skill_slayer_master_slayermaster_14]
en = "I'm here about blessed axes again."
pt = "Vim de novo por causa dos machados abençoados."

[.skill_slayer_master_slayermaster_15]
en = "What is that cape you're wearing?"
pt = "Que capa é essa que você está usando?"

[.skill_slayer_master_slayermaster_16]
en = "Er...nothing... "
pt = "É... nada... "

[.skill_slayer_master_slayermaster_17]
en = "You're still hunting %1%, you have %2% to go."
pt = "Você ainda está caçando: %1%. Faltam %2%."

[.skill_slayer_master_slayermaster_18]
en = "Although, it's not an assignment that I'd normally give... I guess I could give you a new assignment, if you'd like."
pt = "Bem, não é uma tarefa que eu costumo dar... Acho que eu poderia te dar uma nova tarefa, se você quiser."

[.skill_slayer_master_slayermaster_19]
en = "If you do get a new one, you will reset your task streak of %1%. Is that okay?"
pt = "Se você pegar uma nova, vai zerar a sua sequência de %1% tarefas. Tudo bem?"

[.skill_slayer_master_slayermaster_20]
en = "Although, it's a tougher assignment that I'd normally give... I guess I could give you a new assignment, if you'd like."
pt = "Bem, é uma tarefa mais difícil do que as que eu costumo dar... Acho que eu poderia te dar uma nova tarefa, se você quiser."

[.skill_slayer_master_slayermaster_21]
en = "Excellent, you're doing great. Your new task is to kill %1% %2%."
pt = "Excelente, você está indo muito bem. Sua nova tarefa: matar %1% %2%."

[.skill_slayer_master_slayermaster_22]
en = "Okay, great!"
pt = "Certo, ótimo!"

[.skill_slayer_master_slayermaster_23]
en = "Wow, can you teach me?"
pt = "Uau, você pode me ensinar?"

[.skill_slayer_master_slayermaster_24]
en = "Hmmm well I'm not so sure..."
pt = "Hmmm, bem, não sei, não..."

[.skill_slayer_master_slayermaster_25]
en = "Pleeeaasssse!"
pt = "Por favooooor!"

[.skill_slayer_master_slayermaster_26]
en = "Oh okay then, you twisted my arm. You'll have to train against specific groups of creatures."
pt = "Ah, tá bom, você me convenceu. Você vai ter que treinar contra grupos específicos de criaturas."

[.skill_slayer_master_slayermaster_27]
en = "Okay, what's first?"
pt = "Certo, o que vem primeiro?"

[.skill_slayer_master_slayermaster_28]
en = "We'll start you off hunting %1%, you'll need to kill %2% of them."
pt = "Para começar, você vai caçar: %1%. Vai precisar matar %2%."

[.skill_slayer_master_slayermaster_29]
en = "You'll also need this enchanted gem, it allows Slayer Masters like myself to contact you and update you on your progress. Don't worry if you lose it, you can buy another from any Slayer Master."
pt = "Você também vai precisar desta gema encantada (enchanted gem). Com ela, mestres de Slayer como eu podem falar com você e atualizar o seu progresso. Se perder, não se preocupe: dá para comprar outra com qualquer mestre de Slayer."

[.skill_slayer_master_slayermaster_30]
en = "Good luck! Don't forget to come back when you need a new assignment."
pt = "Boa sorte! Não esqueça de voltar quando precisar de uma nova tarefa."

[.skill_slayer_master_slayermaster_31]
en = "Sounds useless to me."
pt = "Para mim, parece inútil."

[.skill_slayer_master_slayermaster_32]
en = "Suit yourself."
pt = "Você é quem sabe."

