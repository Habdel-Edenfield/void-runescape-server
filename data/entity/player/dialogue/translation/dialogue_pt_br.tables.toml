pt = "Bom, tenho muita coisa pra fazer hoje, então talvez a gente vá a vários lugares."

[.skill_summoning_familiar_smokedevil_9]
en = "Are we there yet?"
pt = "Já chegamos?"

[.skill_summoning_familiar_smokedevil_10]
en = "No, not yet."
pt = "Não, ainda não."

[.skill_summoning_familiar_smokedevil_11]
en = "How about now?"
pt = "E agora?"

[.skill_summoning_familiar_smokedevil_12]
en = "Are we still not there?"
pt = "Ainda não chegamos?"

[.skill_summoning_familiar_smokedevil_13]
en = "Okay, just checking."
pt = "Tá bom, só conferindo."

[.skill_summoning_familiar_smokedevil_14]
en = "Ah, this is the life!"
pt = "Ah, isso é que é vida!"

[.skill_summoning_familiar_smokedevil_15]
en = "Having a good time up there?"
pt = "Se divertindo aí em cima?"

[.skill_summoning_familiar_smokedevil_16]
en = "Yeah! It's great to feel the wind in your tentacles."
pt = "Sim! É ótimo sentir o vento nos tentáculos."

[.skill_summoning_familiar_smokedevil_17]
en = "Sadly, I don't know what that feels like."
pt = "Infelizmente, não sei como é isso."

[.skill_summoning_familiar_smokedevil_18]
en = "No tentacles for a start."
pt = "Pra começar, não tenho tentáculos."

[.skill_summoning_familiar_smokedevil_19]
en = "Well, nobody's perfect."
pt = "Bom, ninguém é perfeito."

[.skill_summoning_familiar_smokedevil_20]
en = "Why is it always so cold here?"
pt = "Por que aqui é sempre tão frio?"

[.skill_summoning_familiar_smokedevil_21]
en = "I don't think it's that cold."
pt = "Não acho que esteja tão frio."

[.skill_summoning_familiar_smokedevil_22]
en = "It is compared to back home."
pt = "Está, comparado com a minha terra."

[.skill_summoning_familiar_smokedevil_23]
en = "How hot is it where you are from?"
pt = "Quão quente é de onde você vem?"

[.skill_summoning_familiar_smokedevil_24]
en = "I can never remember. What is the vaporisation point of steel again?"
pt = "Nunca me lembro. Qual é mesmo o ponto de vaporização do aço?"

[.skill_summoning_familiar_smokedevil_25]
en = "Pretty high."
pt = "Bem alto."

[.skill_summoning_familiar_smokedevil_26]
en = "No wonder you feel cold here..."
pt = "Não admira que você sinta frio aqui..."

