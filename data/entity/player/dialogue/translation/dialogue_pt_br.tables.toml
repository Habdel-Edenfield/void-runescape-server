en = "You can also sell most items to the shop."
pt = "Você também pode vender a maioria dos itens para a loja."

[.generalstore_8]
en = "Thank you."
pt = "Obrigado."

[.generalstore_9]
en = "I'm glad you ask! You can buy as many of the items stocked as you wish. You can also sell most items to the shop."
pt = "Que bom que perguntou! Você pode comprar quantos itens do estoque quiser. Também pode vender a maioria dos itens para a loja."

[.generalstore_10]
en = "No thanks."
pt = "Não, obrigado."

[.generalstore_11]
en = "It's a beautiful day today, no? Can I do anything for you?"
pt = "Que dia lindo hoje, não? Posso fazer algo por você?"

