# Musician - Lumbridge - Tutorial Island

[.musician_1]
en = "Me? I'm a musician Let me help you relax: sit down, rest your weary limbs and allow me to wash away the troubles of the day."
pt = "Eu? Sou um músico. Deixe-me ajudar você a relaxar: sente-se, descanse esses membros cansados e deixe-me lavar os problemas do dia."

[.musician_2]
en = "After a long trek, what could be better than some music to give you the energy to continue?"
pt = "Depois de uma longa caminhada, o que pode ser melhor que um pouco de música para dar energia para seguir em frente?"

[.musician_3]
en = "Can I ask you some questions about resting?"
pt = "Posso te fazer umas perguntas sobre descansar?"

[.musician_4]
en = "How does resting work?"
pt = "Como funciona o descanso?"

[.musician_5]
en = "So how does resting work?"
pt = "Então, como funciona o descanso?"

[.musician_6]
en = "Have you ever been on a long journey, and simply wanted to have a rest? When you're running from city to city, it's so easy to run out of breath, don't you find?"
pt = "Já esteve numa longa jornada e só quis descansar? Correndo de cidade em cidade, é tão fácil ficar sem fôlego, não acha?"

[.musician_7]
en = "Yes, I can never run as far as I'd like."
pt = "Sim, nunca consigo correr tão longe quanto gostaria."

[.musician_8]
en = "Well, you may rest anywhere, simply choose the Rest option on the run buttons."
pt = "Bem, você pode descansar em qualquer lugar, é só escolher a opção 'Rest' nos botões de corrida."

[.musician_9]
en = "When you are nice and relaxed, you will recharge your run energy more quickly and your life points twice as fast as you would do so normally."
pt = "Bem relaxado, você recarrega a energia de corrida (run energy) mais rápido e os pontos de vida (life points) duas vezes mais rápido que o normal."

[.musician_10]
en = "Of course, you can't do anything else while you're resting, other than talk."
pt = "É claro que você não pode fazer mais nada enquanto descansa, a não ser conversar."

[.musician_11]
en = "Well, you wouldn't be resting, now would you? Also, you should know that resting by a musician, has a similar effect but the benefits are greater."
pt = "Ora, aí você não estaria descansando, não é? E saiba que descansar perto de um músico tem um efeito parecido, mas com benefícios maiores."

[.musician_12]
en = "What's special about resting by a musician?"
pt = "O que tem de especial em descansar perto de um músico?"

[.musician_13]
en = "The effects of resting are enhanced by music. Your run energy will recharge many times the normal rate, and your life points three times as fast."
pt = "A música potencializa o descanso. Sua energia de corrida recarrega várias vezes mais rápido que o normal, e seus pontos de vida, três vezes mais rápido."

[.musician_14]
en = "Simply sit down and rest as you would normally, nice and close to the musician. You'll turn to face the musician and hear the music. Like resting anywhere, if you do anything other than talk, you will stop resting."
pt = "É só sentar e descansar como sempre, bem pertinho do músico. Você vai se virar para ele e ouvir a música. Como em qualquer lugar, se fizer algo além de conversar, para de descansar."

[.musician_15]
en = "Can you summarise the effects for me?"
pt = "Pode me resumir os efeitos?"

[.musician_16]
en = "Certainly. You can rest anywhere, simply choose the Rest option on the run buttons."
pt = "Claro. Você pode descansar em qualquer lugar, é só escolher a opção 'Rest' nos botões de corrida."

[.musician_17]
en = "Resting anywhere will replenish your run energy more quickly than normal, your life points will replenish twice as fast as well!"
pt = "Descansar em qualquer lugar recupera sua energia de corrida mais rápido que o normal, e seus pontos de vida duas vezes mais rápido!"

[.musician_18]
en = "Resting by a musician will replenish your run energy many times faster than normal, and your life points will also replenish three times as fast."
pt = "Descansar perto de um músico recupera sua energia de corrida várias vezes mais rápido que o normal, e seus pontos de vida três vezes mais rápido."

[.musician_19]
en = "That's all for now."
pt = "Por enquanto é só."

[.musician_20]
en = "Well, don't forget to have a rest every now and again."
pt = "Bem, não se esqueça de descansar de vez em quando."

