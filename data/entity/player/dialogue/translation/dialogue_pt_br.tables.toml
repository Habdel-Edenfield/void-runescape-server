# GeneralStore - Lumbridge - Tutorial Island

[.generalstore_1]
en = "Can I help you at all?"
pt = "Posso ajudar em alguma coisa?"

[.generalstore_2]
en = "Yes please. What are you selling?"
pt = "Sim, por favor. O que você está vendendo?"

[.generalstore_3]
en = "How should I use your shop?"
pt = "Como devo usar sua loja?"

[.generalstore_4]
en = "I'm glad you ask! The shop has two sections to it: 'Main stock' and 'Free sample items'."
pt = "Que bom que perguntou! A loja tem duas seções: 'Main stock' (estoque principal) e 'Free sample items' (amostras grátis)."

[.generalstore_5]
en = "From 'Main Stock' you can buy as many of the stocked items as you wish. I also offer free samples to help get you started and to keep you coming back."
