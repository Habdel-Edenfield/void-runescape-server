pt = "Ele usando armadura verde! General Bentnoze manda nós usar vermelha!"

[.goblins_7]
en = "But General Wartface say we must wear green!"
pt = "Mas General Wartface manda nós usar verde!"

[.goblins_8]
en = "green armour best!"
pt = "armadura verde melhor!"

[.goblins_9]
en = "Why is green best?"
pt = "Por que verde é melhor?"

[.goblins_10]
en = "Cos General Wartface says so, and he bigger than me."
pt = "Porque General Wartface diz que é, e ele maior que eu."

