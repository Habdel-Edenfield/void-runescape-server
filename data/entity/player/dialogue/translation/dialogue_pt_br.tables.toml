[.data_skill_slayer_master_kuradal_tables_18]
en = "The TzHaar contains some mighty warriors, prove yourself against them. You'll find them deep within the Karamja volcano."
pt = "Os TzHaar têm guerreiros poderosos; prove o seu valor contra eles. Você os encontra no fundo do vulcão de Karamja."

[.data_skill_slayer_master_kuradal_tables_19]
en = "Tormented demons are powerful creatures that use magic, ranged and melee attacks. They also have the ability to shield themselves. You can find them below the Tears of Guthix cave."
pt = "Tormented demons são criaturas poderosas que usam ataques de magia, à distância e corpo a corpo. Também conseguem se proteger com um escudo. Você os encontra debaixo da caverna das Tears of Guthix."

[.data_skill_slayer_master_kuradal_tables_20]
en = "Waterfiends are creatures of water that live just north of us. Those followed by familiars are keen to slay these elemental forces."
pt = "Waterfiends são criaturas de água que vivem logo ao norte daqui. Quem anda com familiares gosta de matar essas forças elementais."

[.data_skill_slayer_master_kuradal_tables_21]
en = "Warped tortoises are creatures tainted by magical waste. They are vulnerable to an elven chime. I know you have seen them in your adventures, so go crack some carapace."
pt = "Warped tortoises são criaturas contaminadas por resíduos mágicos. São vulneráveis a um sino élfico (elven chime). Sei que você já as viu nas suas aventuras, então vá quebrar uns cascos."

# Skill data - data/skill/slayer/master/mazchna.tables.toml

[.data_skill_slayer_master_mazchna_tables_1]
en = "Banshees use a piercing scream to shock their enemies; you'll need some earmuffs to protect yourself from them. Their cries echo throughout the Slayer Tower in Morytania."
pt = "As banshees usam um grito penetrante para atordoar os inimigos; você vai precisar de protetores de ouvido (earmuffs) para se proteger. Os gritos delas ecoam pela Slayer Tower, em Morytania."

[.data_skill_slayer_master_mazchna_tables_2]
en = "Bears are tough creatures and fierce fighters, watch out for their powerful claws."
pt = "Ursos (bears) são criaturas resistentes e lutadores ferozes; cuidado com as garras poderosas deles."

[.data_skill_slayer_master_mazchna_tables_3]
en = "Bats are rarely found on the ground, so you'll have to fight them while they're airborne, which won't be easy for melee."
pt = "Morcegos (bats) quase nunca ficam no chão, então você terá de lutar com eles no ar, o que não é fácil no corpo a corpo."

[.data_skill_slayer_master_mazchna_tables_4]
en = "Catablepon are mythical, cow like, magical creatures. Beware their weakening glare."
pt = "Catablepons são criaturas mágicas e míticas, parecidas com vacas. Cuidado com o olhar que enfraquece."

[.data_skill_slayer_master_mazchna_tables_5]
en = "Cave Bugs are like Cave Crawlers, except smaller and easier to squish, though they still have a fondness for plants."
pt = "Cave Bugs são como Cave Crawlers, só que menores e mais fáceis de esmagar, mas ainda gostam muito de plantas."

[.data_skill_slayer_master_mazchna_tables_6]
en = "Cave crawlers are small and fast, often seen creeping around in the Rellekka Slayer Dungeon. Avoid their barbed tongue or you'll get poisoned."
pt = "Cave crawlers são pequenos e rápidos, vistos rastejando pelo Rellekka Slayer Dungeon. Evite a língua farpada deles ou você vai ser envenenado."

[.data_skill_slayer_master_mazchna_tables_7]
en = "Cave Slimes are the lesser cousins of Jellies, though don't be fooled they can still be dangerous as they're often poisonous."
pt = "Cave Slimes são primos menores das Jellies, mas não se engane: ainda podem ser perigosos, pois costumam ser venenosos."

[.data_skill_slayer_master_mazchna_tables_8]
en = "Cockatrices, like basilisks, have a gaze which will paralyse and harm their prey. You'll need a mirror shield to protect you. If you are brave enough, head to Slayer Caves east of Rellekka."
pt = "Cockatrices, como os basilisks, têm um olhar que paralisa e fere a presa. Você vai precisar de um escudo espelhado (mirror shield) para se proteger. Se for corajoso, vá às Slayer Caves a leste de Rellekka."

[.data_skill_slayer_master_mazchna_tables_9]
en = "Crawling Hands are undead severed hands, fast and dexterous they claw their victims."
pt = "Crawling Hands são mãos decepadas mortas-vivas; rápidas e ágeis, arranham as vítimas."

[.data_skill_slayer_master_mazchna_tables_10]
en = "Dogs are much like wolves; they are pack creatures that will hunt in groups. I've heard there are fearsome wild dogs beneath Karamja, or near Ardougne if you are less adventurous."
pt = "Cães (dogs) são parecidos com lobos; vivem em matilha e caçam em grupo. Ouvi dizer que há cães selvagens temíveis debaixo de Karamja, ou perto de Ardougne se você for menos aventureiro."

[.data_skill_slayer_master_mazchna_tables_11]
en = "Fleshcrawlers are scavengers and will eat you - and anyone else, given the chance."
pt = "Fleshcrawlers são carniceiros e vão comer você - e qualquer outro, se tiverem a chance."

[.data_skill_slayer_master_mazchna_tables_12]
en = "Ghosts are undead so magic is your best bet against them, there is even a spell specially for fighting the undead."
pt = "Fantasmas (ghosts) são mortos-vivos, então magia é a sua melhor aposta contra eles; existe até um feitiço especial para lutar contra mortos-vivos."

[.data_skill_slayer_master_mazchna_tables_13]
en = "Ghouls aren't undead, but they are stronger and tougher than they look. They're also very cowardly and will run if they're losing a fight. They wait to ambush those entering the graveyard to the North of Canifis."
pt = "Ghouls não são mortos-vivos, mas são mais fortes e resistentes do que parecem. Também são muito covardes e fogem se estiverem perdendo. Eles ficam de tocaia para quem entra no cemitério ao norte de Canifis."

[.data_skill_slayer_master_mazchna_tables_14]
en = "Hill Giants often wield large weapons, learn to recognise what kind of weapon it is and act accordingly."
pt = "Hill Giants costumam empunhar armas grandes; aprenda a reconhecer que tipo de arma é e aja de acordo."

[.data_skill_slayer_master_mazchna_tables_15]
en = "Hobgoblins carrying spears are often trained warriors. If you want less of a challenge, fight the ones that are unarmed."
pt = "Hobgoblins que carregam lanças costumam ser guerreiros treinados. Se quiser um desafio menor, lute com os que estão desarmados."

[.data_skill_slayer_master_mazchna_tables_16]
en = "Ice warriors are a kind of ice elemental. Thurgo the dwarf recently spotted some in the caves south of Port Sarim."
pt = "Ice warriors são um tipo de elemental de gelo. O anão Thurgo viu alguns há pouco nas cavernas ao sul de Port Sarim."

[.data_skill_slayer_master_mazchna_tables_17]
en = "Kalphite are large insects which live in great hives under the desert sands."
pt = "Kalphites são insetos grandes que vivem em enormes colmeias sob as areias do deserto."

[.data_skill_slayer_master_mazchna_tables_18]
en = "Killerwatts store huge amounts of energy in their bodies, which is released if they are touched. You'll need to wear heavily insulated boots to counter this shocking effect, plus they can attack speedily with both magic and missiles. To access their cloudy plane, you'll need to explore Draynor Manor."
pt = "Killerwatts guardam muita energia no corpo, que é liberada se forem tocados. Você vai precisar de botas bem isoladas (insulated boots) contra esse efeito chocante, e eles atacam rápido com magia e projéteis. Para chegar ao plano nebuloso deles, explore a Draynor Manor."

[.data_skill_slayer_master_mazchna_tables_19]
en = "Desert lizards are large reptiles with tough skin. They're cold-blooded, so dousing them with freezing water will finish them off after a tough battle. You can find them to the east of Sophanem."
pt = "Desert lizards são répteis grandes de pele grossa. Têm sangue frio, então molhá-los com água gelada acaba com eles depois de uma luta difícil. Você os encontra a leste de Sophanem."

[.data_skill_slayer_master_mazchna_tables_20]
en = "Pyrefiends are magical beings of fire and molten rock. They're quick and agile so try attacking them with a crossbow and bolts. You can find some fiends in the Rellekka Slayer Caves."
pt = "Pyrefiends são seres mágicos de fogo e rocha derretida. São rápidos e ágeis, então tente atacá-los com uma besta (crossbow) e virotes (bolts). Há alguns nas Rellekka Slayer Caves."

[.data_skill_slayer_master_mazchna_tables_21]
en = "Rockslugs are strange stoney slugs. You'll need to fight them to near death before finishing them off with Salt."
pt = "Rockslugs são lesmas estranhas de pedra. Você precisa deixá-las quase mortas antes de acabar com elas usando sal (Salt)."

[.data_skill_slayer_master_mazchna_tables_22]
en = "Scorpions are almost always poisonous, their hard carapace makes them resistant to crushing and stabbing attacks."
pt = "Escorpiões (scorpions) quase sempre são venenosos; a carapaça dura os torna resistentes a ataques de esmagamento e de perfuração."

[.data_skill_slayer_master_mazchna_tables_23]
en = "Shades are undead - The town of Mort'ton in Morytania is plagued by these creatures, so help if you can. There are some shades in the Stronghold of Security too, but you won't learn much from fighting those; stick to Mort'ton."
pt = "Shades são mortos-vivos - a cidade de Mort'ton, em Morytania, sofre com essas criaturas, então ajude se puder. Há shades na Stronghold of Security também, mas você não vai aprender muito lutando com elas; fique em Mort'ton."

[.data_skill_slayer_master_mazchna_tables_24]
en = "Skeletons are undead so magic is your best bet against them, there is even a spell specially for fighting the undead."
pt = "Esqueletos (skeletons) são mortos-vivos, então magia é a sua melhor aposta contra eles; existe até um feitiço especial para lutar contra mortos-vivos."

[.data_skill_slayer_master_mazchna_tables_25]
en = "Vampyres are extremely powerful beings. They feed on the blood of the living, so watch that you don't get bitten. Look in the woods of Morytania."
pt = "Vampyres são seres extremamente poderosos. Eles se alimentam do sangue dos vivos, então cuidado para não ser mordido. Procure nos bosques de Morytania."

[.data_skill_slayer_master_mazchna_tables_26]
en = "Wolves are pack animals, so you'll always find them in groups. Watch out for their bite, it can be nasty."
pt = "Lobos (wolves) vivem em matilha, então você sempre vai encontrá-los em grupo. Cuidado com a mordida deles, pode ser feia."

[.data_skill_slayer_master_mazchna_tables_27]
en = "Wall Beasts are really much larger creatures but you'll only see their arms. You'll want something sharp on your head to stop them grabbing you."
pt = "Wall Beasts são criaturas bem maiores, mas você só vai ver os braços delas. É bom ter algo pontudo na cabeça para que não te agarrem."

[.data_skill_slayer_master_mazchna_tables_28]
en = "Zombies are undead so magic is your best bet against them, there is even a spell specially for fighting the undead."
pt = "Zumbis (zombies) são mortos-vivos, então magia é a sua melhor aposta contra eles; existe até um feitiço especial para lutar contra mortos-vivos."

# Skill data - data/skill/slayer/master/sumona.tables.toml

[.data_skill_slayer_master_sumona_tables_1]
en = "Aberrant spectres are fetid, vile ghosts. The very smell of them will paralyse and harm you, while a nosepeg will help ignore their stink. If you sniff carefully, you may be able to detect their aroma beneath the town's well. Kill a few of them, as they offend my nose."
pt = "Aberrant spectres são fantasmas fétidos e vis. Só o cheiro deles já paralisa e fere você; um prendedor de nariz (nosepeg) ajuda a ignorar o fedor. Se farejar bem, vai sentir o aroma deles debaixo do poço da cidade. Mate alguns, eles ofendem o meu nariz."

[.data_skill_slayer_master_sumona_tables_2]
en = "Abyssal demons are nasty creatures to deal with. They aren't really part of this realm and are able to move very quickly to trap their prey. I'm sure you'd love a nice abyssal whip or two, so cull these demons in the Slayer Tower near Canifis."
pt = "Abyssal demons são criaturas desagradáveis de enfrentar. Não pertencem de verdade a este mundo e se movem muito rápido para prender a presa. Aposto que você adoraria um ou dois abyssal whips, então elimine esses demônios na Slayer Tower perto de Canifis."

[.data_skill_slayer_master_sumona_tables_3]
en = "Aquanites are amphibious creatures that attract prey using the glowing lures on their heads. They attack stronger opponents from a distance with water magic, and dislike those who pray against it. You'll find these despicable, slimy creatures in the Fremennik Slayer Dungeon, in a chamber past the kurasks."
pt = "Aquanites são criaturas anfíbias que atraem a presa com as iscas brilhantes na cabeça. Atacam oponentes mais fortes à distância com magia da água e odeiam quem reza contra ela. Você acha esses bichos nojentos e gosmentos no Fremennik Slayer Dungeon, numa câmara depois dos kurasks."

[.data_skill_slayer_master_sumona_tables_4]
en = "Basilisks, like Cockatrices, have a gaze which will paralyse and harm their prey. You'll need a mirror shield to protect you. Conveniently, you can have some combat fun with these brutes in the dungeon beneath the town well."
pt = "Basilisks, como os Cockatrices, têm um olhar que paralisa e fere a presa. Você vai precisar de um escudo espelhado (mirror shield) para se proteger. Por sorte, dá para se divertir em combate com esses brutos na masmorra debaixo do poço da cidade."

[.data_skill_slayer_master_sumona_tables_5]
en = "Banshees use a piercing scream to shock their enemies, so you'll need some earmuffs to protect yourself. I am sometimes disturbed in my sleep by their wails, so do me a favour and thin out those beneath us."
pt = "Banshees usam um grito estridente para atordoar os inimigos, então você vai precisar de protetores de ouvido (earmuffs). Às vezes os uivos delas me acordam, então me faça um favor e diminua as que estão debaixo de nós."

[.data_skill_slayer_master_sumona_tables_6]
en = "Bloodveld are strange, demonic creatures that use their long rasping tongue to feed on just about anything. They are rather robust but frankly feeble and have been seen in the Slayer Tower near Canifis, among other places. I never liked the look of them, so off you go and wipe them out."
pt = "Bloodveld são criaturas estranhas e demoníacas que usam a longa língua áspera para comer quase qualquer coisa. São bem resistentes, mas, francamente, fracos, e foram vistos na Slayer Tower perto de Canifis, entre outros lugares. Nunca gostei da cara deles, então vá lá e acabe com eles."

[.data_skill_slayer_master_sumona_tables_7]
en = "Black demons are creatures that are weak to ranged attacks. They're the strongest type of demon and are therefore very dangerous. Prove yourself more dangerous by slaying these demons in their lairs beneath Taverley or Edgeville."
pt = "Black demons são criaturas fracas contra ataques à distância. São o tipo mais forte de demônio e, por isso, muito perigosos. Prove que você é mais perigoso matando esses demônios nos covis debaixo de Taverley ou de Edgeville."

[.data_skill_slayer_master_sumona_tables_8]
en = "Blue dragons aren't as strong as other dragons, but they're still very powerful. Watch out for their fiery breath! Taverley is home to these pests - I'm sure you'll enjoy murdering a few."
pt = "Blue dragons não são tão fortes quanto outros dragões, mas ainda são muito poderosos. Cuidado com o sopro de fogo! Taverley é o lar dessas pragas; tenho certeza de que você vai gostar de matar alguns."

[.data_skill_slayer_master_sumona_tables_9]
en = "Cave crawlers are small and fast, often hiding in ambush. Avoid their barbed tongue or you'll get poisoned. The ones in the caves below here have grown large and fat in blissful isolation - go and be a force of natural selection."
pt = "Cave crawlers são pequenos e rápidos e muitas vezes ficam de tocaia. Fuja da língua farpada deles ou vai ser envenenado. Os das cavernas aqui embaixo ficaram grandes e gordos no seu isolamento feliz; vá lá e seja uma força da seleção natural."

[.data_skill_slayer_master_sumona_tables_10]
en = "Cave horrors can be found under Mos Le'Harmless. You will need a witchwood icon to fight them effectively. If you want to make a nice Slayer helmet, you'll need the black mask they drop."
pt = "Cave horrors ficam debaixo de Mos Le'Harmless. Você vai precisar de um witchwood icon para enfrentá-los direito. Se quiser fazer um belo elmo de Slayer (Slayer helmet), vai precisar da máscara negra (black mask) que eles deixam cair."

[.data_skill_slayer_master_sumona_tables_11]
en = "Crocodiles are large reptiles that live near water. You'll want to have a stabbing weapon handy for puncturing their thick, scaly hides. These are desert beasts, so seek them there."
pt = "Crocodiles são grandes répteis que vivem perto da água. É bom ter uma arma de estocada à mão para furar o couro grosso e escamoso deles. São feras do deserto, então procure por lá."

[.data_skill_slayer_master_sumona_tables_12]
en = "These things are the curse of the desert! Head north to find them on the hills above the Shantay Pass. Watch out for their vicious ranged attacks."
pt = "Essas coisas são a maldição do deserto! Vá para o norte e você as encontra nas colinas acima do Shantay Pass. Cuidado com os ataques à distância cruéis delas."

[.data_skill_slayer_master_sumona_tables_13]
en = "Dust devils use clouds of dust, sand, ash and whatever else they can inhale to blind and disorientate their victims. You'll be able to test your skills on them in the smoky dungeon to the west. Get going!"
pt = "Dust devils usam nuvens de poeira, areia, cinzas e o que mais conseguirem aspirar para cegar e desorientar as vítimas. Você vai poder testar suas habilidades contra eles na masmorra enfumaçada a oeste. Vamos, ande logo!"

[.data_skill_slayer_master_sumona_tables_14]
en = "Dagannoth are large, sea-dwelling creatures that are very aggressive. You'll often find them in caves near sea water. You'll cackle with glee if you set up a cannon and massacre them."
pt = "Dagannoth são criaturas grandes do mar e muito agressivas. Muitas vezes ficam em cavernas perto da água do mar. Você vai gargalhar de alegria se montar um canhão (cannon) e massacrá-los."

[.data_skill_slayer_master_sumona_tables_15]
en = "Like other giants, Fire giants often wield large weapons. Learn to recognise what kind of weapon it is and act accordingly. Prove that bigger isn't always better by defeating some. They lurk in the smoke dungeon, west of here, telling tales of your weakness."
pt = "Como outros gigantes, os Fire giants costumam usar armas grandes. Aprenda a reconhecer o tipo de arma e aja de acordo. Prove que maior nem sempre é melhor derrotando alguns. Eles se escondem na masmorra enfumaçada, a oeste daqui, contando histórias da sua fraqueza."

[.data_skill_slayer_master_sumona_tables_16]
en = "Gargoyles are winged creatures of stone. You'll need to fight them until they are close to death, before breaking them apart with a rock hammer. They refuse to serve me, so smite them in my name. They are hiding out in the Slayer Tower near Canifis."
pt = "Gargoyles são criaturas aladas de pedra. Você vai ter que lutar até que estejam quase mortas e então quebrá-las com um martelo de pedra (rock hammer). Elas se recusam a me servir, então castigue-as em meu nome. Estão escondidas na Slayer Tower perto de Canifis."

[.data_skill_slayer_master_sumona_tables_17]
en = "Greater demons are creatures that are weak to ranged attacks. Though not the strongest of demons, they are still dangerous. Prove yourself by doing away with them. If you don't know, a large number live in the Brimhaven Dungeon."
pt = "Greater demons são criaturas fracas contra ataques à distância. Não são os demônios mais fortes, mas ainda são perigosos. Prove o seu valor acabando com eles. Caso não saiba, muitos vivem no Brimhaven Dungeon."

[.data_skill_slayer_master_sumona_tables_18]
en = "Hellhounds are a cross between dogs and demons, and are dangerous with a fierce bite. Although they are not cats, they deserve to die anyway. You'll be doing Gielinor a favour if you slay Hellhounds beneath Taverley."
pt = "Hellhounds são um cruzamento de cão com demônio, e a mordida feroz deles é perigosa. Não são gatos, mas merecem morrer mesmo assim. Você vai fazer um favor a Gielinor se matar os Hellhounds debaixo de Taverley."

[.data_skill_slayer_master_sumona_tables_19]
en = "Iron dragons are some of the weaker metallic dragons, but their iron scales are far thicker than normal iron armour. Brimhaven Dungeon has a few of these creatures in residence; I think they should be exterminated because they bore me."
pt = "Iron dragons estão entre os dragões metálicos mais fracos, mas as escamas de ferro deles são bem mais grossas que uma armadura de ferro comum. O Brimhaven Dungeon tem alguns morando lá; acho que deviam ser exterminados porque me entediam."

[.data_skill_slayer_master_sumona_tables_20]
en = "Kalphites are large insects that live in hives under the desert sands. Their Queen is rumoured to be quite powerful. Show people that you are a force to be feared by slaying her brood in the hive to the north-west."
pt = "Kalphites são insetos grandes que vivem em colmeias sob as areias do deserto. Dizem que a Rainha deles é bem poderosa. Mostre que você é uma força a ser temida matando a cria dela na colmeia a noroeste."

[.data_skill_slayer_master_sumona_tables_21]
en = "Kurasks are large, brutal creatures with very thick hides. You'll need a leaf-bladed weapon, broad arrows, or a magic dart to harm them. Unluckily for kurasks, I am sending you to kill them. Luckily for you, kurasks thrive in the dungeons below Pollnivneach."
pt = "Kurasks são criaturas grandes e brutais com couro muito grosso. Você vai precisar de uma arma de lâmina de folha (leaf-bladed), flechas largas (broad arrows) ou do feitiço Magic Dart para feri-los. Azar dos kurasks, estou mandando você matá-los. Sorte sua, eles se multiplicam nas masmorras debaixo de Pollnivneach."

[.data_skill_slayer_master_sumona_tables_22]
en = "Desert lizards are large reptiles with tough skin. They're cold-blooded, so dousing them with freezing water will finish them off after a tough battle."
pt = "Desert lizards são grandes répteis de pele dura. Têm sangue frio, então molhá-los com água gelada acaba com eles depois de uma luta difícil."

[.data_skill_slayer_master_sumona_tables_23]
en = "Nechryael are demons of decay that summon small-winged beings to help them fight their victims. I don't like them much, so kill a few as a personal favour. You can find them up to no good in the Slayer Tower near Canifis."
pt = "Nechryael são demônios da decomposição que invocam pequenos seres alados para ajudá-los a lutar contra as vítimas. Não gosto muito deles, então mate alguns como um favor pessoal. Você os encontra aprontando na Slayer Tower perto de Canifis."

[.data_skill_slayer_master_sumona_tables_24]
en = "Red dragons are fearsome firebreathers, stronger than green or blue. I'm sure that you'll have fun pitting your skills against their claws in either Brimhaven's depths or the ravaged lands far to the north."
pt = "Red dragons são cuspidores de fogo temíveis, mais fortes que os verdes ou os azuis. Tenho certeza de que vai se divertir medindo suas habilidades contra as garras deles nas profundezas de Brimhaven ou nas terras devastadas bem ao norte."

[.data_skill_slayer_master_sumona_tables_25]
en = "Scorpions are almost always venomous and usually found in groups. Last I heard there was a large group near the mine north of Al Kharid."
pt = "Scorpions quase sempre são venenosos e costumam andar em grupo. Da última vez que soube, havia um grupo grande perto da mina ao norte de Al Kharid."

[.data_skill_slayer_master_sumona_tables_26]
en = "Spiritual warriors are fighters that have dedicated their souls to their deity; however, they still retain a fighter's weakness to Magic. They can be found fighting for the god whose cause they support. Kill them all and let their gods lament."
pt = "Spiritual warriors são lutadores que dedicaram a alma à sua divindade; mesmo assim, ainda têm a fraqueza de todo lutador contra Magic. Eles lutam pelo deus cuja causa apoiam. Mate todos e deixe os deuses deles lamentarem."

[.data_skill_slayer_master_sumona_tables_27]
en = "Turoths are large vicious creatures with thick hides. You'll need a leaf-bladed weapon, broad arrows, or a magic dart to harm them. I am sure you'll make yourself useful by killing the ones beneath our feet."
pt = "Turoths são criaturas grandes e cruéis de couro grosso. Você vai precisar de uma arma de lâmina de folha (leaf-bladed), flechas largas (broad arrows) ou do feitiço Magic Dart para feri-los. Tenho certeza de que você vai ser útil matando os que estão debaixo dos nossos pés."

[.data_skill_slayer_master_sumona_tables_28]
en = "The last Mountain troll I killed I found water spells took them down effectively.<br>Trolls regenerate quickly but are still vulnerable to poisons and usually use crushing weapons. I've nothing much against them but their ridiculous names. Unluckily for them, that's enough of a reason to put a few in their graves."
pt = "No último Mountain troll que matei, descobri que feitiços de água os derrubam bem.<br>Trolls se regeneram rápido, mas ainda são vulneráveis a venenos e costumam usar armas de impacto. Não tenho nada contra eles, a não ser os nomes ridículos. Azar deles, isso já é motivo para pôr alguns na cova."

# Skill data - data/skill/slayer/master/turael.tables.toml

[.data_skill_slayer_master_turael_tables_1]
en = "Banshees use a piercing scream to shock their enemies, you'll need some Earmuffs to protect yourself from them."
pt = "Banshees usam um grito estridente para atordoar os inimigos; você vai precisar de protetores de ouvido (Earmuffs) para se proteger delas."

[.data_skill_slayer_master_turael_tables_2]
en = "Birds aren't the most intelligent of creatures, but watch out for their sharp, stabbing beaks. Even the chickens in Lumbridge are after your blood, so get them before they get you."
pt = "Pássaros (birds) não são as criaturas mais inteligentes, mas cuidado com os bicos afiados. Até as galinhas de Lumbridge querem o seu sangue, então pegue-as antes que elas peguem você."

[.data_skill_slayer_master_turael_tables_3]
en = "Cave Crawlers are small and fast, often hiding in ambush. Avoid their barbed tongue or you'll get poisoned."
pt = "Cave Crawlers são pequenos e rápidos, e muitas vezes ficam de tocaia. Evite a língua farpada deles ou você vai ficar envenenado."

[.data_skill_slayer_master_turael_tables_4]
en = "Cows are bigger than you, and they'll often hit hard but react fairly slowly. You can slaughter the ones in Lumbridge - I bet they are up to no good."
pt = "Vacas (cows) são maiores que você e costumam bater forte, mas reagem bem devagar. Pode abater as de Lumbridge - aposto que estão aprontando alguma."

[.data_skill_slayer_master_turael_tables_5]
en = "Crawling hands are undead severed hands; fast and dexterous, they claw their victims. They can be found in the Slayer Tower, north-east of the entrance to Morytania."
pt = "Crawling hands são mãos decepadas mortas-vivas; rápidas e ágeis, arranham as vítimas. Elas ficam na Slayer Tower, a nordeste da entrada de Morytania."

[.data_skill_slayer_master_turael_tables_6]
en = "Dogs are much like Wolves, they are pack creatures which will hunt in groups."
pt = "Cães (dogs) são bem parecidos com lobos: vivem em matilha e caçam em grupo."

[.data_skill_slayer_master_turael_tables_7]
en = "Dwarves are a small but tough race of miners, often using pickaxes to pierce their opponents armour."
pt = "Anões (dwarves) são uma raça pequena mas resistente de mineradores, que muitas vezes usam picaretas para furar a armadura dos oponentes."

[.data_skill_slayer_master_turael_tables_8]
en = "Goblins are mostly just annoying, but they can be vicious. Watch out for the spears they sometimes carry."
pt = "Goblins são mais irritantes que outra coisa, mas podem ser cruéis. Cuidado com as lanças que alguns carregam."

[.data_skill_slayer_master_turael_tables_9]
en = "Icefiends are beings of ice and freezing rock, they're quick and agile so you'll want to be careful when getting close to them."
pt = "Icefiends são seres de gelo e rocha congelada; são rápidos e ágeis, então tenha cuidado ao chegar perto deles."

[.data_skill_slayer_master_turael_tables_10]
en = "Lizards are large reptiles with tough skin. Those found in the desert will need you to douse them with freezing water to finish them off after a tough battle."
pt = "Lagartos (lizards) são répteis grandes de couro duro. Os do deserto precisam ser encharcados com água gelada para acabar com eles depois de uma luta dura."

[.data_skill_slayer_master_turael_tables_11]
en = "Minotaurs are large manlike creatures but you'll want to be careful of their horns."
pt = "Minotauros (minotaurs) são criaturas grandes parecidas com homens, mas tome cuidado com os chifres deles."

[.data_skill_slayer_master_turael_tables_12]
en = "Monkeys are tricky creatures, they are agile and fairly fast. Learn to anticipate their movements."
pt = "Macacos (monkeys) são criaturas espertas, ágeis e bem rápidas. Aprenda a prever os movimentos deles."

[.data_skill_slayer_master_turael_tables_13]
en = "Rats are your everyday pest, but they can get fairly big. Watch out for their sharp piercing teeth."
pt = "Ratos (rats) são a praga de todo dia, mas podem ficar bem grandes. Cuidado com os dentes afiados deles."

[.data_skill_slayer_master_turael_tables_14]
en = "Spiders are often poisonous, and many varieties are camouflaged too."
pt = "Aranhas (spiders) costumam ser venenosas, e muitas espécies também são camufladas."

[.data_skill_slayer_master_turael_tables_15]
en = "Wolves are pack animals, so you'll always find them in groups. Watch out for their bite, it can be nasty. There are plenty to kill on White Wolf Mountain."
pt = "Lobos (wolves) vivem em matilha, então você sempre vai encontrá-los em grupos. Cuidado com a mordida, ela pode ser feia. Há muitos para matar na White Wolf Mountain."

# Skill data - data/skill/slayer/master/vannaka.tables.toml

[.data_skill_slayer_master_vannaka_tables_1]
en = "Aberrant Spectres are fetid, vile ghosts. The very smell of them will paralyse and harm you. A nosepeg will help ignore their stink."
pt = "Aberrant Spectres são fantasmas fétidos e asquerosos. Só o cheiro deles já paralisa e machuca. Um prendedor de nariz (nosepeg) ajuda a ignorar o fedor."

[.data_skill_slayer_master_vannaka_tables_2]
en = "Ankou are undead skeletal ghosts. Their blows can be powerful but they have limited defences, so killing them quickly is often the best way to protect yourself."
pt = "Ankou são fantasmas esqueléticos mortos-vivos. Os golpes deles podem ser fortes, mas a defesa é fraca, então matá-los rápido costuma ser a melhor forma de se proteger."

[.data_skill_slayer_master_vannaka_tables_3]
en = "Basilisks, like Cockatrice, have a gaze which will paralyse and harm their prey. You'll need a Mirror Shield to protect you."
pt = "Basilisks, como os Cockatrice, têm um olhar que paralisa e machuca a presa. Você vai precisar de um escudo espelhado (Mirror Shield) para se proteger."

[.data_skill_slayer_master_vannaka_tables_4]
en = "Bloodveld are strange demonic creatures, their long rasping tongue has magical properties so it pierces straight through physical defences."
pt = "Bloodveld são criaturas demoníacas estranhas; a língua comprida e áspera deles tem poderes mágicos e atravessa direto as defesas físicas."

[.data_skill_slayer_master_vannaka_tables_5]
en = "Brine Rats can be found in caves that are near the sea. They are hairless, bad-tempered and generally unfriendly."
pt = "Brine Rats vivem em cavernas perto do mar. São pelados, mal-humorados e nada amigáveis."

[.data_skill_slayer_master_vannaka_tables_6]
en = "Black Dragons are the strongest dragons and very fierce, watch out for their fiery breath."
pt = "Black Dragons são os dragões mais fortes e muito ferozes; cuidado com o bafo de fogo deles."

[.data_skill_slayer_master_vannaka_tables_7]
en = "Cockatrice, like Basilisks, have a gaze which will paralyse and harm their prey. You'll need a Mirror Shield to protect you."
pt = "Cockatrice, como os Basilisks, têm um olhar que paralisa e machuca a presa. Você vai precisar de um escudo espelhado (Mirror Shield) para se proteger."

[.data_skill_slayer_master_vannaka_tables_8]
en = "Crocodiles are large reptiles which live near water. You'll want to have a stabbing weapon handy for puncturing their thick scaly hides."
pt = "Crocodiles são répteis grandes que vivem perto da água. É bom ter uma arma de estocada à mão para furar o couro grosso e escamoso deles."

[.data_skill_slayer_master_vannaka_tables_9]
en = "Dust Devils use clouds of dust, sand, ash, and whatever else they can inhale to blind and disorientate their victims. Make sure to wear a facemask when fighting them."
pt = "Dust Devils usam nuvens de poeira, areia, cinzas e tudo o mais que conseguirem aspirar para cegar e desorientar as vítimas. Use uma máscara (facemask) ao lutar com eles."

[.data_skill_slayer_master_vannaka_tables_10]
en = "Dagannoth are large sea dwelling creatures which are very aggressive. You'll often find them in caves near sea water."
pt = "Dagannoth são criaturas marinhas grandes e muito agressivas. Costumam ficar em cavernas perto da água do mar."

[.data_skill_slayer_master_vannaka_tables_11]
en = "Like other giants, Fire Giants have little to no magical ability, and they're particularly weak to water spells."
pt = "Como os outros gigantes, os Fire Giants têm pouca ou nenhuma habilidade mágica e são especialmente fracos contra feitiços de água."

[.data_skill_slayer_master_vannaka_tables_12]
en = "Fever Spiders are giant spiders that carry the deadly Spider Fever. If you don't want to catch it I suggest you wear Slayer Gloves to fight them."
pt = "Fever Spiders são aranhas gigantes que transmitem a mortal Febre da Aranha. Se não quiser pegá-la, sugiro usar luvas de Slayer (Slayer Gloves) para lutar com elas."

[.data_skill_slayer_master_vannaka_tables_13]
en = "Gargoyles are winged creatures of stone. You'll need to fight them to near death before breaking them apart with a Rock Hammer."
pt = "Gargoyles são criaturas aladas de pedra. Você precisa deixá-las quase mortas e depois quebrá-las com um martelo de pedra (Rock Hammer)."

[.data_skill_slayer_master_vannaka_tables_14]
en = "Ghouls aren't undead but they are stronger and tougher than they look. However they're also very cowardly and will run if they're losing a fight."
pt = "Ghouls não são mortos-vivos, mas são mais fortes e resistentes do que parecem. Por outro lado são muito covardes e fogem se estiverem perdendo a luta."

[.data_skill_slayer_master_vannaka_tables_15]
en = "Hill giants use crude weapons or tools so prepare accordingly. There is a colony of them, deep inside the Edgeville tunnels; all good folk will approve if you clean it out."
pt = "Hill giants usam armas e ferramentas rústicas, então se prepare. Há uma colônia deles no fundo dos túneis de Edgeville; toda gente de bem vai aprovar se você limpar o lugar."

[.data_skill_slayer_master_vannaka_tables_16]
en = "Hobgoblins are larger and stronger then their brethren. There is a peninsula, south-west of Falador, where these creatures have a hideout."
pt = "Hobgoblins são maiores e mais fortes que os primos goblins. Há uma península a sudoeste de Falador onde essas criaturas têm um esconderijo."

[.data_skill_slayer_master_vannaka_tables_17]
en = "Harpie Bug Swarms are pesky critters that are hard to hit. You need a lit bug lantern to distract them with its hypnotic light."
pt = "Harpie Bug Swarms são bichinhos chatos e difíceis de acertar. Você precisa de uma lanterna de insetos (bug lantern) acesa para distraí-los com a luz hipnótica."

[.data_skill_slayer_master_vannaka_tables_18]
en = "Infernal Mages are dangerous spell users, beware of their magic spells and go properly prepared."
pt = "Infernal Mages são feiticeiros perigosos; cuidado com os feitiços deles e vá bem preparado."

[.data_skill_slayer_master_vannaka_tables_19]
en = "Like other giants, ice giants often wield large weapons. Try using fire spells to melt them before they can hit you. Ice giants can be found underground to the south of Port Sarim."
pt = "Como os outros gigantes, os ice giants costumam usar armas grandes. Tente feitiços de fogo para derretê-los antes que acertem você. Há ice giants no subterrâneo ao sul de Port Sarim."

[.data_skill_slayer_master_vannaka_tables_20]
en = "Jellies are nasty cube-like gelatinous creatures which absorb everything they come across into themselves. Their magical acids bypass physical defences."
pt = "Jellies são criaturas gelatinosas nojentas em forma de cubo que absorvem tudo o que encontram. Os ácidos mágicos delas atravessam as defesas físicas."

[.data_skill_slayer_master_vannaka_tables_21]
en = "Jungle Horrors can be found all over Mos Le'Harmless. They are strong and aggressive, so watch out!"
pt = "Jungle Horrors estão por toda Mos Le'Harmless. São fortes e agressivos, então cuidado!"

[.data_skill_slayer_master_vannaka_tables_22]
en = "Kalphite are large insects that live in hives under the desert sands. You can best enter their hive south-west of Shantay Pass, but try not to go too deep."
pt = "Kalphite são insetos grandes que vivem em colmeias sob a areia do deserto. A melhor entrada da colmeia fica a sudoeste do Shantay Pass, mas não vá fundo demais."

[.data_skill_slayer_master_vannaka_tables_23]
en = "Kurask are large brutal creatures with very thick hides. You'll need a Leaf-Tipped Spear or Battle-axe, Broad Arrows, or a Magic Dart to harm it."
pt = "Kurask são criaturas grandes e brutais de couro muito grosso. Para feri-los você precisa de uma Leaf-Tipped Spear ou Battle-axe, Broad Arrows ou do feitiço Magic Dart."

[.data_skill_slayer_master_vannaka_tables_24]
en = "Demons are weak to magical attacks. Though Lesser Demons are relatively weak they are still dangerous."
pt = "Demônios são fracos contra ataques mágicos. Os Lesser Demons são relativamente fracos, mas ainda são perigosos."

[.data_skill_slayer_master_vannaka_tables_25]
en = "Like other giants, moss giants often wield large weapons. Use fire spells to burn them to cinders before they can damage you. Strangely for giants, some have been seen at the end of the Varrock sewers."
pt = "Como os outros gigantes, os moss giants costumam usar armas grandes. Use feitiços de fogo para reduzi-los a cinzas antes que eles machuquem você. Por estranho que pareça, alguns foram vistos no fim do esgoto de Varrock."

[.data_skill_slayer_master_vannaka_tables_26]
en = "Ogres are brutal creatures, favouring large blunt maces and clubs, they often attack without warning."
pt = "Ogres são criaturas brutais que preferem maças e porretes grandes e pesados; muitas vezes atacam sem aviso."

[.data_skill_slayer_master_vannaka_tables_27]
en = "Otherworldly Beings are ethereal beings making them weak to magical attack."
pt = "Otherworldly Beings são seres etéreos, por isso são fracos contra ataques mágicos."

[.data_skill_slayer_master_vannaka_tables_28]
en = "Pyrefiends are beings of fire and molten rock, they're quick and agile but weak to water spells."
pt = "Pyrefiends são seres de fogo e rocha derretida; são rápidos e ágeis, mas fracos contra feitiços de água."

[.data_skill_slayer_master_vannaka_tables_29]
en = "Shades are undead so magic is your best bet against them. You can find Shades at Mort'ton."
pt = "Shades são mortos-vivos, então magia é sua melhor aposta contra eles. Você encontra Shades em Mort'ton."

[.data_skill_slayer_master_vannaka_tables_30]
en = "Shadow Warriors are dark and mysterious. They wear spectral plate armour, so crush weapons and magic will give them trouble."
pt = "Shadow Warriors são sombrios e misteriosos. Usam armadura de placas espectral, então armas de esmagamento (crush) e magia vão dar trabalho a eles."

[.data_skill_slayer_master_vannaka_tables_31]
en = "Turoth are large vicious creatures with thick hides. You'll need a Leaf-Tipped Spear or Sword, Broad Arrows, or a Magic Dart to harm them."
pt = "Turoth são criaturas grandes e cruéis de couro grosso. Para feri-los você precisa de uma Leaf-Tipped Spear ou Sword, Broad Arrows ou do feitiço Magic Dart."

[.data_skill_slayer_master_vannaka_tables_32]
en = "Trolls regenerate damage quickly and have some level of magical defences, but this is easily bypassed by their weakness to fire."
pt = "Trolls se regeneram rápido e têm alguma defesa mágica, mas ela é fácil de vencer pela fraqueza deles ao fogo."

[.data_skill_slayer_master_vannaka_tables_33]
en = "Werewolves are feral creatures, they are strong and tough with sharp claws and teeth."
pt = "Werewolves são criaturas selvagens, fortes e resistentes, com garras e dentes afiados."

