# Skills - summoning/familiar/AlbinoRat.kt

[.skill_summoning_familiar_albinorat_1]
en = "Hey boss, we going to do anything wicked today?"
pt = "E aí, chefe, vamo aprontar alguma maldade hoje?"

[.skill_summoning_familiar_albinorat_2]
en = "Well, I don't know why we would: I tend not to go around being wicked."
pt = "Bem, não sei por que faríamos isso: não costumo sair por aí fazendo maldade."

[.skill_summoning_familiar_albinorat_3]
en = "Not even a little?"
pt = "Nem um pouquinho?"

[.skill_summoning_familiar_albinorat_4]
en = "Well there was that one time... I'm sorry, no wickedness today."
pt = "Bem, teve aquela vez... Desculpe, nada de maldade hoje."

[.skill_summoning_familiar_albinorat_5]
en = "Awwwwww..."
pt = "Aaaaaah..."

[.skill_summoning_familiar_albinorat_6]
en = "Hey boss, can we go and loot something now?"
pt = "E aí, chefe, bora saquear alguma coisa agora?"

[.skill_summoning_familiar_albinorat_7]
en = "Well, what did you have in mind?"
pt = "Bem, o que você tinha em mente?"

[.skill_summoning_familiar_albinorat_8]
en = "I dunno - where are we headed?"
pt = "Sei lá - pra onde a gente tá indo?"

[.skill_summoning_familiar_albinorat_9]
en = "I hadn't decided yet."
pt = "Ainda não decidi."

[.skill_summoning_familiar_albinorat_10]
en = "When we get there, let's loot something nearby!"
pt = "Quando a gente chegar, bora saquear alguma coisa por perto!"

[.skill_summoning_familiar_albinorat_11]
en = "Sounds like a plan, certainly."
pt = "Parece um plano, sem dúvida."

[.skill_summoning_familiar_albinorat_12]
en = "So what we up to today, boss?"
pt = "E então, qual é a boa de hoje, chefe?"

[.skill_summoning_familiar_albinorat_13]
en = "Oh I'm sure we'll find something to occupy our time."
pt = "Ah, tenho certeza de que vamos achar algo para fazer."

[.skill_summoning_familiar_albinorat_14]
en = "Let's go robbin' graves again!"
pt = "Bora roubar túmulo de novo!"

[.skill_summoning_familiar_albinorat_15]
en = "What do you mean 'again'?"
pt = "Como assim 'de novo'?"

[.skill_summoning_familiar_albinorat_16]
en = "Nuffin'..."
pt = "Nada não..."

[.skill_summoning_familiar_albinorat_17]
en = "You know, boss, I don't think you're totally into this whole 'evil' thing."
pt = "Sabe, chefe, acho que você não curte muito esse lance de 'ser do mal'."

[.skill_summoning_familiar_albinorat_18]
en = "I wonder what gave you that impression?"
pt = "O que será que te deu essa impressão?"

[.skill_summoning_familiar_albinorat_19]
en = "Well, I worked with a lot of evil people; some of the best."
pt = "Bom, já trabalhei com muita gente do mal; dos melhores."

[.skill_summoning_familiar_albinorat_20]
en = "Such as?"
pt = "Como o quê?"

[.skill_summoning_familiar_albinorat_21]
en = "I'm not telling! I've got my principles to uphold."
pt = "Não vou contar! Tenho os meus princípios."

[.skill_summoning_familiar_albinorat_22]
en = "There is honour amongst thieves, it would seem."
pt = "Parece que existe honra entre ladrões."

# Skills - summoning/familiar/ArcticBear.kt

[.skill_summoning_familiar_arcticbear_1]
en = "Crikey! We're tracking ourselves a real live one here. I call 'em 'Brighteyes'."
pt = "Caramba! Estamos rastreando um exemplar bem vivo aqui. Eu chamo de 'Olhos-Brilhantes'."

[.skill_summoning_familiar_arcticbear_2]
en = "Will you stop stalking me like that?"
pt = "Dá para parar de me perseguir desse jeito?"

[.skill_summoning_familiar_arcticbear_3]
en = "Lookit that! Something's riled this one up good and proper."
pt = "Olha só isso! Alguma coisa deixou este aqui bem nervosinho."

[.skill_summoning_familiar_arcticbear_4]
en = "Who are you talking to anyway?"
pt = "Afinal, com quem você está falando?"

[.skill_summoning_familiar_arcticbear_5]
en = "Looks like I've been spotted."
pt = "Parece que fui avistado."

[.skill_summoning_familiar_arcticbear_6]
en = "Did you think you didn't stand out here or something?"
pt = "Você achou que não ia chamar atenção aqui, é?"

[.skill_summoning_familiar_arcticbear_7]
en = "Crikey! Something seems to have startled Brighteyes, here."
pt = "Caramba! Parece que algo assustou o Olhos-Brilhantes aqui."

[.skill_summoning_familiar_arcticbear_8]
en = "What? What's happening?"
pt = "O quê? O que está acontecendo?"

[.skill_summoning_familiar_arcticbear_9]
en = "Maybe he's scented a rival."
pt = "Talvez ele tenha farejado um rival."

[.skill_summoning_familiar_arcticbear_10]
en = "I smell something, but it's not a rival."
pt = "Estou sentindo um cheiro, mas não é de rival."

[.skill_summoning_familiar_arcticbear_11]
en = "We're tracking Brighteyes here as he goes about his daily routine."
pt = "Estamos acompanhando o Olhos-Brilhantes aqui em sua rotina diária."

[.skill_summoning_familiar_arcticbear_12]
en = "My name is %1%, not Brighteyes!"
pt = "Meu nome é %1%, não Olhos-Brilhantes!"

[.skill_summoning_familiar_arcticbear_13]
en = "Looks like the little critter's upset about something."
pt = "Parece que o bichinho está chateado com alguma coisa."

[.skill_summoning_familiar_arcticbear_14]
en = "I wonder if he'd be quiet if I just did really boring stuff."
pt = "Será que ele fica quieto se eu só fizer coisas bem chatas?"

[.skill_summoning_familiar_arcticbear_15]
en = "These little guys get riled up real easy."
pt = "Esses bichinhos ficam nervosos à toa."

[.skill_summoning_familiar_arcticbear_16]
en = "Who wouldn't be upset with a huge bear tracking along behind them, commenting on everything they do?"
pt = "Quem não ficaria chateado com um urso enorme na sua cola, comentando tudo o que você faz?"

# Skills - summoning/familiar/BarkerToad.kt

[.skill_summoning_familiar_barkertoad_1]
en = "Your toad is already loaded."
pt = "O seu sapo já está carregado."

[.skill_summoning_familiar_barkertoad_2]
en = "You load the cannonball into the toad's gaping mouth."
pt = "Você põe a bala de canhão (cannonball) na bocarra aberta do sapo."

[.skill_summoning_familiar_barkertoad_3]
en = "Bwaaarp graaaawk? (What's that croaking in your inventory?)"
pt = "Bwaaarp graaaawk? (Que coaxar é esse no seu inventário?)"

[.skill_summoning_familiar_barkertoad_4]
en = "Ah, you mean that toad?"
pt = "Ah, você está falando deste sapo?"

[.skill_summoning_familiar_barkertoad_5]
en = "Oh, I'm guessing you're not going to like me carrying a toad about."
pt = "Ah, imagino que você não vá gostar de me ver carregando um sapo por aí."

[.skill_summoning_familiar_barkertoad_6]
en = "Craaawk, croak. (I might not be all that happy, no.)"
pt = "Craaawk, croak. (Talvez eu não fique lá muito feliz, não.)"

[.skill_summoning_familiar_barkertoad_7]
en = "I'm not going to eat it."
pt = "Não vou comer ele, tá?"

[.skill_summoning_familiar_barkertoad_8]
en = "Craaaaawk braaap croak. (Weeeeell, I'd hope not! Reminds me of my mama toad. She was inflated and fed to a jubbly, you know. A sad, demeaning way to die.)"
pt = "Craaaaawk braaap croak. (Beeeeem, espero que não! Me lembra a mamãe sapo. Ela foi inflada e servida de comida a um jubbly, sabia? Um jeito triste e humilhante de morrer.)"

[.skill_summoning_familiar_barkertoad_9]
en = "Ladies and gentlemen, for my next trick, I shall swallow this fly!"
pt = "Senhoras e senhores, no meu próximo número, vou engolir esta mosca!"

[.skill_summoning_familiar_barkertoad_10]
en = "Seen it."
pt = "Já vi."

[.skill_summoning_familiar_barkertoad_11]
en = "Ah, but last time was the frog...on fire?"
pt = "Ah, mas da última vez o sapo estava...pegando fogo?"

[.skill_summoning_familiar_barkertoad_12]
en = "No! That would be a good trick."
pt = "Não! Isso sim seria um bom número."

[.skill_summoning_familiar_barkertoad_13]
en = "Well, it won't be this time either."
pt = "Bem, desta vez também não vai estar."

[.skill_summoning_familiar_barkertoad_14]
en = "Awwwww..."
pt = "Aaaaaah..."

[.skill_summoning_familiar_barkertoad_15]
en = "Roll up, roll up, roll up! See the greatest show on Gielinor!"
pt = "Venham, venham, venham! Vejam o maior espetáculo de Gielinor!"

[.skill_summoning_familiar_barkertoad_16]
en = "Well, it's kind of...you."
pt = "Bem, é meio que...você."

[.skill_summoning_familiar_barkertoad_17]
en = "Me?"
pt = "Eu?"

[.skill_summoning_familiar_barkertoad_18]
en = "Roll up, roll up, roll up! See the greatest freakshow on Gielinor!"
pt = "Venham, venham, venham! Vejam o maior show de aberrações de Gielinor!"

[.skill_summoning_familiar_barkertoad_19]
en = "Don't make me smack you, slimy."
pt = "Não me faça te dar um tapa, gosmento."

[.skill_summoning_familiar_barkertoad_20]
en = "We need to set up the big top somewhere near here. The locals look friendly enough."
pt = "Precisamos armar a lona do circo aqui por perto. O povo daqui parece bem simpático."

[.skill_summoning_familiar_barkertoad_21]
en = "Are you kidding?"
pt = "Tá de brincadeira?"

[.skill_summoning_familiar_barkertoad_22]
en = "Your problem is that you never see opportunities."
pt = "Seu problema é que você nunca enxerga as oportunidades."

[.skill_summoning_familiar_barkertoad_23]
en = "Braaaaaaaaaaaaaaaaaaaaaaap! (*Burp!*)"
pt = "Braaaaaaaaaaaaaaaaaaaaaaap! (*Burp!*)"

[.skill_summoning_familiar_barkertoad_24]
en = "That's disgusting behaviour!"
pt = "Que comportamento nojento!"

[.skill_summoning_familiar_barkertoad_25]
en = "Braap craaaaawk craaaawk. (That, my dear boy, was my world-renowned belching.)"
pt = "Braap craaaaawk craaaawk. (Isso, meu caro rapaz, foi o meu arroto mundialmente famoso.)"

[.skill_summoning_familiar_barkertoad_26]
en = "I got that part. Why are you so happy about it?"
pt = "Essa parte eu entendi. Por que você está tão feliz com isso?"

[.skill_summoning_familiar_barkertoad_27]
en = "Braaaaaaap craaaaaawk craaaaaaaawk. (My displays have bedazzled the crowned heads of Gielinor.)"
pt = "Braaaaaaap craaaaaawk craaaaaaaawk. (Minhas apresentações deslumbraram as cabeças coroadas de Gielinor.)"

[.skill_summoning_familiar_barkertoad_28]
en = "I'd give you a standing ovation, but I have my hands full."
pt = "Eu te aplaudiria de pé, mas estou com as mãos ocupadas."

# Skills - summoning/familiar/Beaver.kt

[.skill_summoning_familiar_beaver_1]
en = "Your beaver can only chop naturally growing trees."
pt = "O seu castor (beaver) só corta árvores que cresceram naturalmente."

[.skill_summoning_familiar_beaver_2]
en = "Your beaver's pack is too full to store any more logs."
pt = "A bolsa do seu castor está cheia demais para guardar mais toras."

[.skill_summoning_familiar_beaver_3]
en = "Your beaver chops the tree and stashes some %1% in its pack."
pt = "O seu castor corta a árvore e guarda na bolsa: %1%."

[.skill_summoning_familiar_beaver_4]
en = "'Ere, you 'ave ze logs, now form zem into a mighty dam!"
pt = "Voilà, você tem as torrras (logs)! Agorra faça com elas uma barrragem magnifique!"

[.skill_summoning_familiar_beaver_5]
en = "Well, I was thinking of burning, selling, or fletching them."
pt = "Bem, eu estava pensando em queimar, vender ou fazer arcos com elas."

[.skill_summoning_familiar_beaver_6]
en = "Sacre bleu! Such a waste."
pt = "Sacre bleu! Que desperrdício."

[.skill_summoning_familiar_beaver_7]
en = "Vot are you doing 'ere when we could be logging and building mighty dams, alors?"
pt = "O que faz aqui, quando podíamos estarr cortando torrras e construindo barrragens poderrosas, alors?"

[.skill_summoning_familiar_beaver_8]
en = "Why would I want to build a dam again?"
pt = "Por que mesmo eu ia querer construir uma barragem?"

[.skill_summoning_familiar_beaver_9]
en = "Why vouldn't you want to build a dam again?"
pt = "E porr que você não ia querrer construirr uma barrragem, hein?"

[.skill_summoning_familiar_beaver_10]
en = "I can't argue with that logic."
pt = "Contra essa lógica eu não tenho argumento."

[.skill_summoning_familiar_beaver_11]
en = "Pardonnez-moi - you call yourself a lumberjack?"
pt = "Pardonnez-moi - você se diz um lenhadorr?"

[.skill_summoning_familiar_beaver_12]
en = "Carry on zen."
pt = "Alors, pode continuarr."

[.skill_summoning_familiar_beaver_13]
en = "Paul Bunyan 'as nothing on moi!"
pt = "Paul Bunyan não é nada perrto de moi!"

[.skill_summoning_familiar_beaver_14]
en = "Except several feet in height, a better beard, and opposable thumbs."
pt = "Tirando uns bons palmos de altura, uma barba melhor e polegares opositores."

[.skill_summoning_familiar_beaver_15]
en = "What was zat?"
pt = "Comment? O que foi que você disse?"

[.skill_summoning_familiar_beaver_16]
en = "Nothing."
pt = "Nada."

[.skill_summoning_familiar_beaver_17]
en = "Zis is a fine day make some lumber."
pt = "É um belo dia parra cortarr madeirra."

[.skill_summoning_familiar_beaver_18]
en = "That it is!"
pt = "Lá isso é!"

[.skill_summoning_familiar_beaver_19]
en = "So why are you talking to moi? Get chopping!"
pt = "Então porr que está falando com moi? Vá cortarr!"

# Skills - summoning/familiar/BloatedLeech.kt

[.skill_summoning_familiar_bloatedleech_1]
en = "I'm afraid it's going to have to come off, %1%."
pt = "Receio que vamos ter que amputar, %1%."

[.skill_summoning_familiar_bloatedleech_2]
en = "What is?"
pt = "Amputar o quê?"

[.skill_summoning_familiar_bloatedleech_3]
en = "Never mind. Trust me, I'm almost a doctor."
pt = "Deixa pra lá. Confie em mim, eu sou quase médico."

[.skill_summoning_familiar_bloatedleech_4]
en = "I think I'll get a second opinion."
pt = "Acho que vou pedir uma segunda opinião."

[.skill_summoning_familiar_bloatedleech_5]
en = "You're in a critical condition."
pt = "Seu estado é crítico."

[.skill_summoning_familiar_bloatedleech_6]
en = "Is it terminal?"
pt = "É terminal?"

[.skill_summoning_familiar_bloatedleech_7]
en = "Not yet. Let me get a better look and I'll see what I can do about it."
pt = "Ainda não. Deixa eu dar uma olhada melhor e ver o que posso fazer a respeito."

[.skill_summoning_familiar_bloatedleech_8]
en = "There are two ways to take that...and I think I'll err on the side of caution."
pt = "Dá para entender isso de dois jeitos... e acho melhor pecar pelo excesso de cuidado."

[.skill_summoning_familiar_bloatedleech_9]
en = "Let's get a look at that brain of yours."
pt = "Vamos dar uma olhada nesse seu cérebro."

[.skill_summoning_familiar_bloatedleech_10]
en = "What? My brains stay inside my head, thanks."
pt = "O quê? Meu cérebro fica dentro da cabeça, obrigado."

[.skill_summoning_familiar_bloatedleech_11]
en = "That's ok, I can just drill a hole."
pt = "Tudo bem, é só eu fazer um furo."

[.skill_summoning_familiar_bloatedleech_12]
en = "How about you don't and pretend you did?"
pt = "Que tal você não fazer e fingir que fez?"

[.skill_summoning_familiar_bloatedleech_13]
en = "I think we're going to need to operate."
pt = "Acho que vamos precisar operar."

[.skill_summoning_familiar_bloatedleech_14]
en = "I think we can skip that for now."
pt = "Acho que dá para pular essa parte por enquanto."

[.skill_summoning_familiar_bloatedleech_15]
en = "Who's the doctor here?"
pt = "Quem é o médico aqui?"

[.skill_summoning_familiar_bloatedleech_16]
en = "Not you."
pt = "Você é que não."

[.skill_summoning_familiar_bloatedleech_17]
en = "I may not be a doctor, but I'm keen. Does that not count?"
pt = "Posso não ser médico, mas tenho muita vontade. Isso não conta?"

[.skill_summoning_familiar_bloatedleech_18]
en = "In most other fields, yes; in medicine, no."
pt = "Na maioria das áreas, sim; na medicina, não."

# Skills - summoning/familiar/Bloodrager.kt

[.skill_summoning_familiar_bloodrager_1]
en = "Brother, you are always welcome to talk with me."
pt = "Irmão, você é sempre bem-vindo para conversar comigo."

[.skill_summoning_familiar_bloodrager_2]
en = "Are all gorajo as cheery as you?"
pt = "Todos os gorajo são animados como você?"

[.skill_summoning_familiar_bloodrager_3]
en = "Come to the gorajo plane and find out, brother! In the clan fringes, you will find bloodragers, and there are none more welcoming. You would be treated like a sachem."
pt = "Venha ao plano dos gorajo e descubra, irmão! Nas bordas do clã você vai achar bloodragers, e ninguém é mais acolhedor. Você seria tratado como um sachem."

[.skill_summoning_familiar_bloodrager_4]
en = "I would love to! Are the other gorajo as friendly?"
pt = "Eu adoraria! Os outros gorajo são tão simpáticos assim?"

[.skill_summoning_familiar_bloodrager_5]
en = "Their lives are more complicated, brother. They must bear burdens, teach, guide and lead. Although we must protect the clan and serve Challem, we have nothing else to cloud our minds."
pt = "A vida deles é mais complicada, irmão. Precisam carregar fardos, ensinar, guiar e liderar. Embora devamos proteger o clã e servir a Challem, nada mais nos ocupa a mente."

[.skill_summoning_familiar_bloodrager_6]
en = "Well, I'll hold you to that invite. If we ever get out of here, of course."
pt = "Bom, vou cobrar esse convite. Se a gente sair daqui algum dia, claro."

[.skill_summoning_familiar_bloodrager_7]
en = "How do you like it in Daemonheim?"
pt = "O que você acha de Daemonheim?"

[.skill_summoning_familiar_bloodrager_8]
en = "It is a place, as any other. I am just happy to be alive, taking sharp rukhs full of air-"
pt = "É um lugar como outro qualquer. Só estou feliz por estar vivo, tomando rukhs bem cheios de ar-"

[.skill_summoning_familiar_bloodrager_9]
en = "Im not sure I have a rukh."
pt = "Não sei se eu tenho um rukh."

[.skill_summoning_familiar_bloodrager_10]
en = "Sure you do! Or how else would you grebbit? I am just happy to be alive, breathing the air and completing the task that has been asked of me. Challem be praised."
pt = "Claro que tem! Senão, como você ia grebbit? Só estou feliz por estar vivo, respirando o ar e cumprindo a tarefa que me pediram. Louvado seja Challem."

[.skill_summoning_familiar_bloodrager_11]
en = "I don't have any more questions."
pt = "Não tenho mais perguntas."

[.skill_summoning_familiar_bloodrager_12]
en = "Shame. I feel that we are pollen on the same wind, friend."
pt = "Que pena. Sinto que somos pólen no mesmo vento, amigo."

# Skills - summoning/familiar/BullAnt.kt

[.skill_summoning_familiar_bullant_1]
en = "What's the matter, Private? Not enjoying the run?"
pt = "Qual é o problema, Recruta? Não está gostando da corrida?"

[.skill_summoning_familiar_bullant_2]
en = "Sir...wheeze...yes Sir!"
pt = "Senhor... arf... sim, Senhor!"

[.skill_summoning_familiar_bullant_3]
en = "Not enjoying the run? You need more training biped?"
pt = "Não está gostando da corrida? Precisa de mais treino, bípede?"

[.skill_summoning_familiar_bullant_4]
en = "Sir, no Sir! Sir, I'm enjoying the run a great deal, Sir!"
pt = "Senhor, não, Senhor! Senhor, estou adorando a corrida, Senhor!"

[.skill_summoning_familiar_bullant_5]
en = "Then hop to, Private!"
pt = "Então mexa-se, Recruta!"

[.skill_summoning_familiar_bullant_6]
en = "Sir, yes Sir!"
pt = "Senhor, sim, Senhor!"

[.skill_summoning_familiar_bullant_7]
en = "All right you worthless biped, fall in!"
pt = "Muito bem, seu bípede inútil, em forma!"

[.skill_summoning_familiar_bullant_8]
en = "We're going to work you so hard your boots fall off, understood?"
pt = "Vamos te fazer trabalhar tanto que as suas botas vão cair, entendido?"

[.skill_summoning_familiar_bullant_9]
en = "Carry on Private!"
pt = "Prossiga, Recruta!"

[.skill_summoning_familiar_bullant_10]
en = "Aten...hut!"
pt = "Sen...tido!"

[.skill_summoning_familiar_bullant_11]
en = "Sir, Private Player reporting for immediate active duty, Sir!"
pt = "Senhor, Recruta Player se apresentando para o serviço ativo imediato, Senhor!"

[.skill_summoning_familiar_bullant_12]
en = "As you were, Private!"
pt = "À vontade, Recruta!"

[.skill_summoning_familiar_bullant_13]
en = "I can't believe they stuck me with you..."
pt = "Não acredito que me empurraram você..."

[.skill_summoning_familiar_bullant_14]
en = "Buck up, Sir, it's not that bad."
pt = "Ânimo, Senhor, não é tão ruim assim."

[.skill_summoning_familiar_bullant_15]
en = "Stow that, Private, and get back to work!"
pt = "Corta essa, Recruta, e volte ao trabalho!"

[.skill_summoning_familiar_bullant_16]
en = "What in the name of all the layers of the abyss do you think you're doing, biped?"
pt = "Em nome de todas as camadas do abismo, o que você pensa que está fazendo, bípede?"

[.skill_summoning_familiar_bullant_17]
en = "Sir, nothing Sir!"
pt = "Senhor, nada, Senhor!"

[.skill_summoning_familiar_bullant_18]
en = "Well double-time it, Private, whatever it is!"
pt = "Então faça em passo acelerado, Recruta, seja lá o que for!"

# Skills - summoning/familiar/Bunyip.kt

[.skill_summoning_familiar_bunyip_1]
en = "To cast Swallow Whole, use the Cast option on a raw fish."
pt = "Para lançar Swallow Whole, use a opção 'Cast' num peixe cru."

[.skill_summoning_familiar_bunyip_2]
en = "Your bunyip only transmutes raw fish."
pt = "O seu bunyip só transmuta peixe cru."

[.skill_summoning_familiar_bunyip_3]
en = "Your bunyip transmutes the %1% into some water runes."
pt = "O seu bunyip transmuta em runas de água (water runes): %1%."

[.skill_summoning_familiar_bunyip_4]
en = "I see you've got some fish there, mate."
pt = "Tô vendo que você tem uns peixes aí, brother."

[.skill_summoning_familiar_bunyip_5]
en = "Yeah, but I might cook them up before I give them to you!"
pt = "É, mas talvez eu cozinhe antes de dar pra você!"

[.skill_summoning_familiar_bunyip_6]
en = "Humans...always ruining good fishes."
pt = "Humanos... sempre estragando um peixe bom."

[.skill_summoning_familiar_bunyip_7]
en = "You know, some people prefer them cooked."
pt = "Sabe, tem gente que prefere cozido."

[.skill_summoning_familiar_bunyip_8]
en = "Yeah. We call 'em freaks."
pt = "É. A gente chama esses de esquisitões."

[.skill_summoning_familiar_bunyip_9]
en = "Where are we going and why is it not to the beach?"
pt = "Pra onde a gente vai e por que não é pra praia?"

[.skill_summoning_familiar_bunyip_10]
en = "Well, we have a fair few places to go, but I suppose we could go to the beach if we get time."
pt = "Bom, temos uns bons lugares pra ir, mas acho que dá pra ir à praia se sobrar tempo."

[.skill_summoning_familiar_bunyip_11]
en = "Bonza! I'll get my board ready!"
pt = "Irado! Vou preparar minha prancha!"

[.skill_summoning_familiar_bunyip_12]
en = "Well, even if we do go to the beach I don't know if we'll have time for that."
pt = "Bom, mesmo se a gente for à praia, não sei se vai dar tempo pra isso."

[.skill_summoning_familiar_bunyip_13]
en = "Awww, that's a drag..."
pt = "Aaah, que vacilo..."

[.skill_summoning_familiar_bunyip_14]
en = "Hey Bruce, can we go down to the beach t'day?"
pt = "E aí, Bruce, bora descer pra praia hoje?"

[.skill_summoning_familiar_bunyip_15]
en = "Well, I have a lot of things to do today but maybe later."
pt = "Bom, tenho muita coisa pra fazer hoje, mas talvez mais tarde."

[.skill_summoning_familiar_bunyip_16]
en = "Bonza!"
pt = "Irado!"

[.skill_summoning_familiar_bunyip_17]
en = "Pass me another bunch of shrimps, mate!"
pt = "Me passa mais um punhado de camarões, brother!"

[.skill_summoning_familiar_bunyip_18]
en = "I don't know if I want any more water runes."
pt = "Não sei se eu quero mais runas de água."

[.skill_summoning_familiar_bunyip_19]
en = "Righty, but I do know that I want some shrimps!"
pt = "Beleza, mas eu sei que eu quero camarões!"

[.skill_summoning_familiar_bunyip_20]
en = "A fair point."
pt = "Justo."

[.skill_summoning_familiar_bunyip_21]
en = "Sigh..."
pt = "Suspiro..."

[.skill_summoning_familiar_bunyip_22]
en = "I'm dryin' out in this sun, mate."
pt = "Tô secando nesse sol, brother."

[.skill_summoning_familiar_bunyip_23]
en = "Well, what can I do to help?"
pt = "Bom, como eu posso ajudar?"

[.skill_summoning_familiar_bunyip_24]
en = "Well, fish oil is bonza for the skin, ya know."
pt = "Olha, óleo de peixe é irado pra pele, sabia?"

[.skill_summoning_familiar_bunyip_25]
en = "Oh, right, I think I see where this is going."
pt = "Ah, tá, acho que já entendi onde isso vai dar."

[.skill_summoning_familiar_bunyip_26]
en = "Your bunyip only swallows raw fish."
pt = "O seu bunyip só engole peixe cru."

[.skill_summoning_familiar_bunyip_27]
en = "Your bunyip swallows the %1% whole, and you feel reinvigorated."
pt = "O seu bunyip engole inteiro: %1%. Você se sente revigorado."

# Skills - summoning/familiar/Clay.kt

[.skill_summoning_familiar_clay_1]
en = "How are you getting on with the load?"
pt = "Como está indo com a carga?"

[.skill_summoning_familiar_clay_2]
en = "Rumble. (Just fine, master.)"
pt = "Rumble. (Tudo bem, mestre.)"

[.skill_summoning_familiar_clay_3]
en = "Don't go dropping it, okay?"
pt = "Não vá derrubar, hein?"

[.skill_summoning_familiar_clay_4]
en = "Rumble. (I'll try my very best, master.)"
pt = "Rumble. (Farei o meu melhor, mestre.)"

[.skill_summoning_familiar_clay_5]
en = "What is it like to be made out of sacred clay?"
pt = "Como é ser feito de argila sagrada?"

[.skill_summoning_familiar_clay_6]
en = "Rumble... (I do not understand the question...)"
pt = "Rumble... (Não compreendo a pergunta...)"

[.skill_summoning_familiar_clay_7]
en = "Can you at least tell me how you feel?"
pt = "Pode pelo menos me dizer como você se sente?"

[.skill_summoning_familiar_clay_8]
en = "Rumble! (I am happy as long as I can serve you, master!)"
pt = "Rumble! (Sou feliz enquanto puder servi-lo, mestre!)"

[.skill_summoning_familiar_clay_9]
en = "They're attacking!"
pt = "Eles estão atacando!"

[.skill_summoning_familiar_clay_10]
en = "Rumble! (Fear not, master, for I'll protect you!)"
pt = "Rumble! (Não tema, mestre, pois eu o protegerei!)"

[.skill_summoning_familiar_clay_11]
en = "I'm glad you're here!"
pt = "Que bom que você está aqui!"

[.skill_summoning_familiar_clay_12]
en = "Hey!"
pt = "Ei!"

[.skill_summoning_familiar_clay_13]
en = "Rumble? (Yes, master?)"
pt = "Rumble? (Sim, mestre?)"

[.skill_summoning_familiar_clay_14]
en = "Actually, I probably don't want to be talking to you. It's kind of dangerous here..."
pt = "Na verdade, acho melhor não ficar conversando com você. Aqui é meio perigoso..."

[.skill_summoning_familiar_clay_15]
en = "Rumble... (As You wish...)"
pt = "Rumble... (Como desejar...)"

# Skills - summoning/familiar/Cockatrice.kt

[.skill_summoning_familiar_cockatrice_1]
en = "You know, I'm sensing some trust issues here."
pt = "Sabe, estou sentindo uma certa falta de confiança aqui."

[.skill_summoning_familiar_cockatrice_2]
en = "I'm not sure I know what you are talking about."
pt = "Não sei bem do que você está falando."

[.skill_summoning_familiar_cockatrice_3]
en = "What are you holding?"
pt = "O que é isso na sua mão?"

[.skill_summoning_familiar_cockatrice_4]
en = "A mirror shield."
pt = "Um escudo espelhado (mirror shield)."

[.skill_summoning_familiar_cockatrice_5]
en = "And what do those do?"
pt = "E isso serve para quê?"

[.skill_summoning_familiar_cockatrice_6]
en = "Mumblemumble..."
pt = "Resmungo-resmungo..."

[.skill_summoning_familiar_cockatrice_7]
en = "What was that?"
pt = "O que foi isso?"

[.skill_summoning_familiar_cockatrice_8]
en = "It protects me from your gaze attack."
pt = "Ele me protege do seu ataque de olhar."

[.skill_summoning_familiar_cockatrice_9]
en = "See! Why would you need one unless you didn't trust me?"
pt = "Viu só! Para que você precisaria de um, se confiasse em mim?"

[.skill_summoning_familiar_cockatrice_10]
en = "Who keeps demanding that we stop and have staring contests?"
pt = "E quem vive exigindo que a gente pare para brincar de quem pisca primeiro?"

[.skill_summoning_familiar_cockatrice_11]
en = "How about we drop this and call it even?"
pt = "Que tal a gente esquecer isso e ficar elas por elas?"

[.skill_summoning_familiar_cockatrice_12]
en = "Fine by me."
pt = "Por mim, tudo bem."

[.skill_summoning_familiar_cockatrice_13]
en = "Is this what you do for fun?"
pt = "É isso que você faz para se divertir?"

[.skill_summoning_familiar_cockatrice_14]
en = "Sometimes. Why, what do you do for fun?"
pt = "Às vezes. Por quê, o que você faz para se divertir?"

[.skill_summoning_familiar_cockatrice_15]
en = "I find things and glare at them until they die!"
pt = "Eu acho umas coisas e encaro até elas morrerem!"

[.skill_summoning_familiar_cockatrice_16]
en = "Well...everyone needs a hobby, I suppose."
pt = "Bom... todo mundo precisa de um passatempo, eu acho."

[.skill_summoning_familiar_cockatrice_17]
en = "You know, I think I might train as a hypnotist."
pt = "Sabe, acho que vou estudar para ser hipnotizador."

[.skill_summoning_familiar_cockatrice_18]
en = "Isn't that an odd profession for a cockatrice?"
pt = "Não é uma profissão estranha para uma cockatrice?"

[.skill_summoning_familiar_cockatrice_19]
en = "Not at all! I've already been practicing!"
pt = "Nem um pouco! Eu já ando praticando!"

[.skill_summoning_familiar_cockatrice_20]
en = "Oh, really? How is that going?"
pt = "Ah, é? E como está indo?"

[.skill_summoning_familiar_cockatrice_21]
en = "Not good. I tell them to look in my eyes and that they are feeling sleepy."
pt = "Mal. Eu digo para olharem nos meus olhos e que estão ficando com sono."

[.skill_summoning_familiar_cockatrice_22]
en = "I think I can see where this is headed."
pt = "Acho que já sei aonde isso vai dar."

[.skill_summoning_familiar_cockatrice_23]
en = "And then they just lie there and stop moving."
pt = "E aí eles simplesmente deitam e param de se mexer."

[.skill_summoning_familiar_cockatrice_24]
en = "I hate being right sometimes."
pt = "Às vezes eu odeio ter razão."

[.skill_summoning_familiar_cockatrice_25]
en = "Come on, lets have a staring contest!"
pt = "Anda, vamos brincar de quem pisca primeiro!"

[.skill_summoning_familiar_cockatrice_26]
en = "You win!"
pt = "Você ganhou!"

[.skill_summoning_familiar_cockatrice_27]
en = "Yay! I win again!"
pt = "Oba! Ganhei de novo!"

[.skill_summoning_familiar_cockatrice_28]
en = "Oh, it's no contest alright."
pt = "Pois é, disputa mesmo isso não é."

[.skill_summoning_familiar_cockatrice_29]
en = "You know, sometimes I don't think we're good friends."
pt = "Sabe, às vezes acho que não somos bons amigos."

[.skill_summoning_familiar_cockatrice_30]
en = "Well, you never make eye contact with me for a start."
pt = "Bom, para começar, você nunca me olha nos olhos."

[.skill_summoning_familiar_cockatrice_31]
en = "What happened the last time someone made eye contact with you?"
pt = "O que aconteceu da última vez que alguém te olhou nos olhos?"

[.skill_summoning_familiar_cockatrice_32]
en = "Oh, I petrified them really good! Ooooh...okay, point taken."
pt = "Ah, eu petrifiquei direitinho! Aaaah... tá, entendi o recado."

[.skill_summoning_familiar_cockatrice_33]
en = "I'm glad we had this chat."
pt = "Que bom que tivemos esta conversa."

# Skills - summoning/familiar/CompostMound.kt

[.skill_summoning_familiar_compostmound_1]
en = "Oi've gotta braand new comboine 'aarvester!"
pt = "Arrumei uma culheitadêra cumbinada novinha em fôia!"

[.skill_summoning_familiar_compostmound_2]
en = "A what?"
pt = "Uma o quê?"

[.skill_summoning_familiar_compostmound_3]
en = "Well, it's a flat bit a metal wi' a 'andle that I can use ta 'aarvest all combinations o' plaants."
pt = "Uai, é um tiquim de metar chato cum um cabo, que eu uso pra coiê tudo quanto é cumbinação de pranta."

[.skill_summoning_familiar_compostmound_4]
en = "You mean a spade?"
pt = "Você quer dizer uma pá?"

[.skill_summoning_familiar_compostmound_5]
en = "Aye, 'aat'll be it."
pt = "Isso, é esse trem mesmo."

[.skill_summoning_familiar_compostmound_6]
en = "What we be doin' 'ere, zur?"
pt = "Que nóis tá fazeno aqui, sô?"

[.skill_summoning_familiar_compostmound_7]
en = "Oh, I have a few things to take care of here, is all."
pt = "Ah, só tenho umas coisas para resolver aqui, só isso."

[.skill_summoning_familiar_compostmound_8]
en = "Aye, right ye are, zur. Oi'll be roight there."
pt = "Tá certo, sô. Já tô indo aí."

[.skill_summoning_familiar_compostmound_9]
en = "Errr...are ye gonna eat that?"
pt = "Ééé... cê vai cumê isso?"

[.skill_summoning_familiar_compostmound_10]
en = "Eat what?"
pt = "Comer o quê?"

[.skill_summoning_familiar_compostmound_11]
en = "Y've got summat on yer, goin' wastin'."
pt = "Cê tá cum um trem grudado aí, se disperdiçano."

[.skill_summoning_familiar_compostmound_12]
en = "Ewwww!"
pt = "Eca!"

[.skill_summoning_familiar_compostmound_13]
en = "So ye don' want it then?"
pt = "Então cê num qué?"

[.skill_summoning_familiar_compostmound_14]
en = "No I do not want it! Nor do I want to put my boot in your mouth for you to clean it off."
pt = "Não, eu não quero! E também não quero enfiar a minha bota na sua boca para você limpar."

[.skill_summoning_familiar_compostmound_15]
en = "An' why not?"
pt = "Uai, e pur que não?"

[.skill_summoning_familiar_compostmound_16]
en = "It'll likely come out dirtier than when I put it in!"
pt = "Ela provavelmente ia sair mais suja do que entrou!"

[.skill_summoning_familiar_compostmound_17]
en = "Oi'm not 'appy carryin' round these young'uns where we're going."
pt = "Num tô filiz de carregá esses fiote pr'onde nóis tá ino."

[.skill_summoning_familiar_compostmound_18]
en = "Young'uns? Oh, the buckets of compost! Well, those wooden containers will keep them safe."
pt = "Fiotes? Ah, os baldes de adubo (compost)! Bom, esses recipientes de madeira vão protegê-los."

[.skill_summoning_familiar_compostmound_19]
en = "'Aah, that be a mighty good point, zur."
pt = "Ah, isso é um argumento bão dimais, sô."

[.skill_summoning_familiar_compostmound_20]
en = "Oi wus just a-wonderin'..."
pt = "Eu tava só matutano..."

[.skill_summoning_familiar_compostmound_21]
en = "Oh! What have you been eating! Your breath is making my eyes water!"
pt = "Argh! O que você andou comendo? Seu bafo está fazendo meus olhos lacrimejarem!"

[.skill_summoning_familiar_compostmound_22]
en = "Oi! Oi'm 'urt by thaat."
pt = "Ô! Fiquei magoado cum isso."

[.skill_summoning_familiar_compostmound_23]
en = "Sorry."
pt = "Desculpe."

[.skill_summoning_familiar_compostmound_24]
en = "Oi mean, oi even et some mints earlier."
pt = "Inté cumi umas hortelã agorinha, sô."

[.skill_summoning_familiar_compostmound_25]
en = "You did?"
pt = "Comeu?"

[.skill_summoning_familiar_compostmound_26]
en = "'At's roight. Oi found some mint plaants in a big pile o' muck, and oi 'ad 'em fer me breakfast."
pt = "Isso mesmo. Achei uns pé de hortelã num montão de estrume e cumi no café da manhã."

[.skill_summoning_familiar_compostmound_27]
en = "The mystery resolves itself."
pt = "O mistério se resolve sozinho."

# Skills - summoning/familiar/Deathslinger.kt

[.skill_summoning_familiar_deathslinger_1]
en = "We have much work to do, but I could stop for a moment."
pt = "Temos muito trabalho a fazer, mas posso parar um momento."

[.skill_summoning_familiar_deathslinger_2]
en = "What is the biggest creature you have killed?"
pt = "Qual é a maior criatura que você já matou?"

[.skill_summoning_familiar_deathslinger_3]
en = "Haha, you sound like my cubs! What did you kill, mama? Did it have ten heads, mama? Did it fire magic bolts from its eyes?"
pt = "Haha, você parece os meus filhotes! O que você matou, mamãe? Tinha dez cabeças, mamãe? Soltava raios mágicos pelos olhos?"

[.skill_summoning_familiar_deathslinger_4]
en = "Alright, I get it. I was just making conversation."
pt = "Tá bom, já entendi. Eu só estava puxando conversa."

[.skill_summoning_familiar_deathslinger_5]
en = "Do not sulk, naabe. You simply reminded me of better times. To answer your question, it was most likely a sinkhole. They are huge and flat, shaped something like an open palm. "
pt = "Não fique emburrado, naabe. Você só me lembrou de tempos melhores. Respondendo à sua pergunta, provavelmente foi um sinkhole. São enormes e achatados, com a forma de uma palma aberta."

[.skill_summoning_familiar_deathslinger_6]
en = "They burrow beneath the ground, and then fold themselves into a fist, storing the land and people within them to be digested when required."
pt = "Eles se enterram no chão e depois se fecham como um punho, guardando a terra e as pessoas dentro de si para digerir quando precisarem."

[.skill_summoning_familiar_deathslinger_7]
en = "That's horrible!"
pt = "Que horror!"

[.skill_summoning_familiar_deathslinger_8]
en = "And so much worse to be inside one. This place is nothing in comparison to a sinkhole, naabe. I relish every day outside of that thing."
pt = "E muito pior é estar dentro de um. Este lugar não é nada perto de um sinkhole, naabe. Saboreio cada dia fora daquela coisa."

[.skill_summoning_familiar_deathslinger_9]
en = "How much do you know about Daemonheim?"
pt = "O quanto você sabe sobre Daemonheim?"

[.skill_summoning_familiar_deathslinger_10]
en = "I know that it has been here for far longer than you or I have been alive, beyond the lifetimes of our parents, grandparents and any relatives they knew."
pt = "Sei que está aqui há muito mais tempo do que você ou eu estamos vivos, além das vidas dos nossos pais, avós e de qualquer parente que eles conheceram."

[.skill_summoning_familiar_deathslinger_11]
en = "Many, from so many different races, have been born here. And many have died here, filling the holes they helped to dig. It is not a life they deserved, but they knew no other."
pt = "Muitos, de tantas raças diferentes, nasceram aqui. E muitos morreram aqui, enchendo os buracos que ajudaram a cavar. Não é a vida que mereciam, mas não conheciam outra."

[.skill_summoning_familiar_deathslinger_12]
en = "It must have been a terrible life."
pt = "Deve ter sido uma vida terrível."

[.skill_summoning_familiar_deathslinger_13]
en = "It is best to not consider it a life, naabe. They would have burrowed without question, knowing no life better than this. Like blind moles, churra. "
pt = "É melhor nem considerar aquilo uma vida, naabe. Eles cavavam sem questionar, sem conhecer vida melhor que esta. Como toupeiras cegas, churra."

[.skill_summoning_familiar_deathslinger_14]
en = "They believed that they were burrowing to an exit. It is hateful to think that their leader may have played upon this fact, encouraging them downward to their escape."
pt = "Acreditavam que estavam cavando rumo a uma saída. É odioso pensar que o líder deles pode ter se aproveitado disso, empurrando-os para baixo, rumo à fuga."

[.skill_summoning_familiar_deathslinger_15]
en = "Why do the gorajo have only one role? You can't be a deathslinger all the time, can you?"
pt = "Por que os gorajo têm um só papel? Você não pode ser deathslinger o tempo todo, pode?"

[.skill_summoning_familiar_deathslinger_16]
en = "A gorajo needs but one role. How do you humans say it? We...specialise."
pt = "Um gorajo só precisa de um papel. Como vocês humanos dizem? Nós... nos especializamos."

[.skill_summoning_familiar_deathslinger_17]
en = "I guess that would make you a pure. I mean, adventurers who specialise in one skill are often called pures."
pt = "Acho que isso faz de você um pure. Quer dizer, aventureiros que se especializam em uma só habilidade costumam ser chamados de pures."

[.skill_summoning_familiar_deathslinger_18]
en = "A pure? I like this. The goraju are pure of action, pure of purpose... Yes, I will accept this term."
pt = "Um pure? Gostei disso. Os gorajo são puros de ação, puros de propósito... Sim, aceito esse termo."

[.skill_summoning_familiar_deathslinger_19]
en = "Fly fast on the wind, young naabe."
pt = "Voe rápido no vento, jovem naabe."

# Skills - summoning/familiar/DesertWyrm.kt

[.skill_summoning_familiar_desertwyrm_1]
en = "There are no rocks around here for the desert wyrm to mine from!"
pt = "Não há pedras por aqui para o desert wyrm minerar!"

[.skill_summoning_familiar_desertwyrm_2]
en = "If you have that pick, why make me dig?"
pt = "Se você tem essa picareta, por que me faz cavar?"

[.skill_summoning_familiar_desertwyrm_3]
en = "Because it's a little quicker and easier on my arms."
pt = "Porque é um pouco mais rápido e cansa menos os meus braços."

[.skill_summoning_familiar_desertwyrm_4]
en = "I should take industrial action over this..."
pt = "Isso pede uma ação sindical pesada..."

[.skill_summoning_familiar_desertwyrm_5]
en = "You mean you won't work for me any more?"
pt = "Quer dizer que você vai parar de trabalhar para mim?"

[.skill_summoning_familiar_desertwyrm_6]
en = "No. It means me and the lads feed you legs-first into some industrial machinery, maybe the Blast Furnace."
pt = "Não. Quer dizer que eu e a rapaziada vamos te enfiar de pés numa maquinaria pesada, talvez a Blast Furnace."

[.skill_summoning_familiar_desertwyrm_7]
en = "I'll just be over here, digging."
pt = "Vou ficar ali, cavando."

[.skill_summoning_familiar_desertwyrm_8]
en = "That's the spirit, lad!"
pt = "Assim que se fala, rapaz!"

[.skill_summoning_familiar_desertwyrm_9]
en = "This is so unsafe...I should have a hard hat for this work..."
pt = "Isso é tão perigoso... eu devia ter um capacete para este trabalho..."

[.skill_summoning_familiar_desertwyrm_10]
en = "Well, I could get you a rune helm if you like - those are pretty hard."
pt = "Bom, posso te arrumar um elmo de runita (rune helm), se quiser - esses são bem duros."

[.skill_summoning_familiar_desertwyrm_11]
en = "Keep that up and you'll have the union on your back!"
pt = "Continua assim e o sindicato vai cair em cima de você!"

[.skill_summoning_familiar_desertwyrm_12]
en = "You can't touch me, I'm part of the union!"
pt = "Você não pode encostar em mim, eu sou do sindicato!"

[.skill_summoning_familiar_desertwyrm_13]
en = "Is that some official \"no-touching\" policy or something?"
pt = "Isso é alguma regra oficial de \"proibido encostar\" ou coisa assim?"

[.skill_summoning_familiar_desertwyrm_14]
en = "You really don't get it, do you %1%?"
pt = "Você não entende mesmo, né, %1%?"

[.skill_summoning_familiar_desertwyrm_15]
en = "You know, you might want to register with the union."
pt = "Sabe, você devia se filiar ao sindicato."

[.skill_summoning_familiar_desertwyrm_16]
en = "What are the benefits?"
pt = "Quais são as vantagens?"

[.skill_summoning_familiar_desertwyrm_17]
en = "I stop bugging you to join the union."
pt = "Eu paro de te encher para se filiar ao sindicato."

[.skill_summoning_familiar_desertwyrm_18]
en = "Ask that again later; I'll have to consider that generous proposal."
pt = "Pergunte de novo mais tarde; vou ter que pensar nessa proposta tão generosa."

[.skill_summoning_familiar_desertwyrm_19]
en = "Why are you ignoring that good ore seam, mister?"
pt = "Por que você está ignorando esse belo veio de minério, chefe?"

[.skill_summoning_familiar_desertwyrm_20]
en = "Which ore seam?"
pt = "Que veio de minério?"

[.skill_summoning_familiar_desertwyrm_21]
en = "There's a good ore seam right underneath us at this very moment."
pt = "Tem um belo veio de minério bem debaixo da gente neste exato momento."

[.skill_summoning_familiar_desertwyrm_22]
en = "Great! How long will it take for you to get to it?"
pt = "Ótimo! Quanto tempo você leva para chegar até ele?"

[.skill_summoning_familiar_desertwyrm_23]
en = "Five years, give or take."
pt = "Cinco anos, mais ou menos."

[.skill_summoning_familiar_desertwyrm_24]
en = "Five years!"
pt = "Cinco anos!"

[.skill_summoning_familiar_desertwyrm_25]
en = "That's if we go opencast, mind. I could probably reach it in three if I just dug."
pt = "Isso se for mina a céu aberto, veja bem. Se eu só cavasse, chegava em uns três."

[.skill_summoning_familiar_desertwyrm_26]
en = "Right. I see. I think I'll skip it thanks."
pt = "Certo. Entendi. Acho que vou deixar para lá, obrigado."

