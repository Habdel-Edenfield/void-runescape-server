pt = "Muito bem. Tem alguma coisa dentro?"

[.skill_summoning_familiar_giantchinchompa_27]
en = "Hmmm. Let me see. It seems to be full of some highly sought after, very expensive...chinchompa breath!"
pt = "Hmmm. Deixa eu ver. Parece estar cheio de algo muito procurado, caríssimo... bafo de chinchompa!"

[.skill_summoning_familiar_giantchinchompa_28]
