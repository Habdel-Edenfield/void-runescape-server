# Text - area/misthalin/lumbridge/CowFieldSignpost.kt

[.text_area_misthalin_lumbridge_cowfieldsignpost_1]
en = "Local cowherders have reported that %1% cows have been slain in this field today by passing adventurers. Farmers throughout the land fear this may be an epidemic."
pt = "Os vaqueiros da região relatam que %1% vacas foram abatidas neste campo hoje por aventureiros de passagem. Fazendeiros de todo o reino temem que seja uma epidemia."

[.text_area_misthalin_lumbridge_cowfieldsignpost_2]
en = "The Lumbridge cow population has been thriving today, without a single cow death to worry about!"
pt = "A população de vacas de Lumbridge está prosperando hoje, sem uma única morte de vaca com que se preocupar!"

# Text - area/misthalin/lumbridge/ExplorerJack.kt

[.text_area_misthalin_lumbridge_explorerjack_1]
en = "Ah! Welcome to %1%, lad. My name's Explorer jack. I'm an explorer by trade, and I'm one of the Taskmasters around these parts"
pt = "Ah! Bem-vindo a %1%, rapaz. Meu nome é Explorer Jack. Sou explorador de profissão e um dos Taskmasters destas bandas"

# Text - area/misthalin/lumbridge/LumbridgeBookcase.kt

[.text_area_misthalin_lumbridge_lumbridgebookcase_1]
en = "You search the books..."
pt = "Você examina os livros..."

[.text_area_misthalin_lumbridge_lumbridgebookcase_2]
en = "None of them look very interesting."
pt = "Nenhum deles parece muito interessante."

[.text_area_misthalin_lumbridge_lumbridgebookcase_3]
en = "You find nothing to interest you."
pt = "Você não encontra nada que lhe interesse."

[.text_area_misthalin_lumbridge_lumbridgebookcase_4]
en = "You don't find anything that you'd ever want to read."
pt = "Você não encontra nada que um dia queira ler."

# Text - area/misthalin/lumbridge/Men.kt

[.text_area_misthalin_lumbridge_men_1]
en = "Hello, how's it going?"
pt = "Olá, como vão as coisas?"

[.text_area_misthalin_lumbridge_men_2]
en = "Not too bad, but I'm a little worried about the increase of goblins these days."
pt = "Nada mal, mas ando um pouco preocupado com o aumento de goblins ultimamente."

[.text_area_misthalin_lumbridge_men_3]
en = "Don't worry, I'll kill them."
pt = "Não se preocupe, eu dou cabo deles."

[.text_area_misthalin_lumbridge_men_4]
en = "How can I help you?"
pt = "Como posso ajudar?"

[.text_area_misthalin_lumbridge_men_5]
en = "Do you wish to trade?"
pt = "Quer negociar?"

[.text_area_misthalin_lumbridge_men_6]
en = "No, I have nothing I wish to get rid of. If you want to do some trading, there are plenty of shops and market stalls around though."
pt = "Não, não tenho nada de que eu queira me livrar. Mas se quer negociar, tem muitas lojas e barracas de mercado por aí."

[.text_area_misthalin_lumbridge_men_7]
en = "I'm in search of a quest."
pt = "Estou em busca de uma missão."

[.text_area_misthalin_lumbridge_men_8]
en = "I'm sorry I can't help you there."
pt = "Sinto muito, não posso ajudar com isso."

[.text_area_misthalin_lumbridge_men_9]
en = "I'm in search of enemies to kill."
pt = "Estou em busca de inimigos para matar."

[.text_area_misthalin_lumbridge_men_10]
en = "I've heard there are many fearsome creatures that dwell under the ground..."
pt = "Ouvi dizer que há muitas criaturas temíveis vivendo debaixo da terra..."

[.text_area_misthalin_lumbridge_men_11]
en = "Get out of my way, I'm in a hurry!"
pt = "Sai da frente, estou com pressa!"

[.text_area_misthalin_lumbridge_men_12]
en = "I'm fine, how are you?"
pt = "Estou bem, e você?"

[.text_area_misthalin_lumbridge_men_13]
en = "Very well thank you."
pt = "Muito bem, obrigado."

[.text_area_misthalin_lumbridge_men_14]
en = "Hello there! Nice weather we've been having."
pt = "Olá! Que tempo bom tem feito, hein?"

[.text_area_misthalin_lumbridge_men_15]
en = "I'm very well thank you."
pt = "Estou muito bem, obrigado."

[.text_area_misthalin_lumbridge_men_16]
en = "I'm a bold adventurer."
pt = "Sou um aventureiro destemido."

[.text_area_misthalin_lumbridge_men_17]
en = "Ah, a very noble profession."
pt = "Ah, uma profissão muito nobre."

[.text_area_misthalin_lumbridge_men_18]
en = "Do I know you? I'm in a hurry!"
pt = "Eu te conheço? Estou com pressa!"

[.text_area_misthalin_lumbridge_men_19]
en = "I think we need a new king. The one we've got isn't very good."
pt = "Acho que precisamos de um rei novo. Esse que temos não é lá muito bom."

[.text_area_misthalin_lumbridge_men_20]
en = "Not too bad thanks."
pt = "Nada mal, obrigado."

[.text_area_misthalin_lumbridge_men_21]
en = "Are you asking for a fight?"
pt = "Está procurando briga?"

[.text_area_misthalin_lumbridge_men_22]
en = "I'm busy right now."
pt = "Estou ocupado agora."

[.text_area_misthalin_lumbridge_men_23]
en = "None of your business."
pt = "Não é da sua conta."

[.text_area_misthalin_lumbridge_men_24]
en = "No I don't have any spare change."
pt = "Não, não tenho nenhum trocado."

[.text_area_misthalin_lumbridge_men_25]
en = "I'm a little worried - I've heard there's lots of people going about, killing citizens at random."
pt = "Ando meio preocupado - ouvi dizer que tem muita gente por aí matando cidadãos a esmo."

[.text_area_misthalin_lumbridge_men_26]
en = "No, I don't want to buy anything!"
pt = "Não, não quero comprar nada!"

[.text_area_misthalin_lumbridge_men_27]
en = "That is classified information."
pt = "Isso é informação confidencial."

[.text_area_misthalin_lumbridge_men_28]
en = "Have this flyer..."
pt = "Pegue este panfleto..."

[.text_area_misthalin_lumbridge_men_29]
en = "Yo, wassup!"
pt = "E aí, beleza?!"

# Text - area/misthalin/lumbridge/PlayerDeathSignpost.kt

[.text_area_misthalin_lumbridge_playerdeathsignpost_1]
en = "So far today, %1% unlucky adventurers have died on %2% and been sent to their respawn location. Be careful out there."
pt = "Hoje, até agora, %1% aventureiros azarados morreram em %2% e voltaram ao ponto de renascimento. Cuidado por aí."

[.text_area_misthalin_lumbridge_playerdeathsignpost_2]
en = "So far today, not a single adventurer on %1% has met their end grisly or otherwise. Either the streets are getting safer or adventurers are getting warier."
pt = "Hoje, até agora, nenhum aventureiro em %1% encontrou seu fim, horrível ou não. Ou as ruas estão mais seguras, ou os aventureiros mais cautelosos."

# Text - area/misthalin/lumbridge/blood_pact/Caitlin.kt

[.text_area_misthalin_lumbridge_blood_pact_caitlin_1]
en = "What are you waiting for? Finish me!"
pt = "Está esperando o quê? Acabe comigo!"

[.text_area_misthalin_lumbridge_blood_pact_caitlin_2]
en = "I have some questions."
pt = "Tenho algumas perguntas."

[.text_area_misthalin_lumbridge_blood_pact_caitlin_3]
en = "Time for you to die!"
pt = "Chegou a sua hora de morrer!"

[.text_area_misthalin_lumbridge_blood_pact_caitlin_4]
en = "I'm not killing you. Just give me your stuff and get out of here."
pt = "Não vou matar você. Só me dê as suas coisas e suma daqui."

[.text_area_misthalin_lumbridge_blood_pact_caitlin_5]
en = "I am the wizard Caitlin."
pt = "Sou a maga Caitlin."

[.text_area_misthalin_lumbridge_blood_pact_caitlin_6]
en = "Who are the others?"
pt = "Quem são os outros?"

[.text_area_misthalin_lumbridge_blood_pact_caitlin_7]
en = "Reese used to be an acolyte at Lumbridge Church. He and I came up with this whole idea."
pt = "Reese era acólito na igreja de Lumbridge. Ele e eu tivemos essa ideia toda."

[.text_area_misthalin_lumbridge_blood_pact_caitlin_8]
en = "Kayle's just some idiot Reese roped into helping us. I heard you let him go. It's more than he deserved. He's useless."
pt = "O Kayle é só um idiota que o Reese arrastou para nos ajudar. Soube que você o deixou ir. É mais do que ele merecia. Ele é um inútil."

[.text_area_misthalin_lumbridge_blood_pact_caitlin_9]
en = "Kayle was just some idiot Reese roped into helping us. I heard you killed him and I can't say I mind. If I'd had my way we'd have used him as the sacrifice."
pt = "O Kayle era só um idiota que o Reese arrastou para nos ajudar. Soube que você o matou, e não posso dizer que me importo. Se dependesse de mim, ele teria sido o sacrifício."

[.text_area_misthalin_lumbridge_blood_pact_caitlin_10]
en = "What were you planning to do down here?"
pt = "O que vocês estavam planejando fazer aqui embaixo?"

[.text_area_misthalin_lumbridge_blood_pact_caitlin_11]
en = "Idiot hero! You don't even know what this place is, do you?"
pt = "Herói idiota! Você nem sabe que lugar é este, não é?"

[.text_area_misthalin_lumbridge_blood_pact_caitlin_12]
en = "This is the tomb of Dragith Nurn!"
pt = "Esta é a tumba de Dragith Nurn!"

[.text_area_misthalin_lumbridge_blood_pact_caitlin_13]
en = "Dragith Nurn was a necromancer. He lived in Lumbridge decades ago."
pt = "Dragith Nurn era um necromante. Ele viveu em Lumbridge décadas atrás."

[.text_area_misthalin_lumbridge_blood_pact_caitlin_14]
en = "He kept his necromancy secret. Everyone thought he was just a wealthy nobleman and wizard. He paid for these catacombs to be built, and he's interred here in a special tomb."
pt = "Ele mantinha a necromancia em segredo. Todos achavam que ele era só um nobre rico e mago. Ele pagou pela construção destas catacumbas e está sepultado aqui, numa tumba especial."

[.text_area_misthalin_lumbridge_blood_pact_caitlin_15]
en = "Reese was an acolyte here at the church. He learned that Dragith Nurn was buried here."
pt = "Reese era acólito aqui na igreja. Ele descobriu que Dragith Nurn estava enterrado aqui."

[.text_area_misthalin_lumbridge_blood_pact_caitlin_16]
en = "I was a student at the Wizards' Tower. In the library, I discovered a note left by Dragith Nurn."
pt = "Eu era estudante na Wizards' Tower. Na biblioteca, descobri um bilhete deixado por Dragith Nurn."

[.text_area_misthalin_lumbridge_blood_pact_caitlin_17]
en = "The body of a necromancer contains powerful magic. We learned we could perform a ritual on his tomb to unlock the secrets of his work."
pt = "O corpo de um necromante guarda uma magia poderosa. Descobrimos que podíamos fazer um ritual na tumba dele para desvendar os segredos do seu trabalho."

[.text_area_misthalin_lumbridge_blood_pact_caitlin_18]
en = "We would have gained mastery over life and death!"
pt = "Teríamos conquistado o domínio sobre a vida e a morte!"

[.text_area_misthalin_lumbridge_blood_pact_caitlin_19]
en = "All right. Now finish me!"
pt = "Pronto. Agora acabe comigo!"

[.text_area_misthalin_lumbridge_blood_pact_caitlin_20]
en = "The second cultist came past me on her way out. I don't think she'll be any more trouble. I'm glad you didn't have to kill her."
pt = "A segunda cultista passou por mim na saída. Acho que ela não vai dar mais trabalho. Fico feliz que você não precisou matá-la."

[.text_area_misthalin_lumbridge_blood_pact_caitlin_21]
en = "I heard you killed the second cultist. It's a pity it had to come to that...but I'm not questioning your judgment."
pt = "Soube que você matou a segunda cultista. Pena que precisou chegar a isso... mas não estou questionando o seu julgamento."

[.text_area_misthalin_lumbridge_blood_pact_caitlin_22]
en = "I think the third cultist is a swordsman. Magic is the best thing to use against melee fighters. Speak to me if you need any help."
pt = "Acho que o terceiro cultista é um espadachim. Magic (magia) é a melhor coisa contra lutadores corpo a corpo. Fale comigo se precisar de ajuda."

# Text - area/misthalin/lumbridge/blood_pact/DragithMask.kt

[.text_area_misthalin_lumbridge_blood_pact_dragithmask_1]
en = "You need all five parts of the mask in order to combine them."
pt = "Você precisa das cinco partes da máscara para juntá-las."

[.text_area_misthalin_lumbridge_blood_pact_dragithmask_2]
en = "You combine the parts and assemble the Mask of Dragith Nurn."
pt = "Você junta as partes e monta a máscara de Dragith Nurn (Mask of Dragith Nurn)."

# Text - area/misthalin/lumbridge/blood_pact/Ilona.kt

[.text_area_misthalin_lumbridge_blood_pact_ilona_1]
en = "Yes, rescue Ilona."
pt = "Sim, resgatar a Ilona."

[.text_area_misthalin_lumbridge_blood_pact_ilona_2]
en = "You untie Ilona and return to the surface."
pt = "Você desamarra a Ilona e volta para a superfície."

[.text_area_misthalin_lumbridge_blood_pact_ilona_3]
en = "Thank the gods. We're out."
pt = "Graças aos deuses. Saímos."

[.text_area_misthalin_lumbridge_blood_pact_ilona_4]
en = "I thought I was going to die down there."
pt = "Achei que eu ia morrer lá embaixo."

[.text_area_misthalin_lumbridge_blood_pact_ilona_5]
en = "You saved my life, whoever you are. Thank you."
pt = "Você salvou a minha vida, seja lá quem for. Obrigada."

[.text_area_misthalin_lumbridge_blood_pact_ilona_6]
en = "Well, adventurer, it looks like you have prevailed. You should keep the cultists' weapons as a reward."
pt = "Bem, aventureiro, parece que você venceu. Fique com as armas dos cultistas como recompensa."

[.text_area_misthalin_lumbridge_blood_pact_ilona_7]
en = "I took the liberty of retrieving the weapons you missed."
pt = "Tomei a liberdade de recuperar as armas que você deixou para trás."

[.text_area_misthalin_lumbridge_blood_pact_ilona_8]
en = "You don't have room in your inventory to receive your last reward. Speak to Xenia again when you have dropped, destroyed or banked some of your items."
pt = "Você não tem espaço no inventário para receber sua última recompensa. Fale com a Xenia de novo depois de largar, destruir ou guardar no banco alguns itens."

[.text_area_misthalin_lumbridge_blood_pact_ilona_9]
en = "Ilona departs."
pt = "Ilona vai embora."

# Text - area/misthalin/lumbridge/blood_pact/Kayle.kt

[.text_area_misthalin_lumbridge_blood_pact_kayle_1]
en = "Are - are you going to kill me?"
pt = "Você - você vai me matar?"

[.text_area_misthalin_lumbridge_blood_pact_kayle_2]
en = "Y-yes! I'll tell you anything!"
pt = "S-sim! Eu conto tudo!"

[.text_area_misthalin_lumbridge_blood_pact_kayle_3]
en = "Yes. Now die!"
pt = "Vou. Agora morra!"

[.text_area_misthalin_lumbridge_blood_pact_kayle_4]
en = "No. Just give me your stuff and get out of here."
pt = "Não. Só me passa as suas coisas e some daqui."

[.text_area_misthalin_lumbridge_blood_pact_kayle_5]
en = "I- My name's Kayle. I'm a ranger. Well, I'd been practising the sling... I guess I wasn't as good as I'd thought."
pt = "Eu- Meu nome é Kayle. Sou arqueiro. Bem, eu andava treinando com a funda... acho que eu não era tão bom quanto pensava."

[.text_area_misthalin_lumbridge_blood_pact_kayle_6]
en = "Reese is the leader. All this, the blood pact, it was his idea. He doesn't know magic but he's a strong fighter."
pt = "O Reese é o líder. Tudo isso, o pacto de sangue, foi ideia dele. Ele não sabe magia, mas é um lutador forte."

[.text_area_misthalin_lumbridge_blood_pact_kayle_7]
en = "Caitlin is a wizard. She was a student at the Wizards' Tower, but she left. She wanted to study dark magic."
pt = "A Caitlin é maga. Ela estudava na Wizards' Tower, mas saiu. Queria estudar magia negra."

[.text_area_misthalin_lumbridge_blood_pact_kayle_8]
en = "I - I don't really know! Honestly!"
pt = "Eu - eu não sei direito! Sério!"

[.text_area_misthalin_lumbridge_blood_pact_kayle_9]
en = "Listen...Reese used to be an acolyte at the church here. He discovered something about these catacombs; I don't know what. Something about how they were built, I think."
pt = "Escuta...o Reese era acólito na igreja daqui. Ele descobriu alguma coisa sobre estas catacumbas; não sei o quê. Algo sobre como foram construídas, eu acho."

[.text_area_misthalin_lumbridge_blood_pact_kayle_10]
en = "Caitlin was a student at the Wizards' Tower. She found something too, in the ruins of the old tower, from back when Zamorakian wizards used it."
pt = "A Caitlin estudava na Wizards' Tower. Ela também achou uma coisa, nas ruínas da torre antiga, do tempo em que os magos zamorakianos a usavam."

[.text_area_misthalin_lumbridge_blood_pact_kayle_11]
en = "Caitlin and Reese put what they'd found together. They said they'd discovered a ritual they could perform, something that could give them power over life and death."
pt = "A Caitlin e o Reese juntaram o que tinham achado. Disseram que descobriram um ritual que podiam fazer, algo que lhes daria poder sobre a vida e a morte."

[.text_area_misthalin_lumbridge_blood_pact_kayle_12]
en = "We made a blood pact, the three of us. So that we'd be in it together, whatever happened."
pt = "Fizemos um pacto de sangue, nós três. Para ficarmos juntos nessa, acontecesse o que acontecesse."

[.text_area_misthalin_lumbridge_blood_pact_kayle_13]
en = "Then we kidnapped Ilona. She was another apprentice from the Wizards' Tower, someone Caitlin had known there."
pt = "Aí a gente sequestrou a Ilona. Ela era outra aprendiz da Wizards' Tower, alguém que a Caitlin conheceu lá."

[.text_area_misthalin_lumbridge_blood_pact_kayle_14]
en = "Reese and Caitlin are going down there to perform the ritual. I don't - I don't know what it involves."
pt = "O Reese e a Caitlin vão descer lá para fazer o ritual. Eu não - eu não sei o que ele envolve."

[.text_area_misthalin_lumbridge_blood_pact_kayle_15]
en = "Are - are you going to kill me now?"
pt = "Você - você vai me matar agora?"

[.text_area_misthalin_lumbridge_blood_pact_kayle_16]
en = "I don't think that cultist will be any more trouble. I'm glad you didn't have to kill him."
pt = "Acho que aquele cultista não vai dar mais trabalho. Fico feliz que você não precisou matá-lo."

[.text_area_misthalin_lumbridge_blood_pact_kayle_17]
en = "It's a pity you had to kill that man...but I'm not questioning your judgment."
pt = "É uma pena você ter precisado matar aquele homem...mas não estou questionando o seu julgamento."

[.text_area_misthalin_lumbridge_blood_pact_kayle_18]
en = "I think the second cultist was using magic. You should use a ranged weapon to defeat magic-users. Ask me if you need any help."
pt = "Acho que a segunda cultista estava usando magia. Use uma arma de longo alcance para derrotar magos. Me pergunte se precisar de ajuda."

[.text_area_misthalin_lumbridge_blood_pact_kayle_19]
en = "And you just went along with this?"
pt = "E você simplesmente topou isso?"

[.text_area_misthalin_lumbridge_blood_pact_kayle_20]
en = "The blood pact! We'd made a blood pact, and Reese said that bound me to him. It meant I had to do anything he said. He...he said he could curse me."
pt = "O pacto de sangue! A gente tinha feito um pacto de sangue, e o Reese disse que isso me prendia a ele. Que eu tinha que fazer tudo o que ele mandasse. Ele...ele disse que podia me amaldiçoar."

# Text - area/misthalin/lumbridge/blood_pact/Reese.kt

[.text_area_misthalin_lumbridge_blood_pact_reese_1]
en = "This gate won't budge."
pt = "Este portão não se mexe."

[.text_area_misthalin_lumbridge_blood_pact_reese_2]
en = "The potion is complete. Where are they? The whole group should be present."
pt = "A poção está pronta. Onde eles estão? O grupo inteiro devia estar aqui."

[.text_area_misthalin_lumbridge_blood_pact_reese_3]
en = "Let me go, you-"
pt = "Me solte, seu-"

[.text_area_misthalin_lumbridge_blood_pact_reese_4]
en = "Shut up!"
pt = "Cale a boca!"

[.text_area_misthalin_lumbridge_blood_pact_reese_5]
en = "Who are you? What are you doing here?"
pt = "Quem é você? O que está fazendo aqui?"

[.text_area_misthalin_lumbridge_blood_pact_reese_6]
en = "You've beaten me, adventurer."
pt = "Você me derrotou, aventureiro."

[.text_area_misthalin_lumbridge_blood_pact_reese_7]
en = "Now strike the final blow! End the blood pact in this tomb."
pt = "Agora dê o golpe final! Encerre o pacto de sangue nesta tumba."

[.text_area_misthalin_lumbridge_blood_pact_reese_8]
en = "Ask your questions."
pt = "Faça suas perguntas."

[.text_area_misthalin_lumbridge_blood_pact_reese_9]
en = "I'm not killing you. Give me your stuff and get out of here."
pt = "Não vou matar você. Me dê as suas coisas e suma daqui."

[.text_area_misthalin_lumbridge_blood_pact_reese_10]
en = "No! There must be a death! The blood pact must be complete!"
pt = "Não! Alguém tem que morrer! O pacto de sangue precisa se completar!"

[.text_area_misthalin_lumbridge_blood_pact_reese_11]
en = "My Name is %1%. I'm an adventurer"
pt = "Meu nome é %1%. Sou um aventureiro"

[.text_area_misthalin_lumbridge_blood_pact_reese_12]
en = "This will be your tomb, adventurer. The blood pact will prevail!"
pt = "Esta será a sua tumba, aventureiro. O pacto de sangue vai prevalecer!"

[.text_area_misthalin_lumbridge_blood_pact_reese_13]
en = "I'm %1%. Don't worry, Ilona, I'm here to rescue you."
pt = "Sou %1%. Não se preocupe, Ilona, vim resgatar você."

[.text_area_misthalin_lumbridge_blood_pact_reese_14]
en = "Thank Saradomin! He's insane! He's going to kill me!"
pt = "Graças a Saradomin! Ele é louco! Ele vai me matar!"

[.text_area_misthalin_lumbridge_blood_pact_reese_15]
en = "Maybe you can take her place as the sacrifice, adventurer. Stand and fight!"
pt = "Talvez você possa tomar o lugar dela como sacrifício, aventureiro. Fique e lute!"

[.text_area_misthalin_lumbridge_blood_pact_reese_16]
en = "I'm the one who killed your lackeys. Think you can do better?"
pt = "Fui eu que matei os seus capangas. Acha que se sai melhor?"

[.text_area_misthalin_lumbridge_blood_pact_reese_17]
en = "They were weak. Zamorak will turn his face from them - but he will smile on me when I offer him your blood!"
pt = "Eles eram fracos. Zamorak vai virar o rosto para eles - mas vai sorrir para mim quando eu lhe oferecer o seu sangue!"

[.text_area_misthalin_lumbridge_blood_pact_reese_18]
en = "I let both the others live. This doesn't have to end in violence."
pt = "Deixei os outros dois viverem. Isto não precisa terminar em violência."

[.text_area_misthalin_lumbridge_blood_pact_reese_19]
en = "I'm the one who defeated your lackeys. Think you can do better?"
pt = "Fui eu que derrotei os seus capangas. Acha que se sai melhor?"

[.text_area_misthalin_lumbridge_blood_pact_reese_20]
en = "I'm your worst nightmare, Zamorakian scum!"
pt = "Sou o seu pior pesadelo, escória zamorakiana!"

[.text_area_misthalin_lumbridge_blood_pact_reese_21]
en = "Help! Untie me so we can get out of here!"
pt = "Socorro! Me desamarre para a gente sair daqui!"

[.text_area_misthalin_lumbridge_blood_pact_reese_22]
en = "I am Reese! Warrior of Zamorak and leader of the blood pact!"
pt = "Eu sou Reese! Guerreiro de Zamorak e líder do pacto de sangue!"

[.text_area_misthalin_lumbridge_blood_pact_reese_23]
en = "Who were the others?"
pt = "Quem eram os outros?"

[.text_area_misthalin_lumbridge_blood_pact_reese_24]
en = "Faithful servants of Zamorak! He is the god of chaos and destruction. We bound ourselves to his service!"
pt = "Servos fiéis de Zamorak! Ele é o deus do caos e da destruição. Nós nos entregamos ao serviço dele!"

[.text_area_misthalin_lumbridge_blood_pact_reese_25]
en = "End Saradomin's dominance over Lumbridge! The tyrant god shall fall."
pt = "Acabar com o domínio de Saradomin sobre Lumbridge! O deus tirano vai cair."

[.text_area_misthalin_lumbridge_blood_pact_reese_26]
en = "With the blood pact, and the power of the tomb of Dragith Nurn, we would send an army of the dead to claim this town for Zamorak!"
pt = "Com o pacto de sangue e o poder da tumba de Dragith Nurn, mandaríamos um exército de mortos tomar esta cidade para Zamorak!"

[.text_area_misthalin_lumbridge_blood_pact_reese_27]
en = "Now strike the final blow!"
pt = "Agora dê o golpe final!"

# Text - area/misthalin/lumbridge/castle/Cook.kt

[.text_area_misthalin_lumbridge_castle_cook_1]
en = "You still need to get: %1%%2%"
pt = "Você ainda precisa conseguir: %1%%2%"

[.text_area_misthalin_lumbridge_castle_cook_2]
en = "You still need to get: %1%"
pt = "Você ainda precisa conseguir: %1%"

[.text_area_misthalin_lumbridge_castle_cook_3]
en = "You still need to get: "
pt = "Você ainda precisa conseguir: "

# Text - area/misthalin/lumbridge/castle/LumbridgeCellar.kt

[.text_area_misthalin_lumbridge_castle_lumbridgecellar_1]
en = "You should find a light source and a tinderbox before going down there."
pt = "É bom arranjar uma fonte de luz e uma pederneira (tinderbox) antes de descer aí."

# Text - area/misthalin/lumbridge/castle/LumbridgeWinch.kt

[.text_area_misthalin_lumbridge_castle_lumbridgewinch_1]
en = "It seems the winch is jammed. You can't move it."
pt = "Parece que o guincho está emperrado. Você não consegue movê-lo."

# Text - area/misthalin/lumbridge/castle/Sigmund.kt

[.text_area_misthalin_lumbridge_castle_sigmund_1]
en = "Can I help you?"
pt = "Posso ajudar?"

[.text_area_misthalin_lumbridge_castle_sigmund_2]
en = "Do you have any quests for me?"
pt = "Você tem alguma missão para mim?"

[.text_area_misthalin_lumbridge_castle_sigmund_3]
en = "I hear the Duke has a task for an adventurer. Otherwise, if you want to make yourself useful, there are always evil monsters to slay."
pt = "Ouvi dizer que o Duke tem uma tarefa para um aventureiro. Fora isso, se quiser ser útil, sempre há monstros malignos para matar."

[.text_area_misthalin_lumbridge_castle_sigmund_4]
en = "Okay, I might just do that."
pt = "Certo, talvez eu faça isso."

[.text_area_misthalin_lumbridge_castle_sigmund_5]
en = "I'm the Duke's advisor."
pt = "Sou o conselheiro do Duke."

[.text_area_misthalin_lumbridge_castle_sigmund_6]
en = "Can you give me any advice then?"
pt = "Então pode me dar algum conselho?"

[.text_area_misthalin_lumbridge_castle_sigmund_7]
en = "I only advice the Duke. But if you want to make yourself useful, there are evil goblins to slay on the other side of the river."
pt = "Só aconselho o Duke. Mas, se quiser ser útil, há goblins malignos para matar do outro lado do rio."

[.text_area_misthalin_lumbridge_castle_sigmund_8]
en = "Sigmund doesn't seem to have anything of value."
pt = "Sigmund não parece ter nada de valor."

# Text - area/misthalin/lumbridge/catacomb/LumbridgeCatacombs.kt

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_1]
en = "Hey! I want to talk to you!"
pt = "Ei! Quero falar com você!"

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_2]
en = "You should deal with the second Cultist, before trying to operate the winch."
pt = "Você deve cuidar da segunda cultista antes de tentar mexer no guincho."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_3]
en = "There's no reason to operate this."
pt = "Não há motivo para mexer nisto."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_4]
en = "You operate the winch. The gates creak open."
pt = "Você gira o guincho. Os portões se abrem rangendo."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_5]
en = "You should deal with the second Cultist first."
pt = "Você deve cuidar da segunda cultista primeiro."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_6]
en = "You should deal with the third Cultist first."
pt = "Você deve cuidar do terceiro cultista primeiro."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_7]
en = "You should take the prisoner to the surface and speak to Xenia before you venture deeper into the dungeon."
pt = "Leve a prisioneira à superfície e fale com a Xenia antes de se aventurar mais fundo no calabouço."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_8]
en = "A magical barrier prevents you from taking this statuette."
pt = "Uma barreira mágica impede você de pegar esta estatueta."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_9]
en = "You don't have enough inventory space to take the statuette."
pt = "Você não tem espaço no inventário para pegar a estatueta."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_10]
en = "You think that Xenia might be interested in seeing this statuette."
pt = "Você acha que a Xenia talvez queira ver esta estatueta."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_11]
en = "You've already taken this statue."
pt = "Você já pegou esta estátua."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_12]
en = "The monsters around you seem to become agitated as you approach the statue. You think one of them might attack if you were to take it."
pt = "Os monstros ao redor parecem ficar agitados quando você se aproxima da estátua. Talvez um deles ataque se você pegá-la."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_13]
en = "Take the statue."
pt = "Pegar a estátua."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_14]
en = "Leave the statue alone."
pt = "Deixar a estátua em paz."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_15]
en = "You should deal with the first Cultist before advancing further."
pt = "Você deve cuidar do primeiro cultista antes de seguir em frente."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_16]
en = "Come on, Kayle! We don't have forever."
pt = "Anda logo, Kayle! Não temos a eternidade."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_17]
en = "Look, Reese; are you sure about this? There must be some other way we can..."
pt = "Olha, Reese, tem certeza disso? Deve haver outro jeito de a gente..."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_18]
en = "We made a blood pact, Kayle! The three of us are in this all the way."
pt = "Fizemos um pacto de sangue, Kayle! Nós três vamos nisso até o fim."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_19]
en = "Yes, but..."
pt = "Sim, mas..."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_20]
en = "Do we have to take this idiot?"
pt = "A gente precisa mesmo levar esse idiota?"

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_21]
en = "Yes! The blood pact! You read the book!"
pt = "Sim! O pacto de sangue! Você leu o livro!"

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_22]
en = "Let me go! I didn't make any blood pact with-"
pt = "Me soltem! Eu não fiz pacto de sangue nenhum com-"

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_23]
en = "Kayle, you stay here. Guard the door."
pt = "Kayle, você fica aqui. Vigie a porta."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_24]
en = "You, come on."
pt = "Você, vem."

[.text_area_misthalin_lumbridge_catacomb_lumbridgecatacombs_25]
en = "Looks like there's a guard ahead. We should take him together."
pt = "Parece que tem um guarda mais à frente. Vamos enfrentá-lo juntos."

# Text - area/misthalin/lumbridge/church/Gravestone.kt

[.text_area_misthalin_lumbridge_church_gravestone_1]
en = "Your gravestone has appeared and will last %1% minute before crumbling to dust. You"
pt = "Sua lápide (gravestone) apareceu e vai durar %1% minuto antes de virar pó. Você"

[.text_area_misthalin_lumbridge_church_gravestone_2]
en = "Your gravestone has appeared and will last %1% minutes before crumbling to dust. You"
pt = "Sua lápide (gravestone) apareceu e vai durar %1% minutos antes de virar pó. Você"

[.text_area_misthalin_lumbridge_church_gravestone_3]
en = "can find the location of your gravestone by looking at the world map."
pt = "pode ver onde ela está olhando o mapa do mundo (world map)."

# Text - area/misthalin/lumbridge/church/Gravestones.kt

[.text_area_misthalin_lumbridge_church_gravestones_1]
en = "Isn't there something a bit odd about reading your own gravestone?"
pt = "Não é meio estranho ler a sua própria lápide?"

[.text_area_misthalin_lumbridge_church_gravestones_2]
en = "The inscription is too unclear to read."
pt = "A inscrição está apagada demais para ler."

[.text_area_misthalin_lumbridge_church_gravestones_3]
en = "The gods don't seem to approve of people attempting to repair their own gravestones."
pt = "Os deuses não parecem aprovar quem tenta consertar a própria lápide."

[.text_area_misthalin_lumbridge_church_gravestones_4]
en = "This gravestone can no longer be repaired."
pt = "Esta lápide não pode mais ser consertada."

[.text_area_misthalin_lumbridge_church_gravestones_5]
en = "You need a Prayer level of 2 to repair a gravestone."
pt = "Você precisa de nível 2 em Prayer para consertar uma lápide."

[.text_area_misthalin_lumbridge_church_gravestones_6]
en = "%1% has repaired your gravestone. It should survive another %2% minute."
pt = "%1% consertou a sua lápide. Ela deve durar mais %2% minuto."

[.text_area_misthalin_lumbridge_church_gravestones_7]
en = "%1% has repaired your gravestone. It should survive another %2% minutes."
pt = "%1% consertou a sua lápide. Ela deve durar mais %2% minutos."

[.text_area_misthalin_lumbridge_church_gravestones_8]
en = "The gods don't seem to approve of people attempting to bless their own gravestones."
pt = "Os deuses não parecem aprovar quem tenta abençoar a própria lápide."

[.text_area_misthalin_lumbridge_church_gravestones_9]
en = "You need a prayer level of 70 to bless a gravestone."
pt = "Você precisa de nível 70 em Prayer para abençoar uma lápide."

[.text_area_misthalin_lumbridge_church_gravestones_10]
en = "You don't have enough prayer points to bless the gravestone."
pt = "Você não tem pontos de oração suficientes para abençoar a lápide."

[.text_area_misthalin_lumbridge_church_gravestones_11]
en = "This gravestone has already been blessed."
pt = "Esta lápide já foi abençoada."

[.text_area_misthalin_lumbridge_church_gravestones_12]
en = "The gods hear your prayers; the gravestone will remain for a little longer."
pt = "Os deuses ouvem suas preces; a lápide vai durar mais um pouco."

[.text_area_misthalin_lumbridge_church_gravestones_13]
en = "%1% has blessed your gravestone. It should survive another %2% minute."
pt = "%1% abençoou a sua lápide. Ela deve durar mais %2% minuto."

[.text_area_misthalin_lumbridge_church_gravestones_14]
en = "%1% has blessed your gravestone. It should survive another %2% minutes."
pt = "%1% abençoou a sua lápide. Ela deve durar mais %2% minutos."

[.text_area_misthalin_lumbridge_church_gravestones_15]
en = "It would be impolite to demolish someone else's gravestone."
pt = "Seria falta de educação demolir a lápide de outra pessoa."

[.text_area_misthalin_lumbridge_church_gravestones_16]
en = "It looks like it'll survive another %1% minute. You demolish it anyway."
pt = "Parece que ela duraria mais %1% minuto. Você a demole mesmo assim."

[.text_area_misthalin_lumbridge_church_gravestones_17]
en = "It looks like it'll survive another %1% minutes. You demolish it anyway."
pt = "Parece que ela duraria mais %1% minutos. Você a demole mesmo assim."

[.text_area_misthalin_lumbridge_church_gravestones_18]
en = "Surely you aren't going to drop litter on your own grave!"
pt = "Você não vai jogar lixo no seu próprio túmulo, né?!"

[.text_area_misthalin_lumbridge_church_gravestones_19]
en = "Your gravestone has collapsed."
pt = "A sua lápide desmoronou."

[.text_area_misthalin_lumbridge_church_gravestones_20]
en = "It's about to collapse!"
pt = "Está prestes a desmoronar!"

[.text_area_misthalin_lumbridge_church_gravestones_21]
en = "It looks like it'll survive another %1%."
pt = "Parece que ainda vai durar: %1%."

# Text - area/misthalin/lumbridge/church/LumbridgeChurch.kt

[.text_area_misthalin_lumbridge_church_lumbridgechurch_1]
en = "You ring the church bell, confusing the citizens of Lumbridge."
pt = "Você toca o sino da igreja, confundindo os cidadãos de Lumbridge."

[.text_area_misthalin_lumbridge_church_lumbridgechurch_2]
en = "You close the coffin."
pt = "Você fecha o caixão."

[.text_area_misthalin_lumbridge_church_lumbridgechurch_3]
en = "There's a nice and complete skeleton in here!"
pt = "Tem um esqueleto bonito e completinho aqui dentro!"

[.text_area_misthalin_lumbridge_church_lumbridgechurch_4]
en = "You search the coffin and find some human remains."
pt = "Você revista o caixão e encontra restos humanos."

[.text_area_misthalin_lumbridge_church_lumbridgechurch_5]
en = "Maybe I should open it first."
pt = "Talvez eu deva abrir primeiro."

[.text_area_misthalin_lumbridge_church_lumbridgechurch_6]
en = "You open the coffin."
pt = "Você abre o caixão."

[.text_area_misthalin_lumbridge_church_lumbridgechurch_7]
en = "You put the skull in the coffin."
pt = "Você coloca o crânio no caixão."

[.text_area_misthalin_lumbridge_church_lumbridgechurch_8]
en = "Release! Thank you stranger."
pt = "Liberdade! Obrigado, estranho."

[.text_area_misthalin_lumbridge_church_lumbridgechurch_9]
en = "There's a skeleton without a skull in here. There's no point in disturbing it."
pt = "Tem um esqueleto sem crânio aqui dentro. Não adianta mexer nele."

# Text - area/misthalin/lumbridge/combat_hall/ArcheryTarget.kt

[.text_area_misthalin_lumbridge_combat_hall_archerytarget_1]
en = "You can only use Ranged against this target."
pt = "Neste alvo você só pode usar Ranged."

[.text_area_misthalin_lumbridge_combat_hall_archerytarget_2]
en = "You can only use a Training bow and arrows against this target."
pt = "Neste alvo você só pode usar o Training bow e flechas de treino."

[.text_area_misthalin_lumbridge_combat_hall_archerytarget_3]
en = "You are already in combat."
pt = "Você já está em combate."

[.text_area_misthalin_lumbridge_combat_hall_archerytarget_4]
en = "You can't use that ammo with your bow."
pt = "Você não pode usar essa munição com o seu arco."

# Text - area/misthalin/lumbridge/combat_hall/CombatDummy.kt

[.text_area_misthalin_lumbridge_combat_hall_combatdummy_1]
en = "You can only use Magic against this dummy."
pt = "Só dá para usar magia (Magic) contra este boneco."

[.text_area_misthalin_lumbridge_combat_hall_combatdummy_2]
en = "You can only use Melee against this dummy."
pt = "Só dá para usar corpo a corpo (Melee) contra este boneco."

# Text - area/misthalin/lumbridge/farm/HayBales.kt

[.text_area_misthalin_lumbridge_farm_haybales_1]
en = "You search the hay bale..."
pt = "Você revista o fardo de feno..."

[.text_area_misthalin_lumbridge_farm_haybales_2]
en = "You search the hay bales..."
pt = "Você revista os fardos de feno..."

[.text_area_misthalin_lumbridge_farm_haybales_3]
en = "Ow! There's something sharp in there!"
pt = "Ai! Tem algo pontudo aí dentro!"

[.text_area_misthalin_lumbridge_farm_haybales_4]
en = "Wow! A needle!<br> Now what are the chances of finding that?"
pt = "Uau! Uma agulha (needle)!<br> Qual era a chance de achar isso?"

[.text_area_misthalin_lumbridge_farm_haybales_5]
en = "You find nothing of interest."
pt = "Você não encontra nada de interessante."

# Text - area/misthalin/lumbridge/farm/Sacks.kt

[.text_area_misthalin_lumbridge_farm_sacks_1]
en = "There's nothing interesting in these sacks."
pt = "Não há nada de interessante nestes sacos."

# Text - area/misthalin/lumbridge/farm/SethGroatsFarm.kt

[.text_area_misthalin_lumbridge_farm_sethgroatsfarm_1]
en = "You've no reason to pick that up; eggs of that size are only useful for royal cakes."
pt = "Não há motivo para pegar isso; ovos desse tamanho só servem para bolos reais."

[.text_area_misthalin_lumbridge_farm_sethgroatsfarm_2]
en = "You've already got one of those eggs and one's enough."
pt = "Você já tem um desses ovos, e um basta."

[.text_area_misthalin_lumbridge_farm_sethgroatsfarm_3]
en = "The crate is empty."
pt = "O caixote está vazio."

# Text - area/misthalin/lumbridge/roddecks_house/RoddecksBookcase.kt

[.text_area_misthalin_lumbridge_roddecks_house_roddecksbookcase_1]
en = "There's nothing particularly interesting here."
pt = "Não há nada de especialmente interessante aqui."

# Text - area/misthalin/lumbridge/roddecks_house/RoddecksHouseDrawers.kt

[.text_area_misthalin_lumbridge_roddecks_house_roddeckshousedrawers_1]
en = "Nothing terribly interesting in here."
